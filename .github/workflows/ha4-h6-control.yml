name: HA4 — one H6 CONTROL restore, no watchpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ha4-h6-control.yml"
      - "experiments/ha4_h6_control.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-ha4-h6-control
  cancel-in-progress: false

jobs:
  ha4-h6-control:
    name: HA4 one-launch H6 CONTROL (no watchpoint)
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
      WORK: /tmp/naruto-ha4-control-${{ github.run_id }}-${{ github.run_attempt }}
      OUT: /tmp/naruto-ha4-control-output
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Compile-check the HA4 control script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/ha4_h6_control.py
          echo "HA4_PY_COMPILE=PASS"

      - name: Install headless runtime utilities
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            jq curl unzip xvfb x11-utils zip git
          mkdir -p "$WORK"/{source,inputs,resume,logs,capstone,ffmpeg-libs,home} "$OUT"

      - name: Validate exact active H6 artifact ID and download checkpoint
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$RESEARCH_REPO"
          META="$WORK/source/artifact-metadata.json"
          ZIP="$WORK/inputs/h6-cycle-02.zip"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/actions/artifacts/12482055310" -o "$META"
          python3 - "$META" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          want={
            "id":12482055310,
            "name":"naruto-storymode-adaptive-player-private",
            "size_in_bytes":11407011,
            "digest":"sha256:a0f45156dfd489f24c8dc8e122c33a048c7b9ac34b935ac828523593d21ca2a8",
            "expired":False,
          }
          for key,value in want.items():
              if j.get(key)!=value: raise SystemExit(f"ARTIFACT_METADATA_MISMATCH {key}={j.get(key)!r}")
          if j.get("workflow_run",{}).get("id")!=39907655833:
              raise SystemExit("ARTIFACT_SOURCE_RUN_MISMATCH")
          print("HA4_ARTIFACT_METADATA=PASS run=39907655833 id=12482055310")
          PY
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/actions/artifacts/12482055310/zip" -o "$ZIP"
          test "$(stat -c %s "$ZIP")" = 11407011
          echo "a0f45156dfd489f24c8dc8e122c33a048c7b9ac34b935ac828523593d21ca2a8  $ZIP" | sha256sum --check -
          test "$(unzip -Z1 "$ZIP" | grep -Fxc 'adaptive-cycle-02-f180.sstate')" = 1
          unzip -p "$ZIP" adaptive-cycle-02-f180.sstate > "$WORK/resume/adaptive-cycle-02-f180.sstate"
          test "$(stat -c %s "$WORK/resume/adaptive-cycle-02-f180.sstate")" = 21162799
          echo "705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35  $WORK/resume/adaptive-cycle-02-f180.sstate" | sha256sum --check -
          echo "HA4_CHECKPOINT_VALIDATION=PASS name=adaptive-cycle-02-f180.sstate bytes=21162799"

      - name: Download and verify pinned emulator, disc and BIOS
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/source"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"; bytes="$3"; digest="$4"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 600 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$out"
            test "$(stat -c %s "$out")" = "$bytes"
            echo "$digest  $out" | sha256sum --check -
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage 65747557 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin 325989552 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue 116 be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8
          fetch_asset scph7502.zip scph7502.zip 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for item in z.infolist():
                  p=Path(item.filename); mode=(item.external_attr>>16)&0xffff; total+=item.file_size
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("UNSAFE_BIOS_ARCHIVE")
                  if item.file_size>2*1024*1024 or total>4*1024*1024:
                      raise SystemExit("BIOS_EXPANSION_LIMIT")
                  if not item.is_dir() and item.file_size==524288:
                      members.append(item)
              if len(members)!=1: raise SystemExit("BIOS_MEMBER_COUNT_MISMATCH")
              bios=z.read(members[0])
              digest=hashlib.sha256(bios).hexdigest()
              if digest!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1":
                  raise SystemExit("BIOS_SHA256_MISMATCH")
              Path("scph7502.bin").write_bytes(bios)
          cue=Path("game.cue").read_text(encoding="utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,line in enumerate(cue) if line.strip().upper().startswith("FILE ")]
          if len(ix)!=1: raise SystemExit("CUE_FILE_DIRECTIVE_COUNT_MISMATCH")
          cue[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(cue)+"\n",encoding="ascii")
          print("HA4_DISC_BIOS_VALIDATION=PASS")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          APPDIR="$WORK/source/squashfs-root"
          PCSX_BIN="$(find -L "$APPDIR" -maxdepth 8 -type f -perm /111 | grep -E '/(pcsx-redux|pcsx-redux[^/]*)$' | head -n 1)"
          test -n "$PCSX_BIN" && test -x "$PCSX_BIN"
          CAPSTONE_FILE="$(find -L "$APPDIR" -type f -name 'libcapstone.so.5' -print -quit)"
          test -n "$CAPSTONE_FILE"
          cp -L "$CAPSTONE_FILE" "$WORK/capstone/libcapstone.so.5"
          while IFS= read -r -d '' lib; do
            cp -L "$lib" "$WORK/ffmpeg-libs/$(basename "$lib")"
          done < <(find -L "$APPDIR" -type f \( -name 'libav*.so*' -o -name 'libsw*.so*' -o -name 'libpostproc.so*' \) -print0)
          test -s "$WORK/ffmpeg-libs/libavformat.so.63"
          printf 'APPDIR=%s\nPCSX_BIN=%s\n' "$APPDIR" "$PCSX_BIN" >> "$GITHUB_ENV"

      - name: Start Xvfb and run exactly one CONTROL launch
        shell: bash
        run: |
          set -euo pipefail
          dd if=/dev/zero of="$WORK/control.mcd" bs=131072 count=1 status=none
          test "$(stat -c %s "$WORK/control.mcd")" = 131072
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/logs/xvfb.log" 2>&1 &
          echo $! > "$WORK/xvfb.pid"
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          for n in $(seq 1 80); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          export LD_LIBRARY_PATH="$WORK/capstone:$WORK/ffmpeg-libs:$APPDIR/usr/lib:$APPDIR/usr/lib/x86_64-linux-gnu"
          export QT_PLUGIN_PATH="$APPDIR/usr/plugins"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$APPDIR/usr/plugins/platforms"
          export QML2_IMPORT_PATH="$APPDIR/usr/qml"
          set +e
          python3 experiments/ha4_h6_control.py \
            --pcsx-bin "$PCSX_BIN" --bios "$WORK/source/scph7502.bin" \
            --cue "$WORK/source/game-run.cue" --card "$WORK/control.mcd" \
            --work "$WORK" --out "$OUT" --timeout-seconds 240
          rc=$?
          set -e
          echo "$rc" > "$OUT/HA4_SCRIPT_EXIT_CODE.txt"
          if [ "$rc" -ne 0 ]; then
            echo "HA4_CONTROL_STEP_RESULT=FAIL script_exit=$rc"
            exit "$rc"
          fi

      - name: Remove private checkpoint, disc, BIOS, card and emulator files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$WORK/xvfb.pid" ]; then kill "$(cat "$WORK/xvfb.pid")" 2>/dev/null || true; fi
          rm -rf "$WORK"
          test ! -e "$WORK"
          echo "PRIVATE_INPUT_CLEANUP=PASS" > "$OUT/cleanup.txt"

      - name: Commit text-only Actions summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if [ ! -s "$OUT/HA4_CONTROL_SUMMARY.txt" ]; then
            printf 'STATUS=FAIL\nreason=control_script_did_not_write_summary\n' > "$OUT/HA4_CONTROL_SUMMARY.txt"
          fi
          if [ ! -s "$OUT/HA4_SCRIPT_EXIT_CODE.txt" ]; then
            echo "TIDAK_TAHU" > "$OUT/HA4_SCRIPT_EXIT_CODE.txt"
          fi
          DEST="reports/stage1_economy/ha4-control-run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          cp "$OUT/HA4_CONTROL_SUMMARY.txt" "$DEST/"
          cp "$OUT/cleanup.txt" "$DEST/" 2>/dev/null || true
          JOB_ID="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$RESEARCH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -r '.jobs[] | select(.name=="HA4 one-launch H6 CONTROL (no watchpoint)") | .id' | head -n 1)"
          test -n "$JOB_ID" || JOB_ID="TIDAK TAHU"
          STATUS="$(sed -n 's/^STATUS=//p' "$DEST/HA4_CONTROL_SUMMARY.txt" | head -n 1)"
          test -n "$STATUS" || STATUS="INCOMPLETE"
          RC="$(cat "$OUT/HA4_SCRIPT_EXIT_CODE.txt" 2>/dev/null || echo TIDAK_TAHU)"
          {
            echo "STATUS=$STATUS"
            echo "JOB=ha4-h6-control"
            echo "JOB_ID=$JOB_ID"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXIT_CODE=$RC"
          } > "$DEST/ACTIONS_RUN_SUMMARY.txt"
          python3 - "$DEST" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          bad=[str(p) for p in root.rglob("*") if p.is_file() and p.suffix.lower() not in {".txt",".tsv",".log"}]
          if bad: raise SystemExit("NON_TEXT_COMMIT_BLOCKED="+repr(bad))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Publish HA4 one-launch H6 CONTROL summary $GITHUB_RUN_ID [skip ci]"
            pushed=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$n"
            done
            test "$pushed" -eq 1
          fi
          echo "HA4_REPORT_PATH=$DEST"
