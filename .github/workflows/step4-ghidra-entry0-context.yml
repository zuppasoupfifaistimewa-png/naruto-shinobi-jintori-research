name: Step 4 — bounded Ghidra context for DATA.BIN entry 0 calls

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/step4-ghidra-entry0-context.yml"
      - "tools/ghidra/ExportRngCallContext.java"

permissions:
  contents: read

concurrency:
  group: step4-ghidra-entry0-context
  cancel-in-progress: false

jobs:
  entry0-context:
    name: Decode only candidate RNG/seed callsite windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install disc tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Set up Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Fetch and validate private disc; slice the documented DATA.BIN entry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/step4-entry0-context"
          source_dir="$root/source"
          extracted="$source_dir/extracted-root"
          input="$root/input"
          out="$RUNNER_TEMP/step4-entry0-context-output"
          mkdir -p "$source_dir" "$extracted" "$input" "$out"
          bin="$source_dir/naruto-disc.bin"
          cue_raw="$source_dir/original.cue"
          cue="$source_dir/naruto-disc.cue"
          bin_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873"
          cue_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760"

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 600 "$bin_url" --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 60 "$cue_url" --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status

          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          source, destination = map(Path, sys.argv[1:3])
          lines, rewritten, replaced = source.read_text(encoding="utf-8").splitlines(), [], 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  m = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not m: raise SystemExit("Unrecognized CUE FILE directive")
                  line = m.group(1) + '"naruto-disc.bin"' + m.group(2)
                  replaced += 1
              rewritten.append(line)
          if replaced != 1: raise SystemExit(f"Expected 1 FILE directive, got {replaced}")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

          bchunk "$bin" "$cue" "$source_dir/track"
          iso="$(find "$source_dir" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$out/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          [[ -n "$data" && -f "$data" && "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status

          python3 - "$data" "$input/DATA_BIN_ENTRY_0000.bin" <<'PY'
          from pathlib import Path
          import hashlib, sys
          src, dst = map(Path, sys.argv[1:3])
          chunk = src.read_bytes()[0x5F800:0x5F800+110536]
          digest = hashlib.sha256(chunk).hexdigest()
          expected = "56ee7d3b195b0708bd5f9163d354f0173a828430c9467d410e822b1793d316d4"
          if len(chunk) != 110536 or digest != expected:
              raise SystemExit(f"Entry 0 identity mismatch: bytes={len(chunk)} sha256={digest}")
          dst.write_bytes(chunk)
          print(f"entry0_bytes={len(chunk)} sha256={digest}")
          PY
          rm -rf "$source_dir"

      - name: Restore cached Ghidra
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          fi

      - name: Linear decode windows around the five candidate calls only
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/step4-entry0-context/input"
          out="$RUNNER_TEMP/step4-entry0-context-output"
          mkdir -p "$out/project"
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          [[ -n "$headless" && -x "$headless" ]]
          "$headless" "$out/project" DATA_BIN_entry_0000_context \
            -import "$input/DATA_BIN_ENTRY_0000.bin" \
            -loader BinaryLoader -loader-baseAddr 0x800AD000 -loader-length 0x1AF08 \
            -loader-blockName DATA_BIN_ENTRY_0000 -processor "MIPS:LE:32:default" \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript ExportRngCallContext.java "$out/data-bin-entry0-rng-context.txt" \
              0x800AF2AC:0x80035DA8 \
              0x800BB2D8:0x80035D78 \
              0x800BB2FC:0x80035D78 \
              0x800BB748:0x80035D78 \
              0x800BB770:0x80035D78 \
            -deleteProject > "$out/ghidra-context.log" 2>&1
          [[ -s "$out/data-bin-entry0-rng-context.txt" ]]

          # Audit the 16-entry switch table referenced by entry 1 at 0x800AE900.
          # Entry 0's import base is hypothetical; dump raw words only, never execute targets.
          "$headless" "$out/project" DATA_BIN_entry_0000_jumptable             -import "$input/DATA_BIN_ENTRY_0000.bin"             -loader BinaryLoader -loader-baseAddr 0x800AD000 -loader-length 0x1AF08             -loader-blockName DATA_BIN_ENTRY_0000 -processor "MIPS:LE:32:default"             -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra"             -postScript ExportJumpTableContext.java "$out/jump-table-800AE900.txt" 0x800AE900 16 \
            -deleteProject > "$out/jumptable-ghidra.log" 2>&1
          [[ -s "$out/jump-table-800AE900.txt" ]]

          {
            echo "status=SUCCESS"
            echo "scope=five localized call windows plus 16 raw words at 0x800AE900; no whole-program auto-analysis"
            echo "resource_base=0x800AD000 (hypothesis only)"
            echo "emulator_or_gameplay_executed=no"
            echo "binary_uploaded_as_artifact=no"
          } > "$out/scan-result.txt"
          grep -E '^(analysis=|program=|=== CANDIDATE|raw_word=|mips_jal_target_from_word=|raw_opcode_is_jal=|ghidra_instruction_at_site=|ghidra_decoded_flow_to_target=|caller_function_boundary=|caller_function_entry=)' "$out/data-bin-entry0-rng-context.txt" || true

      - name: Upload text-only context outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-entry0-rng-context
          path: ${{ runner.temp }}/step4-entry0-context-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary entry resource
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/step4-entry0-context"
