name: Step 7 — DATA.BIN Entry 1 analysis at loader buffer base

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step7-entry1-buffer-base-audit.yml"
      - "tools/step7/ExportStage1EconomyAQ1.java"
      - "tools/step7/ExportStage1EconomyDeepContext.java"
      - "tools/step7/ExportManagerEconomyWriters.java"
      - "tools/step7/ExportPendingParticipantDelta.java"
      - "tools/step7/ScanStage1EconomyData.py"
      - "tools/step7/ScanAllDataBinText.py"
      - "tools/step7/SummarizeStage1EconomyCensus.py"
      - "tools/step7/ExportTileResourceLoader.java"
      - "tools/step7/ScanStage1TileResources.py"
      - "tools/step7/ExportBA1SelectorMatrix.java"
      - "tools/step7/ExportBB2ActionByteAudit.java"
      - "tools/step7/ExportBB2TileNibbleAudit.java"
      - "tools/ghidra/ExportTargetCallers.java"
      - "tools/ghidra/ExportFunctionDetail.java"
      - "tools/ghidra/ExportNumericLiteralReferences.java"
      - "tools/ghidra/ExportInstructionWindows.java"
      - "tools/ghidra/ExportManagerFieldAccesses.java"

permissions:
  contents: write

concurrency:
  group: step7-entry1-buffer-base-audit
  cancel-in-progress: false

jobs:
  analyze-entry1-buffer-base:
    name: Analyze verified Entry 1 slice at 0x800AD450
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
      EXPECTED_ENTRY1_SHA256: "9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a"
      EXPECTED_ENTRY1_BYTES: "596412"
      ENTRY1_BASE: "0x800AD450"
      ENTRY1_LENGTH: "0x919BC"
    steps:
      - name: Checkout research tools
        uses: actions/checkout@v4

      - name: Install PS1 extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Fetch verified disc and slice directory Entry 1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/entry1-buffer-base"
          source="$root/source"
          extracted="$source/extracted-root"
          input="$root/input"
          out="$RUNNER_TEMP/entry1-buffer-base-output"
          mkdir -p "$source" "$extracted" "$input" "$out"
          bin="$source/naruto-disc.bin"
          cue_raw="$source/original.cue"
          cue="$source/naruto-disc.cue"

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 \
            --max-time 600 \
            "https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873" \
            --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 \
            --max-time 60 \
            "https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760" \
            --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status

          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          source, destination = map(Path, sys.argv[1:3])
          lines, rewritten, replaced = source.read_text(encoding="utf-8").splitlines(), [], 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  match = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not match:
                      raise SystemExit("Unrecognized CUE FILE directive")
                  line = match.group(1) + '"naruto-disc.bin"' + match.group(2)
                  replaced += 1
              rewritten.append(line)
          if replaced != 1:
              raise SystemExit(f"Expected one FILE directive, got {replaced}")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

          bchunk "$bin" "$cue" "$source/track"
          iso="$(find "$source" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$out/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          exe="$(find "$extracted" -type f -iname 'SLPS_035.53' -print -quit)"
          [[ -n "$data" && -f "$data" ]]
          [[ -n "$exe" && -f "$exe" ]]
          [[ "$(stat -c '%s' "$exe")" == "385024" ]]
          echo "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569  $exe" | sha256sum --check --status
          cp "$exe" "$input/SLPS_035.53"
          [[ "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status

          python3 - "$data" "$input" "$out/input-identity.txt" <<'PY'
          from pathlib import Path
          import hashlib, struct, sys
          src, dest, report = map(Path, sys.argv[1:4])
          data = src.read_bytes()
          table = data[0x44:0x2F44]
          rows = [struct.unpack_from("<II", table, i * 8) for i in range(len(table) // 8)]
          expected = {
              0: (403, 110536, 0x5F800, "56ee7d3b195b0708bd5f9163d354f0173a828430c9467d410e822b1793d316d4"),
              1: (8778, 596412, 0x10BB000, "9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a"),
          }
          meta = []
          for idx in (0, 1):
              lbn, length = rows[idx]
              elbn, elength, eoffset, edigest = expected[idx]
              offset = (lbn - 212) * 2048
              chunk = data[offset:offset + length]
              digest = hashlib.sha256(chunk).hexdigest()
              if (lbn, length, offset, len(chunk), digest) != (elbn, elength, eoffset, elength, edigest):
                  raise SystemExit(f"Entry{idx} identity mismatch: lbn={lbn} len={length} off={offset:#x} sha={digest}")
              (dest / f"DATA_BIN_ENTRY_{idx:04d}.bin").write_bytes(chunk)
              meta.extend([f"entry{idx}_lbn={lbn}",f"entry{idx}_bytes={length}",
                           f"entry{idx}_offset=0x{offset:X}",f"entry{idx}_sha256={digest}"])
          meta.extend(["entry0_runtime_base=TIDAK TAHU",
                       "entry1_static_base_candidate=0x800AD450",
                       "entry1_runtime_mapping=NOT_VALIDATED",
                       "main_exe_sha256=a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569",
                       "main_exe_bytes=385024","private_binary_artifact=no"])
          report.write_text("input_validation=PASS\n"+"\n".join(meta)+"\n",encoding="utf-8")
          PY
          python3 tools/step7/ScanStage1TileResources.py --data "$data" --out-dir "$out"
          python3 - "$data" "$out" <<'PY'
          import csv,hashlib,struct,sys
          from pathlib import Path
          data_path,out_path=Path(sys.argv[1]),Path(sys.argv[2])
          data=data_path.read_bytes()
          base=212; table_off=0x44; count=1504; stride=0x1e
          entries=[struct.unpack_from("<II",data,table_off+i*8) for i in range(count)]
          candidates=[];records=[]
          def u16(b,o): return struct.unpack_from("<H",b,o)[0]
          for idx,(lbn,length) in enumerate(entries):
              off=(lbn-base)*2048
              if length!=1+22*stride or off<0 or off+length>len(data): continue
              chunk=data[off:off+length]
              if chunk[0]!=22: continue
              digest=hashlib.sha256(chunk).hexdigest()
              candidates.append({"entry_index":idx,"lbn":lbn,"length":length,"offset":f"0x{off:X}",
                                 "sha256":digest,"header_record_count":chunk[0],"record_stride":"0x1E",
                                 "shape_check":"PASS","selection":"PENDING_FUN_800129E4_RETURN_VALUE"})
              for ri in range(22):
                  r=chunk[1+ri*stride:1+(ri+1)*stride]
                  row={"entry_index":idx,"resource_id_hex":f"0x{idx:X}","entry_lbn":lbn,
                       "entry_file_offset":f"0x{off:X}","entry_sha256":digest,"record_index":ri,
                       "record_source_offset":f"0x{off+1+ri*stride:X}","source_byte_05_skipped":r[5],
                       "runtime_tile_b_00":r[0],"runtime_tile_b_01":r[1],"runtime_tile_b_02":r[2],
                       "runtime_tile_b_03":r[3],"runtime_tile_b_04":r[4],"runtime_tile_b_05":r[6],
                       "runtime_tile_b_0C":r[29],"runtime_tile_h_0E":u16(r,7),"runtime_tile_h_10":u16(r,9),
                       "runtime_tile_h_12":u16(r,11),"runtime_tile_h_14":u16(r,13),"runtime_tile_h_16":u16(r,15),
                       "runtime_tile_h_18":u16(r,17),"runtime_tile_h_1A":u16(r,19),"runtime_tile_h_1C":u16(r,21),
                       "runtime_tile_h_1E":u16(r,23),"runtime_tile_h_20_loader_init":0xF020,
                       "runtime_tile_h_22":u16(r,25),"runtime_tile_h_24":u16(r,27)}
                  records.append(row)
          out_path.mkdir(parents=True,exist_ok=True)
          cand_cols=("entry_index","lbn","length","offset","sha256","header_record_count","record_stride","shape_check","selection")
          with (out_path/"BA1_TILE_TABLE_CANDIDATES.tsv").open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=cand_cols,delimiter="\t");w.writeheader();w.writerows(candidates)
          record_cols=("entry_index","resource_id_hex","entry_lbn","entry_file_offset","entry_sha256","record_index",
              "record_source_offset","source_byte_05_skipped","runtime_tile_b_00","runtime_tile_b_01","runtime_tile_b_02",
              "runtime_tile_b_03","runtime_tile_b_04","runtime_tile_b_05","runtime_tile_b_0C",
              "runtime_tile_h_0E","runtime_tile_h_10","runtime_tile_h_12","runtime_tile_h_14","runtime_tile_h_16",
              "runtime_tile_h_18","runtime_tile_h_1A","runtime_tile_h_1C","runtime_tile_h_1E",
              "runtime_tile_h_20_loader_init","runtime_tile_h_22","runtime_tile_h_24")
          with (out_path/"BA1_TILE_TABLE_RECORDS.tsv").open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=record_cols,delimiter="\t");w.writeheader();w.writerows(records)
          ids=",".join(str(x["entry_index"]) for x in candidates) or "NONE"
          lines=["STATUS=PASS",f"candidate_entry_indices={ids}",f"candidate_count={len(candidates)}",
                 f"derived_record_rows={len(records)}","resource_lookup_expression=FUN_800129E4()+0x276 (callsite 0x800B3ED8)",
                 "directory_index_stride=8 bytes (FUN_8002D00C uses param_1*8)",
                 "source_record_stride=0x1E","runtime_record_stride=0x124",
                 "runtime_map=FUN_800F7ADC static copy map; byte +0x05 is skipped; runtime +0x20 init=0xF020",
                 "selection_status=PENDING_FUN_800129E4_RETURN_VALUE; no candidate is labeled Stage 1 yet",
                 "runtime_base_status=0x800AD450 is static import candidate; runtime mapping unverified"]
          for x in candidates: lines.append(f"entry_{x['entry_index']}_bytes={x['length']} offset={x['offset']} sha256={x['sha256']}")
          (out_path/"BA1_TILE_TABLE_SCAN_SUMMARY.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print(f"BA1_TILE_TABLE_EXPORT=PASS candidates={len(candidates)} records={len(records)} ids={ids}")
          PY
          python3 tools/step7/ScanAllDataBinText.py \
            --data "$data" \
            --report "$out/BB2_FULL_DATABIN_TEXT_SCAN.txt" \
            --tsv "$out/bb2-full-databin-text-scan.tsv"
          rm -rf "$source" "$extracted"
          test ! -e "$source" && test ! -e "$extracted"
          echo "source_disc_and_DATA_BIN_removed_before_Ghidra=PASS" >> "$out/input-identity.txt"

      - name: Set up Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Restore cached Ghidra
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          fi

      - name: Analyze Entry 1 under the loader-buffer base hypothesis
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/entry1-buffer-base"
          input="$root/input"
          out="$RUNNER_TEMP/entry1-buffer-base-output"
          project="$root/ghidra-project"
          mkdir -p "$project" "$out"
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          [[ -n "$headless" && -x "$headless" ]]

          cp "$GITHUB_WORKSPACE/tools/step7/ExportPendingParticipantDelta.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportPendingParticipantDelta.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportStage1EconomyAQ1.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportStage1EconomyAQ1.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportStage1EconomyDeepContext.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportStage1EconomyDeepContext.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportManagerEconomyWriters.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportManagerEconomyWriters.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportTileResourceLoader.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportTileResourceLoader.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportBA1SelectorMatrix.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportBA1SelectorMatrix.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportBB2ActionByteAudit.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportBB2ActionByteAudit.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportBB2TileNibbleAudit.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportBB2TileNibbleAudit.java"

          set +e
          "$headless" "$project" Naruto_DATA_BIN_entry1_buffer_base \
            -import "$input/DATA_BIN_ENTRY_0001.bin" \
            -loader BinaryLoader -loader-baseAddr 0x800AD450 \
            -loader-length 0x919BC -loader-blockName DATA_BIN_ENTRY_0001_AT_BUFFER_BASE \
            -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript ExportEntry0TargetFunction.java "$out/entry1-buffer-base-targets.txt" \
              0x800BDC4C 0x800B770C 0x800BDBFC 0x800B7464 \
              0x800FC700 0x800FCA0C 0x800FD730 0x800FE314 \
              0x800FEA28 0x800FB598 0x800C815C 0x800CD678 \
              0x800E0324 0x800F1CCC 0x800F2050 \
              0x80107F4C 0x800BE5D8 0x800F9520 0x800B5D68 \
              0x800EE4E0 0x800CF434 0x80108054 0x80109994 0x80109F1C \
              0x800CADB8 0x800CB4B4 0x800D15A8 0x800E03B0 0x800E3E74 \
              0x801170A8 0x80117068 0x800BD704 0x800BB36C \
              0x800BB004 0x800BE464 0x80102408 0x80100FC0 \
              0x8010109C 0x80101140 \
              0x80117BD8 0x80117C24 0x800B54F4 \
              0x800F5DBC 0x800F5EFC 0x80117C60 \
              0x80117610 0x80117690 0x80117774 0x80117C60 \
              0x80119634 0x800DC2E0 0x800DFEE8 0x800E6470 \
              0x800E9220 0x800EB290 0x800F0C10 0x800F2A9C \
              0x800D15A8 0x800D8930 0x800D10F0 \
              0x80102898 0x801088A8 0x80108D2C 0x80105BCC 0x801052E8 \
            -postScript ExportPerRecordCallerGraph.java "$out/per-record-caller-graph.txt" \
            -postScript ExportPendingParticipantDelta.java "$out/pending-participant-delta.txt" \
            -postScript ExportStage1EconomyAQ1.java "$out/aq1-economy-census.tsv" \
            -postScript ExportBB2ActionByteAudit.java "$out/bb2-action-byte-access.tsv" \
            -postScript ExportBB2TileNibbleAudit.java "$out/bb2-tile-nibble-access.tsv" \
            -postScript ExportNumericLiteralReferences.java "$out/bb2-entry1-numeric-literals.tsv" \
            -postScript ExportInstructionWindows.java "$out/bb2-event-instruction-windows.txt" 0x800D4974 0x800D4980 0x800D4A58 0x800CF94C 0x800DAA84 0x800DAA88 0x800EC3A4 0x800EC3A8 0x800EF3C8 0x800EF3CC 0x800E0918 0x800E0928 0x800F5EFC 0x800F3658 \
            -postScript ExportFunctionDetail.java "$out/bb2-event-function-detail.txt" 0x800C2FD8 0x800BA9F8 0x8010ABF8 0x800CF434 0x800D9570 0x800EB434 0x800E03B0 0x800EE4E0 0x800F3658 \
            -postScript ExportFunctionDetail.java "$out/bb2-d15a8-focused.txt" 0x800D15A8 0x80102408 0x80100DCC 0x80108ECC 0x80108EAC 0x80108EBC 0x80108E1C 0x80108E54 0x80108EE8 \
            -postScript ExportTargetCallers.java "$out/bb2-event-direct-callers.txt" 0x800C2FD8 0x8010ABF8 \
            -postScript ExportFunctionDetail.java "$out/bb2-d15a8-function-detail.txt" 0x800D15A8 0x800C2570 0x800BE0E4 0x800BE464 0x800C7870 0x800D7F38 0x800DC2E0 0x800E0324 0x800FA094 0x8010CC38 0x8010CD00 0x8010CD2C 0x8010CDD0 0x800D9570 0x800EB434 0x800F3658 0x800EE4E0 0x800EF3CC 0x800D8930 0x800D10F0 0x800DD7C0 0x800E481C 0x800E4F50 0x800E7B38 0x800EA18C 0x800CF900 0x8010BDFC 0x80108EAC 0x80108EBC 0x80108E1C 0x80108E54 0x80108EE8 0x80108ECC 0x80100DCC 0x80100D14 0x80100E9C 0x80102408 0x80102510 0x80102600 0x800FAD68 0x800C2FD8 0x800BA9F8 0x80013D80 0x800160D4 0x80014FA8 0x800143AC 0x8010897C 0x80103E40 0x80103E5C 0x80101360 0x80101BD8 0x80101AAC 0x80101814 0x80101570 0x80101474 0x801013F8 0x801013C8 0x80101394 0x80101338 0x80101298 0x80101168 0x8010109C 0x80100C34 0x80100AB8 0x80100A78 0x80100A10 \
            -postScript ExportTargetCallers.java "$out/bb2-d15a8-direct-callers.txt" 0x800D15A8 0x800C2570 0x800D9570 0x800EB434 0x800EE4E0 0x800EF3CC 0x800D8930 0x800D10F0 0x800DD7C0 0x800E481C 0x800E4F50 0x800E7B38 0x800EA18C 0x8010BDFC 0x80108EAC 0x80108EBC 0x80108E1C 0x80100DCC 0x80100E9C 0x80101360 \
            -postScript ExportTargetXrefs.java "$out/bb2-message-object-xrefs.csv" "$out/bb2-message-object-functions.csv" 0x800AD450 0x8013A1D8 \
            -postScript ExportStage1EconomyDeepContext.java "$out/aq1-deep-context.tsv" \
            -postScript ExportFunctionDetail.java "$out/entry1-helper-function-detail.txt" 0x800B770C 0x800BDC4C \
            -postScript ExportFunctionDetail.java "$out/aw1-manager-function-detail.txt" 0x80109994 0x80109F1C 0x80109FEC \
            -postScript ExportManagerFieldAccesses.java "$out/aw1-manager-b38-accesses.tsv" 0xB38 \
            -postScript ExportManagerFieldAccesses.java "$out/aw1-manager-b40-accesses.tsv" 0xB40 \
            -postScript ExportManagerFieldAccesses.java "$out/aw1-manager-b44-accesses.tsv" 0xB44 \
            -postScript ExportNumericLiteralReferences.java "$out/aw2-numeric-instruction-literals.tsv" \
            -postScript ExportManagerEconomyWriters.java ENTRY1 "$out/ay1-ay2-entry1.tsv" \
            -postScript ExportTargetCallers.java "$out/az3-setter-direct-callers-entry1.txt" 0x8001387C \
            -postScript ExportFunctionDetail.java "$out/az3-resource-economy-function-detail.txt" 0x800CF94C 0x800CF900 0x800EC574 0x800DB29C 0x800E0B3C 0x800C7574 0x800F3658 0x800E8190 0x800EA18C 0x800EF9A4 0x800F1290 0x800F2A9C 0x800D5BC0 0x800F2490 0x800D05B8 0x800D15A8 0x800D6E7C 0x800DF698 0x800B2A58 0x800B5790 0x800B5D68 0x800B63F4 0x800C88F0 0x800E3E74 0x800EB434 0x800F64B0 0x800F6988 0x800F7ADC \
            -postScript ExportCallWindows.java "$out/az3-setter-call-windows-entry1.tsv" 0x8001387C \
            -postScript ExportCallWindows.java "$out/aw1-helper-call-windows.tsv" 0x800B770C 0x800BDC4C \
            -postScript ExportTileResourceLoader.java "$out/ba1-tile-resource-loader.txt" 0x800F7ADC \
            -postScript ExportFunctionDetail.java "$out/ba1-tile-loader-callers.txt" 0x800B2A58 0x800B63F4 0x800F64B0 \
            -analysisTimeoutPerFile 900 -max-cpu 2 -deleteProject \
            > "$out/ghidra-headless.log" 2>&1
          rc=$?
