name: Step 7 — DATA.BIN Entry 1 analysis at loader buffer base

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step7-entry1-buffer-base-audit.yml"
      - "tools/step7/ExportStage1EconomyAQ1.java"
      - "tools/step7/ExportStage1EconomyDeepContext.java"
      - "tools/step7/ExportPendingParticipantDelta.java"

permissions:
  contents: write

concurrency:
  group: step7-entry1-buffer-base-audit
  cancel-in-progress: false

jobs:
  analyze-entry1-buffer-base:
    name: Analyze verified Entry 1 slice at 0x800AD450
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
      EXPECTED_ENTRY1_SHA256: "9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a"
      EXPECTED_ENTRY1_BYTES: "596412"
      ENTRY1_BASE: "0x800AD450"
      ENTRY1_LENGTH: "0x919BC"
    steps:
      - name: Checkout research tools
        uses: actions/checkout@v4

      - name: Install PS1 extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Fetch verified disc and slice directory Entry 1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/entry1-buffer-base"
          source="$root/source"
          extracted="$source/extracted-root"
          input="$root/input"
          out="$RUNNER_TEMP/entry1-buffer-base-output"
          mkdir -p "$source" "$extracted" "$input" "$out"
          bin="$source/naruto-disc.bin"
          cue_raw="$source/original.cue"
          cue="$source/naruto-disc.cue"

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 \
            --max-time 600 \
            "https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873" \
            --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 \
            --max-time 60 \
            "https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760" \
            --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status

          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          source, destination = map(Path, sys.argv[1:3])
          lines, rewritten, replaced = source.read_text(encoding="utf-8").splitlines(), [], 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  match = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not match:
                      raise SystemExit("Unrecognized CUE FILE directive")
                  line = match.group(1) + '"naruto-disc.bin"' + match.group(2)
                  replaced += 1
              rewritten.append(line)
          if replaced != 1:
              raise SystemExit(f"Expected one FILE directive, got {replaced}")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

          bchunk "$bin" "$cue" "$source/track"
          iso="$(find "$source" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$out/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          [[ -n "$data" && -f "$data" ]]
          [[ "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status

          python3 - "$data" "$input/DATA_BIN_ENTRY_0001.bin" "$out/input-identity.txt" <<'PY'
          from pathlib import Path
          import hashlib, struct, sys
          src, dst, report = map(Path, sys.argv[1:4])
          data = src.read_bytes()
          table = data[0x44:0x2F44]
          rows = [struct.unpack_from("<II", table, i * 8) for i in range(len(table) // 8)]
          lbn, length = rows[1]
          if (lbn, length) != (8778, 596412):
              raise SystemExit(f"Entry1 directory row mismatch: {(lbn, length)}")
          offset = (lbn - 212) * 2048
          if offset != 0x10BB000:
              raise SystemExit(f"Entry1 source offset mismatch: {offset:#x}")
          chunk = data[offset:offset + length]
          digest = hashlib.sha256(chunk).hexdigest()
          expected = "9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a"
          if len(chunk) != 596412 or digest != expected:
              raise SystemExit(f"Entry1 slice identity mismatch bytes={len(chunk)} sha256={digest}")
          dst.write_bytes(chunk)
          report.write_text("\n".join([
              "input_validation=PASS",
              f"directory_index=1",
              f"directory_LBN={lbn}",
              f"directory_byte_length={length}",
              f"DATA_BIN_file_offset=0x{offset:X}",
              f"slice_bytes={len(chunk)}",
              f"slice_sha256={digest}",
              "proposed_buffer_base=0x800AD450",
              "buffer_base_status=STATIC_CANDIDATE_FROM_MAIN_EXE_GLOBAL_SLOT",
              "runtime_mapping=NOT_CAPTURED",
              "binary_uploaded_as_artifact=no",
          ]) + "\n", encoding="utf-8")
          PY
          rm -rf "$source" "$extracted"
          test ! -e "$source" && test ! -e "$extracted"
          echo "source_disc_and_DATA_BIN_removed_before_Ghidra=PASS" >> "$out/input-identity.txt"

      - name: Set up Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Restore cached Ghidra
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          fi

      - name: Analyze Entry 1 under the loader-buffer base hypothesis
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/entry1-buffer-base"
          input="$root/input"
          out="$RUNNER_TEMP/entry1-buffer-base-output"
          project="$root/ghidra-project"
          mkdir -p "$project" "$out"
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          [[ -n "$headless" && -x "$headless" ]]

          cp "$GITHUB_WORKSPACE/tools/step7/ExportPendingParticipantDelta.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportPendingParticipantDelta.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportStage1EconomyAQ1.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportStage1EconomyAQ1.java"
          cp "$GITHUB_WORKSPACE/tools/step7/ExportStage1EconomyDeepContext.java" "$GITHUB_WORKSPACE/tools/ghidra/ExportStage1EconomyDeepContext.java"

          set +e
          "$headless" "$project" Naruto_DATA_BIN_entry1_buffer_base \
            -import "$input/DATA_BIN_ENTRY_0001.bin" \
            -loader BinaryLoader -loader-baseAddr 0x800AD450 \
            -loader-length 0x919BC -loader-blockName DATA_BIN_ENTRY_0001_AT_BUFFER_BASE \
            -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript ExportEntry0TargetFunction.java "$out/entry1-buffer-base-targets.txt" \
              0x800BDC4C 0x800B770C 0x800BDBFC 0x800B7464 \
              0x800FC700 0x800FCA0C 0x800FD730 0x800FE314 \
              0x800FEA28 0x800FB598 0x800C815C 0x800CD678 \
              0x800E0324 0x800F1CCC 0x800F2050 \
              0x80107F4C 0x800BE5D8 0x800F9520 0x800B5D68 \
              0x800EE4E0 0x800CF434 0x80108054 0x80109994 0x80109F1C \
              0x800CADB8 0x800CB4B4 0x800D15A8 0x800E03B0 0x800E3E74 \
              0x801170A8 0x80117068 0x800BD704 0x800BB36C \
              0x800BB004 0x800BE464 0x80102408 0x80100FC0 \
              0x8010109C 0x80101140 \
              0x80117BD8 0x80117C24 0x800B54F4 \
              0x800F5DBC 0x800F5EFC 0x80117C60 \
              0x80117610 0x80117690 0x80117774 0x80117C60 \
              0x80119634 0x800DC2E0 0x800DFEE8 0x800E6470 \
              0x800E9220 0x800EB290 0x800F0C10 0x800F2A9C \
              0x800D15A8 0x800D8930 0x800D10F0 \
              0x80102898 0x801088A8 0x80108D2C \
            -postScript ExportPerRecordCallerGraph.java "$out/per-record-caller-graph.txt" \
            -postScript ExportPendingParticipantDelta.java "$out/pending-participant-delta.txt" \
            -postScript ExportStage1EconomyAQ1.java "$out/aq1-economy-census.tsv" \
            -postScript ExportStage1EconomyDeepContext.java "$out/aq1-deep-context.tsv" \
            -analysisTimeoutPerFile 600 -max-cpu 2 -deleteProject \
            > "$out/ghidra-headless.log" 2>&1
          rc=$?
          set -e

          if [[ "$rc" -ne 0 || ! -s "$out/entry1-buffer-base-targets.txt" || ! -s "$out/per-record-caller-graph.txt" || ! -s "$out/pending-participant-delta.txt" || ! -s "$out/aq1-economy-census.tsv" || ! -s "$out/aq1-deep-context.tsv" ]]; then
            {
              echo "status=FAILURE"
              echo "job=analyze-entry1-buffer-base"
              echo "commit_sha=$GITHUB_SHA"
              echo "exit_code=$rc"
              echo "target_output_present=$([[ -s "$out/entry1-buffer-base-targets.txt" ]] && echo yes || echo no)"
              echo "caller_graph_present=$([[ -s "$out/per-record-caller-graph.txt" ]] && echo yes || echo no)"
              echo "pending_delta_trace_present=$([[ -s "$out/pending-participant-delta.txt" ]] && echo yes || echo no)"
              echo "aq1_economy_census_present=$([[ -s "$out/aq1-economy-census.tsv" ]] && echo yes || echo no)"
              echo "aq1_deep_context_present=$([[ -s "$out/aq1-deep-context.tsv" ]] && echo yes || echo no)"
            } > "$out/run-summary.txt"
            tail -n 80 "$out/ghidra-headless.log" || true
            exit 1
          fi

          python3 - "$out/entry1-buffer-base-targets.txt" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8", errors="replace")
          text = text.replace("resource_base=0x800AD000 (hypothesis only)",
                              "resource_base=0x800AD450 (loader global slot candidate; runtime unverified)")
          out = []
          current_target = None
          for line in text.splitlines():
              m = re.match(r"=== TARGET (?:0x)?([0-9A-Fa-f]+) ===", line)
              if m:
                  current_target = int(m.group(1), 16)
              if current_target is not None and line.startswith("target_offset_under_hypothesis="):
                  line = "target_offset_under_buffer_base=0x" + format(current_target - 0x800AD450, "x")
              out.append(line)
          text = "\n".join(out) + "\n"
          path.write_text(text, encoding="utf-8")
          if "resource_base=0x800AD450" not in text:
              raise SystemExit("Buffer base metadata correction failed")
          if "target_offset_under_buffer_base=0x107fc" not in text:
              raise SystemExit("Helper corrected file offset missing")
          print("buffer_base_metadata=PASS")
          PY

          {
            echo "status=SUCCESS"
            echo "job=analyze-entry1-buffer-base"
            echo "commit_sha=$GITHUB_SHA"
            echo "exit_code=0"
            echo "entry1_directory_index=1"
            echo "entry1_file_offset=0x10BB000"
            echo "entry1_bytes=596412"
            echo "entry1_sha256=$EXPECTED_ENTRY1_SHA256"
            echo "analysis_import_base=0x800AD450"
            echo "analysis_base_status=STATIC_CANDIDATE_FROM_GLOBAL_POINTER"
            echo "per_record_caller_graph=PASS"
            echo "pending_delta_trace=PASS"
            echo "aq1_economy_census=PASS"
            echo "aq1_scope=jump_table_5; record_fields_00_0B_20; direct_callers_770C_BDC4C; accessor_callers_grouped_by_record_B44_2EE"
            echo "targeted_functions=toll commit callback, all candidate pending-delta writers, pending processor, upgrade/toll state machines and caller graph"
            echo "game_or_emulator_executed=no"
            echo "gameplay_input_sent=no"
            echo "savestate_restored=no"
            echo "private_BINARY_uploaded_as_artifact=no"
          } > "$out/run-summary.txt"

      - name: Remove private slice and Ghidra project
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/entry1-buffer-base"
          rm -rf "$root"
          out="$RUNNER_TEMP/entry1-buffer-base-output"
          if [[ ! -e "$root" ]]; then
            echo "PRIVATE_INPUT_AND_PROJECT_CLEANUP=PASS" >> "$out/run-summary.txt" 2>/dev/null || true
          else
            echo "PRIVATE_INPUT_AND_PROJECT_CLEANUP=FAIL" >> "$out/run-summary.txt"
            exit 1
          fi

      - name: Validate text-only output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/entry1-buffer-base-output"
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          files = [p for p in root.rglob("*") if p.is_file()]
          invalid = [str(p) for p in files if p.suffix.lower() not in {".txt", ".log", ".tsv"}]
          oversized = [str(p) for p in files if p.stat().st_size > 30_000_000]
          if invalid or oversized:
              raise SystemExit(f"Invalid artifact files: invalid={invalid} oversized={oversized}")
          if not (root / "run-summary.txt").is_file():
              raise SystemExit("Missing run-summary.txt")
          print(f"text_only_output_count={len(files)}")
          print("private_binary_uploaded=no")
          PY

      - name: Recount AQ1 TSV and commit text-only report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/entry1-buffer-base-output"
          python3 - "$out/aq1-economy-census.tsv" "$out/aq1-recount.txt" <<'PY'
          import csv,sys
          from collections import Counter
          src,dst=sys.argv[1:3]
          rows=[]
          try:
              with open(src,encoding="utf-8",newline="") as f:
                  rows=list(csv.DictReader(f,delimiter="\t"))
          except FileNotFoundError:
              pass
          types=Counter(r.get("record_type","") for r in rows)
          field=Counter((r.get("item",""),r.get("kind","")) for r in rows if r.get("record_type")=="FIELD")
          helper=Counter(r.get("item","") for r in rows if r.get("record_type")=="HELPER_CALL")
          accessor=Counter((r.get("item",""),r.get("scope_or_group","")) for r in rows if r.get("record_type")=="ACCESSOR_CALL")
          with open(dst,"w",encoding="utf-8") as f:
              f.write("AQ1 totals recomputed from aq1-economy-census.tsv\n")
              f.write("record_type_counts="+repr(dict(types))+"\n")
              f.write("record_field_access_counts="+repr({str(k):v for k,v in field.items()})+"\n")
              f.write("helper_direct_callsite_counts="+repr(dict(helper))+"\n")
              f.write("accessor_direct_callsite_group_counts="+repr({str(k):v for k,v in accessor.items()})+"\n")
              f.write("indirect_JALR=TIDAK_TAHU\n")
          print("AQ1_COUNTS_RECOMPUTED rows="+str(len(rows)))
          PY
          dest="reports/stage1_economy/aq1-run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dest"
          for f in aq1-economy-census.tsv aq1-deep-context.tsv aq1-recount.txt run-summary.txt input-identity.txt; do
            if [ -f "$out/$f" ]; then cp "$out/$f" "$dest/$f"; fi
          done
          API="https://api.github.com/repos/$RESEARCH_REPO"
          JOB_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | jq -r '.jobs[] | select(.name=="analyze-entry1-buffer-base") | .id' | head -n 1)"
          test -n "$JOB_ID" || JOB_ID="TIDAK TAHU"
          RC="$(sed -n 's/^exit_code=//p' "$out/run-summary.txt" 2>/dev/null | head -n 1)"; test -n "$RC" || RC="TIDAK TAHU"
          STATUS="$(sed -n 's/^status=//p' "$out/run-summary.txt" 2>/dev/null | head -n 1)"; test -n "$STATUS" || STATUS="INCOMPLETE"
          { echo "STATUS=$STATUS"; echo "JOB=analyze-entry1-buffer-base"; echo "JOB_ID=$JOB_ID"; echo "RUN_ID=$GITHUB_RUN_ID"; echo "SOURCE_SHA=$GITHUB_SHA"; echo "EXIT_CODE=$RC"; } > "$dest/ACTIONS_RUN_SUMMARY.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Publish AQ1 static economy census run $GITHUB_RUN_ID"
            pushed=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$n"
            done
            test "$pushed" -eq 1
          fi
          echo "AQ1_REPORT_PATH=$dest"

      - name: Upload text-only trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry1-loader-buffer-base-static-audit
          path: ${{ runner.temp }}/entry1-buffer-base-output/
          if-no-files-found: warn
          retention-days: 14
