name: UM0-UM2 — static writer lineage, frame-1 read-only snapshot and ledger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/um0-um2-audit.yml"
      - "tools/stage1/RunUM0.py"
      - "tools/stage1/RunUM1.py"
      - "tools/stage1/RunUM2.py"
  workflow_dispatch:
    inputs:
      run_um1:
        description: Run the bounded read-only PCSX snapshot (4 launches maximum including card warmup)
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-um0-um2-audit
  cancel-in-progress: false

jobs:
  preflight:
    name: um-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
      preflight_pass: ${{ steps.gate.outputs.preflight_pass }}
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile, lint, parse YAML, actionlint and self-tests
        id: gate
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/UM_PREFLIGHT_SUMMARY.txt"
          : > "$report"
          python -m py_compile tools/stage1/RunUM0.py tools/stage1/RunUM1.py tools/stage1/RunUM2.py tools/stage1/RunUL0.py experiments/ub2_headless_trace.py
          compile_rc=$?

          python -m pip install --disable-pip-version-check --no-input pyflakes PyYAML >/tmp/um-pip-install.log 2>&1
          pip_rc=$?
          if [ "$pip_rc" -eq 0 ]; then
            python -m pyflakes tools/stage1/RunUM0.py tools/stage1/RunUM1.py tools/stage1/RunUM2.py
            pyflakes_rc=$?
          else
            pyflakes_rc=2
          fi

          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path(".github/workflows/um0-um2-audit.yml")
          yaml.compose(p.read_text(encoding="utf-8"), Loader=yaml.SafeLoader)
          print("UM_WORKFLOW_YAML=PASS")
          PY
          yaml_rc=$?
          if [ "$yaml_rc" -ne 0 ]; then
            ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/um0-um2-audit.yml"); puts "UM_WORKFLOW_YAML_RUBY=PASS"'
            yaml_rc=$?
          fi

          python tools/stage1/RunUM0.py --self-test
          um0_rc=$?
          python tools/stage1/RunUM1.py --self-test
          um1_rc=$?
          python tools/stage1/RunUM2.py --self-test
          um2_rc=$?

          actionlint_rc=2
          actionlint_version="1.7.12"
          if curl --fail --silent --show-error --location --max-time 60 "https://github.com/rhysd/actionlint/releases/download/v$actionlint_version/actionlint_1.7.12_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"; then
            if tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint; then
              "$RUNNER_TEMP/actionlint" .github/workflows/um0-um2-audit.yml
              actionlint_rc=$?
            fi
          fi

          record_check() {
            name="$1"; code="$2"
            if [ "$code" = "0" ]; then state=PASS
            elif [ "$code" = "2" ]; then state=NOT_RUN
            else state=FAIL
            fi
            echo "$name=$state" | tee -a "$report" >> "$GITHUB_STEP_SUMMARY"
          }
          record_check LOCAL_PY_COMPILE 2
          record_check LOCAL_PYFLAKES 2
          record_check LOCAL_YAML_PARSE 2
          record_check LOCAL_ACTIONLINT 2
          record_check PY_COMPILE "$compile_rc"
          record_check PYFLAKES "$pyflakes_rc"
          record_check YAML_PARSE "$yaml_rc"
          record_check UM0_SELF_TEST "$um0_rc"
          record_check UM1_SELF_TEST "$um1_rc"
          record_check UM2_SELF_TEST "$um2_rc"
          record_check ACTIONLINT "$actionlint_rc"
          if [ "$pip_rc" -eq 0 ]; then echo "PYFLAKES_INSTALL=PASS" >> "$report"; else echo "PYFLAKES_INSTALL=NOT_RUN" >> "$report"; fi

          rc=0
          for code in "$compile_rc" "$yaml_rc" "$um0_rc" "$um1_rc" "$um2_rc"; do
            [ "$code" -eq 0 ] || rc=1
          done
          [ "$pyflakes_rc" -eq 1 ] && rc=1
          [ "$actionlint_rc" -eq 1 ] && rc=1
          partial=0
          [ "$pyflakes_rc" -eq 2 ] && partial=1
          [ "$actionlint_rc" -eq 2 ] && partial=1
          if [ "$rc" -ne 0 ]; then status=BELUM; pass=false
          elif [ "$partial" -eq 1 ]; then status=SEBAGIAN; pass=true
          else status=TUNTAS; pass=true
          fi
          {
            echo "STATUS=$status"
            echo "JOB=um-preflight"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXIT_CODE=$rc"
          } >> "$report"
          cp "$report" "$RUNNER_TEMP/UM_PREFLIGHT_RESULT.txt"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "preflight_pass=$pass" >> "$GITHUB_OUTPUT"
          echo "PREFLIGHT_EXIT_CODE=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  um-audit:
    name: um-audit
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.preflight_pass == 'true' && github.sha == needs.preflight.outputs.source_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: /tmp/naruto-um-private-${{ github.run_id }}-${{ github.run_attempt }}
      OUT: /tmp/naruto-um-output-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact workflow source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source SHA and prepare outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$WORK/source" "$WORK/extracted" "$WORK/input" "$WORK/checkpoint" "$WORK/emulator" "$WORK/cards" "$OUT/UM0" "$OUT/UM1" "$OUT/UM2" "$OUT/PREFLIGHT" "$OUT/ACTIONS"
          echo "WORKFLOW_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install private-disc extraction utilities
        shell: bash
        run: |
          set +e
          if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bchunk xorriso jq unzip; then
            rc=0
          else
            rc=$?
          fi
          echo "$rc" > "$OUT/ENV_SETUP_EXIT_CODE.txt"
          if [ "$rc" -eq 0 ]; then echo "DISC_TOOLS=PASS" >> "$GITHUB_STEP_SUMMARY"; else echo "DISC_TOOLS=FAIL" >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Download and privately extract EXE and DATA.BIN
        shell: bash
        run: |
          set +e
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          bin="$WORK/source/naruto-disc.bin"
          cue_raw="$WORK/source/original.cue"
          cue="$WORK/source/naruto-disc.cue"
          rc=0
          command -v bchunk >/dev/null 2>&1 || rc=10
          command -v xorriso >/dev/null 2>&1 || rc=10
          if [ "$rc" -eq 0 ]; then
            curl --fail --location --silent --show-error --retry 2 --max-time 600 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/647346873" -o "$bin" || rc=11
          fi
          if [ "$rc" -eq 0 ]; then
            test "$(stat -c '%s' "$bin")" = "325989552" || rc=12
            echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status || rc=13
          fi
          if [ "$rc" -eq 0 ]; then
            curl --fail --location --silent --show-error --retry 2 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/647354760" -o "$cue_raw" || rc=14
          fi
          if [ "$rc" -eq 0 ]; then
            test "$(stat -c '%s' "$cue_raw")" = "116" || rc=15
            echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status || rc=16
          fi
          if [ "$rc" -eq 0 ]; then
            if awk '
              BEGIN { n=0 }
              /^[[:space:]]*FILE[[:space:]]/ { print "FILE \"naruto-disc.bin\" BINARY"; n++; next }
              { print }
              END { if (n != 1) exit 1 }
            ' "$cue_raw" > "$cue"; then
              echo "CUE_REWRITE=PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              rc=17
            fi
          fi
          if [ "$rc" -eq 0 ]; then bchunk "$bin" "$cue" "$WORK/source/track" >/tmp/um-bchunk.log 2>&1 || rc=18; fi
          iso="$(find "$WORK/source" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          if [ "$rc" -eq 0 ]; then
            [ -n "$iso" ] || rc=19
            xorriso -osirrox on -indev "$iso" -extract / "$WORK/extracted" > "$WORK/disc-extract.log" 2>&1 || rc=20
          fi
          if [ "$rc" -eq 0 ]; then
            exe="$(find "$WORK/extracted" -type f -iname 'SLPS_035.53' -print -quit)"
            data="$(find "$WORK/extracted" -type f -iname 'DATA.BIN' -print -quit)"
            [ -n "$exe" ] && [ -n "$data" ] || rc=21
          fi
          if [ "$rc" -eq 0 ]; then
            test "$(stat -c '%s' "$exe")" = "385024" || rc=22
            echo "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569  $exe" | sha256sum --check --status || rc=23
            test "$(stat -c '%s' "$data")" = "66015232" || rc=24
            echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status || rc=25
          fi
          if [ "$rc" -eq 0 ]; then
            cp "$exe" "$WORK/input/SLPS_035.53"
            cp "$data" "$WORK/input/DATA.BIN"
            echo "DISC_EXTRACT=PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DISC_EXTRACT=FAIL code=$rc" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "$rc" > "$OUT/DISC_EXTRACT_EXIT_CODE.txt"
          exit 0

      - name: UM0 — backward value lineage for all UL0 writer sites
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s "$WORK/input/SLPS_035.53" ] && [ -s "$WORK/input/DATA.BIN" ]; then
            python tools/stage1/RunUM0.py --exe "$WORK/input/SLPS_035.53" --data-bin "$WORK/input/DATA.BIN" --out-dir "$OUT/UM0" > "$OUT/UM0_EXECUTION_LOG.txt" 2>&1
            rc=$?
          else
            rc=2
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=private EXE or DATA.BIN extraction did not complete\nEXIT_CODE=2\n' > "$OUT/UM0/UM0_SUMMARY.txt"
            printf 'UM0_INPUTS_MISSING\n' > "$OUT/UM0_EXECUTION_LOG.txt"
          fi
          echo "$rc" > "$OUT/UM0_EXIT_CODE.txt"
          if [ "$rc" -ne 0 ] && [ ! -s "$OUT/UM0/UM0_SUMMARY.txt" ]; then
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=UM0 analysis failed\nEXIT_CODE=%s\n' "$rc" > "$OUT/UM0/UM0_SUMMARY.txt"
          fi
          echo "UM0_EXIT_CODE=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Download exact checkpoint artifact for frame-1 snapshot
        if: github.event_name == 'push' || github.event.inputs.run_um1 == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: "39907655833"
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}/checkpoint

      - name: Download and verify PCSX-Redux, retail BIOS and private disc input
        if: github.event_name == 'push' || github.event.inputs.run_um1 == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd "$WORK/source"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          curl --fail --silent --show-error --location --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          rc=$?
          fetch_asset() {
            name="$1"; dest="$2"; size="$3"; digest="$4"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null || return 1
            curl --fail --silent --show-error --location --retry 2 --max-time 600 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$dest" || return 1
            test "$(stat -c %s "$dest")" = "$size" || return 1
            echo "$digest  $dest" | sha256sum --check --status || return 1
          }
          if [ "$rc" -eq 0 ]; then fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage 65747557 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c || rc=2; fi
          if [ "$rc" -eq 0 ]; then
            cp "$WORK/source/naruto-disc.bin" game.bin
            echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check --status || rc=3
            cp "$WORK/source/naruto-disc.cue" game.cue
            fetch_asset scph7502.zip scph7502.zip 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a || rc=4
          fi
          if [ "$rc" -eq 0 ]; then
            if python - <<'PY'
          from pathlib import Path
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as archive:
              members = []; total = 0
              for item in archive.infolist():
                  name = Path(item.filename); mode = (item.external_attr >> 16) & 0xffff; total += item.file_size
                  if name.is_absolute() or ".." in name.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("BIOS_ARCHIVE_UNSAFE_MEMBER")
                  if item.file_size > 2*1024*1024 or total > 4*1024*1024:
                      raise SystemExit("BIOS_ARCHIVE_EXPANSION_BOUND")
                  if not item.is_dir() and item.file_size == 524288:
                      members.append(item)
              if len(members) != 1:
                  raise SystemExit("BIOS_EXPECTED_ONE_512K_MEMBER")
              bios = archive.read(members[0])
              digest = hashlib.sha256(bios).hexdigest()
              if digest != "5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1":
                  raise SystemExit("BIOS_SHA256_MISMATCH")
              Path("scph7502.bin").write_bytes(bios)
          lines = Path("game.cue").read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          files = [i for i, line in enumerate(lines) if line.strip().upper().startswith("FILE ")]
          if len(files) != 1:
              raise SystemExit("CUE_EXPECTED_ONE_FILE_ROW")
          lines[files[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
            then
              :
            else
              rc=5
            fi
          fi
          if [ "$rc" -eq 0 ]; then chmod +x pcsx-redux.AppImage; ./pcsx-redux.AppImage --appimage-extract >/dev/null || rc=6; fi
          if [ "$rc" -eq 0 ]; then
            APPDIR="$WORK/source/squashfs-root"
            test -x "$APPDIR/AppRun" || rc=7
            PCSX_BIN="$(find -L "$APPDIR" -maxdepth 8 -type f -perm /111 | grep -E '/(pcsx-redux|pcsx-redux[^/]*)$' | head -n 1)"
            test -n "$PCSX_BIN" && test -x "$PCSX_BIN" || rc=8
            cp scph7502.bin "$WORK/input/scph7502.bin"
            cp game-run.cue "$WORK/input/game-run.cue"
            echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"
            echo "PCSX_BIN=$PCSX_BIN" >> "$GITHUB_ENV"
          fi
          echo "$rc" > "$OUT/EMULATOR_INPUTS_EXIT_CODE.txt"
          if [ "$rc" -eq 0 ]; then echo "EMULATOR_INPUTS=PASS" >> "$GITHUB_STEP_SUMMARY"; else echo "EMULATOR_INPUTS=FAIL code=$rc" >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Verify immutable checkpoint
        if: github.event_name == 'push' || github.event.inputs.run_um1 == 'true'
        shell: bash
        run: |
          set +e
          SOURCE="$WORK/checkpoint/adaptive-cycle-02-f180.sstate"
          rc=0
          test -f "$SOURCE" && test "$(stat -c '%s' "$SOURCE")" = "21162799" || rc=1
          if [ "$rc" -eq 0 ]; then
            echo "705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35  $SOURCE" | sha256sum --check --status || rc=2
          fi
          if [ "$rc" -eq 0 ]; then chmod 0444 "$SOURCE"; fi
          echo "$rc" > "$OUT/CHECKPOINT_VERIFY_EXIT_CODE.txt"
          if [ "$rc" -eq 0 ]; then echo "CHECKPOINT_VERIFY=PASS" >> "$GITHUB_STEP_SUMMARY"; else echo "CHECKPOINT_VERIFY=FAIL" >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: UM1 — bounded frame-1 read-only snapshot
        if: github.event_name == 'push' || github.event.inputs.run_um1 == 'true'
        shell: bash
        run: |
          set +e
          if [ "$(cat "$OUT/CHECKPOINT_VERIFY_EXIT_CODE.txt" 2>/dev/null)" = "0" ] &&
             [ "$(cat "$OUT/EMULATOR_INPUTS_EXIT_CODE.txt" 2>/dev/null)" = "0" ]; then
            python tools/stage1/RunUM1.py --work "$WORK/emulator" --out "$OUT/UM1" --pcsx-bin "$PCSX_BIN" --appdir "$APPDIR" \
              --bios "$WORK/input/scph7502.bin" --cue "$WORK/input/game-run.cue" \
              --source "$WORK/checkpoint/adaptive-cycle-02-f180.sstate" \
              --lv-table reports/stage1_economy/DN1_DK1_X_LV_TABLE_2026-11-05.tsv \
              --timeout-seconds 120 --max-launches 4 > "$OUT/UM1_EXECUTION_LOG.txt" 2>&1
            rc=$?
          else
            rc=2
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=checkpoint or emulator input verification not passed\nLAST_STAGE=PRE_LAUNCH\nEXIT_CODE=2\n' > "$OUT/UM1/UM1_SUMMARY.txt"
            printf 'UM1_PRE_LAUNCH_PREREQUISITE_FAILED\n' > "$OUT/UM1_EXECUTION_LOG.txt"
          fi
          echo "$rc" > "$OUT/UM1_EXIT_CODE.txt"
          if [ "$rc" -ne 0 ] && [ ! -s "$OUT/UM1/UM1_SUMMARY.txt" ]; then
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=UM1 runtime did not produce a summary\nLAST_STAGE=SEE_EXECUTION_LOG\nEXIT_CODE=%s\n' "$rc" > "$OUT/UM1/UM1_SUMMARY.txt"
          fi
          echo "UM1_EXIT_CODE=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: UM2 — inclusive commit and Actions run/job/page ledger
        if: always()
        shell: bash
        run: |
          set +e
          python tools/stage1/RunUM2.py --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" --out-dir "$OUT/UM2" > "$OUT/UM2_EXECUTION_LOG.txt" 2>&1
          rc=$?
          echo "$rc" > "$OUT/UM2_EXIT_CODE.txt"
          if [ "$rc" -ne 0 ] && [ ! -s "$OUT/UM2/UM2_SUMMARY.txt" ]; then
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=UM2 API, Actions HTML page or Git ledger failed\nEXIT_CODE=%s\n' "$rc" > "$OUT/UM2/UM2_SUMMARY.txt"
          fi
          echo "UM2_EXIT_CODE=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Remove private ROM, BIOS, checkpoint and emulator state
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$WORK"
          if [ -d "$WORK" ]; then echo "PRIVATE_CLEANUP=FAIL" >> "$GITHUB_STEP_SUMMARY"; else echo "PRIVATE_CLEANUP=PASS" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit text-only UM reports and Actions summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for stage in UM0 UM1 UM2; do
            stage_exit="$OUT/$stage"_EXIT_CODE.txt
            stage_log="$OUT/$stage"_EXECUTION_LOG.txt
            stage_summary="$OUT/$stage/$stage"_SUMMARY.txt
            mkdir -p "$OUT/$stage"
            if [ ! -f "$stage_exit" ]; then echo 2 > "$stage_exit"; fi
            if [ ! -f "$stage_log" ]; then
              printf '%s\n' "STATUS=BELUM" "REASON=stage did not reach its execution step" "EXIT_CODE=2" > "$stage_log"
            fi
            if [ ! -f "$stage_summary" ]; then
              printf '%s\n' "STATUS=BELUM" "EVIDENCE=K0" "REASON=no stage summary was produced" "EXIT_CODE=2" > "$stage_summary"
            fi
          done
          rc0="$(cat "$OUT/UM0_EXIT_CODE.txt")"
          rc1="$(cat "$OUT/UM1_EXIT_CODE.txt")"
          rc2="$(cat "$OUT/UM2_EXIT_CODE.txt")"
          printf '%s\n' "$(cat "$RUNNER_TEMP/UM_PREFLIGHT_RESULT.txt" 2>/dev/null || true)" > "$OUT/PREFLIGHT/PREFLIGHT_SUMMARY.txt"
          final_rc=0
          for code in "$rc0" "$rc1" "$rc2"; do
            [ "$code" = "0" ] || [ "$code" = "2" ] || final_rc=1
          done
          if [ "$rc0" = "0" ] && [ "$rc1" = "0" ] && [ "$rc2" = "0" ]; then status=TUNTAS
          else status=SEBAGIAN
          fi
          {
            echo "STATUS=$status"
            echo "JOB=um-audit"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "UM0_EXIT_CODE=$rc0"
            echo "UM1_EXIT_CODE=$rc1"
            echo "UM2_EXIT_CODE=$rc2"
            echo "EXIT_CODE=$final_rc"
          } > "$OUT/ACTIONS/ACTIONS_RUN_SUMMARY.txt"
          cat > "$OUT/UM_FINAL_CLOSEOUT.txt" <<EOF
          UM0-UM2 FINAL CLOSEOUT
          REPOSITORY=$GITHUB_REPOSITORY
          BRANCH=main
          BASELINE_UM_INCLUSIVE=77df5627cba56a17503f54cb7664f02129893ab7
          HARNESS_DELETION_AUDIT_BASELINE_REFERENCE=aa32fbcee97c8f49946a8e589010cfb9ef1a6928
          WORKFLOW_SOURCE_SHA=$GITHUB_SHA
          WORKFLOW_RUN_ID=$GITHUB_RUN_ID
          OVERALL_STATUS=$status
          UM0_EXIT_CODE=$rc0
          UM1_EXIT_CODE=$rc1
          UM2_EXIT_CODE=$rc2
          RESULT_REPORT_COMMIT_INCLUDED_IN_UM2_LEDGER=NO (ledger captured before final text-only report commit)
          LOCAL_PY_COMPILE=NOT_RUN
          LOCAL_PYFLAKES=NOT_RUN
          LOCAL_YAML_PARSE=NOT_RUN
          LOCAL_ACTIONLINT=NOT_RUN
          CODE_FILES_ADDED:
          .github/workflows/um0-um2-audit.yml
          tools/stage1/RunUM0.py
          tools/stage1/RunUM1.py
          tools/stage1/RunUM2.py
          RESULT_REPORT_PATH=reports/ui-audit-2026-11-12/um/run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT/
          OLD_FILES_MODIFIED=NO
          STATUS_MD_RELEASE_TAG_MODIFIED=NO
          BINARY_ROM_BIOS_SAVESTATE_MEMORY_CARD_RAM_DUMP_COMMITTED=NO
          EOF
          git fetch origin main
          git switch -C um-report-publish origin/main
          dest="reports/ui-audit-2026-11-12/um/run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dest"
          cp -R "$OUT/UM0" "$OUT/UM1" "$OUT/UM2" "$OUT/PREFLIGHT" "$OUT/ACTIONS" "$dest/"
          cp "$OUT/UM0_EXECUTION_LOG.txt" "$OUT/UM1_EXECUTION_LOG.txt" "$OUT/UM2_EXECUTION_LOG.txt" "$dest/"
          cp "$OUT/UM0_EXIT_CODE.txt" "$OUT/UM1_EXIT_CODE.txt" "$OUT/UM2_EXIT_CODE.txt" "$dest/"
          cp "$OUT/DISC_EXTRACT_EXIT_CODE.txt" "$OUT/EMULATOR_INPUTS_EXIT_CODE.txt" "$OUT/CHECKPOINT_VERIFY_EXIT_CODE.txt" "$dest/" 2>/dev/null || true
          cp "$OUT/UM_FINAL_CLOSEOUT.txt" "$dest/UM_FINAL_CLOSEOUT.txt"
          {
            echo "FILES_CHANGED_BY_RESULT_COMMIT:"
            find "$dest" -type f -print | sort
          } >> "$dest/UM_FINAL_CLOSEOUT.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record UM0-UM2 audit results for run $GITHUB_RUN_ID [skip ci]"
            pushed=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$n"
            done
            test "$pushed" -eq 1
          fi
          report_sha="$(git rev-parse HEAD)"
          {
            echo "UM_REPORT_COMMIT=$report_sha"
            echo "UM_ACTIONS_SUMMARY_RAW_URL=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$report_sha/$dest/ACTIONS/ACTIONS_RUN_SUMMARY.txt"
            echo "OVERALL_ANALYSIS_STATUS=$status"
            echo "OVERALL_ANALYSIS_EXIT_CODE=$final_rc"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$final_rc"
