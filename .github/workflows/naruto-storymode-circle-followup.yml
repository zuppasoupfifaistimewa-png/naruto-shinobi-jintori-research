name: Naruto Story Mode Circle follow-up timeline probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-circle-followup"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-CIRCLE-FOLLOWUP]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-circle-followup
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research workflow
        uses: actions/checkout@v4

      - name: Install screenshot tools and prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil xvfb x11-utils curl unzip
          mkdir -p "$WORK"/{build-artifact,state-artifact,card-artifact,cards,resume,captures/raw,home,.config,.data,runtime,app}

      - name: Download already-built patched emulator from control probe
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-circle-followup/build-artifact

      - name: Download verified next checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-spu-sentinel-fix-probe-private
          run-id: 39426068247
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-circle-followup/state-artifact

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-circle-followup/card-artifact

      - name: Verify reusable binary, checkpoint and card hashes
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          RAW="$WORK/state-artifact/captures/storymode-checkpoint-next.raw.sstate"
          MANIFEST="$WORK/state-artifact/captures/probe-manifest.txt"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$RAW")" = 21162405
          test "$(sha256sum "$RAW" | cut -d ' ' -f1)" = b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a
          grep -q '^PROBE_NEXT_CHECKPOINT_VALID=PASS$' "$MANIFEST"
          grep -q '^PROBE_CONTROLLER_INPUT=none$' "$MANIFEST"
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$RAW" "$WORK/resume/storymode-checkpoint.sstate"
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          echo "CIRCLE_FOLLOWUP_BINARY_VALID=PASS"
          echo "CIRCLE_TIMELINE_CHECKPOINT_VALID=PASS bytes=21162405 sha256=b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a"
          echo "CIRCLE_TIMELINE_MEMORY_CARD_VALID=PASS"

      - name: Download game and BIOS from the private runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0]); h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("CIRCLE_TIMELINE_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Compare control and Circle timing from the same savestate
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          mkdir -p "$WORK/runtime"
          chmod 700 "$WORK/runtime"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("CIRCLE_TIMELINE_PAD_SETUP=PASS")
          LUA
          )
          cat > "$WORK/timeline.lua" <<'LUA'
          local mode=os.getenv("PROBE_MODE") or "NONE"
          local frame=0; local start_seen=false; local load_returned=false; local load_event=false; local finalFrame=(mode=="NONE") and 150 or 180
          local pad=PCSX.SIO0.slots[1].pads[1]; local buttons=PCSX.CONSTS.PAD.BUTTON
          local captures={[20]=true,[29]=true,[30]=true,[35]=true,[37]=true,[38]=true,[39]=true,[45]=true,[90]=true,[120]=true,[150]=true,[180]=true}
          local function log(s) print(s); io.stdout:flush() end
          local function shot(f)
              local s=PCSX.GPU.takeScreenShot()
              assert(s and s.width>=100 and s.height>=100 and s.data,"invalid screenshot")
              local bpp=(s.bpp==0) and 16 or 24
              local label=mode.."-f"..string.format("%03d",f)
              local rawpath="captures/raw/"..label..".raw"
              local raw=assert(Support.File.open(rawpath,"TRUNCATE")); raw:writeMoveSlice(s.data); raw:close()
              local m=assert(io.open("captures/"..label..".json","wb"))
              m:write(string.format('{"label":"%s","raw":"%s","width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',label,rawpath,s.width,s.height,bpp,s.width*s.height*bpp/8)); m:close()
              log(string.format("CIRCLE_TIMELINE_SCREENSHOT label=%s width=%d height=%d",label,s.width,s.height))
          end
          local function input(action,phase)
              local b=buttons.CIRCLE
              if action=="LEFT" then b=buttons.LEFT elseif action=="START" then b=buttons.START end
              local ok,readback=pcall(function()
                  if phase=="press" then pad.setOverride(b) else pad.clearOverride(b) end
                  return pad.getButton(b)
              end)
              log(string.format("CIRCLE_TIMELINE_INPUT mode=%s action=%s phase=%s readback=%s status=%s",mode,action,phase,tostring(readback),(ok and readback==(phase=="press")) and "PASS" or "FAIL"))
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function() load_event=true; frame=0; log("CIRCLE_TIMELINE_LOAD_EVENT=PASS") end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not start_seen then
                  start_seen=true; log("CIRCLE_TIMELINE_LOAD_BEGIN=1"); PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/storymode-checkpoint.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("CIRCLE_TIMELINE_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      load_returned=true; log("CIRCLE_TIMELINE_LOAD_RETURNED=1"); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not load_event or not load_returned then return end
              frame=frame+1
              if mode=="CIRCLE_TAP_EARLY" then
                  if frame==30 then input("CIRCLE","press") elseif frame==38 then input("CIRCLE","release") end
              elseif mode=="START_TAP_EARLY" then
                  if frame==30 then input("START","press") elseif frame==38 then input("START","release") end
              end
              if captures[frame] then shot(frame) end
              if frame==finalFrame then
                  log("CIRCLE_TIMELINE_BRANCH_DONE mode="..mode.." load_event="..tostring(load_event).." load_returned="..tostring(load_returned))
                  PCSX.pauseEmulator(); PCSX.nextTick(function() PCSX.quit(0) end); return
              end
          end)
          log("CIRCLE_TIMELINE_READY mode="..mode)
          LUA
          cp "$WORK/timeline.lua" "$WORK/captures/timeline.lua"

          failed=0
          for mode in NONE CIRCLE_TAP_EARLY START_TAP_EARLY; do
            cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/card-$mode.mcd"
            echo "CIRCLE_TIMELINE_BRANCH_BEGIN=$mode"
            set +e
            PROBE_MODE="$mode" timeout --signal=TERM --kill-after=5s 240s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-$mode.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/timeline.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/pcsx-$mode.log" -run > "$WORK/captures/pcsx-$mode.stdout" 2>&1
            rc=$?
            set -e
            echo "CIRCLE_TIMELINE_BRANCH_EXIT mode=$mode code=$rc"
            grep -E 'CIRCLE_TIMELINE_(LOAD_EVENT|LOAD_RETURNED|INPUT|SCREENSHOT|BRANCH_DONE|LOAD_ERROR)' "$WORK/captures/pcsx-$mode.stdout" || true
            if [ "$rc" -ne 0 ] || ! grep -q 'CIRCLE_TIMELINE_BRANCH_DONE' "$WORK/captures/pcsx-$mode.stdout"; then failed=$((failed+1)); fi
          done

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path("captures"); images={}
          for mp in sorted(root.glob("*.json")):
              m=json.loads(mp.read_text()); raw=Path(m["raw"]).read_bytes()
              if len(raw)!=int(m["expected_bytes"]): raise SystemExit("screenshot byte count mismatch "+mp.name)
              w,h,bpp=int(m["width"]),int(m["height"]),int(m["bpp"])
              if bpp==16:
                  rgb=bytearray()
                  for p in range(0,len(raw),2):
                      v=raw[p] | (raw[p+1]<<8); rgb.extend(((v&31)*255//31,((v>>5)&31)*255//31,((v>>10)&31)*255//31))
                  im=Image.frombytes("RGB",(w,h),bytes(rgb))
              elif bpp==24: im=Image.frombytes("RGB",(w,h),raw)
              else: raise SystemExit("unsupported bpp")
              im.save(root/(m["label"]+".png"),optimize=True); images[m["label"]]=im
          modes=["NONE","CIRCLE_TAP_EARLY","START_TAP_EARLY"]
          frames=[20,29,30,35,37,38,39,45,90,120,150,180]
          baseline={f:images.get("NONE-f"+str(f).zfill(3)) for f in frames}
          out=[
             "CIRCLE_FOLLOWUP_PARENT_CHECKPOINT_SHA256=b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a",
             "CIRCLE_FOLLOWUP_PATCHED_APPIMAGE_SHA256=2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99",
             "CIRCLE_FOLLOWUP_BRANCHES=NONE,CIRCLE_TAP_EARLY,START_TAP_EARLY",
             "CIRCLE_FOLLOWUP_FRAMES="+",".join(map(str,frames)),
             "CIRCLE_FOLLOWUP_PARENT_STATE_MUTATION=NO",
             "",
             "Per-frame differences against NONE at the same VSync count:"
          ]
          for mode in modes:
              rows=[]
              for f in frames:
                  img=images.get(mode+"-f"+str(f).zfill(3)); base=baseline.get(f)
                  if img is None or base is None: rows.append(f"f{f}:missing"); continue
                  if img.size!=base.size: rows.append(f"f{f}:dimension_mismatch"); continue
                  d=ImageChops.difference(base,img); mean=sum(ImageStat.Stat(d).mean)/3
                  exact=sum(1 for a,b in zip(base.getdata(),img.getdata()) if a==b)/(img.width*img.height)
                  rows.append(f"f{f}:mad={mean:.3f},exact={exact:.5f}")
              out.append(mode+": "+"; ".join(rows))
          (root/"circle-followup-report.txt").write_text("\n".join(out)+"\n")
          print("\n".join(out))
          PY
          cat "$WORK/captures/circle-followup-report.txt"
          if [ "$failed" -ne 0 ]; then echo "::error::$failed timeline branches failed"; exit 44; fi

      - name: Upload private timeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-circle-followup-private
          path: |
            /tmp/naruto-storymode-circle-followup/captures/*.png
            /tmp/naruto-storymode-circle-followup/captures/*.txt
            /tmp/naruto-storymode-circle-followup/captures/*.stdout
            /tmp/naruto-storymode-circle-followup/captures/*.log
            /tmp/naruto-storymode-circle-followup/captures/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove checkpoint, Memory Card, ROM and BIOS from ephemeral runner
        if: always()
        shell: bash
        run: rm -rf "$WORK"
