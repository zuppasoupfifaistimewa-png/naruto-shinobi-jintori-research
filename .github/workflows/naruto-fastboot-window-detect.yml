name: Naruto fastboot OpenBIOS window-identification probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-fastboot-window-detect.yml"

permissions:
  contents: read

concurrency:
  group: naruto-fastboot-window-detect
  cancel-in-progress: true

jobs:
  fastboot-window:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Install private GUI inspection tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils xdotool imagemagick tesseract-ocr tesseract-ocr-jpn libgl1-mesa-dri mesa-utils

      - name: Download and verify private ROM, fastboot OpenBIOS and AnyLinux emulator
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-fastboot-window"
          mkdir -p "$WORK/captures" "$WORK/home"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private release asset: $name"; exit 1; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset openbios.bin openbios-fastboot.bin
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          echo "25c789eb66608847907217c367f04a3ec6e62c08530e97c437ce99d29f4c156d  openbios-fastboot.bin" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p=Path("game.cue")
          lines=p.read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ids=[i for i,line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids)!=1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          echo "ROM, emulator and fastboot BIOS identity checks passed."

      - name: Boot fastboot variant, enumerate actual X11 windows, and capture input deltas
        run: |
          set -eu
          cd "$WORK"
          Xvfb :99 -ac -screen 0 1280x800x24 -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          echo "OPENGL_CAPABILITIES_BEGIN"
          glxinfo -B 2>&1 | head -45 || true
          echo "OPENGL_CAPABILITIES_END"
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped")
          -- Deliberately avoid PCSX.getRegisters() inside GPU::Vsync callbacks:
          -- previous probes showed register reads there can freeze/segfault the emulator.
          print("SAFE_MONITORING=no CPU register reads inside VSync callbacks")
          LUA
          )
          timeout --signal=TERM --kill-after=5s 100s \
            "$WORK/squashfs-root/AppRun" -bios "$WORK/openbios-fastboot.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -run -interpreter -stdout -lua_stdout \
            -logfile "$WORK/pcsx.log" > "$WORK/pcsx.stdout" 2>&1 &
          emu_pid=$!
          capture_window() {
            label="$1"
            tree="$(xwininfo -root -tree 2>&1 || true)"
            printf '%s\n' "$tree" > "$WORK/window-tree-$label.txt"
            root_hex="$(xwininfo -root 2>/dev/null | awk '/Window id:/{print $4; exit}')"
            root_id=$((root_hex))
            echo "X11_ROOT_ID=$root_id ($root_hex)"
            window_id=""
            best_area=0
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              id_num=$((id))
              if [ "$id_num" -eq "$root_id" ]; then
                echo "WINDOW_CANDIDATE_SKIPPED=root id=$id_num"
                continue
              fi
              stats="$(xwininfo -id "$id" 2>/dev/null || true)"
              width="$(printf '%s\n' "$stats" | awk '/Width:/{print $2; exit}')"
              height="$(printf '%s\n' "$stats" | awk '/Height:/{print $2; exit}')"
              name="$(printf '%s\n' "$stats" | sed -n 's/.*Window id: [^"]*"\(.*\)".*/\1/p' | head -n 1)"
              case "$width:$height" in *[!0-9:]*|:*) continue;; esac
              area=$((width*height))
              if [ "$width" -ge 400 ] && [ "$height" -ge 250 ] && [ "$area" -gt "$best_area" ]; then
                window_id="$id_num"; best_area="$area"; best_name="$name"; best_width="$width"; best_height="$height"
              fi
            done < <(printf '%s\n' "$tree" | awk '$1 ~ /^0x[[:xdigit:]]+$/ {print $1}')
            if [ -z "$window_id" ]; then
              echo "CAPTURE_RESULT=$label no eligible non-root X11 window; window tree was saved"
              sed -n '1,100p' "$WORK/window-tree-$label.txt" || true
              return 1
            fi
            echo "CAPTURE_WINDOW=$label id=$window_id name=$best_name width=$best_width height=$best_height"
            import -window "$window_id" "$WORK/captures/$label.png"
            identify -format 'FRAME_METRICS label=%f width=%w height=%h mean=%[mean] stddev=%[standard-deviation] colors=%k\\n' "$WORK/captures/$label.png"
            echo "OCR_BEGIN=$label"
            tesseract "$WORK/captures/$label.png" stdout -l jpn+eng 2>/dev/null | head -20 || true
            echo "OCR_END=$label"
            echo "$window_id" > "$WORK/last-window-id"
            return 0
          }
          sleep 18
          capture_window before-input || true
          if [ -s "$WORK/last-window-id" ]; then
            wid="$(cat "$WORK/last-window-id")"
            timeout 2s xdotool windowfocus "$wid" 2>/dev/null || true
            echo "INPUT_TEST=Return then Z sent to detected app window; visual result must be interpreted separately"
            xdotool key --clearmodifiers Return
            sleep 2
            capture_window after-return || true
            xdotool key --clearmodifiers z
            sleep 2
            capture_window after-cross || true
            echo "INPUT_TEST_END"
          else
            echo "INPUT_TEST_SKIPPED=no eligible app window detected"
          fi
          for label in frame-40s frame-65s frame-90s; do
            case "$label" in frame-40s) sleep 18;; frame-65s) sleep 25;; frame-90s) sleep 25;; esac
            capture_window "$label" || true
          done
          set +e
          wait "$emu_pid"
          rc=$?
          set -e
          echo "GUI_PROCESS_EXIT=$rc (124 is the bounded observation cap)"
          echo "BOOT_MARKERS_BEGIN"
          grep -E 'Loaded BIOS:|OpenBIOS detected|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM\.CNF|BOOT =|\[CHUNK1\].*(after|done)|EXEC:PC0|Execute !|PAD_SETUP=|GUEST_PC_SAMPLE|Unknown command for pad|FATAL|Exception|ERROR|Error|Failed|failed' "$WORK/pcsx.stdout" "$WORK/pcsx.log" 2>/dev/null | tail -100 || true
          echo "BOOT_MARKERS_END"
          echo "Renderer experiment: default OpenGL GPU backend under Mesa llvmpipe; a window capture is not a game-boot claim."

      - name: Upload private diagnostic evidence for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-fastboot-window-private-captures
          path: |
            ${{ runner.temp }}/naruto-fastboot-window/captures/*.png
            ${{ runner.temp }}/naruto-fastboot-window/pcsx.stdout
            ${{ runner.temp }}/naruto-fastboot-window/pcsx.log
            ${{ runner.temp }}/naruto-fastboot-window/window-tree-*.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Clean private game data and temporary captures
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi
          echo "Cleanup complete; private ROM, OpenBIOS, emulator and captures removed from runner."
