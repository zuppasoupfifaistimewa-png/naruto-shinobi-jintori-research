name: Step 4 — Ghidra validation of RNG callers in resource code

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/step4-ghidra-rng-callers.yml"
      - "tools/ghidra/ExportTargetCallers.java"
      - "tools/ghidra/PrepareOverlayResource.java"
      - "tools/ghidra/PrepareEntry0Helper.java"

permissions:
  contents: read

concurrency:
  group: step4-ghidra-rng-caller-validation
  cancel-in-progress: false

jobs:
  validate-overlay-calls:
    name: Validate direct RNG/seed calls in DATA.BIN code candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GHIDRA_VERSION: "12.2"
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install disc tools and Java
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso
      - name: Set up Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Fetch and validate private BIN/CUE; extract DATA.BIN resource entries
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/step4-callers"
          source_dir="$root/source"
          extracted="$source_dir/extracted-root"
          input="$root/input"
          out="$RUNNER_TEMP/step4-callers-output"
          mkdir -p "$source_dir" "$extracted" "$input" "$out"
          bin="$source_dir/naruto-disc.bin"
          cue_raw="$source_dir/original.cue"
          cue="$source_dir/naruto-disc.cue"
          bin_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873"
          cue_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760"

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 600 "$bin_url" --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 60 "$cue_url" --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status

          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          source, destination = map(Path, sys.argv[1:3])
          lines, rewritten, replaced = source.read_text(encoding="utf-8").splitlines(), [], 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  m = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not m: raise SystemExit("Unrecognized CUE FILE directive")
                  line = m.group(1) + '"naruto-disc.bin"' + m.group(2)
                  replaced += 1
              rewritten.append(line)
          if replaced != 1: raise SystemExit(f"Expected 1 FILE directive, got {replaced}")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

          bchunk "$bin" "$cue" "$source_dir/track"
          iso="$(find "$source_dir" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$out/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          [[ -n "$data" && -f "$data" ]]
          [[ "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status

          python3 - "$data" "$input" <<'PY'
          from pathlib import Path
          import hashlib, sys
          src, out = Path(sys.argv[1]), Path(sys.argv[2])
          data = src.read_bytes()
          specs = [
              ("DATA_BIN_ENTRY_0000.bin", 0x5F800, 110536, "56ee7d3b195b0708bd5f9163d354f0173a828430c9467d410e822b1793d316d4"),
              ("DATA_BIN_ENTRY_0001.bin", 0x10BB000, 596412, "9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a"),
          ]
          for name, offset, size, expected in specs:
              chunk = data[offset:offset+size]
              digest = hashlib.sha256(chunk).hexdigest()
              if len(chunk) != size or digest != expected:
                  raise SystemExit(f"Resource identity mismatch: {name} bytes={len(chunk)} sha256={digest}")
              (out/name).write_bytes(chunk)
              print(f"{name} bytes={size} sha256={digest}")
          PY
          rm -rf "$source_dir"

      - name: Restore cached Ghidra installation
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          fi

      - name: Ghidra validate direct callers for entry 0 and entry 1
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/step4-callers/input"
          out="$RUNNER_TEMP/step4-callers-output"
          mkdir -p "$out/entry0-project" "$out/entry1-project"
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          [[ -n "$headless" && -x "$headless" ]]

          "$headless" "$out/entry1-project" DATA_BIN_entry_0001 \
            -import "$input/DATA_BIN_ENTRY_0001.bin" \
            -loader BinaryLoader -loader-baseAddr 0x800D0000 -loader-length 0x919BC \
            -loader-blockName DATA_BIN_ENTRY_0001 -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -preScript PrepareOverlayResource.java \
            -postScript ExportTargetCallers.java "$out/data-bin-entry1-rng-callers.txt" 0x80035D78 0x80035DA8 \
            -analysisTimeoutPerFile 1200 -max-cpu 2 -deleteProject > "$out/entry1-ghidra.log" 2>&1

          "$headless" "$out/entry0-project" DATA_BIN_entry_0000 \
            -import "$input/DATA_BIN_ENTRY_0000.bin" \
            -loader BinaryLoader -loader-baseAddr 0x800AD000 -loader-length 0x1AF08 \
            -loader-blockName DATA_BIN_ENTRY_0000 -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -preScript PrepareEntry0Helper.java \
            -postScript ExportTargetCallers.java "$out/data-bin-entry0-rng-callers.txt" 0x80035D78 0x80035DA8 \
            -analysisTimeoutPerFile 1200 -max-cpu 2 -deleteProject > "$out/entry0-ghidra.log" 2>&1

          [[ -s "$out/data-bin-entry1-rng-callers.txt" && -s "$out/data-bin-entry0-rng-callers.txt" ]]
          grep -E '^(analysis=|program=|instruction_count_scanned=|validated_direct_callsite_count=|unique_caller_function_count=|=== VALIDATED_CALLSITES ===|target=)' "$out/data-bin-entry1-rng-callers.txt" "$out/data-bin-entry0-rng-callers.txt" || true
          {
            echo "status=SUCCESS"
            echo "main_exe_routine=0x80035D78"
            echo "candidate_seed_setter=0x80035DA8"
            echo "resource_base_addresses=HYPOTHESIS_NOT_RUNTIME_VERIFIED"
            echo "gameplay_or_emulator_executed=no"
            echo "source_binaries_uploaded_as_artifact=no"
          } > "$out/scan-result.txt"

      - name: Upload text-only Ghidra outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-ghidra-rng-caller-validation
          path: ${{ runner.temp }}/step4-callers-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary extracted resource inputs
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/step4-callers"
