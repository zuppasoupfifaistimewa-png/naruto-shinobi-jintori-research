name: Verify checkpoint release SHA and target RAM window

on:
  push:
    branches:
      - audit/checkpoint-window-2026-10-29
    paths:
      - ".github/workflows/audit-checkpoint-target-window.yml"

permissions:
  contents: write

jobs:
  verify-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RELEASE_ASSET_ID: "686794219"
      EXPECTED_STATE_BYTES: "21163286"
      EXPECTED_STATE_SHA256: "00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d"
      CHECKPOINT_RUN_ID: "39262213468"
    steps:
      - name: Checkout permitted research repository
        uses: actions/checkout@v4

      - name: Re-download the public Release asset and verify exact bytes/hash
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checkpoint-release-audit"
          mkdir -p "$root/output"
          state="$root/checkpoint.raw.sstate"
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$RELEASE_ASSET_ID"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --retry 2 --retry-delay 2 --max-time 180 "$url" --output "$state"
          bytes="$(stat -c '%s' "$state")"
          sha="$(sha256sum "$state" | awk '{print $1}')"
          printf 'release_asset_id=%s\nrelease_asset_url=https://github.com/%s/releases/download/naruto-checkpoint-39262213468/storymode-checkpoint-run-39262213468.raw.sstate\n' "$RELEASE_ASSET_ID" "$GITHUB_REPOSITORY" > "$root/output/release-download-verification.txt"
          printf 'source_checkpoint_run_id=%s\nsource_preservation_commit=4c505394ac331225545728261c66566fa3113763\nactual_bytes=%s\nexpected_bytes=%s\nactual_sha256=%s\nexpected_sha256=%s\n' "$CHECKPOINT_RUN_ID" "$bytes" "$EXPECTED_STATE_BYTES" "$sha" "$EXPECTED_STATE_SHA256" >> "$root/output/release-download-verification.txt"
          if [[ "$bytes" != "$EXPECTED_STATE_BYTES" || "$sha" != "$EXPECTED_STATE_SHA256" ]]; then
            echo "RESULT=FAIL" >> "$root/output/release-download-verification.txt"
            cat "$root/output/release-download-verification.txt"
            exit 1
          fi
          echo "RESULT=PASS" >> "$root/output/release-download-verification.txt"
          cat "$root/output/release-download-verification.txt"
          echo "STATE_PATH=$state" >> "$GITHUB_ENV"
          echo "AUDIT_ROOT=$root" >> "$GITHUB_ENV"

      - name: Parse saved state directly and inspect 64 bytes around 0x801CEF08
        shell: bash
        run: |
          set -euo pipefail
          root="$AUDIT_ROOT"
          ram="$root/ram-prefix.bin"
          python3 tools/parse_pcsx_savestate_ram.py "$STATE_PATH" "$ram" --run-id "$CHECKPOINT_RUN_ID" --csv "$root/ram-values-private.csv" > "$root/output/ram-parser-log.txt"
          python3 - "$ram" "$root/output/checkpoint-target-64-byte-window.txt" "$root/output/checkpoint-target-verification.txt" <<'PY'
          import hashlib, struct, sys
          from pathlib import Path
          ram_path, window_path, verify_path = map(Path, sys.argv[1:4])
          ram = ram_path.read_bytes()
          if len(ram) != 0x200000:
              raise SystemExit(f"RAM_PREFIX_SIZE_MISMATCH:{len(ram)}")
          slot = 0x8013A554
          target = struct.unpack_from("<I", ram, slot - 0x80000000)[0]
          expected_target = 0x801CEF08
          offset = target - 0x80000000
          lines = [
              "checkpoint_run_id=39262213468",
              f"ram_prefix_bytes={len(ram)}",
              f"ram_prefix_sha256={hashlib.sha256(ram).hexdigest()}",
              f"slot_address=0x{slot:08X}",
              f"slot_bytes_le={ram[slot-0x80000000:slot-0x80000000+4].hex(' ').upper()}",
              f"slot_u32_le=0x{target:08X}",
              f"expected_slot_value=0x{expected_target:08X}",
              f"slot_value_matches_expected={'PASS' if target == expected_target else 'FAIL'}",
              f"target_address=0x{target:08X}",
              f"target_ram_offset=0x{offset:06X}",
              f"target_within_extracted_2MiB_RAM={'YES' if 0 <= offset < len(ram) else 'NO'}",
              "interpretation_limit=RAM-range membership proves an address inside extracted RAM, not a C type or gameplay meaning",
          ]
          verify_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          if target != expected_target:
              raise SystemExit("CHECKPOINT_SLOT_VALUE_MISMATCH")
          if offset < 32 or offset + 32 > len(ram):
              raise SystemExit("TARGET_WINDOW_OUTSIDE_EXTRACTED_RAM_PREFIX")
          start = offset - 32
          window = ram[start:start+64]
          out = [
              "64-byte window centered on 0x801CEF08 (32 bytes before + target + 31 after)",
              f"virtual_range=0x{0x80000000+start:08X}..0x{0x80000000+start+63:08X}",
              f"ram_offset_range=0x{start:06X}..0x{start+63:06X}",
          ]
          for i in range(0, 64, 16):
              addr = 0x80000000 + start + i
              chunk = window[i:i+16]
              words = [f"{struct.unpack_from('<I', chunk, j)[0]:08X}" for j in range(0,16,4)]
              out.append(f"0x{addr:08X}: {chunk.hex(' ').upper()} | u32_le: {' '.join(words)}")
          window_path.write_text("\n".join(out) + "\n", encoding="utf-8")
          print("\n".join(lines))
          print("\n".join(out))
          PY

      - name: Install disc tools for offline MIPS disassembly
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Download and verify DATA.BIN transiently
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checkpoint-release-audit"
          src="$root/disc-source"
          extracted="$root/disc-extracted"
          mkdir -p "$src" "$extracted"
          bin="$src/naruto-disc.bin"
          cue_raw="$src/original.cue"
          cue="$src/naruto-disc.cue"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --retry 2 --retry-delay 2 --max-time 600 \
            "$api/647346873" --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check -
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --retry 2 --retry-delay 2 --max-time 60 \
            "$api/647354760" --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check -
          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          src, dst = map(Path, sys.argv[1:3])
          out, count = [], 0
          for line in src.read_text(encoding="utf-8").splitlines():
              if line.lstrip().upper().startswith("FILE "):
                  m = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/checkpoint-release-audit/checkpoint.raw.sstate" "$RUNNER_TEMP/checkpoint-release-audit/ram-prefix.bin" "$RUNNER_TEMP/checkpoint-release-audit/ram-values-private.csv"

      - name: Upload text-only verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-release-target-window-text-only
          path: |
            ${{ runner.temp }}/checkpoint-release-audit/output/*.txt
          if-no-files-found: error
          retention-days: 7
, line, re.I)
                  if not m: raise SystemExit("Unrecognized CUE FILE directive")
                  line = m.group(1) + '"naruto-disc.bin"' + m.group(2)
                  count += 1
              out.append(line)
          if count != 1: raise SystemExit(f"Expected one CUE FILE directive; got {count}")
          dst.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          bchunk "$bin" "$cue" "$src/track"
          iso="$(find "$src" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$root/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          [[ -n "$data" && "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check -
          out="reports/slot_provenance_audit/run_$GITHUB_RUN_ID"
          mkdir -p "$out"
          python3 tools/audit_slot_provenance.py \
            "$data" \
            "reports/step4_10_static_evidence_audit/run_40789339014/a2_expanded_xref_candidates.csv" \
            "reports/step4_10_static_evidence_audit/run_40789339014/a2_ghidra_rebased_functions.csv" \
            "$out"
          {
            echo "DATA_BIN_BYTES=66015232"
            echo "DATA_BIN_SHA256=69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822"
            echo "ENTRY1_OFFSET=0x10BB000"
            echo "ENTRY1_BYTES=596412"
            echo "ENTRY1_SHA256=9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a"
            echo "ROM_DATA_BIN_GIT_COMMITTED=no"
            echo "SAVESTATE_RAM_GIT_COMMITTED=no"
            echo "emulator_used=no"
          } > "$out/input-identity.txt"
          python3 - "$out/V1-reconciliation.md" <<'PY'
          from pathlib import Path
          import sys
          report = """# V1 — Reconciliation of run, release and scan evidence

          ## (a) Run 40792708405
          Workflow: Preserve Naruto checkpoint and compare RAM / strict A2
          Workflow path: .github/workflows/preserve-checkpoint-and-compare.yml
          Branch: main
          head_sha: 4c505394ac331225545728261c66566fa3113763
          Run: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/actions/runs/40792708405
          Commit permalink: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/commit/4c505394ac331225545728261c66566fa3113763
          The same run creates the sanitized report commit b26455720d19b6e78ada49bfe0698d1a289bc91a after the Release step. The job log shows 4c50539..b264557 HEAD -> main. This is why the head SHA and report commit differ.
          Report commit permalink: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/commit/b26455720d19b6e78ada49bfe0698d1a289bc91a

          ## (b) Checkpoint Release
          Release API reports release ID 427327611, asset ID 686794219, author github-actions[bot], created_at 2026-10-29T00:14:06Z.
          Run 40792708405 has the explicit step Preserve raw savestate as a non-expiring GitHub Release asset and records the tag/asset in its manifest. Conclusion: run 40792708405, workflow head commit 4c505394ac331225545728261c66566fa3113763; generated sanitized reports then committed as b26455720d19b6e78ada49bfe0698d1a289bc91a.
          Release API: https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/tags/naruto-checkpoint-39262213468
          Release: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/tag/naruto-checkpoint-39262213468

          ## (c) 32 and 191 counts
          Expanded scan has 326 candidate memory instructions: 294 have a heuristic same-register LUI pairing with effective address 0x8013A554; 32 are UNRESOLVED because no same-register LUI was found within a 32-word window.
          All 191 strict-scan difference rows appear in the expanded candidate list; membership does not mean all 191 effective addresses were independently resolved. The 32 unresolved candidates correspond to 32 READ/LW rows in the 191 difference table lacking a same-register LUI in the window. The value 32 is also used as the look-back window length, but the row count and window size are different concepts.
          Scan run: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/actions/runs/40789339014
          Scan commit: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/commit/8b70e004f0df21bbb250a3c0b918a19e76ce0a21
          Reconciliation commit: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/commit/4c505394ac331225545728261c66566fa3113763
          """
          Path(sys.argv[1]).write_text(report, encoding="utf-8")
          PY
          rm -rf "$src" "$extracted"
          rm -f "$root/DATA.BIN"

      - name: Cleanup private savestate and RAM dump
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/checkpoint-release-audit/checkpoint.raw.sstate" "$RUNNER_TEMP/checkpoint-release-audit/ram-prefix.bin" "$RUNNER_TEMP/checkpoint-release-audit/ram-values-private.csv"

      - name: Upload text-only verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-release-target-window-text-only
          path: |
            ${{ runner.temp }}/checkpoint-release-audit/output/*.txt
          if-no-files-found: error
          retention-days: 7
