name: Runner-only analysis of bounded submenu diagnostic result

on:
  push:
    branches: [main]
    paths:
      - "experiments/.inspect-submenu-right-ab-result"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    if: contains(github.event.head_commit.message, '[INSPECT-NARUTO-SUBMENU-RIGHT-AB-RESULT]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install image analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pil
      - name: Download diagnostic output to runner only
        uses: actions/download-artifact@v4
        with:
          name: naruto-submenu-right-ab-private
          run-id: 40144220503
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/submenu-right-ab
      - name: Report runner logs and numeric frame metrics only
        env:
          RESULT: ${{ runner.temp }}/submenu-right-ab
        run: |
          set -euo pipefail
          find "$RESULT" -maxdepth 3 -type f -printf 'RUNNER_FILE=%f bytes=%s\n' | sort
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          import numpy as np
          from PIL import Image
          root=Path(os.environ["RESULT"])
          markers=("LOAD_EVENT=","CAPTURE=","PRECONDITION=","INPUT action=","POST_F60_STATE=",
                   "DIAGNOSTIC_BRANCH_FINISHED=","LOAD_ERROR=","CLASSIFIER_FAIL=","CAPTURE_FAIL=",
                   "F20_PARITY","PREFLIGHT_F20_PARITY=","INPUT_SUPPRESSED=","PIXEL_PARITY=",
                   "DIAGNOSTIC_SCRIPT_READY")
          for p in sorted(list(root.glob("*.stdout"))+list(root.glob("runner.log"))):
              print("BRANCH_LOG="+p.name)
              for line in p.read_text(errors="replace").splitlines():
                  if any(m in line for m in markers):
                      print(line[:500])
          xvfb=root/"xvfb.log"
          if xvfb.is_file():
              for line in xvfb.read_text(errors="replace").splitlines()[-20:]:
                  print("XVFB_LOG="+line[:500])
          def img(branch, frame):
              candidates=list(root.rglob(f"{branch}-F{frame}.png"))
              if len(candidates)!=1:
                  print(f"FRAME_ANALYSIS=UNAVAILABLE branch={branch} frame={frame} count={len(candidates)}")
                  return None,None
              p=candidates[0]
              with Image.open(p) as im:
                  a=np.asarray(im.convert("RGB"))
              if a.shape!=(800,1280,3):
                  print(f"FRAME_ANALYSIS=INVALID branch={branch} frame={frame} shape={a.shape}")
                  return None,None
              return p,a
          def metric(left,right,label,frame):
              lp,a=img(left,frame); rp,b=img(right,frame)
              if a is None or b is None: return None
              d=np.abs(a.astype(np.int16)-b.astype(np.int16))
              row={"pair":label,"frame":frame,"left_sha256":hashlib.sha256(lp.read_bytes()).hexdigest(),
                   "right_sha256":hashlib.sha256(rp.read_bytes()).hexdigest(),
                   "different_pixels":int(np.count_nonzero(np.any(d!=0,axis=2))),
                   "mean_abs_rgb":round(float(d.mean()),6)}
              print("FRAME_METRIC "+str(row))
              return row
          pre=metric("PREFLIGHT_ACTION","PREFLIGHT_CONTROL","preflight",20)
          post=[]
          for frame in (20,60,100,110,180):
              row=metric("ACTION","CONTROL","action-control",frame)
              if row is not None: post.append(row)
          if pre is not None:
              print("PREFLIGHT_F20_PARITY="+("PASS" if pre["different_pixels"]==0 else "FAIL"))
          if post and post[0]["frame"]==20:
              print("ACTION_CONTROL_F20_PARITY="+("PASS" if post[0]["different_pixels"]==0 else "FAIL"))
          print("INTERPRETATION=runner-side diagnostics only; visual target cue remains UNKNOWN unless independently proven")
          PY