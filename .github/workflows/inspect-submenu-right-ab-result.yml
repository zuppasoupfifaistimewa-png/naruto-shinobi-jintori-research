name: Runner-only analysis of bounded submenu diagnostic result

on:
  push:
    branches: [main]
    paths:
      - "experiments/.inspect-submenu-right-ab-result"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    if: contains(github.event.head_commit.message, '[INSPECT-NARUTO-SUBMENU-RIGHT-AB-RESULT]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install image analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pil
      - name: Download diagnostic output to runner only
        uses: actions/download-artifact@v4
        with:
          name: naruto-submenu-right-ab-private
          run-id: 40142559635
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/submenu-right-ab
      - name: Report runner logs and numeric frame metrics only
        env:
          RESULT: ${{ runner.temp }}/submenu-right-ab
        run: |
          set -euo pipefail
          find "$RESULT" -maxdepth 3 -type f -printf 'RUNNER_FILE=%f bytes=%s\n' | sort
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          import numpy as np
          from PIL import Image
          root=Path(os.environ["RESULT"])
          markers=("LOAD_EVENT=","CAPTURE=","PRECONDITION=","INPUT action=","POST_F60_STATE=","DIAGNOSTIC_BRANCH_FINISHED=","LOAD_ERROR=","CLASSIFIER_FAIL=","CAPTURE_FAIL=")
          for p in sorted(root.glob("*.stdout")):
              print("BRANCH_LOG="+p.name)
              for line in p.read_text(errors="replace").splitlines():
                  if any(m in line for m in markers):
                      print(line[:500])
          for p in sorted(root.glob("runner.log")):
              print("COMBINED_LOG="+p.name)
              for line in p.read_text(errors="replace").splitlines():
                  if any(m in line for m in markers):
                      print(line[:500])
          def img(branch, frame):
              candidates=list(root.rglob(f"{branch}-F{frame}.png"))
              if len(candidates)!=1: raise FileNotFoundError(f"{branch}-F{frame}.png count={len(candidates)}")
              p=candidates[0]
              with Image.open(p) as im:
                  a=np.asarray(im.convert("RGB"))
              if a.shape!=(800,1280,3): raise ValueError(f"{p.name} dimensions {a.shape}")
              return p,a
          rows=[]
          for frame in (20,60,100,110,180):
              try: ap,a=img("ACTION",frame); cp,c=img("CONTROL",frame)
              except Exception as e:
                  print("FRAME_ANALYSIS=UNAVAILABLE frame=%d reason=%s"%(frame,e))
                  continue
              d=np.abs(a.astype(np.int16)-c.astype(np.int16))
              row={"frame":frame,"action_sha256":hashlib.sha256(ap.read_bytes()).hexdigest(),
                   "control_sha256":hashlib.sha256(cp.read_bytes()).hexdigest(),
                   "different_pixels":int(np.count_nonzero(np.any(d!=0,axis=2))),
                   "mean_abs_rgb":round(float(d.mean()),6)}
              x=a[145:225,525:660,:].astype(np.int16); y=c[145:225,525:660,:].astype(np.int16)
              def pink(v):
                  r,g,b=v[:,:,0],v[:,:,1],v[:,:,2]
                  return (r>150)&(r>1.3*g)&(b>100)&(np.abs(r-b)<100)
              row["pink_mask_action"]=int(np.count_nonzero(pink(x)))
              row["pink_mask_control"]=int(np.count_nonzero(pink(y)))
              rows.append(row)
              print("FRAME_METRIC "+str(row))
          if rows:
              print("PRE_FRAME_PARITY="+("PASS" if rows[0]["frame"]==20 and rows[0]["different_pixels"]==0 else "FAIL"))
          PY