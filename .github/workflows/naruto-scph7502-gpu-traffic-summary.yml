name: Naruto SCPH-7502 Story Mode playthrough

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Prior run ID whose private Memory Card artifact must be restored when resuming"
        required: false
        type: string
      load_savestate:
        description: "Also load the savestate from resume_run_id; leave false to use the Memory Card path only"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/naruto-scph7502-gpu-traffic-summary.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: naruto-scph7502-gpu-traffic-summary
  cancel-in-progress: true

jobs:
  gpu-traffic-summary:
    if: false
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    steps:
      - name: Install private runtime requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils libgl1-mesa-dri python3 python3-pil gdb

      - name: Download and verify private runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/naruto-scph7502-gpu-traffic"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/home" "$WORK/captures/raw" "$WORK/cards"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private release asset: $name"; exit 1; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c '%s' scph7502.zip)" = "283463"
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as zf:
              members = []
              expanded = 0
              for info in zf.infolist():
                  p = PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("Unsafe BIOS archive entry")
                  if info.file_size > 2*1024*1024:
                      raise SystemExit("BIOS archive member exceeds safety limit")
                  expanded += info.file_size
                  if expanded > 4*1024*1024:
                      raise SystemExit("BIOS archive expansion exceeds safety limit")
                  if not info.is_dir() and info.file_size == 524288:
                      members.append(info)
              if len(members) != 1:
                  raise SystemExit(f"Expected one BIOS-sized member, found {len(members)}")
              out = Path("scph7502.bin")
              digest = hashlib.sha256()
              with zf.open(members[0]) as src, out.open("wb") as dst:
                  while True:
                      chunk = src.read(65536)
                      if not chunk: break
                      digest.update(chunk)
                      dst.write(chunk)
              actual = digest.hexdigest()
              expected = "5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1"
              print("RETAIL_BIOS_SHA256=" + actual)
              print("RETAIL_BIOS_REFERENCE_MATCH=" + str(actual == expected).upper())
              if actual != expected:
                  raise SystemExit("Retail BIOS reference mismatch")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          lines = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          ids = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "ROM/CUE/emulator hashes verified; BIOS=SCPH-7502"
          echo "EMULATOR_PIN=0c3572c3db75f97542001e453ae80ba8c3f8acba"

      - name: Restore private Story Mode checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' && inputs.load_savestate }}
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-checkpoint-private
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/naruto-scph7502-gpu-traffic/resume

      - name: Restore private Story Mode Memory Card
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/naruto-scph7502-gpu-traffic/resume-memory-card

      - name: Play Story Mode, skip detected dialogue with Start, checkpoint and observe up to VSync 50000
        env:
          RESTORE_GDB: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[restore-gdb]') }}
          LOAD_SAVESTATE: ${{ github.event_name == 'workflow_dispatch' && inputs.load_savestate }}
          CARD_RESTORE_EXPECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          GPU_BACKEND_FLAG="-softgpu"
          GPU_BACKEND_TIMEOUT="5400s" # 90m hard emulator limit; reserve time for evidence packaging and cleanup
          echo "GPU_BACKEND_SELECTED=$GPU_BACKEND_FLAG"
          echo "GPU_BACKEND_TIMEOUT=$GPU_BACKEND_TIMEOUT"
          cd "$WORK"
          mkdir -p "$WORK/resume" "$WORK/cards"
          if [[ "${CARD_RESTORE_EXPECTED:-false}" == "true" ]]; then
            source_card="$WORK/resume-memory-card/naruto-storymode.mcd"
            source_manifest="$WORK/resume-memory-card/memory-card-manifest.txt"
            if [[ ! -s "$source_card" || ! -s "$source_manifest" ]]; then
              echo "::error::STORY_MEMORY_CARD_RESTORE=FAIL reason=card_or_manifest_missing"
              exit 41
            fi
            expected_sha="$(awk -F= '$1 == "STORY_MEMORY_CARD_SHA256" {print $2; exit}' "$source_manifest")"
            expected_bytes="$(awk -F= '$1 == "STORY_MEMORY_CARD_BYTES" {print $2; exit}' "$source_manifest")"
            actual_sha="$(sha256sum "$source_card" | cut -d ' ' -f 1)"
            actual_bytes="$(stat -c '%s' "$source_card")"
            if [[ ! "$expected_sha" =~ ^[0-9a-f]{64}$ || "$actual_sha" != "$expected_sha" || "$actual_bytes" != "$expected_bytes" ]]; then
              echo "::error::STORY_MEMORY_CARD_RESTORE=FAIL reason=manifest_mismatch bytes=$actual_bytes sha256=$actual_sha"
              exit 42
            fi
            cp "$source_card" "$WORK/cards/naruto-storymode.mcd"
            : > "$WORK/cards/memory-card-restored.flag"
            echo "STORY_MEMORY_CARD_RESTORE=PASS bytes=$actual_bytes sha256=$actual_sha"
          else
            echo "STORY_MEMORY_CARD_RESTORE=not_requested; fresh run"
          fi
          if [ "${LOAD_SAVESTATE:-false}" = "true" ]; then
            if [ ! -s "$WORK/resume/storymode-checkpoint.sstate" ]; then
              echo "::error::STORY_SAVESTATE_RESTORE=FAIL reason=requested_state_missing"
              exit 43
            fi
          else
            rm -f "$WORK/resume/storymode-checkpoint.sstate"
            echo "STORY_SAVESTATE_LOAD_DISABLED=1; Memory Card is the primary persistence path"
          fi
          RESUME_MODE=false
          if [ -f "$WORK/resume/storymode-checkpoint.sstate" ]; then
            RESUME_MODE=true
            echo "STORY_RESUME_ARTIFACT=present"
            # The private artifact omits Memory.rom to avoid transferring the retail
            # BIOS. Reconstruct it locally from the already verified BIOS file before
            # PCSX-Redux commits the fixed-size ROM field while loading the state.
            python3 - "$WORK/resume/storymode-checkpoint.sstate" "$WORK/scph7502.bin" <<'PY'
          import sys
          from pathlib import Path

          state_path = Path(sys.argv[1])
          bios = Path(sys.argv[2]).read_bytes()
          state_data = state_path.read_bytes()
          if len(bios) != 0x80000:
              raise SystemExit(f"RESTORE_BIOS_REHYDRATE=FAIL wrong_bios_size={len(bios)}")

          def read_varint(data, pos):
              value = shift = 0
              while pos < len(data):
                  byte = data[pos]
                  pos += 1
                  value |= (byte & 0x7f) << shift
                  if not byte & 0x80:
                      return value, pos
                  shift += 7
                  if shift > 70:
                      raise ValueError("protobuf varint too long")
              raise ValueError("truncated protobuf varint")

          def varint(value):
              out = bytearray()
              while value > 0x7f:
                  out.append((value & 0x7f) | 0x80)
                  value >>= 7
              out.append(value)
              return bytes(out)

          def fields(data):
              result, pos = [], 0
              while pos < len(data):
                  start = pos
                  tag, pos = read_varint(data, pos)
                  number, wire = tag >> 3, tag & 7
                  if wire == 0:
                      _, pos = read_varint(data, pos)
                      payload_start = payload_end = pos
                  elif wire == 1:
                      payload_start, payload_end = pos, pos + 8
                      pos += 8
                  elif wire == 2:
                      size, pos = read_varint(data, pos)
                      payload_start = pos
                      pos += size
                      payload_end = pos
                  elif wire == 5:
                      payload_start, payload_end = pos, pos + 4
                      pos += 4
                  else:
                      raise ValueError(f"unsupported protobuf wire type {wire}")
                  if pos > len(data):
                      raise ValueError("truncated protobuf field")
                  result.append((number, wire, start, payload_start, payload_end, pos))
              return result

          top = fields(state_data)
          memories = [entry for entry in top if entry[0] == 3 and entry[1] == 2]
          if len(memories) != 1:
              raise SystemExit(f"RESTORE_BIOS_REHYDRATE=FAIL memory_message_count={len(memories)}")
          _, _, _, mem_start, mem_end, _ = memories[0]
          memory = state_data[mem_start:mem_end]
          nested = fields(memory)
          if any(number == 2 and wire == 2 for number, wire, *_ in nested):
              raise SystemExit("RESTORE_BIOS_REHYDRATE=FAIL checkpoint already has Memory.rom")
          if not any(number == 1 and wire == 2 for number, wire, *_ in nested):
              raise SystemExit("RESTORE_BIOS_REHYDRATE=FAIL Memory.ram field missing")

          restored_memory = bytearray()
          inserted = False
          for number, wire, start, payload_start, payload_end, end in nested:
              restored_memory.extend(memory[start:end])
              if number == 1 and wire == 2:
                  restored_memory.extend(varint((2 << 3) | 2))
                  restored_memory.extend(varint(len(bios)))
                  restored_memory.extend(bios)
                  inserted = True
          if not inserted:
              raise SystemExit("RESTORE_BIOS_REHYDRATE=FAIL could not insert ROM field")

          rebuilt = bytearray()
          replaced = 0
          for number, wire, start, payload_start, payload_end, end in top:
              if number == 3 and wire == 2:
                  rebuilt.extend(varint((3 << 3) | 2))
                  rebuilt.extend(varint(len(restored_memory)))
                  rebuilt.extend(restored_memory)
                  replaced += 1
              else:
                  rebuilt.extend(state_data[start:end])
          if replaced != 1:
              raise SystemExit(f"RESTORE_BIOS_REHYDRATE=FAIL memory_rebuilt={replaced}")
          state_path.write_bytes(rebuilt)
          print(f"RESTORE_BIOS_REHYDRATE=PASS bios_bytes={len(bios)} state_bytes={len(rebuilt)}")
          PY
          else
            echo "STORY_RESUME_ARTIFACT=absent"
          fi
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          emu_pid=""
          cleanup() {
            if [ -n "$emu_pid" ]; then kill "$emu_pid" 2>/dev/null || true; fi
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1
          unset MESA_GL_VERSION_OVERRIDE MESA_GLSL_VERSION_OVERRIDE
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          echo "HOST_DISPLAY_READY=1; emulator backend remains SoftGPU"

          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print(string.format("PAD_SETUP=Port 1 connected=%s device_type=%s input_type=%s",
              tostring(PCSX.settings.pads[1].Connected),
              tostring(PCSX.settings.pads[1].DeviceType),
              tostring(PCSX.settings.pads[1].PadType)))
          LUA
          )
          cat > "$WORK/gpu-traffic.lua" <<'LUA'
          local frame_count = 0
          local stop_frame = 12000
          local pad = PCSX.SIO0.slots[1].pads[1]
          local buttons = PCSX.CONSTS.PAD.BUTTON
          local resume_mode = false
          local resume_pending = false
          local resume_state_path = "resume/storymode-checkpoint.sstate"
          local raw_resume_verify = false
          local restore_event_seen = false
          local restore_post_frames = 0
          local restore_verify_pending = false
          local restore_verify_attempts = 0
          -- A state must not be loaded during initial Lua script evaluation. Defer it
          -- until the emulator reaches its first VSync, then pause and load on nextTick.
          local resume_probe = io.open(resume_state_path, "rb")
          if resume_probe then
              resume_probe:close()
              resume_mode = true
              resume_pending = true
              print("STORY_SAVESTATE_PRESENT=1; restore deferred to first VSync safe point")
          else
              print("STORY_SAVESTATE_PRESENT=0; cold boot sequence enabled")
          end
          local raw_marker = io.open("resume/raw-resume.flag", "rb")
          if raw_marker then
              raw_marker:close()
              raw_resume_verify = true
              print("STORY_RAW_RESUME_VERIFY=1; byte-exact raw state; BIOS rehydration disabled")
          end
          local input_sequence = {}
          local memory_card_restored = false
          local card_flag = io.open("cards/memory-card-restored.flag", "rb")
          if card_flag then
              card_flag:close()
              memory_card_restored = true
              print("STORY_MEMORY_CARD_RESTORED=1")
          end
          if not resume_mode and not memory_card_restored then
              input_sequence = {
              -- Start is sent only after the title prompt is known to be visible.
              -- The menu is initially on はじめから; Down then Up tests D-pad navigation
              -- and returns the selection to はじめから before Circle confirms it.
              {frame=2650, action="press", button=buttons.START, name="START"},
              {frame=2680, action="release", button=buttons.START, name="START"},
              {frame=2710, action="press", button=buttons.DOWN, name="DOWN"},
              {frame=2720, action="release", button=buttons.DOWN, name="DOWN"},
              {frame=2740, action="press", button=buttons.UP, name="UP"},
              {frame=2750, action="release", button=buttons.UP, name="UP"},
              {frame=2780, action="press", button=buttons.CIRCLE, name="CIRCLE"},
              {frame=2810, action="release", button=buttons.CIRCLE, name="CIRCLE"},
              }
          end
          if memory_card_restored and not resume_mode then
              print("STORY_MEMORY_CARD_AUTO_LOAD_UNTESTED=1; suppressing new-game inputs to protect existing card save")
          end
          local input_index = 1
          local story_circle2_pressed = false
          local auto_start_release_frame = nil
          local checkpoint_pending = false
          local capture_targets = { [2599]=true, [2649]=true, [2650]=true, [2660]=true, [2670]=true, [2680]=true, [2690]=true, [2700]=true, [2709]=true, [2710]=true, [2715]=true, [2720]=true, [2730]=true, [2739]=true, [2740]=true, [2745]=true, [2749]=true, [2750]=true, [2760]=true, [2770]=true, [2779]=true, [2780]=true, [2790]=true, [2800]=true, [2809]=true, [2810]=true, [2820]=true, [2850]=true, [2900]=true, [2950]=true, [2999]=true, [3199]=true, [3399]=true, [3599]=true, [3999]=true, [4499]=true, [4999]=true, [5499]=true, [5999]=true, [6099]=true, [6100]=true, [6110]=true, [6129]=true, [6130]=true, [6140]=true, [6200]=true, [6399]=true, [6799]=true, [7199]=true, [7599]=true, [7999]=true, [8499]=true, [8999]=true, [9099]=true, [9199]=true, [9200]=true, [9229]=true, [9230]=true, [9240]=true, [9299]=true, [9499]=true, [9999]=true, [10099]=true, [10199]=true, [10200]=true, [10229]=true, [10230]=true, [10240]=true, [10299]=true, [10499]=true, [10999]=true }

          local function apply_input(action)
              local expected = action.action == "press"
              local ok, readback = pcall(function()
                  if expected then pad.setOverride(action.button) else pad.clearOverride(action.button) end
                  return pad.getButton(action.button)
              end)
              if not ok then
                  print(string.format("PAD_INJECT frame=%d button=%s action=%s status=ERROR", frame_count, action.name, action.action))
                  return
              end
              local status = (readback == expected) and "PASS" or "FAIL"
              print(string.format("PAD_INJECT frame=%d button=%s action=%s readback=%s expected=%s status=%s",
                  frame_count, action.name, action.action, tostring(readback), tostring(expected), status))
          end

          local function capture_vram(n)
              local ok = pcall(function()
                  local vram = PCSX.GPU.getVRAM()
                  local raw_path = string.format("captures/raw/vram-frame-%06d.raw", n)
                  local raw = assert(Support.File.open(raw_path, "TRUNCATE"), "cannot create private temporary VRAM capture")
                  raw:writeMoveSlice(vram)
                  raw:close()
                  print(string.format("GPU_VRAM_CAPTURE frame=%d status=ok", n))
              end)
              if not ok then print(string.format("GPU_VRAM_CAPTURE frame=%d status=ERROR", n)) end
          end

          local function capture_frame(n)
              local ok, err = pcall(function()
                  local shot = PCSX.GPU.takeScreenShot()
                  local bpp = (shot.bpp == 0) and 16 or 24
                  local raw_path = string.format("captures/raw/frame-%06d.raw", n)
                  local raw = assert(Support.File.open(raw_path, "TRUNCATE"), "cannot create private temporary screenshot")
                  raw:writeMoveSlice(shot.data)
                  raw:close()
                  local meta_path = string.format("captures/frame-%06d.json", n)
                  local meta = assert(io.open(meta_path, "wb"), "cannot create temporary screenshot metadata")
                  meta:write(string.format(
                      '{"frame":%d,"width":%d,"height":%d,"bpp":%d,"expected_bytes":%d,"guest_fps":%.4f}\n',
                      n, shot.width, shot.height, bpp, shot.width * shot.height * bpp / 8,
                      PCSX.GPU.getGuestFPS()
                  ))
                  meta:close()
                  print(string.format("GPU_SCREENSHOT_CAPTURE frame=%d width=%d height=%d bpp=%d",
                      n, shot.width, shot.height, bpp))
              end)
              if not ok then print(string.format("GPU_SCREENSHOT_CAPTURE frame=%d status=ERROR", n)) end
          end

          local function capture_restore_immediate()
              local shot = PCSX.GPU.takeScreenShot()
              local bpp = (shot.bpp == 0) and 16 or 24
              local raw = assert(Support.File.open("captures/raw/storymode-restore-immediate.raw", "TRUNCATE"),
                  "cannot create temporary immediate-restore screenshot")
              raw:writeMoveSlice(shot.data)
              raw:close()
              local meta = assert(io.open("captures/storymode-restore-immediate.json", "wb"),
                  "cannot create immediate-restore screenshot metadata")
              meta:write(string.format(
                  '{"frame":0,"width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',
                  shot.width, shot.height, bpp, shot.width * shot.height * bpp / 8))
              meta:close()
              print(string.format("STORY_RAW_RESTORE_IMMEDIATE_SCREENSHOT=CAPTURED width=%d height=%d bpp=%d",
                  shot.width, shot.height, bpp))
          end

          -- Rolling screenshot for a lightweight visual dialogue detector.
          -- This raw frame is local-only and removed before artifact upload.
          local function capture_dialog_watch(n)
              local ok = pcall(function()
                  local shot = PCSX.GPU.takeScreenShot()
                  local bpp = (shot.bpp == 0) and 16 or 24
                  local raw = assert(Support.File.open("captures/raw/dialog-watch.raw", "TRUNCATE"),
                      "cannot create dialogue-watch frame")
                  raw:writeMoveSlice(shot.data)
                  raw:close()
                  local meta = assert(io.open("captures/dialog-watch.json", "wb"),
                      "cannot create dialogue-watch metadata")
                  meta:write(string.format(
                      '{"frame":%d,"width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',
                      n, shot.width, shot.height, bpp, shot.width * shot.height * bpp / 8))
                  meta:close()
              end)
              if not ok then print(string.format("STORY_DIALOG_WATCH_CAPTURE_ERROR frame=%d", n)) end
          end

          local function save_checkpoint(n)
              local ok, err = pcall(function()
                  local state = PCSX.createSaveState()
                  local file = assert(Support.File.open("captures/raw/storymode-checkpoint.raw", "TRUNCATE"),
                      "cannot create temporary savestate")
                  file:writeMoveSlice(state)
                  file:close()
                  print(string.format("STORY_SAVESTATE_CAPTURE frame=%d status=ok", n))
              end)
              if not ok then
                  print(string.format("STORY_SAVESTATE_CAPTURE frame=%d status=ERROR detail=%s", n, tostring(err)))
              end
              return ok
          end

          -- Defer the serializer to a paused nextTick safe point, outside GPU::Vsync.
          local function checkpoint_at_safe_tick(n, quit_after, reason)
              if checkpoint_pending then return end
              checkpoint_pending = true
              PCSX.pauseEmulator()
              PCSX.nextTick(function()
                  capture_frame(n)
                  local saved = save_checkpoint(n)
                  print(string.format("STORY_CHECKPOINT_SAFE_POINT frame=%d save_ok=%s reason=%s",
                      n, tostring(saved), tostring(reason)))
                  if quit_after then
                      PCSX.quit(saved and 0 or 4)
                  else
                      checkpoint_pending = false
                      PCSX.resumeEmulator()
                  end
              end)
          end

          shellReachedListener = PCSX.Events.createEventListener("ExecutionFlow::ShellReached", function()
              print("EXECUTION_EVENT=ShellReached")
          end)
          runListener = PCSX.Events.createEventListener("ExecutionFlow::Run", function()
              print("EXECUTION_EVENT=Run")
          end)
          _G.storySavestateLoadedListener = PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded", function()
              if resume_mode then
                  restore_event_seen = true
                  restore_post_frames = 0
                  print("STORY_SAVESTATE_LOAD_EVENT=ExecutionFlow::SaveStateLoaded")
              end
          end)

          gpuTrafficListener = PCSX.Events.createEventListener("GPU::Vsync", function()
              if resume_pending then
                  resume_pending = false
                  print("STORY_SAVESTATE_RESTORE_PAUSE_REQUESTED=1")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local file_ok, state_file = pcall(function()
                          return Support.File.open(resume_state_path)
                      end)
                      if not file_ok or not state_file then
                          print("STORY_SAVESTATE_FILE_OPEN_ERROR; refusing cold-boot fallback")
                          PCSX.quit(2)
                          return
                      end
                      local load_ok, load_err = pcall(function() PCSX.loadSaveState(state_file) end)
                      state_file:close()
                      if not load_ok then
                          print("STORY_SAVESTATE_LOAD_ERROR=" .. tostring(load_err))
