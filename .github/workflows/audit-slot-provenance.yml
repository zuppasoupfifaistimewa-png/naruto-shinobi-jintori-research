name: Static slot provenance audit V1-V3

on:
  push:
    branches:
      - audit/checkpoint-window-2026-10-29
    paths:
      - "tools/audit_slot_provenance.py"
      - "tools/audit_w0_w3_cfg_ram.py"
      - "tools/audit_x2_static.py"
      - "tools/ghidra/ExportRequestedFunctions.java"
      - ".github/workflows/audit-slot-provenance.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: naruto-static-slot-provenance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATA_BIN_ASSET_ID: "647346873"
      CUE_ASSET_ID: "647354760"
      DATA_BIN_BYTES: "66015232"
      DATA_BIN_SHA256: "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822"
    steps:
      - name: Checkout permitted research repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install disc extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Download and verify private source transiently, extract DATA.BIN
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/slot-provenance-audit"
          src="$root/source"
          extracted="$root/extracted"
          mkdir -p "$src" "$extracted" "$root/output"
          bin="$src/naruto-disc.bin"
          cue_raw="$src/original.cue"
          cue="$src/naruto-disc.cue"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --retry 2 --retry-delay 2 --max-time 600 \
            "$api/$DATA_BIN_ASSET_ID" --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check -
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --retry 2 --retry-delay 2 --max-time 60 \
            "$api/$CUE_ASSET_ID" --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check -
          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          src, dst = map(Path, sys.argv[1:3])
          out, count = [], 0
          for line in src.read_text(encoding="utf-8").splitlines():
              if line.lstrip().upper().startswith("FILE "):
                  m = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not m: raise SystemExit("Unrecognized CUE FILE directive")
                  line = m.group(1) + '"naruto-disc.bin"' + m.group(2)
                  count += 1
              out.append(line)
          if count != 1: raise SystemExit(f"Expected one CUE FILE directive; got {count}")
          dst.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          bchunk "$bin" "$cue" "$src/track"
          iso="$(find "$src" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$root/output/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          [[ -n "$data" && "$(stat -c '%s' "$data")" == "$DATA_BIN_BYTES" ]]
          echo "$DATA_BIN_SHA256  $data" | sha256sum --check -
          exe="$(find "$extracted" -type f -iname 'SLPS_035.53*' -print -quit)"
          [[ -n "$exe" && "$(stat -c '%s' "$exe")" == "385024" ]]
          echo "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569  $exe" | sha256sum --check -
          cp "$data" "$root/DATA.BIN"
          cp "$exe" "$root/SLPS_035.53"
          rm -rf "$src" "$extracted"
          echo "DATA_BIN_SHA256=$DATA_BIN_SHA256" > "$root/output/input-identity.txt"
          echo "DATA_BIN_BYTES=$DATA_BIN_BYTES" >> "$root/output/input-identity.txt"
          echo "ENTRY1_OFFSET=0x10BB000 ENTRY1_SIZE=596412 ENTRY1_SHA256=9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a" >> "$root/output/input-identity.txt"
          echo "raw_binary_git_committed=no" >> "$root/output/input-identity.txt"
          echo "DATA_PATH=$root/DATA.BIN" >> "$GITHUB_ENV"
          echo "EXE_PATH=$root/SLPS_035.53" >> "$GITHUB_ENV"
          echo "OUT_PATH=$root/output" >> "$GITHUB_ENV"

      - name: Emit complete target-function disassembly and 32-row backward trace
        shell: bash
        run: |
          set -euo pipefail
          out="reports/slot_provenance_audit/run_$GITHUB_RUN_ID"
          mkdir -p "$out"
          python3 tools/audit_slot_provenance.py \
            "$DATA_PATH" \
            "reports/step4_10_static_evidence_audit/run_40789339014/a2_expanded_xref_candidates.csv" \
            "reports/step4_10_static_evidence_audit/run_40789339014/a2_ghidra_rebased_functions.csv" \
            "$out"
          cp "$OUT_PATH/input-identity.txt" "$out/input-identity.txt"
          cp "$OUT_PATH/disc-extraction.log" "$out/disc-extraction-summary.log"
          python3 - "$out/V1-reconciliation.md" <<'PY'
          from pathlib import Path
          import sys
          report = """# V1 reconciliation — evidence chain

          ## (a) Run 40792708405 metadata
          - Workflow: 'Preserve Naruto checkpoint and compare RAM / strict A2'
          - Workflow file: '.github/workflows/preserve-checkpoint-and-compare.yml'
          - Branch: 'main'
          - head_sha: '4c505394ac331225545728261c66566fa3113763'
          - Run: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/actions/runs/40792708405
          - Head commit permalink: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/commit/4c505394ac331225545728261c66566fa3113763
          - Follow-on sanitized report commit: 'b26455720d19b6e78ada49bfe0698d1a289bc91a'. The same workflow log shows '4c50539..b264557 HEAD -> main' after the step 'Commit only sanitized text, JSON and CSV reports'. These SHAs identify different stages, not conflicting identities.
          - Follow-on commit permalink: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/commit/b26455720d19b6e78ada49bfe0698d1a289bc91a

          ## (b) Release creator evidence
          - Release API: created_at='2026-10-29T00:14:06Z', author='github-actions[bot]', release ID 427327611, asset ID 686794219.
          - Run 40792708405 began at '2026-10-29T00:14:11Z'. Its job step explicitly named 'Preserve raw savestate as a non-expiring GitHub Release asset' created/verified the asset; the resulting manifest records the release tag and asset ID.
          - Conclusion: the Release asset was created/verified by run 40792708405 using workflow definition at head commit '4c505394ac331225545728261c66566fa3113763'. The sanitized reports were committed afterward as 'b26455720d19b6e78ada49bfe0698d1a289bc91a'.
          - Release API: https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/tags/naruto-checkpoint-39262213468
          - Release URL: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/tag/naruto-checkpoint-39262213468

          ## (c) 'extended scan 32' vs '191 all appear'
          - '326' is the expanded-scan candidate count. Its 'effective_address_if_pair' field has 294 candidates with heuristic same-register LUI-pair effective address '0x8013A554' and 32 candidates marked 'UNRESOLVED' because no same-register LUI was found within the fixed 32-word backward window.
          - In the 191-row comparison against the strict scan, every row occurs in the expanded candidate file ('extended_scan_326_candidate=YES'). This is candidate-site membership, not 191 independently proved effective addresses.
          - Exactly 32 of those 191 rows are READ/LW rows categorized as lacking a same-register 'lui 0x8014' within the 32-word window; these correspond to the 32 unresolved effective-address rows in the expanded candidate table. '32' is a row/site count; the window itself is 32 instruction words.
          - Scan run: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/actions/runs/40789339014
          - Scan commit permalink: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/commit/8b70e004f0df21bbb250a3c0b918a19e76ce0a21
          - Reconciliation commit permalink: https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/commit/4c505394ac331225545728261c66566fa3113763

          Caveat: LUI pairing is a linear local heuristic, not proof of CFG dominance, aliasing, or runtime access. V3 therefore uses a separate in-function backtrace.
          """
          Path(sys.argv[1]).write_text(report, encoding="utf-8")
          PY

      - name: W0-W2 release timeline, CFG, and direct checkpoint RAM parse
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_w0_w3_cfg_ram.py
          root="$RUNNER_TEMP/slot-provenance-audit"
          out="reports/slot_provenance_audit/run_$GITHUB_RUN_ID"
          state="$root/checkpoint.raw.sstate"
          ram="$root/ram-prefix-private.bin"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --retry 2 --retry-delay 2 --max-time 180 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/686794219" --output "$state"
          [[ "$(stat -c '%s' "$state")" == "21163286" ]]
          echo "00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d  $state" | sha256sum --check -
          python3 tools/parse_pcsx_savestate_ram.py "$state" "$ram" --run-id "39262213468" --csv "$root/ram-values-private.csv" > "$root/output/ram-parser-log-private.txt"
          python3 - "$DATA_PATH" "$root/entry1-private.bin" <<'PY'
          import hashlib,sys
          from pathlib import Path
          src,dst=map(Path,sys.argv[1:3])
          d=src.read_bytes()
          if len(d)!=66015232 or hashlib.sha256(d).hexdigest()!="69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822": raise SystemExit("DATA_BIN_IDENTITY_MISMATCH")
          e=d[0x10BB000:0x10BB000+596412]
          if len(e)!=596412 or hashlib.sha256(e).hexdigest()!="9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a": raise SystemExit("ENTRY1_IDENTITY_MISMATCH")
          dst.write_bytes(e)
          PY
          python3 tools/audit_w0_w3_cfg_ram.py \
            --entry "$root/entry1-private.bin" \
            --candidate "reports/step4_10_static_evidence_audit/run_40789339014/a2_expanded_xref_candidates.csv" \
            --function_csv "reports/step4_10_static_evidence_audit/run_40789339014/a2_ghidra_rebased_functions.csv" \
            --v3 "reports/slot_provenance_audit/run_40815320809/v3_32_reader_base_register_trace.csv" \
            --ram "$ram" --state "$state" --out "$out" --run_id "$GITHUB_RUN_ID"

      - name: Set up Java for W3 Ghidra executable import
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Restore pinned Ghidra cache for W3
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install pinned Ghidra when cache is missing
        shell: bash
        run: |
          set -euo pipefail
          cache="/home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016"
          mkdir -p "$cache"
          if ! find "$cache" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/ghidra_12.2_PUBLIC_20261016.zip"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 \
              "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" --output "$archive"
            echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check -
            unzip -q "$archive" -d "$cache"
            rm -f "$archive"
          fi

      - name: W3 full Ghidra-bounded helper-function disassembly
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/slot-provenance-audit"
          out="reports/slot_provenance_audit/run_$GITHUB_RUN_ID"
          exe_raw="$root/SLPS_035.53-text.bin"
          python3 - "$EXE_PATH" "$exe_raw" <<'PY'
          import hashlib,sys
          from pathlib import Path
          src,dst=map(Path,sys.argv[1:3])
          data=src.read_bytes()
          if len(data)!=385024 or hashlib.sha256(data).hexdigest()!="a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569":
              raise SystemExit("SLPS_035.53_IDENTITY_MISMATCH")
          text=data[0x800:]
          if len(text)!=0x5D800: raise SystemExit("PSX_EXE_TEXT_SIZE_MISMATCH")
          dst.write_bytes(text)
          print(f"exe_text_bytes={len(text)} exe_text_sha256={hashlib.sha256(text).hexdigest()} base=0x80010000")
          PY
          mkdir -p "$root/ghidra-exe-project"
          headless="$(find /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016 -type f -path '*/support/analyzeHeadless' -print -quit)"
          [[ -n "$headless" && -x "$headless" ]]
          "$headless" "$root/ghidra-exe-project" SLPS_035_53_main \
            -import "$exe_raw" -loader BinaryLoader -loader-baseAddr 0x80010000 -loader-length 0x5D800 \
            -loader-blockName SLPS_035_53_TEXT -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript ExportRequestedFunctions.java "$out/w3_helper_function_disassembly.txt" \
              0x8002DEC4 0x8002DFE4 0x80035D48 0x80020F54 \
              "--xref-out=$out/x2_exe_helper_xrefs_and_callers.txt" \
            -analysisTimeoutPerFile 1200 -max-cpu 2 -deleteProject \
            > "$out/w3-ghidra-headless.log" 2>&1
          test -s "$out/w3_helper_function_disassembly.txt"
          test -s "$out/x2_exe_helper_xrefs_and_callers.txt"
          grep -E 'ERROR|Exception|W3_DISASSEMBLY_OUTPUT|HELPER_XREF_OUTPUT' "$out/w3-ghidra-headless.log" || true

      - name: X2 helper xrefs, a0 arguments, and slot-object field accesses
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_x2_static.py
          root="$RUNNER_TEMP/slot-provenance-audit"
          out="reports/slot_provenance_audit/run_$GITHUB_RUN_ID"
          python3 tools/audit_x2_static.py \
            --entry1 "$root/entry1-private.bin" \
            --exe "$EXE_PATH" \
            --functions-csv "reports/step4_10_static_evidence_audit/run_40789339014/a2_ghidra_rebased_functions.csv" \
            --v3 "reports/slot_provenance_audit/run_40815320809/v3_32_reader_base_register_trace.csv" \
            --ghidra-xrefs "$out/x2_exe_helper_xrefs_and_callers.txt" \
            --out "$out" --run-id "$GITHUB_RUN_ID"

      - name: Remove source binaries and extracted working files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/slot-provenance-audit/DATA.BIN" \
                "$RUNNER_TEMP/slot-provenance-audit/SLPS_035.53" \
                "$RUNNER_TEMP/slot-provenance-audit/checkpoint.raw.sstate" \
                "$RUNNER_TEMP/slot-provenance-audit/ram-prefix-private.bin" \
                "$RUNNER_TEMP/slot-provenance-audit/ram-values-private.csv" \
                "$RUNNER_TEMP/slot-provenance-audit/entry1-private.bin" \
                "$RUNNER_TEMP/slot-provenance-audit/SLPS_035.53-text.bin" \
                "$RUNNER_TEMP/slot-provenance-audit/output/ram-parser-log-private.txt"
          rm -rf "$RUNNER_TEMP/slot-provenance-audit/source" "$RUNNER_TEMP/slot-provenance-audit/extracted"

      - name: Commit sanitized text/CSV report to this audit branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reports/slot_provenance_audit/run_$GITHUB_RUN_ID"
          git commit -m "Record slot provenance audit run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload sanitized text/CSV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slot-provenance-audit-text-only
          path: |
            reports/slot_provenance_audit/run_${{ github.run_id }}/*.txt
            reports/slot_provenance_audit/run_${{ github.run_id }}/*.csv
            reports/slot_provenance_audit/run_${{ github.run_id }}/*.md
            reports/slot_provenance_audit/run_${{ github.run_id }}/*.log
          if-no-files-found: warn
          retention-days: 14
