name: HA2 — raw bound global and helper table probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ha2-bound-table-probe.yml"
      - "tools/stage1/ProbeHA2BoundTable.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-ha2-bound-table-probe
  cancel-in-progress: false

jobs:
  ha2-bound-table-probe:
    name: ha2-bound-table-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
      EXPECTED_GAME_SHA256: 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
      EXPECTED_EXE_SHA256: a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569
      WORK: /tmp/ha2-bound-probe
      OUT: /tmp/ha2-bound-probe-output

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install extraction and disassembly tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bchunk xorriso
          python3 -m pip install --break-system-packages "capstone==5.0.3"
          mkdir -p "$WORK"/{source,extracted} "$OUT"

      - name: Download verified disc and extract PS-X EXE
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$RESEARCH_REPO"
          BIN="$WORK/source/disc.bin"
          CUE_RAW="$WORK/source/original.cue"
          CUE="$WORK/source/disc.cue"
          curl --fail --location --silent --show-error --retry 2 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/647346873" -o "$BIN"
          test "$(stat -c %s "$BIN")" = 325989552
          echo "$EXPECTED_GAME_SHA256  $BIN" | sha256sum --check --status
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/647354760" -o "$CUE_RAW"
          test "$(stat -c %s "$CUE_RAW")" = 116
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $CUE_RAW" | sha256sum --check --status
          python3 - "$CUE_RAW" "$CUE" <<'PY'
          from pathlib import Path
          import re,sys
          src,dst=map(Path,sys.argv[1:3]); rows=[]; count=0
          for line in src.read_text(encoding="utf-8").splitlines():
              if line.lstrip().upper().startswith("FILE "):
                  m=re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$',line,re.I)
                  if not m: raise SystemExit("INVALID_CUE_FILE_DIRECTIVE")
                  line=m.group(1)+'"disc.bin"'+m.group(2); count+=1
              rows.append(line)
          if count!=1: raise SystemExit(f"CUE_FILE_COUNT={count}")
          dst.write_text("\n".join(rows)+"\n",encoding="utf-8")
          PY
          bchunk "$BIN" "$CUE" "$WORK/source/track"
          ISO="$(find "$WORK/source" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          test -n "$ISO"
          xorriso -osirrox on -indev "$ISO" -extract / "$WORK/extracted" > "$WORK/source/extract.log" 2>&1
          EXE="$(find "$WORK/extracted" -type f -iname 'SLPS_035.53' -print -quit)"
          test -n "$EXE"
          test "$(stat -c %s "$EXE")" = 385024
          echo "$EXPECTED_EXE_SHA256  $EXE" | sha256sum --check --status
          cp "$EXE" "$WORK/SLPS_035.53"
          echo "PRIVATE_EXE=VERIFIED" 

      - name: Compile and run static bound/table probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stage1/ProbeHA2BoundTable.py
          python3 tools/stage1/ProbeHA2BoundTable.py --exe "$WORK/SLPS_035.53" --out "$OUT"

      - name: Remove private binary inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          test ! -e "$WORK"
          echo "PRIVATE_CLEANUP=PASS" > "$OUT/cleanup.txt"

      - name: Commit text-only report and Actions summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          DEST="reports/stage1_economy/ha2-bound-table-run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          if [ -d "$OUT" ]; then
            find "$OUT" -maxdepth 1 -type f \( -name '*.txt' -o -name '*.tsv' \) -exec cp {} "$DEST/" \;
          fi
          PYRC=0
          python3 -m py_compile tools/stage1/ProbeHA2BoundTable.py || PYRC=$?
          [ "$PYRC" -ne 0 ] || [ -f "$DEST/HA2_BOUND_TABLE_SUMMARY.txt" ] || PYRC=99
          if [ "$PYRC" -eq 0 ]; then STATUS=PASS; else STATUS=PARTIAL_OR_FAILURE; fi
          {
            echo "STATUS=$STATUS"
            echo "JOB=ha2-bound-table-probe"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXIT_CODE=$PYRC"
            echo "PY_COMPILE_EXIT_CODE=$PYRC"
            echo "GAME_OR_EMULATOR_EXECUTED=no"
            echo "PRIVATE_BINARY_COMMITTED=no"
          } > "$DEST/ACTIONS_RUN_SUMMARY.txt"
          BAD="$(find "$DEST" -type f ! \( -name '*.txt' -o -name '*.tsv' \) -print)"
          test -z "$BAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Publish HA2 bound and helper-table static probe $GITHUB_RUN_ID [skip ci]"
            PUSHED=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
              if git push origin HEAD:main; then PUSHED=1; break; fi
              sleep "$n"
            done
            test "$PUSHED" -eq 1
          fi
          echo "HA2_BOUND_TABLE_REPORT=$DEST"
