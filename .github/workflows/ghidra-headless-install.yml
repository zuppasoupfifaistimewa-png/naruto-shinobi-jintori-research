name: Ghidra headless install and verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ghidra-headless-install.yml"

permissions:
  contents: read

concurrency:
  group: ghidra-headless-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-verify:
    name: Install Ghidra and verify headless launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GHIDRA_VERSION: "12.2"
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install required Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Restore cached Ghidra installation
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Download and install Ghidra when cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check -
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          else
            echo "Cached Ghidra installation found; download skipped."
          fi

      - name: Verify Java and Ghidra headless launcher
        shell: bash
        run: |
          set -euo pipefail
          java --version
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          if [[ -z "$headless" ]]; then
            echo "::error::Ghidra support/analyzeHeadless was not found."
            exit 1
          fi
          ghidra_home="${headless%/support/analyzeHeadless}"
          test -x "$headless"
          echo "Ghidra home: $ghidra_home"
          echo "Headless launcher: $headless"
          help_log="$RUNNER_TEMP/ghidra-analyzeHeadless-help.txt"
          set +e
          "$headless" -help >"$help_log" 2>&1
          help_status=$?
          set -e
          if [[ $help_status -ne 0 ]] && ! grep -Eiq '^Usage:|Usage: analyzeHeadless' "$help_log"; then
            cat "$help_log"
            echo "::error::analyzeHeadless failed to start (exit $help_status)."
            exit "$help_status"
          fi
          if ! grep -Eiq 'Usage:|analyzeHeadless|Ghidra' "$help_log"; then
            cat "$help_log"
            echo "::error::Headless launcher output did not contain expected usage text."
            exit 1
          fi
          {
            echo "Result: Ghidra headless launcher verified"
            echo "Ghidra version: $GHIDRA_VERSION"
            echo "Release asset: $GHIDRA_ASSET"
            echo "Expected SHA-256: $GHIDRA_SHA256"
            echo "Java:"
            java --version
            echo "Headless path: $headless"
            echo "Repository commit: $(git rev-parse HEAD)"
            echo "Cache hit: ${{ steps.ghidra-cache.outputs.cache-hit }}"
            echo "Help exit code: $help_status"
            echo
            sed -n '1,35p' "$help_log"
          } > ghidra-runner-install-report.txt
          cat ghidra-runner-install-report.txt

      - name: Upload text-only installation report
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-headless-install-report
          path: ghidra-runner-install-report.txt
          if-no-files-found: error
          retention-days: 14
