name: Naruto SCPH-7502 low-rate RSP progress probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-scph7502-rsp-progress-probe.yml"

permissions:
  contents: read

concurrency:
  group: naruto-scph7502-rsp-progress-probe
  cancel-in-progress: true

jobs:
  retail-bios-progress:
    runs-on: ubuntu-26.04
    timeout-minutes: 14
    steps:
      - name: Install private runtime and capture tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils xdotool imagemagick tesseract-ocr tesseract-ocr-jpn libgl1-mesa-dri mesa-utils

      - name: Download and verify private game, pinned emulator, and SCPH-7502 BIOS
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-scph7502-rsp"
          mkdir -p "$WORK/captures" "$WORK/home"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            ids="$(jq -r --arg name "$name" '[.assets[]? | select(.name == $name) | .id] | .[]' release.json)"
            if [ "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "::error::Expected exactly one release asset named $name"
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$ids" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c '%s' scph7502.zip)" = "283463"
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as zf:
              members=[]
              for info in zf.infolist():
                  p=PurePosixPath(info.filename)
                  mode=(info.external_attr >> 16) & 0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("Unsafe BIOS archive entry")
                  if info.file_size > 2*1024*1024:
                      raise SystemExit("BIOS archive member exceeds safety limit")
                  if not info.is_dir() and info.file_size == 524288:
                      members.append(info)
              if len(members) != 1:
                  raise SystemExit(f"Expected one BIOS-sized member, found {len(members)}")
              out=Path("scph7502.bin")
              digest=hashlib.sha256()
              with zf.open(members[0]) as src, out.open("wb") as dst:
                  while True:
                      chunk=src.read(65536)
                      if not chunk: break
                      digest.update(chunk); dst.write(chunk)
              actual=digest.hexdigest()
              expected="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1"
              print("RETAIL_BIOS_SHA256="+actual)
              print("RETAIL_BIOS_REFERENCE_MATCH="+str(actual == expected).upper())
              if actual != expected: raise SystemExit("Retail BIOS identity mismatch")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p=Path("game.cue")
          lines=p.read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          files=[i for i,line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(files)!=1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE: expected one FILE and at least one TRACK")
          lines[files[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          echo "ASSET_CHECKS=PASS"
          echo "EMULATOR_PIN=0c3572c3db75f97542001e453ae80ba8c3f8acba"
          echo "BIOS_TARGET=SCPH-7502"
          echo "ROM_AND_BIOS_REMAIN_ON_EPHEMERAL_PRIVATE_RUNNER=TRUE"

      - name: Boot with SCPH-7502, capture real app frames, and sample PC infrequently
        run: |
          set -eu
          cd "$WORK"
          Xvfb :99 -ac -screen 0 1280x800x24 -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped")
          print("DIAGNOSTIC=external low-rate RSP PC snapshots; no VSync callback or breakpoint")
          LUA
          )
          timeout --signal=TERM --kill-after=5s 108s \
            "$WORK/squashfs-root/AppRun" -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -gdb -gdb-port 3333 -run -interpreter -softgpu -stdout -lua_stdout \
            -logfile "$WORK/retail.log" > "$WORK/retail.stdout" 2>&1 &
          emu_pid=$!
          capture_window() {
            label="$1"
            tree="$(xwininfo -root -tree 2>&1 || true)"
            printf '%s\n' "$tree" > "$WORK/window-tree-$label.txt"
            root_hex="$(xwininfo -root 2>/dev/null | awk '/Window id:/{print $4; exit}')"
            [ -n "$root_hex" ] || return 1
            root_id=$((root_hex))
            window_id=""
            best_area=0
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              id_num=$((id))
              [ "$id_num" -ne "$root_id" ] || continue
              stats="$(xwininfo -id "$id" 2>/dev/null || true)"
              width="$(printf '%s\n' "$stats" | awk '/Width:/{print $2; exit}')"
              height="$(printf '%s\n' "$stats" | awk '/Height:/{print $2; exit}')"
              name="$(printf '%s\n' "$stats" | sed -n 's/.*Window id: [^"]*"\(.*\)".*/\1/p' | head -n 1)"
              case "$width:$height" in *[!0-9:]*|:*) continue;; esac
              area=$((width*height))
              if [ "$width" -ge 400 ] && [ "$height" -ge 250 ] && [ "$area" -gt "$best_area" ]; then
                window_id="$id_num"; best_area="$area"; best_name="$name"; best_width="$width"; best_height="$height"
              fi
            done < <(printf '%s\n' "$tree" | awk '$1 ~ /^0x[[:xdigit:]]+$/ {print $1}')
            if [ -z "$window_id" ]; then
              echo "CAPTURE_WINDOW=$label result=no-eligible-non-root-window"
              return 1
            fi
            echo "CAPTURE_WINDOW=$label id=$window_id name=$best_name width=$best_width height=$best_height"
            import -window "$window_id" "$WORK/captures/$label.png"
            identify -format 'FRAME_METRICS file=%f width=%w height=%h mean=%[mean] stddev=%[standard-deviation] colors=%k\n' "$WORK/captures/$label.png"
            echo "OCR_BEGIN=$label"
            tesseract "$WORK/captures/$label.png" stdout -l jpn+eng 2>/dev/null | head -16 || true
            echo "OCR_END=$label"
            echo "$window_id" > "$WORK/last-window-id"
          }

          sleep 12
          capture_window frame-12s || true
          python3 - <<'PY' > "$WORK/rsp-summary.txt" 2>&1 &
          import socket, time
          HOST, PORT = "127.0.0.1", 3333
          def packet(payload):
              raw=payload.encode("ascii")
              return b"$"+raw+b"#"+f"{sum(raw)&255:02x}".encode("ascii")
          def receive_packet(sock, timeout=3.0):
              deadline=time.monotonic()+timeout
              buf=bytearray()
              while time.monotonic()<deadline:
                  sock.settimeout(max(0.1,deadline-time.monotonic()))
                  try: chunk=sock.recv(4096)
                  except socket.timeout: continue
                  if not chunk: raise ConnectionError("peer closed")
                  buf.extend(chunk)
                  start=buf.find(b"$")
                  if start>=0:
                      mark=buf.find(b"#",start+1)
                      if mark>=0 and len(buf)>=mark+3:
                          body=bytes(buf[start+1:mark]); got=buf[mark+1:mark+3]
                          del buf[:mark+3]
                          want=f"{sum(body)&255:02x}".encode("ascii")
                          if got.lower()!=want: raise ValueError("response checksum mismatch")
                          return body.decode("ascii","replace")
              raise TimeoutError("no RSP packet before deadline")
          def request(sock,payload):
              sock.sendall(packet(payload))
              return receive_packet(sock)
          def reg_value(value):
              if len(value)!=8: return "unavailable"
              try: return f"0x{int.from_bytes(bytes.fromhex(value),'little'):08x}"
              except ValueError: return "unavailable"
          sock=None
          for attempt in range(20):
              try:
                  sock=socket.create_connection((HOST,PORT),timeout=1.0); break
              except OSError: time.sleep(0.5)
          if sock is None:
              print("RSP_CONNECT=failed port=3333")
              raise SystemExit(0)
          sock.settimeout(3.0)
          print("RSP_CONNECT=connected port=3333",flush=True)
          try:
              try: print("RSP_QSUPPORTED="+request(sock,"qSupported:multiprocess+")[:200],flush=True)
              except Exception as exc: print("RSP_QSUPPORTED=error:"+type(exc).__name__,flush=True)
              for index in range(5):
                  if index: time.sleep(12)
                  try:
                      pc=reg_value(request(sock,"p25"))
                  except Exception as exc:
                      pc="error:"+type(exc).__name__
                  try:
                      state=request(sock,"?")
                  except Exception as exc:
                      state="error:"+type(exc).__name__
                  print(f"RSP_PC_SAMPLE index={index} pc={pc} target_status={state}",flush=True)
          finally:
              sock.close()
          PY
          probe_pid=$!
          sleep 26
          capture_window frame-40s || true
          sleep 25
          capture_window frame-65s || true
          if [ -s "$WORK/last-window-id" ]; then
            wid="$(cat "$WORK/last-window-id")"
            timeout 2s xdotool windowfocus "$wid" 2>/dev/null || true
            echo "INPUT_TEST_BEGIN checkpoint=65s keys=Return,Z"
            xdotool key --clearmodifiers Return
            sleep 2
            capture_window after-return || true
            xdotool key --clearmodifiers z
            sleep 2
            capture_window after-cross || true
            echo "INPUT_TEST_END"
          else
            echo "INPUT_TEST_SKIPPED reason=no-valid-app-window"
          fi
          sleep 18
          capture_window frame-90s || true
          set +e
          wait "$probe_pid"; probe_rc=$?
          wait "$emu_pid"; emu_rc=$?
          set -e
          echo "RSP_PROBE_EXIT=$probe_rc"
          echo "GUI_PROCESS_EXIT=$emu_rc (124 means observation cap)"
          echo "RSP_SUMMARY_BEGIN"
          cat "$WORK/rsp-summary.txt" || true
          echo "RSP_SUMMARY_END"
          echo "BOOT_MARKERS_BEGIN"
          grep -E 'Loaded BIOS:|Known BIOS detected|OpenBIOS detected|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM\.CNF|BOOT =|EXEC:PC0|Execute !|ResetCallback|unknown GPU data word|PAD_SETUP=|FATAL|Exception|ERROR|Error|Failed|failed' \
            "$WORK/retail.stdout" "$WORK/retail.log" 2>/dev/null | tail -100 || true
          echo "BOOT_MARKERS_END"

      - name: Upload private captures and bounded diagnostic summaries for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-scph7502-rsp-progress-private
          path: |
            ${{ runner.temp }}/naruto-scph7502-rsp/captures/*.png
            ${{ runner.temp }}/naruto-scph7502-rsp/rsp-summary.txt
            ${{ runner.temp }}/naruto-scph7502-rsp/retail.stdout
            ${{ runner.temp }}/naruto-scph7502-rsp/retail.log
            ${{ runner.temp }}/naruto-scph7502-rsp/window-tree-*.txt
            ${{ runner.temp }}/naruto-scph7502-rsp/xvfb.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove private ROM, BIOS, emulator extracts and diagnostics
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi
          echo "Cleanup complete; private ROM, BIOS, emulator extracts and raw data removed from runner."
