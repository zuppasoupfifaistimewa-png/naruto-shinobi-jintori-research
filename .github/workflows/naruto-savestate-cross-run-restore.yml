name: Naruto raw savestate cross-run restore

on:
  workflow_run:
    workflows: ["Naruto raw savestate cross-run proof"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: naruto-savestate-cross-run-restore
  cancel-in-progress: false

jobs:
  cross-run-proof:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Mark experiment role and prepare workspace
        shell: bash
        env:
          SOURCE_RUN_ID: "${{ github.event.workflow_run.id }}"
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/naruto-savestate-cross-run"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/home" "$WORK/logs" "$WORK/resume" "$WORK/captures/raw"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "ROLE=CREATE" >> "$GITHUB_ENV"
            echo "CROSS_RUN_ROLE=CREATE_SOURCE_STATE run_id=$GITHUB_RUN_ID commit=$GITHUB_SHA" | tee "$WORK/captures/diagnostic-summary.txt"
          else
            echo "ROLE=RESTORE" >> "$GITHUB_ENV"
            echo "CROSS_RUN_ROLE=RESTORE_SOURCE_RUN source_run_id=$SOURCE_RUN_ID restore_run_id=$GITHUB_RUN_ID commit=$GITHUB_SHA" | tee "$WORK/captures/diagnostic-summary.txt"
          fi

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils libgl1-mesa-dri python3 python3-pil

      - name: Download and verify pinned emulator, game, and BIOS
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          RESEARCH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private release asset: $name"; exit 1; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c '%s' scph7502.zip)" = "283463"
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as zf:
              members = []
              expanded = 0
              for info in zf.infolist():
                  p = PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("Unsafe BIOS archive entry")
                  if info.file_size > 2*1024*1024:
                      raise SystemExit("BIOS archive member exceeds safety limit")
                  expanded += info.file_size
                  if expanded > 4*1024*1024:
                      raise SystemExit("BIOS archive too large")
                  if not info.is_dir() and info.file_size == 524288:
                      members.append(info)
              if len(members) != 1:
                  raise SystemExit(f"Expected one BIOS-sized member, found {len(members)}")
              out = Path("scph7502.bin")
              with zf.open(members[0]) as src, out.open("wb") as dst:
                  while True:
                      chunk = src.read(65536)
                      if not chunk:
                          break
                      dst.write(chunk)
              actual = hashlib.sha256(out.read_bytes()).hexdigest()
              expected = "5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1"
              print("RETAIL_BIOS_SHA256=" + actual)
              if actual != expected:
                  raise SystemExit("Retail BIOS reference mismatch")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          lines = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          ids = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "CROSS_RUN_ASSETS=verified" | tee -a "$WORK/captures/diagnostic-summary.txt"

      - name: Download source raw savestate artifact from Run A
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: naruto-raw-savestate-cross-run-source
          run-id: "${{ github.event.workflow_run.id }}"
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
          path: "${{ runner.temp }}/naruto-savestate-cross-run/source-artifact"

      - name: Validate source artifact byte-for-byte before restore
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          EXPECTED_SOURCE_RUN_ID: "${{ github.event.workflow_run.id }}"
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/naruto-savestate-cross-run/source-artifact"
          STATE="$SOURCE/raw-cross-run.sstate"
          MANIFEST="$SOURCE/raw-cross-run-manifest.txt"
          test -s "$STATE" && test -s "$MANIFEST"
          manifest_run="$(awk -F= '$1=="SOURCE_RUN_ID"{print $2;exit}' "$MANIFEST")"
          expected_bytes="$(awk -F= '$1=="SAVESTATE_BYTES"{print $2;exit}' "$MANIFEST")"
          expected_sha="$(awk -F= '$1=="SAVESTATE_SHA256"{print $2;exit}' "$MANIFEST")"
          test "$manifest_run" = "$EXPECTED_SOURCE_RUN_ID"
          actual_bytes="$(stat -c '%s' "$STATE")"
          actual_sha="$(sha256sum "$STATE" | cut -d ' ' -f 1)"
          test "$actual_bytes" = "$expected_bytes"
          test "$actual_sha" = "$expected_sha"
          cp "$STATE" "$WORK/resume/raw-cross-run.sstate"
          test "$(stat -c '%s' "$WORK/resume/raw-cross-run.sstate")" = "$expected_bytes"
          test "$(sha256sum "$WORK/resume/raw-cross-run.sstate" | cut -d ' ' -f 1)" = "$expected_sha"
          cp "$MANIFEST" "$WORK/captures/source-manifest.txt"
          {
            echo "SOURCE_ARTIFACT_VERIFY=PASS"
            echo "SOURCE_RUN_ID=$manifest_run"
            echo "SAVESTATE_BYTES=$actual_bytes"
            echo "SAVESTATE_SHA256=$actual_sha"
            echo "SOURCE_FILE_UNMODIFIED=1"
          } | tee -a "$WORK/captures/diagnostic-summary.txt"

      - name: Download and verify reference Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39242130783
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/naruto-savestate-cross-run/card-artifact

      - name: Validate reference Memory Card artifact
        shell: bash
        run: |
          set -euo pipefail
          CARD_DIR="$RUNNER_TEMP/naruto-savestate-cross-run/card-artifact"
          card="$(find "$CARD_DIR" -type f -name 'naruto-storymode.mcd' -print -quit)"
          manifest="$(find "$CARD_DIR" -type f -name 'memory-card-manifest.txt' -print -quit)"
          test -s "$card" && test -s "$manifest"
          test "$(stat -c '%s' "$card")" = "131072"
          echo "ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5  $card" | sha256sum --check -
          cp "$card" "$WORK/blank-reference.mcd"
          echo "CROSS_RUN_REFERENCE_CARD=verified size=131072 sha256=ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5" | tee -a "$WORK/captures/diagnostic-summary.txt"

      - name: Prepare and run emulator in a fresh process
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          PAD_SETUP=$(cat <<'PADLUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("CROSS_RUN_PAD_SETUP=1")
          PADLUA
          )

          if [ "$ROLE" = "CREATE" ]; then
            cat > "$WORK/create-raw-state.lua" <<'LUA'
          if io.stdout then io.stdout:setvbuf("no") end
          print("CROSS_RUN_CREATE_SCRIPT_ENTERED=1")
          local frame_count = 0
          local pending = false
          _G.crossRunCreateListener = PCSX.Events.createEventListener("GPU::Vsync", function()
              frame_count = frame_count + 1
              if frame_count == 1 or frame_count % 30 == 0 then
                  print("CROSS_RUN_CREATE_VSYNC=" .. tostring(frame_count))
              end
              if frame_count == 60 and not pending then
                  pending = true
                  print("CROSS_RUN_CREATE_SAFEPOINT=1")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local ok, state = pcall(function() return PCSX.createSaveState() end)
                      if not ok or not state then
                          print("CROSS_RUN_CREATE_ERROR=" .. tostring(state))
                          PCSX.quit(71)
                          return
                      end
                      local opened, file = pcall(function()
                          return assert(Support.File.open("resume/raw-cross-run.sstate", "TRUNCATE"),
                              "cannot create raw cross-run state")
                      end)
                      if not opened or not file then
                          print("CROSS_RUN_WRITE_OPEN_ERROR=" .. tostring(file))
                          PCSX.quit(72)
                          return
                      end
                      local wrote, err = pcall(function() file:writeMoveSlice(state) end)
                      file:close()
                      if not wrote then
                          print("CROSS_RUN_WRITE_ERROR=" .. tostring(err))
                          PCSX.quit(73)
                          return
                      end
                      print("CROSS_RUN_CREATE_PASS=1")
                      PCSX.quit(0)
                  end)
              end
          end)
          print("CROSS_RUN_CREATE_ARMED=1 target_vsync=60")
          LUA
            export DISPLAY=:99
            Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
            for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
            xdpyinfo -display "$DISPLAY" >/dev/null
            set +e
            timeout --signal=TERM --kill-after=5s 120s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" \
              -memcard1 "$WORK/blank-reference.mcd" -exec "$PAD_SETUP" \
              -dofile "$WORK/create-raw-state.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/logs/create-pcsx.log" -run > "$WORK/logs/create-stdout.log" 2>&1
            rc=$?
            set -e
            grep -E 'CROSS_RUN_|Loaded BIOS:|CD-ROM Label:|CD-ROM ID:|KERNEL SETUP|FATAL|ERROR' "$WORK/logs/create-stdout.log" "$WORK/logs/create-pcsx.log" >> "$WORK/captures/diagnostic-summary.txt" || true
            echo "CROSS_RUN_CREATE_EXIT=$rc" | tee -a "$WORK/captures/diagnostic-summary.txt"
            test "$rc" -eq 0
            grep -q 'CROSS_RUN_CREATE_PASS=1' "$WORK/captures/diagnostic-summary.txt"
            test -s "$WORK/resume/raw-cross-run.sstate"
            bytes="$(stat -c '%s' "$WORK/resume/raw-cross-run.sstate")"
            sha="$(sha256sum "$WORK/resume/raw-cross-run.sstate" | cut -d ' ' -f 1)"
            {
              echo "SOURCE_RUN_ID=$GITHUB_RUN_ID"
              echo "SOURCE_COMMIT=$GITHUB_SHA"
              echo "STATE_KIND=raw-PCSX.createSaveState-output-no-sanitization"
              echo "STATE_CREATED_AT_VSYNC=60"
              echo "SAVESTATE_BYTES=$bytes"
              echo "SAVESTATE_SHA256=$sha"
              echo "PCSX_APPIMAGE_SHA256=c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c"
              echo "GAME_SHA256=58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88"
              echo "BIOS_SHA256=5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1"
            } > "$WORK/resume/raw-cross-run-manifest.txt"
            cp "$WORK/resume/raw-cross-run-manifest.txt" "$WORK/captures/raw-cross-run-manifest.txt"
            {
              echo "SOURCE_STATE_CREATED=PASS"
              echo "SAVESTATE_BYTES=$bytes"
              echo "SAVESTATE_SHA256=$sha"
              echo "SOURCE_ARTIFACT_WILL_CONTAIN_RAW_STATE_UNCHANGED=1"
            } | tee -a "$WORK/captures/diagnostic-summary.txt"
          else
            cat > "$WORK/load-raw-state.lua" <<'LUA'
          if io.stdout then io.stdout:setvbuf("no") end
          print("CROSS_RUN_RESTORE_SCRIPT_ENTERED=1")
          local first_vsync_seen = false
          local state_loaded = false
          local load_call_returned = false
          local post_restore_frames = 0
          local frame_count = 0
          local pause_pending = false

          _G.crossRunRunListener = PCSX.Events.createEventListener("ExecutionFlow::Run", function()
              print("CROSS_RUN_EXECUTION_RUN=1")
          end)
          _G.crossRunLoadedListener = PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded", function()
              state_loaded = true
              post_restore_frames = 0
              print("CROSS_RUN_LOAD_EVENT=ExecutionFlow::SaveStateLoaded")
          end)
          local function capture_screenshot()
              local shot = PCSX.GPU.takeScreenShot()
              local bpp = (shot.bpp == 0) and 16 or 24
              local raw = assert(Support.File.open("captures/raw/post-restore-180.raw", "TRUNCATE"))
              raw:writeMoveSlice(shot.data)
              raw:close()
              local meta = assert(io.open("captures/raw/post-restore-180.json", "wb"))
              meta:write(string.format('{"frame":%d,"width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',
                  post_restore_frames, shot.width, shot.height, bpp, shot.width * shot.height * bpp / 8))
              meta:close()
              print(string.format("CROSS_RUN_SCREENSHOT_CAPTURED=1 name=post-restore-180 frame=%d width=%d height=%d",
                  post_restore_frames, shot.width, shot.height))
          end
          _G.crossRunGpuListener = PCSX.Events.createEventListener("GPU::Vsync", function()
              frame_count = frame_count + 1
              if not first_vsync_seen then
                  first_vsync_seen = true
                  print("CROSS_RUN_FIRST_VSYNC=1; schedule restore after callback unwinds")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local opened, file = pcall(function()
                          return assert(Support.File.open("resume/raw-cross-run.sstate"), "cannot open raw cross-run state")
                      end)
                      if not opened or not file then
                          print("CROSS_RUN_LOAD_OPEN_ERROR=" .. tostring(file))
                          PCSX.quit(50)
                          return
                      end
                      print("CROSS_RUN_LOAD_CALL_BEGIN=1")
                      local ok, err = pcall(function() PCSX.loadSaveState(file) end)
                      file:close()
                      if not ok then
                          print("CROSS_RUN_LOAD_CALL_ERROR=" .. tostring(err))
                          PCSX.quit(51)
                          return
                      end
                      load_call_returned = true
                      print("CROSS_RUN_LOAD_CALL_RETURNED=1")
                      PCSX.resumeEmulator()
                  end)
                  return
              end
              if state_loaded then
                  post_restore_frames = post_restore_frames + 1
                  if post_restore_frames == 180 and not pause_pending then
                      pause_pending = true
                      PCSX.pauseEmulator()
                      PCSX.nextTick(function()
                          local ok, err = pcall(capture_screenshot)
                          if not ok then
                              print("CROSS_RUN_SCREENSHOT_ERROR=" .. tostring(err))
                              PCSX.quit(61)
                              return
                          end
                          local proof_ok = state_loaded and load_call_returned and post_restore_frames >= 180
                          print("CROSS_RUN_POST_RESTORE_VSYNC=" .. tostring(post_restore_frames))
                          print("CROSS_RUN_RESTORE_PROOF=" .. (proof_ok and "PASS" or "FAIL"))
                          PCSX.quit(proof_ok and 0 or 52)
                      end)
                  end
              elseif frame_count >= 1500 and not pause_pending then
                  print("CROSS_RUN_LOAD_EVENT_TIMEOUT=1")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function() PCSX.quit(53) end)
              end
          end)
          print("CROSS_RUN_RESTORE_ARMED=1; wait for first VSync, load raw artifact, require 180 post-restore VSync")
          LUA
            export DISPLAY=:99
            Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
            for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
            xdpyinfo -display "$DISPLAY" >/dev/null
            set +e
            timeout --signal=TERM --kill-after=5s 180s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" \
              -memcard1 "$WORK/blank-reference.mcd" -exec "$PAD_SETUP" \
              -dofile "$WORK/load-raw-state.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/logs/restore-pcsx.log" -run > "$WORK/logs/restore-stdout.log" 2>&1
            rc=$?
            set -e
            grep -E 'CROSS_RUN_|Loaded BIOS:|CD-ROM Label:|CD-ROM ID:|KERNEL SETUP|FATAL|ERROR' "$WORK/logs/restore-stdout.log" "$WORK/logs/restore-pcsx.log" >> "$WORK/captures/diagnostic-summary.txt" || true
            echo "CROSS_RUN_RESTORE_EXIT=$rc" | tee -a "$WORK/captures/diagnostic-summary.txt"
            test "$rc" -eq 0
            grep -q 'CROSS_RUN_LOAD_EVENT=ExecutionFlow::SaveStateLoaded' "$WORK/captures/diagnostic-summary.txt"
            grep -q 'CROSS_RUN_LOAD_CALL_RETURNED=1' "$WORK/captures/diagnostic-summary.txt"
            grep -q 'CROSS_RUN_POST_RESTORE_VSYNC=180' "$WORK/captures/diagnostic-summary.txt"
            grep -q 'CROSS_RUN_RESTORE_PROOF=PASS' "$WORK/captures/diagnostic-summary.txt"
          fi

      - name: Convert and validate post-restore screenshot
        if: github.event_name == 'workflow_run' && always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          test -s "$WORK/captures/raw/post-restore-180.json"
          test -s "$WORK/captures/raw/post-restore-180.raw"
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageStat
          root = Path("captures/raw")
          meta = json.loads((root / "post-restore-180.json").read_text())
          raw_path = root / "post-restore-180.raw"
          raw = raw_path.read_bytes()
          width, height, bpp = int(meta["width"]), int(meta["height"]), int(meta["bpp"])
          if width < 100 or height < 100:
              raise SystemExit(f"Invalid screenshot dimensions: {width}x{height}")
          if len(raw) != width * height * bpp // 8:
              raise SystemExit(f"Screenshot byte count mismatch: {len(raw)}")
          if bpp == 16:
              rgb = bytearray()
              for i in range(0, len(raw), 2):
                  word = raw[i] | (raw[i+1] << 8)
                  rgb.extend(((word & 31)*255//31, ((word>>5)&31)*255//31, ((word>>10)&31)*255//31))
              image = Image.frombytes("RGB", (width, height), bytes(rgb))
          elif bpp == 24:
              image = Image.frombytes("RGB", (width, height), raw)
          else:
              raise SystemExit(f"Unsupported screenshot bpp: {bpp}")
          output = Path("captures/post-restore-180.png")
          image.save(output)
          check = Image.open(output).convert("RGB")
          extrema = check.getextrema()
          if not any(high > low for low, high in extrema):
              raise SystemExit("Screenshot is visually blank/constant")
          print(f"CROSS_RUN_SCREENSHOT_VALID=PASS file={output.name} dimensions={width}x{height} bytes={output.stat().st_size}")
          print(f"CROSS_RUN_SCREENSHOT_SHA256={__import__('hashlib').sha256(output.read_bytes()).hexdigest()}")
          PY
          grep -q 'CROSS_RUN_RESTORE_PROOF=PASS' "$WORK/captures/diagnostic-summary.txt"
          echo "CROSS_RUN_FINAL_GATE=PASS" | tee -a "$WORK/captures/diagnostic-summary.txt"

      - name: Upload raw source savestate artifact (Run A only)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: naruto-raw-savestate-cross-run-source
          path: |
            ${{ runner.temp }}/naruto-savestate-cross-run/resume/raw-cross-run.sstate
            ${{ runner.temp }}/naruto-savestate-cross-run/resume/raw-cross-run-manifest.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload cross-run proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-raw-savestate-cross-run-evidence
          path: |
            ${{ runner.temp }}/naruto-savestate-cross-run/captures/diagnostic-summary.txt
            ${{ runner.temp }}/naruto-savestate-cross-run/captures/post-restore-180.png
            ${{ runner.temp }}/naruto-savestate-cross-run/captures/raw/post-restore-180.json
            ${{ runner.temp }}/naruto-savestate-cross-run/source-manifest.txt
            ${{ runner.temp }}/naruto-savestate-cross-run/logs/*.log
            ${{ runner.temp }}/naruto-savestate-cross-run/xvfb.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
