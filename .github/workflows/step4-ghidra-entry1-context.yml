name: Step 4 — bounded Ghidra context for entry 1 raw RNG candidates

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/step4-ghidra-entry1-context.yml"
      - "tools/ghidra/ExportRngCallContext.java"

permissions:
  contents: read

concurrency:
  group: step4-ghidra-entry1-context
  cancel-in-progress: false

jobs:
  entry1-context:
    name: Decode only unresolved RNG callsite windows in entry 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install disc tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Set up Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Fetch and validate private disc; slice only DATA.BIN entry 1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/step4-entry1-context"
          source_dir="$root/source"
          extracted="$source_dir/extracted-root"
          input="$root/input"
          out="$RUNNER_TEMP/step4-entry1-context-output"
          mkdir -p "$source_dir" "$extracted" "$input" "$out"
          bin="$source_dir/naruto-disc.bin"
          cue_raw="$source_dir/original.cue"
          cue="$source_dir/naruto-disc.cue"
          bin_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873"
          cue_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760"

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 600 "$bin_url" --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 60 "$cue_url" --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status

          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          source, destination = map(Path, sys.argv[1:3])
          lines, rewritten, replaced = source.read_text(encoding="utf-8").splitlines(), [], 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  m = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not m: raise SystemExit("Unrecognized CUE FILE directive")
                  line = m.group(1) + '"naruto-disc.bin"' + m.group(2)
                  replaced += 1
              rewritten.append(line)
          if replaced != 1: raise SystemExit(f"Expected 1 FILE directive, got {replaced}")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

          bchunk "$bin" "$cue" "$source_dir/track"
          iso="$(find "$source_dir" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$out/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          [[ -n "$data" && -f "$data" && "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status

          python3 - "$data" "$input/DATA_BIN_ENTRY_0001.bin" <<'PY'
          from pathlib import Path
          import hashlib, sys
          src, dst = map(Path, sys.argv[1:3])
          chunk = src.read_bytes()[0x10BB000:0x10BB000+596412]
          digest = hashlib.sha256(chunk).hexdigest()
          expected = "9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a"
          if len(chunk) != 596412 or digest != expected:
              raise SystemExit(f"Entry 1 identity mismatch: bytes={len(chunk)} sha256={digest}")
          dst.write_bytes(chunk)
          print(f"entry1_bytes={len(chunk)} sha256={digest}")
          PY
          rm -rf "$source_dir"

      - name: Restore cached Ghidra
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          fi

      - name: Decode context around unresolved candidate sites only
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/step4-entry1-context/input"
          out="$RUNNER_TEMP/step4-entry1-context-output"
          mkdir -p "$out/project"
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          [[ -n "$headless" && -x "$headless" ]]
          "$headless" "$out/project" DATA_BIN_entry_0001_context \
            -import "$input/DATA_BIN_ENTRY_0001.bin" \
            -loader BinaryLoader -loader-baseAddr 0x800D0000 -loader-length 0x919BC \
            -loader-blockName DATA_BIN_ENTRY_0001 -processor "MIPS:LE:32:default" \
            -noanalysis -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript ExportRngCallContext.java "$out/data-bin-entry1-rng-context.txt" \
              0x800E7008:0x80035D78 \
              0x800EC004:0x80035D78 \
              0x800EC0C8:0x80035D78 \
              0x800ED1E0:0x80035D78 \
              0x800FA278:0x80035D78 \
              0x80129404:0x80035D78 \
              0x80132C88:0x80035D78 \
              0x8013332C:0x80035D78 \
              0x80133370:0x80035D78 \
              0x801334A4:0x80035D78 \
              0x801334E8:0x80035D78 \
              0x8013D548:0x80035D78 \
              0x8013D580:0x80035D78 \
              0x8013D5B8:0x80035D78 \
              0x8013D5DC:0x80035D78 \
              0x801454EC:0x80035D78 \
              0x8014A2F0:0x80035D78 \
              0x8014A570:0x80035D78 \
              0x8014DD68:0x80035D78 \
              0x8014DDC8:0x80035D78 \
              0x8014DE28:0x80035D78 \
              0x8014DE88:0x80035D78 \
              0x8014DEE8:0x80035D78 \
              0x8014DF48:0x80035D78 \
              0x8014E0D4:0x80035D78 \
              0x801558FC:0x80035D78 \
              0x8015592C:0x80035D78 \
              0x80155974:0x80035D78 \
              0x801559B0:0x80035D78 \
              0x801559CC:0x80035D78 \
              0x801559E8:0x80035D78 \
              0x80155A04:0x80035D78 \
              0x80155AB4:0x80035D78 \
              0x80156478:0x80035D78 \
              0x8015657C:0x80035D78 \
              0x801565B8:0x80035D78 \
            -deleteProject > "$out/ghidra-context.log" 2>&1
          [[ -s "$out/data-bin-entry1-rng-context.txt" ]]
          {
            echo "status=SUCCESS"
            echo "scope=36 local callsite windows only; no whole-program auto-analysis"
            echo "resource_base=0x800D0000 (hypothesis only)"
            echo "emulator_or_gameplay_executed=no"
            echo "binary_uploaded_as_artifact=no"
          } > "$out/scan-result.txt"
          grep -E '^(analysis=|program=|=== CANDIDATE|raw_word=|mips_jal_target_from_word=|raw_opcode_is_jal=|forced_disassembly_at_candidate_site=|ghidra_instruction_at_site=|ghidra_decoded_flow_to_target=|decoded_instruction_is_call=|caller_function_boundary=|caller_function_entry=|candidate_site=|incoming_source=|incoming_flow_scan_scope=)' "$out/data-bin-entry1-rng-context.txt" || true

      - name: Upload text-only context outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-entry1-rng-context
          path: ${{ runner.temp }}/step4-entry1-context-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary entry resource
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/step4-entry1-context"
