name: UP0-UP2 — static reader audit, checkpoint breakpoint probe and ledger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/up0-up2-audit.yml"
      - "tools/stage1/RunUP0.py"
      - "tools/stage1/RunUP1.py"
      - "tools/stage1/RunUP2.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-up0-up2-audit
  cancel-in-progress: false

jobs:
  up-audit:
    name: up-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: /tmp/naruto-up-private-${{ github.run_id }}-${{ github.run_attempt }}
      OUT: /tmp/naruto-up-output-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source and prepare output directories
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$WORK/source" "$WORK/disc" "$WORK/input" "$WORK/checkpoint" "$WORK/emulator" "$OUT/PREFLIGHT" "$OUT/UP0" "$OUT/UP1" "$OUT/UP2" "$OUT/ACTIONS"
          {
            echo "WORKFLOW_SOURCE_SHA=$GITHUB_SHA"
            echo "SOURCE_CHECKOUT=PASS"
            echo "REPOSITORY=$GITHUB_REPOSITORY"
            echo "RUN_ID=$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight — py_compile, pip pyflakes, YAML and all self-tests
        id: preflight
        shell: bash
        run: |
          set +e
          mkdir -p "$OUT/PREFLIGHT"
          report="$OUT/PREFLIGHT/UP_PREFLIGHT_RESULT.txt"
          python -m py_compile tools/stage1/RunUP0.py tools/stage1/RunUP1.py tools/stage1/RunUP2.py
          compile_rc=$?
          python -m pip install --disable-pip-version-check --no-input pyflakes PyYAML > "$OUT/PREFLIGHT/PIP_INSTALL_LOG.txt" 2>&1
          pip_rc=$?
          if [ "$pip_rc" -eq 0 ]; then
            python -m pyflakes tools/stage1/RunUP0.py tools/stage1/RunUP1.py tools/stage1/RunUP2.py > "$OUT/PREFLIGHT/PYFLAKES_LOG.txt" 2>&1
            pyflakes_rc=$?
          else
            pyflakes_rc=2
            echo "PYFLAKES_NOT_RUN_PIP_INSTALL_FAILED" > "$OUT/PREFLIGHT/PYFLAKES_LOG.txt"
          fi
          if [ "$pip_rc" -eq 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path(".github/workflows/up0-up2-audit.yml")
          yaml.compose(p.read_text(encoding="utf-8"), Loader=yaml.SafeLoader)
          print("UP_WORKFLOW_YAML_PARSE=PASS")
          PY
            yaml_rc=$?
          else
            yaml_rc=2
          fi
          python tools/stage1/RunUP0.py --self-test > "$OUT/PREFLIGHT/UP0_SELF_TEST.txt" 2>&1
          up0_rc=$?
          python tools/stage1/RunUP1.py --self-test > "$OUT/PREFLIGHT/UP1_SELF_TEST.txt" 2>&1
          up1_rc=$?
          python tools/stage1/RunUP2.py --self-test > "$OUT/PREFLIGHT/UP2_SELF_TEST.txt" 2>&1
          up2_rc=$?
          rc=0
          for code in "$compile_rc" "$pip_rc" "$yaml_rc" "$up0_rc" "$up1_rc" "$up2_rc"; do
            [ "$code" -eq 0 ] || rc=1
          done
          [ "$pyflakes_rc" -eq 0 ] || rc=1
          if [ "$rc" -eq 0 ]; then status=TUNTAS; else status=BELUM; fi
          {
            echo "STATUS=$status"
            echo "JOB=up-audit-preflight"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "PY_COMPILE_EXIT_CODE=$compile_rc"
            echo "PIP_INSTALL_EXIT_CODE=$pip_rc"
            echo "PYFLAKES_EXIT_CODE=$pyflakes_rc"
            echo "YAML_PARSE_EXIT_CODE=$yaml_rc"
            echo "UP0_SELF_TEST_EXIT_CODE=$up0_rc"
            echo "UP1_SELF_TEST_EXIT_CODE=$up1_rc"
            echo "UP2_SELF_TEST_EXIT_CODE=$up2_rc"
            echo "EXIT_CODE=$rc"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          test -s "$report" || rc=1
          exit "$rc"

      - name: Install private-disc extraction utilities
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bchunk xorriso jq unzip
          echo "DISC_EXTRACTION_UTILITIES=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Download and privately extract EXE and DATA.BIN
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          bin="$WORK/source/naruto-disc.bin"
          cue_raw="$WORK/source/original.cue"
          cue="$WORK/source/naruto-disc.cue"
          curl --fail --location --silent --show-error --retry 2 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/647346873" -o "$bin"
          test "$(stat -c '%s' "$bin")" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/647354760" -o "$cue_raw"
          test "$(stat -c '%s' "$cue_raw")" = "116"
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status
          awk '
            BEGIN { n=0 }
            /^[[:space:]]*FILE[[:space:]]/ { print "FILE \"naruto-disc.bin\" BINARY"; n++; next }
            { print }
            END { if (n != 1) exit 1 }
          ' "$cue_raw" > "$cue"
          bchunk "$bin" "$cue" "$WORK/source/track" > "$WORK/source/bchunk.log" 2>&1
          iso="$(find "$WORK/source" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          test -n "$iso"
          mkdir -p "$WORK/disc"
          xorriso -osirrox on -indev "$iso" -extract / "$WORK/disc" > "$WORK/disc/xorriso.log" 2>&1
          exe="$(find "$WORK/disc" -type f -iname 'SLPS_035.53' -print -quit)"
          data="$(find "$WORK/disc" -type f -iname 'DATA.BIN' -print -quit)"
          test -n "$exe" && test -n "$data"
          test "$(stat -c '%s' "$exe")" = "385024"
          echo "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569  $exe" | sha256sum --check --status
          test "$(stat -c '%s' "$data")" = "66015232"
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status
          cp "$exe" "$WORK/input/SLPS_035.53"
          cp "$data" "$WORK/input/DATA.BIN"
          echo "DISC_EXTRACT=PASS; EXE_AND_DATA_BIN_PRIVATE_ONLY=YES" >> "$GITHUB_STEP_SUMMARY"

      - name: UP0 — static bounded def-chain, forward taint and branch targets
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s "$WORK/input/SLPS_035.53" ] && [ -s "$WORK/input/DATA.BIN" ]; then
            python tools/stage1/RunUP0.py --exe "$WORK/input/SLPS_035.53" --data-bin "$WORK/input/DATA.BIN" --out-dir "$OUT/UP0" > "$OUT/UP0_EXECUTION_LOG.txt" 2>&1
            rc=$?
          else
            rc=2
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=private EXE or DATA.BIN extraction missing\nEXIT_CODE=2\n' > "$OUT/UP0/UP0_SUMMARY.txt"
            printf 'UP0_INPUTS_MISSING\n' > "$OUT/UP0_EXECUTION_LOG.txt"
          fi
          echo "$rc" > "$OUT/UP0_EXIT_CODE.txt"
          if [ "$rc" -ne 0 ] && [ ! -s "$OUT/UP0/UP0_SUMMARY.txt" ]; then
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=UP0 analysis failed\nEXIT_CODE=%s\n' "$rc" > "$OUT/UP0/UP0_SUMMARY.txt"
          fi
          echo "UP0_EXIT_CODE=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Download exact immutable checkpoint artifact
        if: success()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: "39907655833"
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}/checkpoint

      - name: Download PCSX-Redux, BIOS and prepare the existing private game cue
        if: success()
        shell: bash
        run: |
          set +e
          cd "$WORK/source"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          curl --fail --silent --show-error --location --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          rc=$?
          fetch_asset() {
            name="$1"; dest="$2"; size="$3"; digest="$4"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null || return 1
            curl --fail --silent --show-error --location --retry 2 --max-time 600 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$dest" || return 1
            test "$(stat -c %s "$dest")" = "$size" || return 1
            echo "$digest  $dest" | sha256sum --check --status || return 1
          }
          if [ "$rc" -eq 0 ]; then
            fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage 65747557 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c || rc=2
          fi
          if [ "$rc" -eq 0 ]; then
            fetch_asset scph7502.zip scph7502.zip 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a || rc=3
          fi
          if [ "$rc" -eq 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import stat
          import zipfile
          with zipfile.ZipFile("scph7502.zip") as archive:
              members=[]; total=0
              for item in archive.infolist():
                  name=Path(item.filename)
                  mode=(item.external_attr >> 16) & 0xffff
                  total += item.file_size
                  if name.is_absolute() or ".." in name.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("BIOS_ARCHIVE_UNSAFE_MEMBER")
                  if item.file_size > 2*1024*1024 or total > 4*1024*1024:
                      raise SystemExit("BIOS_ARCHIVE_EXPANSION_BOUND")
                  if not item.is_dir() and item.file_size == 524288:
                      members.append(item)
              if len(members) != 1:
                  raise SystemExit("BIOS_EXPECTED_ONE_512K_MEMBER")
              bios=archive.read(members[0])
              import hashlib
              if hashlib.sha256(bios).hexdigest() != "5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1":
                  raise SystemExit("BIOS_SHA256_MISMATCH")
              Path("scph7502.bin").write_bytes(bios)
          PY
            [ "$?" -eq 0 ] || rc=4
          fi
          if [ "$rc" -eq 0 ]; then
            chmod +x pcsx-redux.AppImage
            ./pcsx-redux.AppImage --appimage-extract > /tmp/up-appimage-extract.log 2>&1 || rc=5
          fi
          if [ "$rc" -eq 0 ]; then
            APPDIR="$WORK/source/squashfs-root"
            test -x "$APPDIR/AppRun" || rc=6
            PCSX_BIN="$(find -L "$APPDIR" -maxdepth 8 -type f -perm /111 | grep -E '/(pcsx-redux|pcsx-redux[^/]*)$' | head -n 1)"
            test -n "$PCSX_BIN" && test -x "$PCSX_BIN" || rc=7
            cp scph7502.bin "$WORK/input/scph7502.bin"
            awk '
              BEGIN { n=0 }
              /^[[:space:]]*FILE[[:space:]]/ { print "FILE \"naruto-disc.bin\" BINARY"; n++; next }
              { print }
              END { if (n != 1) exit 1 }
            ' "$WORK/source/naruto-disc.cue" > "$WORK/source/game-run.cue" || rc=8
            echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"
            echo "PCSX_BIN=$PCSX_BIN" >> "$GITHUB_ENV"
          fi
          echo "$rc" > "$OUT/EMULATOR_SETUP_EXIT_CODE.txt"
          if [ "$rc" -eq 0 ]; then echo "PCSX_AND_BIOS_SETUP=PASS" >> "$GITHUB_STEP_SUMMARY"; else echo "PCSX_AND_BIOS_SETUP=FAIL code=$rc" >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Verify immutable checkpoint identity
        if: always()
        shell: bash
        run: |
          set +e
          SOURCE_C01="$WORK/checkpoint/adaptive-cycle-01-f180.sstate"
          SOURCE_C02="$WORK/checkpoint/adaptive-cycle-02-f180.sstate"
          rc=0
          test -f "$SOURCE_C01" && test "$(stat -c '%s' "$SOURCE_C01")" = "21162638" || rc=1
          test -f "$SOURCE_C02" && test "$(stat -c '%s' "$SOURCE_C02")" = "21162799" || rc=1
          if [ "$rc" -eq 0 ]; then
            echo "747217064b1a178d7bdfe4ef4722935593dbbea2c89efcbd451e25d651bd014f  $SOURCE_C01" | sha256sum --check --status || rc=2
            echo "705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35  $SOURCE_C02" | sha256sum --check --status || rc=3
          fi
          if [ "$rc" -eq 0 ]; then chmod 0444 "$SOURCE_C01" "$SOURCE_C02"; fi
          echo "$rc" > "$OUT/CHECKPOINT_VERIFY_EXIT_CODE.txt"
          {
            echo "CHECKPOINT_C01_SHA256=747217064b1a178d7bdfe4ef4722935593dbbea2c89efcbd451e25d651bd014f"
            echo "CHECKPOINT_C01_BYTES=21162638"
            echo "CHECKPOINT_C02_SHA256=705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35"
            echo "CHECKPOINT_C02_BYTES=21162799"
            echo "CHECKPOINT_VERIFY_EXIT_CODE=$rc"
          } > "$OUT/CHECKPOINT_VERIFY.txt"
          if [ "$rc" -eq 0 ]; then echo "CHECKPOINT_VERIFY=PASS" >> "$GITHUB_STEP_SUMMARY"; else echo "CHECKPOINT_VERIFY=FAIL code=$rc" >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: UP1 — paired no-input replays for both existing checkpoints
        if: always()
        shell: bash
        run: |
          set +e
          SOURCE_C01="$WORK/checkpoint/adaptive-cycle-01-f180.sstate"
          SOURCE_C02="$WORK/checkpoint/adaptive-cycle-02-f180.sstate"
          ENTRY="$OUT/UP0/UP0_FUNCTION_ENTRY_POINTS.tsv"
          DISASM="$OUT/UP0/UP0_READER_FUNCTION_DISASSEMBLY.tsv"
          CALLERS="$OUT/UP0/UP0_CALLERS.tsv"
          CASES="$OUT/UP0/UP0_CASE_MULTIPLIERS.tsv"
          FORWARD="$OUT/UP0/UP0_FORWARD_7_SITES.tsv"
          JUMPTABLE="$OUT/UP0/UP0_SELECTOR_JUMPTABLE.tsv"
          prerequisites=0
          grep -q '^STATUS=TUNTAS$' "$OUT/PREFLIGHT/UP_PREFLIGHT_RESULT.txt" 2>/dev/null || prerequisites=1
          [ "$(cat "$OUT/CHECKPOINT_VERIFY_EXIT_CODE.txt" 2>/dev/null)" = "0" ] || prerequisites=1
          [ "$(cat "$OUT/EMULATOR_SETUP_EXIT_CODE.txt" 2>/dev/null)" = "0" ] || prerequisites=1
          [ -x "$PCSX_BIN" ] && [ -s "$WORK/input/scph7502.bin" ] && [ -s "$WORK/source/game-run.cue" ] || prerequisites=1
          [ -s "$ENTRY" ] && [ -s "$DISASM" ] && [ -s "$CALLERS" ] && [ -s "$CASES" ] && [ -s "$FORWARD" ] && [ -s "$JUMPTABLE" ] || prerequisites=1
          rc_c02=2
          rc_c01=2
          rc_nav_c02=2
          rc_nav_c01=2
          if [ "$prerequisites" -eq 0 ]; then
            python tools/stage1/RunUP1.py --work "$WORK/emulator/c02" --out "$OUT/UP1" \
              --pcsx-bin "$PCSX_BIN" --appdir "$APPDIR" --bios "$WORK/input/scph7502.bin" \
              --cue "$WORK/source/game-run.cue" --source "$SOURCE_C02" \
              --checkpoint-sha256 705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35 \
              --checkpoint-bytes 21162799 \
              --static-readers "$ENTRY" --static-disassembly "$DISASM" \
              --static-callers "$CALLERS" --static-cases "$CASES" \
              --static-forward-sites "$FORWARD" --static-selector-table "$JUMPTABLE" \
              --frames 600 --timeout-seconds 900 > "$OUT/UP1_EXECUTION_LOG.txt" 2>&1
            rc_c02=$?
            python tools/stage1/RunUP1.py --work "$WORK/emulator/c01" --out "$OUT/UP1_C01" \
              --pcsx-bin "$PCSX_BIN" --appdir "$APPDIR" --bios "$WORK/input/scph7502.bin" \
              --cue "$WORK/source/game-run.cue" --source "$SOURCE_C01" \
              --checkpoint-sha256 747217064b1a178d7bdfe4ef4722935593dbbea2c89efcbd451e25d651bd014f \
              --checkpoint-bytes 21162638 \
              --static-readers "$ENTRY" --static-disassembly "$DISASM" \
              --static-callers "$CALLERS" --static-cases "$CASES" \
              --static-forward-sites "$FORWARD" --static-selector-table "$JUMPTABLE" \
              --frames 600 --timeout-seconds 900 > "$OUT/UP1_C01_EXECUTION_LOG.txt" 2>&1
            rc_c01=$?
            mkdir -p "$OUT/UP1_NAV_C02" "$OUT/UP1_NAV_C01"
            python tools/stage1/RunUP1.py --work "$WORK/emulator/pad-nav-c02" --out "$OUT/UP1_NAV_C02" \
              --pcsx-bin "$PCSX_BIN" --appdir "$APPDIR" --bios "$WORK/input/scph7502.bin" \
              --cue "$WORK/source/game-run.cue" --source "$SOURCE_C02" \
              --checkpoint-sha256 705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35 \
              --checkpoint-bytes 21162799 --input-sequence "30:UP,90:RIGHT,150:DOWN,210:LEFT,270:UP,330:RIGHT,390:DOWN,450:LEFT,510:CIRCLE" \
              --static-readers "$ENTRY" --static-disassembly "$DISASM" \
              --static-callers "$CALLERS" --static-cases "$CASES" \
              --static-forward-sites "$FORWARD" --static-selector-table "$JUMPTABLE" \
              --frames 600 --timeout-seconds 900 > "$OUT/UP1_NAV_C02_EXECUTION_LOG.txt" 2>&1
            rc_nav_c02=$?
            python tools/stage1/RunUP1.py --work "$WORK/emulator/pad-nav-c01" --out "$OUT/UP1_NAV_C01" \
              --pcsx-bin "$PCSX_BIN" --appdir "$APPDIR" --bios "$WORK/input/scph7502.bin" \
              --cue "$WORK/source/game-run.cue" --source "$SOURCE_C01" \
              --checkpoint-sha256 747217064b1a178d7bdfe4ef4722935593dbbea2c89efcbd451e25d651bd014f \
              --checkpoint-bytes 21162638 --input-sequence "30:UP,90:RIGHT,150:DOWN,210:LEFT,270:UP,330:RIGHT,390:DOWN,450:LEFT,510:CIRCLE" \
              --static-readers "$ENTRY" --static-disassembly "$DISASM" \
              --static-callers "$CALLERS" --static-cases "$CASES" \
              --static-forward-sites "$FORWARD" --static-selector-table "$JUMPTABLE" \
              --frames 600 --timeout-seconds 900 > "$OUT/UP1_NAV_C01_EXECUTION_LOG.txt" 2>&1
            rc_nav_c01=$?
          else
            mkdir -p "$OUT/UP1_C01"
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=preflight, either checkpoint, emulator or UP0 static-output prerequisites not passed\nEXIT_CODE=2\n' > "$OUT/UP1/UP1_SUMMARY.txt"
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=preflight, either checkpoint, emulator or UP0 static-output prerequisites not passed\nEXIT_CODE=2\n' > "$OUT/UP1_C01/UP1_SUMMARY.txt"
            printf 'UP1_C02_PRE_LAUNCH_PREREQUISITE_FAILED\n' > "$OUT/UP1_EXECUTION_LOG.txt"
            printf 'UP1_C01_PRE_LAUNCH_PREREQUISITE_FAILED\n' > "$OUT/UP1_C01_EXECUTION_LOG.txt"
          fi
          echo "$rc_c02" > "$OUT/UP1_EXIT_CODE.txt"
          echo "$rc_c01" > "$OUT/UP1_C01_EXIT_CODE.txt"
          echo "$rc_nav_c02" > "$OUT/UP1_NAV_C02_EXIT_CODE.txt"
          echo "$rc_nav_c01" > "$OUT/UP1_NAV_C01_EXIT_CODE.txt"
          if [ "$rc_nav_c02" -ne 0 ] && [ ! -s "$OUT/UP1_NAV_C02/UP1_SUMMARY.txt" ]; then
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=C02 pad navigation runtime failed before summary\nEXIT_CODE=%s\n' "$rc_nav_c02" > "$OUT/UP1_NAV_C02/UP1_SUMMARY.txt"
          fi
          if [ "$rc_nav_c01" -ne 0 ] && [ ! -s "$OUT/UP1_NAV_C01/UP1_SUMMARY.txt" ]; then
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=C01 pad navigation runtime failed before summary\nEXIT_CODE=%s\n' "$rc_nav_c01" > "$OUT/UP1_NAV_C01/UP1_SUMMARY.txt"
          fi
          if [ "$rc_c02" -ne 0 ] && [ ! -s "$OUT/UP1/UP1_SUMMARY.txt" ]; then
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=C02 UP1 runtime failed before summary\nEXIT_CODE=%s\n' "$rc_c02" > "$OUT/UP1/UP1_SUMMARY.txt"
          fi
          mkdir -p "$OUT/UP1" "$OUT/UP1_C01"
          mkdir -p "$OUT/UP1_NAV_C01" "$OUT/UP1_NAV_C02"
          python - "$OUT/UP1" "$OUT/UP1_C01" "$OUT/UP1_NAV_C02" "$OUT/UP1_NAV_C01" "$OUT/UP0/UP0_SELECTOR_JUMPTABLE.tsv" <<'PY'
          import csv
          import sys
          from pathlib import Path

          folders={
              "C01_BASELINE":Path(sys.argv[2]),
              "C02_BASELINE":Path(sys.argv[1]),
              "C01_PAD_NAV":Path(sys.argv[4]),
              "C02_PAD_NAV":Path(sys.argv[3]),
          }
          table=Path(sys.argv[5])
          targets_by_selector={}
          with table.open(encoding="utf-8",newline="") as stream:
              for row in csv.DictReader(stream,delimiter="\t"):
                  targets_by_selector[row["selector_value"]]=row["jump_target_pc"]
          all_selector_rows=[];all_snapshot_rows=[]
          selector_union=set();target_union=set();snapshot_selector_union=set()
          repeatable_by_selector={};lines=["UP1_MULTI_CHECKPOINT_AND_PAD_NAVIGATION_SUMMARY"]
          all_k5=True
          for condition,folder in folders.items():
              values={}
              summary=folder/"UP1_SUMMARY.txt"
              if summary.exists():
                  for line in summary.read_text(encoding="utf-8",errors="replace").splitlines():
                      if "=" in line:
                          key,value=line.split("=",1);values[key]=value
              rows=[]
              selector_file=folder/"UP1_SELECTOR_V0.tsv"
              if selector_file.exists():
                  with selector_file.open(encoding="utf-8",newline="") as stream:
                      for row in csv.DictReader(stream,delimiter="\t"):
                          row["condition"]=condition;all_selector_rows.append(row);rows.append(row)
                          selector=row.get("selector_value","TIDAK TAHU")
                          launch=row.get("launch","TIDAK TAHU")
                          if selector in targets_by_selector:
                              selector_union.add(selector)
                              repeatable_by_selector.setdefault(selector,{}).setdefault(condition,set()).add(launch)
                          if row.get("table_target_pc") in targets_by_selector.values():
                              target_union.add(row["table_target_pc"])
              snapshots=[]
              snap_file=folder/"UP1_RECORD_SELECTORS.tsv"
              if snap_file.exists():
                  with snap_file.open(encoding="utf-8",newline="") as stream:
                      for row in csv.DictReader(stream,delimiter="\t"):
                          row["condition"]=condition;all_snapshot_rows.append(row);snapshots.append(row)
                          try:sel=str(int(row.get("record_selector",""),16))
                          except (TypeError,ValueError):continue
                          if sel in targets_by_selector:snapshot_selector_union.add(sel)
              pad_rows=[]
              pad_file=folder/"UP1_PAD_ACTIONS.tsv"
              if pad_file.exists():
                  with pad_file.open(encoding="utf-8",newline="") as stream:
                      pad_rows=list(csv.DictReader(stream,delimiter="\t"))
              by_launch={}
              for row in pad_rows:by_launch.setdefault(row.get("launch",""),[]).append(row)
              if condition.endswith("PAD_NAV"):
                  pad_ok=(len(by_launch.get("LAUNCH_1",[]))==18 and
                          len(by_launch.get("LAUNCH_2",[]))==18 and
                          all(row.get("status")=="PASS" for row in pad_rows) and
                          [tuple(r[k] for k in ("frame","button","phase","readback","status")) for r in by_launch["LAUNCH_1"]]==
                          [tuple(r[k] for k in ("frame","button","phase","readback","status")) for r in by_launch["LAUNCH_2"]])
              else:
                  pad_ok=(values.get("PAD_ACTION_TRACE_IDENTICAL_ROW_BY_ROW")=="YES")
              k5=(values.get("STATUS")=="TUNTAS" and values.get("EVIDENCE")=="K5" and
                  values.get("EVENT_TRACE_IDENTICAL_ROW_BY_ROW")=="YES" and
                  values.get("PAD_ACTION_TRACE_IDENTICAL_ROW_BY_ROW")=="YES" and
                  values.get("MAXIMUM_STAGE_REACHED")=="600" and pad_ok)
              all_k5=all_k5 and k5
              lines.extend([f"{condition}_STATUS={values.get('STATUS','TIDAK TAHU')}",
                f"{condition}_EVIDENCE={values.get('EVIDENCE','TIDAK TAHU')}",
                f"{condition}_CHECKPOINT_SHA256={values.get('CHECKPOINT_SHA256','TIDAK TAHU')}",
                f"{condition}_EVENT_TRACE_IDENTICAL_ROW_BY_ROW={values.get('EVENT_TRACE_IDENTICAL_ROW_BY_ROW','TIDAK TAHU')}",
                f"{condition}_PAD_ACTION_TRACE_IDENTICAL_ROW_BY_ROW={values.get('PAD_ACTION_TRACE_IDENTICAL_ROW_BY_ROW','TIDAK TAHU')}",
                f"{condition}_PAD_ACTION_ROWS={len(pad_rows)}",
                f"{condition}_SELECTOR_ROWS={len(rows)}",
                f"{condition}_RECORD_SNAPSHOT_ROWS={len(snapshots)}"])
          repeatable=[]
          for selector,seen in repeatable_by_selector.items():
              if any({"LAUNCH_1","LAUNCH_2"}.issubset(launches) for launches in seen.values()):
                  repeatable.append(selector)
          matches=sum(1 for row in all_selector_rows if row.get("comparison_status")=="MATCH")
          mismatches=sum(1 for row in all_selector_rows if row.get("comparison_status")=="MISMATCH")
          unproven=sum(1 for row in all_selector_rows if row.get("comparison_status") in
                       ("TIDAK DAPAT DIBANDINGKAN","MATCH_INPUT_SOURCE_UNPROVEN"))
          required=set(targets_by_selector)
          formula_k5=(selector_union==required and set(repeatable)==required and
                      matches>0 and mismatches==0 and unproven==0 and all_k5)
          snapshot_repeatable=True;by_condition={}
          for row in all_snapshot_rows:
              by_condition.setdefault((row.get("condition"),row.get("launch")),{})[row.get("record_index","")]=(
                  row.get("record_selector",""),row.get("rec_20",""),row.get("selected_offset",""),row.get("selected_value",""))
          for condition in folders:
              first=by_condition.get((condition,"LAUNCH_1"));second=by_condition.get((condition,"LAUNCH_2"))
              if first is not None or second is not None:
                  if first is None or second is None or first!=second:snapshot_repeatable=False
          lines.extend(["INPUT=PAD_ONLY_FOR_PAD_NAV_CONDITIONS; baseline conditions use NONE",
            "RAM_WRITE_INJECTION=NONE",
            f"REPEATABILITY_K5_ALL_CONDITIONS={'TUNTAS' if all_k5 else 'BELUM'}",
            f"CASE_TARGETS_EXPECTED={len(required)}",f"CASE_TARGETS_EXECUTED={len(selector_union)}",
            f"CASE_TARGET_COVERAGE={'TUNTAS' if selector_union==required else 'SEBAGIAN'}",
            f"SELECTOR_VALUES_EXECUTED={','.join(sorted(selector_union))}",
            f"SELECTOR_VALUES_WITH_TWO_IDENTICAL_REPLAYS={','.join(sorted(repeatable))}",
            f"RECORD_SELECTOR_VALUES_PRESENT_IN_RAM={','.join(sorted(snapshot_selector_union))}",
            f"RECORD_SNAPSHOT_TARGET_COVERAGE={'TUNTAS' if snapshot_selector_union==required else 'SEBAGIAN'}",
            f"RECORD_SNAPSHOT_REPEATABLE_WITHIN_CONDITIONS={'YES' if snapshot_repeatable else 'NO_OR_INCOMPLETE'}",
            f"SELECTOR_RESULT_MATCH_ROWS={matches}",f"SELECTOR_RESULT_MISMATCH_ROWS={mismatches}",
            f"SELECTOR_RESULT_UNPROVEN_ROWS={unproven}",
            f"CASE_FORMULA_K5={'TUNTAS' if formula_k5 else 'BELUM'}"])
          dest=folders["C02_BASELINE"]
          (dest/"UP1_MULTI_CHECKPOINT_SUMMARY.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          if all_selector_rows:
              with (dest/"UP1_ALL_SELECTOR_ROWS.tsv").open("w",encoding="utf-8",newline="") as stream:
                  fields=list(all_selector_rows[0].keys())
                  writer=csv.DictWriter(stream,fieldnames=fields,delimiter="\t",extrasaction="ignore",lineterminator="\n")
                  writer.writeheader();writer.writerows(all_selector_rows)
          if all_snapshot_rows:
              with (dest/"UP1_ALL_RECORD_SELECTORS.tsv").open("w",encoding="utf-8",newline="") as stream:
                  fields=list(all_snapshot_rows[0].keys())
                  writer=csv.DictWriter(stream,fieldnames=fields,delimiter="\t",extrasaction="ignore",lineterminator="\n")
                  writer.writeheader();writer.writerows(all_snapshot_rows)
          (dest/"UP1_CASE_FORMULA_K5.txt").write_text("TUNTAS\n" if formula_k5 else "BELUM\n",encoding="utf-8")
          print("\n".join(lines),flush=True)
          PY
          merge_rc=$?
          if [ "$merge_rc" -ne 0 ]; then rc_c02=2; echo 2 > "$OUT/UP1_EXIT_CODE.txt"; fi
          echo "UP1_EXIT_CODE=$rc_c02" >> "$GITHUB_STEP_SUMMARY"
          echo "UP1_C01_EXIT_CODE=$rc_c01" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: UP2 — inclusive Git and all Actions run/job ledger
        if: always()
        shell: bash
        run: |
          set +e
          python tools/stage1/RunUP2.py --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --preflight-marker "$OUT/PREFLIGHT/UP_PREFLIGHT_RESULT.txt" --out-dir "$OUT/UP2" \
            > "$OUT/UP2_EXECUTION_LOG.txt" 2>&1
          rc=$?
          echo "$rc" > "$OUT/UP2_EXIT_CODE.txt"
          if [ "$rc" -ne 0 ] && [ ! -s "$OUT/UP2/UP2_SUMMARY.txt" ]; then
            printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=UP2 Git or Actions API ledger failed\nEXIT_CODE=%s\n' "$rc" > "$OUT/UP2/UP2_SUMMARY.txt"
          fi
          echo "UP2_EXIT_CODE=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Remove private ROM, BIOS, checkpoint, emulator and intermediate files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$WORK"
          if [ -d "$WORK" ]; then echo "PRIVATE_CLEANUP=FAIL" >> "$GITHUB_STEP_SUMMARY"; else echo "PRIVATE_CLEANUP=PASS" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit text-only stage reports and Actions summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for stage in UP0 UP1 UP2; do
            mkdir -p "$OUT/$stage"
            exit_file="$OUT/${stage}_EXIT_CODE.txt"
            log_file="$OUT/${stage}_EXECUTION_LOG.txt"
            summary_file="$OUT/$stage/${stage}_SUMMARY.txt"
            if [ ! -s "$exit_file" ]; then echo 2 > "$exit_file"; fi
            if [ ! -s "$log_file" ]; then printf 'STATUS=BELUM\nREASON=stage execution was skipped\nEXIT_CODE=2\n' > "$log_file"; fi
            if [ ! -s "$summary_file" ]; then printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=no stage summary was produced\nEXIT_CODE=2\n' > "$summary_file"; fi
          done
          if [ ! -s "$OUT/PREFLIGHT/UP_PREFLIGHT_RESULT.txt" ]; then
            printf 'STATUS=BELUM\nJOB=up-audit-preflight\nSOURCE_SHA=%s\nEXIT_CODE=2\n' "$GITHUB_SHA" > "$OUT/PREFLIGHT/UP_PREFLIGHT_RESULT.txt"
          fi
          rc0="$(cat "$OUT/UP0_EXIT_CODE.txt")"
          rc1="$(cat "$OUT/UP1_EXIT_CODE.txt")"
          rc1c01="$(cat "$OUT/UP1_C01_EXIT_CODE.txt")"
          rc_nav_c02="$(cat "$OUT/UP1_NAV_C02_EXIT_CODE.txt" 2>/dev/null || echo 2)"
          rc_nav_c01="$(cat "$OUT/UP1_NAV_C01_EXIT_CODE.txt" 2>/dev/null || echo 2)"
          case_rc=2
          [ "$(cat "$OUT/UP1/UP1_CASE_FORMULA_K5.txt")" = "TUNTAS" ] && case_rc=0
          rc2="$(cat "$OUT/UP2_EXIT_CODE.txt")"
          preflight_rc="$(grep '^EXIT_CODE=' "$OUT/PREFLIGHT/UP_PREFLIGHT_RESULT.txt" | tail -n 1 | cut -d= -f2)"
          final_rc=0
          for code in "$rc0" "$rc1" "$rc1c01" "$rc_nav_c02" "$rc_nav_c01" "$case_rc" "$rc2" "$preflight_rc"; do
            [ "$code" = "0" ] || final_rc=2
          done
          if [ "$final_rc" = "0" ]; then status=TUNTAS
          elif [ "$preflight_rc" != "0" ]; then status=BELUM
          else status=SEBAGIAN
          fi
          mkdir -p "$OUT/ACTIONS"
          {
            echo "STATUS=$status"
            echo "JOB=up-audit"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "UP0_EXIT_CODE=$rc0"
            echo "UP1_C02_EXIT_CODE=$rc1"
            echo "UP1_C01_EXIT_CODE=$rc1c01"
            echo "UP1_NAV_C02_EXIT_CODE=$rc_nav_c02"
            echo "UP1_NAV_C01_EXIT_CODE=$rc_nav_c01"
            echo "CASE_FORMULA_K5_EXIT_CODE=$case_rc"
            echo "UP2_EXIT_CODE=$rc2"
            echo "PREFLIGHT_EXIT_CODE=$preflight_rc"
            echo "EXIT_CODE=$final_rc"
          } > "$OUT/ACTIONS/ACTIONS_RUN_SUMMARY.txt"
          cat > "$OUT/UP_FINAL_CLOSEOUT.txt" <<EOF
          UP0-UP2 FINAL CLOSEOUT
          REPOSITORY=$GITHUB_REPOSITORY
          BRANCH=main
          LEDGER_BASELINE_INCLUSIVE=d0c7b1a1dff85ffb439923078e78adf5b958b9a8
          WORKFLOW_SOURCE_SHA=$GITHUB_SHA
          WORKFLOW_RUN_ID=$GITHUB_RUN_ID
          OVERALL_STATUS=$status
          UP0_EXIT_CODE=$rc0
          UP1_C02_EXIT_CODE=$rc1
          UP1_C01_EXIT_CODE=$rc1c01
          UP1_NAV_C02_EXIT_CODE=$rc_nav_c02
          UP1_NAV_C01_EXIT_CODE=$rc_nav_c01
          CASE_FORMULA_K5_EXIT_CODE=$case_rc
          UP2_EXIT_CODE=$rc2
          PREFLIGHT_EXIT_CODE=$preflight_rc
          CLOSEOUT_COMMIT_INCLUDED_IN_UP2_LEDGER=NO (ledger captured at source SHA before this text-only report commit)
          OLD_FILES_MODIFIED=NO
          STATUS_MD_RELEASE_TAG_MODIFIED=NO
          ROM_EXE_DATA_BIN_BIOS_CHECKPOINT_CARD_RAM_DUMP_COMMITTED=NO
          CODE_FILES_ADDED:
          .github/workflows/up0-up2-audit.yml
          tools/stage1/RunUP0.py
          tools/stage1/RunUP1.py
          tools/stage1/RunUP2.py
          EOF
          mkdir -p "$OUT/UP1_C01"
          if [ ! -s "$OUT/UP1_C01_EXIT_CODE.txt" ]; then echo 2 > "$OUT/UP1_C01_EXIT_CODE.txt"; fi
          if [ ! -s "$OUT/UP1_C01_EXECUTION_LOG.txt" ]; then printf 'STATUS=BELUM\nREASON=C01 replay stage skipped\nEXIT_CODE=2\n' > "$OUT/UP1_C01_EXECUTION_LOG.txt"; fi
          if [ ! -s "$OUT/UP1_C01/UP1_SUMMARY.txt" ]; then printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=C01 summary missing\nEXIT_CODE=2\n' > "$OUT/UP1_C01/UP1_SUMMARY.txt"; fi
          for nav in C01 C02; do
            mkdir -p "$OUT/UP1_NAV_$nav"
            if [ ! -s "$OUT/UP1_NAV_$nav/UP1_SUMMARY.txt" ]; then printf 'STATUS=BELUM\nEVIDENCE=K0\nREASON=pad navigation summary missing\nEXIT_CODE=2\n' > "$OUT/UP1_NAV_$nav/UP1_SUMMARY.txt"; fi
            if [ ! -s "$OUT/UP1_NAV_${nav}_EXECUTION_LOG.txt" ]; then printf 'PAD_NAV_NOT_RUN\n' > "$OUT/UP1_NAV_${nav}_EXECUTION_LOG.txt"; fi
            if [ ! -s "$OUT/UP1_NAV_${nav}_EXIT_CODE.txt" ]; then echo 2 > "$OUT/UP1_NAV_${nav}_EXIT_CODE.txt"; fi
          done
          if [ ! -s "$OUT/UP1/UP1_CASE_FORMULA_K5.txt" ]; then printf 'BELUM\n' > "$OUT/UP1/UP1_CASE_FORMULA_K5.txt"; fi
          git fetch origin main
          git switch -C up-report-publish origin/main
          dest="reports/ui-audit-2026-11-13/up/run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dest"
          cp -R "$OUT/UP0" "$OUT/UP1" "$OUT/UP1_C01" "$OUT/UP1_NAV_C01" "$OUT/UP1_NAV_C02" "$OUT/UP2" "$OUT/PREFLIGHT" "$OUT/ACTIONS" "$dest/"
          cp "$OUT/UP0_EXECUTION_LOG.txt" "$OUT/UP1_EXECUTION_LOG.txt" "$OUT/UP1_C01_EXECUTION_LOG.txt" "$OUT/UP1_NAV_C01_EXECUTION_LOG.txt" "$OUT/UP1_NAV_C02_EXECUTION_LOG.txt" "$OUT/UP2_EXECUTION_LOG.txt" "$dest/"
          cp "$OUT/UP0_EXIT_CODE.txt" "$OUT/UP1_EXIT_CODE.txt" "$OUT/UP1_C01_EXIT_CODE.txt" "$OUT/UP1_NAV_C01_EXIT_CODE.txt" "$OUT/UP1_NAV_C02_EXIT_CODE.txt" "$OUT/UP2_EXIT_CODE.txt" "$dest/"
          cp "$OUT/UP_FINAL_CLOSEOUT.txt" "$dest/UP_FINAL_CLOSEOUT.txt"
          {
            echo "FILES_CHANGED_BY_RESULT_COMMIT:"
            find "$dest" -type f -print | sort
          } >> "$dest/UP_FINAL_CLOSEOUT.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record UP0-UP2 audit results for run $GITHUB_RUN_ID [skip ci]"
            pushed=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$n"
            done
            test "$pushed" -eq 1
          fi
          report_sha="$(git rev-parse HEAD)"
          raw_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$report_sha/$dest/ACTIONS/ACTIONS_RUN_SUMMARY.txt"
          {
            echo "UP_REPORT_COMMIT=$report_sha"
            echo "UP_ACTIONS_SUMMARY_RAW_URL=$raw_url"
            echo "OVERALL_STATUS=$status"
            echo "OVERALL_EXIT_CODE=$final_rc"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$final_rc"
