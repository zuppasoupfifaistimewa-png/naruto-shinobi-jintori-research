name: Naruto fastboot VRAM checkpoints

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/naruto-fastboot-vram-probe.yml"

permissions:
  contents: read

concurrency:
  group: naruto-fastboot-vram-probe
  cancel-in-progress: true

jobs:
  vram-probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - name: Install cloud runtime tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils libgl1-mesa-dri python3 python3-pil

      - name: Download and verify private runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/naruto-fastboot-vram-probe"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/home" "$WORK/captures/raw"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private release asset: $name"; exit 1; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset openbios.bin openbios-fastboot.bin
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          echo "25c789eb66608847907217c367f04a3ec6e62c08530e97c437ce99d29f4c156d  openbios-fastboot.bin" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          lines = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          ids = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "ROM, CUE, BIOS and pinned AnyLinux hashes/structure verified."

      - name: Capture PS1 VRAM checkpoints through the pinned PCSX-Redux Lua API
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          emu_pid=""
          cleanup() {
            if [ -n "$emu_pid" ]; then kill "$emu_pid" 2>/dev/null || true; fi
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1
          unset MESA_GL_VERSION_OVERRIDE MESA_GLSL_VERSION_OVERRIDE
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          echo "HOST_GL=software renderer requested; no GL/GLSL version override"
          glxinfo -B 2>/dev/null | grep -E 'OpenGL vendor string|OpenGL renderer string|OpenGL (core profile )?version string' || true

          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped")
          LUA
          )

          cat > "$WORK/vram-probe.lua" <<'LUA'
          local frame_count = 0
          local started = os.time()
          local checkpoints = {5,10,15,20,30,40,50,60,70,80}
          local next_checkpoint = 1

          local function capture_vram(target_s, elapsed_s)
              local ok, err = pcall(function()
                  local vram = PCSX.GPU.getVRAM()
                  local stem = string.format("vram-t%02d", target_s)
                  local raw = assert(Support.File.open("captures/raw/" .. stem .. ".raw", "TRUNCATE"))
                  raw:writeMoveSlice(vram)
                  raw:close()
                  local meta = assert(io.open("captures/raw/" .. stem .. ".json", "wb"))
                  meta:write(string.format(
                      '{"kind":"vram","checkpoint":"t%02d","elapsed_s":%d,"width":1024,"height":512,"bpp":16,"bytes":1048576,"guest_fps":%.4f}\n',
                      target_s, elapsed_s, PCSX.GPU.getGuestFPS()))
                  meta:close()
                  print(string.format("VRAM_CAPTURE status=ok checkpoint=t%02d elapsed_s=%d width=1024 height=512 bytes=1048576 guest_fps=%.4f",
                      target_s, elapsed_s, PCSX.GPU.getGuestFPS()))
              end)
              if not ok then
                  printError(string.format("VRAM_CAPTURE status=error checkpoint=t%02d elapsed_s=%d error=%s",
                      target_s, elapsed_s, tostring(err)))
              end
          end

          local function capture_screen(target_s, elapsed_s)
              local ok, err = pcall(function()
                  local shot = PCSX.GPU.takeScreenShot()
                  local bpp = (shot.bpp == 0) and 16 or 24
                  if shot.width <= 0 or shot.height <= 0 then
                      print(string.format("SCREEN_CAPTURE status=empty checkpoint=t%02d elapsed_s=%d width=%d height=%d bpp=%d",
                          target_s, elapsed_s, shot.width, shot.height, bpp))
                      return
                  end
                  local stem = string.format("screen-t%02d", target_s)
                  local raw = assert(Support.File.open("captures/raw/" .. stem .. ".raw", "TRUNCATE"))
                  raw:writeMoveSlice(shot.data)
                  raw:close()
                  local meta = assert(io.open("captures/raw/" .. stem .. ".json", "wb"))
                  meta:write(string.format(
                      '{"kind":"screen","checkpoint":"t%02d","elapsed_s":%d,"width":%d,"height":%d,"bpp":%d,"guest_fps":%.4f}\n',
                      target_s, elapsed_s, shot.width, shot.height, bpp, PCSX.GPU.getGuestFPS()))
                  meta:close()
                  print(string.format("SCREEN_CAPTURE status=ok checkpoint=t%02d elapsed_s=%d width=%d height=%d bpp=%d",
                      target_s, elapsed_s, shot.width, shot.height, bpp))
              end)
              if not ok then
                  printError(string.format("SCREEN_CAPTURE status=error checkpoint=t%02d elapsed_s=%d error=%s",
                      target_s, elapsed_s, tostring(err)))
              end
          end

          local function poll_time()
              local elapsed = os.time() - started
              if next_checkpoint <= #checkpoints and elapsed >= checkpoints[next_checkpoint] then
                  local target = checkpoints[next_checkpoint]
                  capture_vram(target, elapsed)
                  capture_screen(target, elapsed)
                  next_checkpoint = next_checkpoint + 1
              end
              if next_checkpoint <= #checkpoints then
                  PCSX.nextTick(poll_time)
              else
                  print("TIMED_CHECKPOINTS_COMPLETE=1")
                  PCSX.quit(0)
              end
          end

          vramProbeListener = PCSX.Events.createEventListener("GPU::Vsync", function()
              frame_count = frame_count + 1
              if frame_count % 300 == 0 then
                  print(string.format("VRAM_PROBE_VSYNC frame=%d guest_fps=%.4f", frame_count, PCSX.GPU.getGuestFPS()))
              end
          end)
          print("VRAM_PROBE=timed checkpoints 5,10,15,20,30,40,50,60,70,80 seconds")
          PCSX.nextTick(poll_time)
          LUA

          timeout --signal=TERM --kill-after=5s 90s \
            "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/openbios-fastboot.bin" -iso "$WORK/game-run.cue" \
              -exec "$PAD_SETUP" -dofile "$WORK/vram-probe.lua" \
              -no-debugger -no-gdb -dynarec -stdout -lua_stdout -logfile "$WORK/pcsx.log" -run \
              > "$WORK/pcsx.stdout" 2>&1 &
          emu_pid=$!
          set +e
          wait "$emu_pid"
          emu_rc=$?
          set -e
          emu_pid=""
          echo "EMULATOR_EXIT_CODE=$emu_rc"
          grep -E 'PAD_SETUP|VRAM_PROBE|VRAM_CAPTURE|SYSTEM.CNF|BOOT =|EXEC:PC0|Execute !|error|Error|ERROR' \
            "$WORK/pcsx.stdout" "$WORK/pcsx.log" > "$WORK/captures/important-log-lines.txt" || true
          cat "$WORK/captures/important-log-lines.txt" || true
          echo "VRAM_PROBE_EMULATOR_STEP_DONE=1"

      - name: Convert timed VRAM/screen captures privately and delete raw files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 - <<'PY'
          import hashlib, json, math
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path("captures")
          raw_dir = root / "raw"
          summary = []
          grouped = {"vram": [], "screen": []}

          for meta_path in sorted(raw_dir.glob("*.json")):
              try:
                  meta = json.loads(meta_path.read_text())
              except Exception as exc:
                  summary.append(f"invalid metadata {meta_path.name}: {exc}")
                  meta_path.unlink(missing_ok=True)
                  continue
              raw_path = meta_path.with_suffix(".raw")
              if not raw_path.exists():
                  summary.append(f"{meta.get('kind','unknown')} {meta.get('checkpoint','?')}: raw file missing")
                  meta_path.unlink(missing_ok=True)
                  continue
              raw = raw_path.read_bytes()
              width, height, bpp = int(meta["width"]), int(meta["height"]), int(meta["bpp"])
              expected = width * height * (bpp // 8)
              if width <= 0 or height <= 0 or bpp not in (16, 24) or len(raw) != expected:
                  summary.append(f"{meta.get('kind','unknown')} {meta.get('checkpoint','?')}: INVALID bytes={len(raw)} expected={expected}")
                  raw_path.unlink(missing_ok=True)
                  meta_path.unlink(missing_ok=True)
                  continue

              if bpp == 16:
                  rgb = bytearray()
                  nonblack = 0
                  unique = set()
                  for i in range(0, len(raw), 2):
                      value = raw[i] | (raw[i + 1] << 8)
                      r = (value & 31) * 255 // 31
                      g = ((value >> 5) & 31) * 255 // 31
                      b = ((value >> 10) & 31) * 255 // 31
                      rgb.extend((r, g, b))
                      unique.add(value & 0x7fff)
                      if (value & 0x7fff) != 0:
                          nonblack += 1
                  pixels = bytes(rgb)
                  unique_count = len(unique)
                  nonblack_ratio = nonblack / (width * height)
              else:
                  pixels = raw
                  triples = [tuple(raw[i:i+3]) for i in range(0, len(raw), 3)]
                  unique_count = len(set(triples))
                  nonblack_ratio = sum(1 for r,g,b in triples if r > 8 or g > 8 or b > 8) / (width * height)

              img = Image.frombytes("RGB", (width, height), pixels)
              kind = meta.get("kind", "unknown")
              checkpoint = meta.get("checkpoint", meta_path.stem)
              png_path = root / f"{kind}-{checkpoint}.png"
              img.save(png_path)
              digest = hashlib.sha256(png_path.read_bytes()).hexdigest()
              summary.append(
                  f"kind={kind} checkpoint={checkpoint} elapsed_s={meta.get('elapsed_s','?')} "
                  f"size={width}x{height} bpp={bpp} raw_bytes={len(raw)} "
                  f"unique_colors={unique_count} nonblack_ratio={nonblack_ratio:.6f} "
                  f"guest_fps={meta.get('guest_fps',0):.2f} png_sha256={digest}"
              )
              thumb = img.copy()
              thumb.thumbnail((340, 190), Image.Resampling.NEAREST)
              grouped.setdefault(kind, []).append((str(checkpoint), thumb))
              raw_path.unlink(missing_ok=True)
              meta_path.unlink(missing_ok=True)

          # Clean up orphaned raw bytes too; raw data is never included in uploaded artifacts.
          for path in raw_dir.iterdir():
              if path.is_file():
                  if path.suffix == ".raw":
                      summary.append(f"orphan raw file removed: {path.name}")
                  path.unlink(missing_ok=True)
              elif path.is_dir():
                  import shutil
                  shutil.rmtree(path)
          raw_dir.rmdir()

          for kind, images in grouped.items():
              if not images:
                  continue
              images.sort(key=lambda item: item[0])
              cols = 2
              rows = math.ceil(len(images) / cols)
              sheet = Image.new("RGB", (cols * 360, rows * 225), (24, 24, 24))
              draw = ImageDraw.Draw(sheet)
              for i, (label, img) in enumerate(images):
                  x, y = (i % cols) * 360, (i // cols) * 225
                  draw.text((x + 8, y + 6), f"{kind} checkpoint {label}", fill=(255, 255, 255))
                  sheet.paste(img, (x + 8, y + 26))
              sheet.save(root / f"{kind}-contact-sheet.png")

          if not summary:
              summary.append("NO_VALID_TIMED_CAPTURES")
          (root / "vram-summary.txt").write_text("\n".join(summary) + "\n")
          print("\n".join(summary))
          print("RAW_VRAM_AND_SCREEN_BYTES_REMOVED=1")
          PY

      - name: Upload only private PNG diagnostics and summary (no raw VRAM or traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-private-vram-png-checkpoints
          path: |
            ${{ env.WORK }}/captures/*.png
            ${{ env.WORK }}/captures/vram-summary.txt
            ${{ env.WORK }}/captures/important-log-lines.txt
          if-no-files-found: warn
          retention-days: 1
