name: UE0–UE2 — immutable byte gate, ENTRY1 scene audit and read-only trace

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ub2-headless-trace.yml"
      - "experiments/ub2_headless_trace.py"
      - "experiments/uc0_uc1_static_audit.py"
      - "experiments/uc0_uc1_uc2_probe.py"
      - "experiments/ud1_static_audit.py"
      - "tools/union_gate.py"
      - "tools/ue0_union_gate.py"
      - "experiments/ue1_entry1_scene_audit.py"
      - "experiments/ue2_scene_trace.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-ub2-headless-trace
  cancel-in-progress: true

jobs:
  ub2-headless-trace:
    name: UE0/UE1 static audit and six 900-frame read-only launches
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_REPO: ${{ github.repository }}
      WORK: /tmp/naruto-ue2-${{ github.run_id }}-${{ github.run_attempt }}
      OUT: /tmp/naruto-ue2-output-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Allocate private workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK"/{source,checkpoint,app,logs,card-template,output}
          mkdir -p "$OUT"

      - name: Download immutable adaptive-cycle-02-f180 source artifact
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: "39907655833"
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}/checkpoint

      - name: Download and verify emulator, game disc and retail BIOS
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/source"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; dest="$2"; size="$3"; digest="$4"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 600 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$dest"
            test "$(stat -c %s "$dest")" = "$size"
            echo "$digest  $dest" | sha256sum --check -
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage 65747557 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin 325989552 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue 116 be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8
          fetch_asset scph7502.zip scph7502.zip 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              found=[]; total=0
              for x in z.infolist():
                  p=Path(x.filename); mode=(x.external_attr>>16)&0xffff; total+=x.file_size
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("unsafe BIOS member")
                  if x.file_size>2*1024*1024 or total>4*1024*1024:
                      raise SystemExit("BIOS expansion bound")
                  if not x.is_dir() and x.file_size==524288: found.append(x)
              if len(found)!=1: raise SystemExit("expected one BIOS-sized member")
              bios=z.read(found[0])
              digest=hashlib.sha256(bios).hexdigest()
              if digest!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1":
                  raise SystemExit("BIOS SHA256 mismatch")
              Path("scph7502.bin").write_bytes(bios)
          lines=Path("game.cue").read_text(encoding="utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,s in enumerate(lines) if s.strip().upper().startswith("FILE ")]
          if len(ix)!=1: raise SystemExit("expected one CUE FILE row")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          APPDIR="$WORK/source/squashfs-root"
          test -x "$APPDIR/AppRun"
          PCSX_BIN="$(find -L "$APPDIR" -maxdepth 8 -type f -perm /111 | grep -E '/(pcsx-redux|pcsx-redux[^/]*)$' | head -n 1)"
          test -n "$PCSX_BIN" && test -x "$PCSX_BIN"
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"
          echo "PCSX_BIN=$PCSX_BIN" >> "$GITHUB_ENV"
          echo "UB2_INPUTS_VERIFIED=YES" >> "$GITHUB_ENV"

      - name: Verify exact checkpoint bytes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$WORK/checkpoint/adaptive-cycle-02-f180.sstate"
          test -f "$SOURCE"
          test "$(stat -c %s "$SOURCE")" = 21162799
          echo "705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35  $SOURCE" | sha256sum --check -
          cp "$SOURCE" "$WORK/source-checkpoint.sstate"
          chmod 400 "$WORK/source-checkpoint.sstate"
          echo "UB2_CHECKPOINT_SOURCE=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Install static extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bchunk xorriso python3-pip
          python3 -m pip install --break-system-packages "capstone==5.0.3"

      - name: UE0 — archive exact baseline and run immutable byte union gate
        shell: bash
        run: |
          set -euo pipefail
          UE0_BASELINE="9a6ccb7969a8cf377006dba01f468fb2c9dc4b05"
          BASELINE_TSV="$WORK/ue0-baseline-tsv"
          mkdir -p "$BASELINE_TSV"
          git archive --format=tar "$UE0_BASELINE" -- '*.tsv' | tar -xf - -C "$BASELINE_TSV"
          test "$(find "$BASELINE_TSV" -type f -name '*.tsv' | wc -l)" -gt 0
          set +e
          python3 tools/ue0_union_gate.py --root "$BASELINE_TSV" --out "$OUT" --baseline "$UE0_BASELINE"
          ue0_rc=$?
          set -e
          echo "$ue0_rc" > "$OUT/UE0_GATE_EXIT_CODE.txt"
          echo "UE0_BASELINE=$UE0_BASELINE" >> "$GITHUB_STEP_SUMMARY"
          echo "UE0_GATE_EXIT_CODE=$ue0_rc" >> "$GITHUB_STEP_SUMMARY"

      - name: UE1 — verify scene chain and references in complete ENTRY1 only
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/ue1_entry1_scene_audit.py --data "$DATA" --out "$OUT"

      - name: UE2 — local post-processing regression test on committed UD logs
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/ue2_scene_trace.py \
            --postprocess-self-test \
            --reports "$GITHUB_WORKSPACE/reports/stage1_economy/ud0-ud2-run-42789941079/attempt-1" \
            --out "$OUT"

      - name: UE2 — six read-only headless launches, seven breakpoints
        id: ue2-probe
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set +e
          python3 experiments/ue2_scene_trace.py \
            --work "$WORK" \
            --out "$OUT" \
            --pcsx-bin "$PCSX_BIN" \
            --appdir "$APPDIR" \
            --bios "$WORK/source/scph7502.bin" \
            --cue "$WORK/source/game-run.cue" \
            --source "$WORK/source-checkpoint.sstate" \
            --card-dir "$WORK/card-template" \
            --timeout-seconds 180
          rc=$?
          set -e
          echo "$rc" | tee "$OUT/UE2_SCRIPT_EXIT_CODE.txt"
          exit "$rc"

      - name: Remove private ROM, BIOS, checkpoint, card and emulator state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          test ! -e "$WORK"
          echo "PRIVATE_BINARY_CLEANUP=PASS" > "$OUT/cleanup.txt"

      - name: Validate and publish only UE0–UE2 text results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          UE0_RC="$(cat "$OUT/UE0_GATE_EXIT_CODE.txt" 2>/dev/null || echo 1)"
          UE2_RC="$(cat "$OUT/UE2_SCRIPT_EXIT_CODE.txt" 2>/dev/null || echo 1)"
          case "$UE0_RC:$UE2_RC" in
            0:0) STATUS="completed/success"; FINAL_RC=0 ;;
            *) STATUS="completed/failure"; FINAL_RC=1 ;;
          esac
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          allowed={".txt",".tsv"}
          bad=[str(p) for p in root.rglob("*") if p.is_file() and p.suffix.lower() not in allowed]
          if bad: raise SystemExit("private/non-text result blocked: "+repr(bad))
          PY
          DEST="reports/stage1_economy/ue0-ue2-run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          cp "$OUT"/*.txt "$DEST/" 2>/dev/null || true
          cp "$OUT"/*.tsv "$DEST/" 2>/dev/null || true
          JOB_ID="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$RESEARCH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" |
            jq -r '.jobs[0].id // empty' | head -n 1)"
          test -n "$JOB_ID" || JOB_ID="TIDAK_TAHU"
          {
            echo "STATUS=$STATUS"
            echo "JOB=UE0/UE1 static audit and UE2 six-launch read-only trace"
            echo "JOB_ID=$JOB_ID"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "UE0_EXIT_CODE=$UE0_RC"
            echo "UE2_EXIT_CODE=$UE2_RC"
            echo "EXIT_CODE=$FINAL_RC"
          } > "$DEST/ACTIONS_RUN_SUMMARY.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Publish UE0-UE2 audit and read-only trace run $GITHUB_RUN_ID [skip ci]"
            pushed=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$n"
            done
            test "$pushed" -eq 1
          fi
          echo "UE0_UE2_REPORT_PATH=$DEST"
          exit "$FINAL_RC"
