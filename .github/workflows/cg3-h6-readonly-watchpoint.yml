name: CG3 — H6 read-only 0xEA8 write-watchpoint, two launches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cg3-h6-readonly-watchpoint.yml"
      - "experiments/cg3_h6_readonly_watchpoint.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-cg3-h6-readonly-watchpoint
  cancel-in-progress: false

jobs:
  cg3-h6-readonly-watchpoint:
    name: CG3 two independent PCSX-Redux H6 read-only launches
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_REPO: ${{ github.repository }}
      WORK: /tmp/naruto-cg3-${{ github.run_id }}-${{ github.run_attempt }}
      TIMEOUT_SECONDS: "3600"
    steps:
      - name: Checkout research scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Allocate private work and text output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK"/{source,inputs,resume,logs,home}
          mkdir -p "$RUNNER_TEMP/cg3-output"
          echo "OUTDIR=$RUNNER_TEMP/cg3-output" >> "$GITHUB_ENV"

      - name: Install bounded headless utilities
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq python3 xvfb x11-utils curl git unzip

      - name: Download and verify private game inputs, BIOS, and target checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/source"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"; bytes="$3"; digest="$4"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 600 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$out"
            test "$(stat -c %s "$out")" = "$bytes"
            echo "$digest  $out" | sha256sum --check -
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin 325989552 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue 116 be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8
          fetch_asset scph7502.zip scph7502.zip 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/686794219" -o target.sstate
          test "$(stat -c %s target.sstate)" = 21163286
          echo "00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d  target.sstate" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              found=[]; total=0
              for x in z.infolist():
                  p=Path(x.filename); mode=(x.external_attr>>16)&0xffff; total+=x.file_size
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS member")
                  if x.file_size>2*1024*1024 or total>4*1024*1024: raise SystemExit("BIOS expansion bound")
                  if not x.is_dir() and x.file_size==524288: found.append(x)
              if len(found)!=1: raise SystemExit("expected one BIOS-sized member")
              data=z.read(found[0])
              if hashlib.sha256(data).hexdigest()!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS SHA mismatch")
              Path("scph7502.bin").write_bytes(data)
          lines=Path("game.cue").read_text(encoding="utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          idx=[i for i,s in enumerate(lines) if s.strip().upper().startswith("FILE ")]
          if len(idx)!=1: raise SystemExit("expected one CUE FILE row")
          lines[idx[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          cp target.sstate "$WORK/resume/target.sstate"
          chmod 400 "$WORK/resume/target.sstate"
          echo "TARGET_STATE_SHA256=00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d" | tee "$WORK/source-input-manifest.txt"

      - name: Download previously verified CONTROL checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: "39867730674"
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}/inputs

      - name: Verify CONTROL checkpoint and extract pinned PCSX-Redux
        shell: bash
        run: |
          set -euo pipefail
          cp "$(find "$WORK/inputs" -type f -name adaptive-cycle-01-f180.sstate -print -quit)" "$WORK/resume/control.sstate"
          test "$(stat -c %s "$WORK/resume/control.sstate")" = 21162546
          echo "9eef83b1590773159b95180447aaa1f35139468b3ea51c7beec00bfb89f41492  $WORK/resume/control.sstate" | sha256sum --check -
          cd "$WORK/source"
          asset_name="PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage"
          asset_id="$(jq -r --arg name "$asset_name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
          test -n "$asset_id" && test "$asset_id" != null
          curl --fail --silent --show-error --location --retry 2 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$RESEARCH_REPO/releases/assets/$asset_id" -o pcsx-redux.AppImage
          test "$(stat -c %s pcsx-redux.AppImage)" = 65747557
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          APPDIR="$WORK/source/squashfs-root"
          PCSX_BIN="$(find -L "$APPDIR" -maxdepth 8 -type f -perm /111 | grep -E '/(pcsx-redux|pcsx-redux[^/]*)$' | head -n 1)"
          test -n "$PCSX_BIN" && test -x "$PCSX_BIN"
          CAPSTONE_FILE="$(find -L "$APPDIR" -type f -name 'libcapstone.so.5' -print -quit)"
          mkdir -p "$WORK/capstone" "$WORK/ffmpeg-libs"
          test -n "$CAPSTONE_FILE"
          cp "$CAPSTONE_FILE" "$WORK/capstone/libcapstone.so.5"
          while IFS= read -r -d '' f; do
            cp -L "$f" "$WORK/ffmpeg-libs/$(basename "$f")"
          done < <(find -L "$APPDIR" -type f \( -name 'libav*.so*' -o -name 'libsw*.so*' -o -name 'libpostproc.so*' \) -print0)
          test -s "$WORK/ffmpeg-libs/libavformat.so.63"
          {
            echo "PCSX_RELEASE_ASSET=$asset_name"
            echo "PCSX_RELEASE_SHA256=c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c"
            echo "PCSX_SOURCE_COMMIT=0c3572c3db75f97542001e453ae80ba8c3f8acba"
            echo "PCSX_CPU=INTERPRETER"
            echo "PCSX_DEBUGGER=ENABLED"
            echo "PCSX_LUA_WRITE_WATCHPOINT=ENABLED"
          } > "$OUTDIR/CG3_PCSX_MANIFEST.txt"
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"
          echo "PCSX_BIN=$PCSX_BIN" >> "$GITHUB_ENV"

      - name: Start headless display and run two read-only H6 launches
        id: cg3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/logs"
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/logs/xvfb.txt" 2>&1 &
          echo $! > "$WORK/xvfb.pid"
          export DISPLAY=:99
          for n in $(seq 1 80); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          python3 -m py_compile experiments/aj2_h6_ram_probe.py experiments/cg3_h6_readonly_watchpoint.py
          set +e
          python3 experiments/cg3_h6_readonly_watchpoint.py \
            --target "$WORK/resume/target.sstate" --control "$WORK/resume/control.sstate" \
            --pcsx-bin "$PCSX_BIN" --appdir "$APPDIR" --bios "$WORK/source/scph7502.bin" \
            --cue "$WORK/source/game-run.cue" --work "$WORK" --out "$OUTDIR" \
            --timeout-seconds "$TIMEOUT_SECONDS" > "$OUTDIR/CG3_PYTHON_DRIVER_RAW.txt" 2>&1
          rc=$?
          set -e
          echo "WORKFLOW_SCRIPT_EXIT_CODE=$rc" >> "$OUTDIR/CG3_PCSX_MANIFEST.txt"
          if [ ! -s "$OUTDIR/ACTIONS_RUN_SUMMARY.txt" ]; then
            {
              echo "STATUS=FAILURE"
              echo "JOB=cg3-h6-readonly-watchpoint"
              echo "RUN_ID=$GITHUB_RUN_ID"
              echo "SOURCE_SHA=$GITHUB_SHA"
              echo "EXIT_CODE=$rc"
              echo "H6_SHA256=d57b626100d1023e8f63ec2c7d559bffcfd152453b1affc36032c1d642ee3475"
            } > "$OUTDIR/ACTIONS_RUN_SUMMARY.txt"
          fi
          echo "RUNNER_SCRIPT_EXIT_CODE=$rc"

      - name: Remove private game, BIOS, checkpoints, and temporary RAM
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          test ! -e "$WORK"
          echo "PRIVATE_INPUT_AND_RAM_CLEANUP=PASS" >> "$OUTDIR/CG3_PCSX_MANIFEST.txt" 2>/dev/null || true

      - name: Validate text-only report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          python3 - "$OUTDIR" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          files=[p for p in root.rglob("*") if p.is_file()]
          bad=[str(p) for p in files if p.suffix.lower() not in {".txt",".tsv"} or p.stat().st_size>20000000]
          if bad: raise SystemExit("non-text/oversized report files: "+repr(bad))
          if not (root/"ACTIONS_RUN_SUMMARY.txt").is_file(): raise SystemExit("missing Actions summary")
          print("CG3_TEXT_ONLY_REPORT=PASS files="+str(len(files)))
          PY

      - name: Commit text summary and raw logs to research repo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dest="reports/stage1_economy/cg3-h6-readonly-run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dest"
          for f in "$OUTDIR"/*.txt "$OUTDIR"/*.tsv; do
            [ -f "$f" ] || continue
            cp "$f" "$dest/"
          done
          if [ ! -s "$dest/ACTIONS_RUN_SUMMARY.txt" ]; then
            {
              echo "STATUS=FAILURE"
              echo "JOB=cg3-h6-readonly-watchpoint"
              echo "RUN_ID=$GITHUB_RUN_ID"
              echo "SOURCE_SHA=$GITHUB_SHA"
              echo "EXIT_CODE=TIDAK TAHU"
            } > "$dest/ACTIONS_RUN_SUMMARY.txt"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Publish CG3 H6 read-only watchpoint run $GITHUB_RUN_ID"
            pushed=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$n"
            done
            test "$pushed" -eq 1
          fi
          echo "CG3_REPORT_PATH=$dest"
