name: Build OpenBIOS for PS1 research

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-openbios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-openbios:
    name: Build OpenBIOS from PCSX-Redux source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PCSX-Redux source at the package source commit
        uses: actions/checkout@v4
        with:
          repository: grumpycoders/pcsx-redux
          ref: 0c3572c3db75f97542001e453ae80ba8c3f8acba
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Build the open-source PS1 BIOS replacement
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          mkdir -p "$GITHUB_WORKSPACE/dist/openbios"
          # Build the normal shell/menu variant first.
          ./dockermake.sh -C src/mips/openbios
          test -s src/mips/openbios/openbios.bin
          test -s src/mips/openbios/openbios.elf
          cp src/mips/openbios/openbios.bin "$GITHUB_WORKSPACE/dist/openbios/openbios-shell.bin"
          cp src/mips/openbios/openbios.elf "$GITHUB_WORKSPACE/dist/openbios/openbios-shell.elf"

          # Build a second version that skips the BIOS shell and auto-boots the inserted CD.
          ./dockermake.sh -C src/mips/openbios clean
          ./dockermake.sh -C src/mips/openbios BOOT_MODE=fast
          test -s src/mips/openbios/openbios.bin
          test -s src/mips/openbios/openbios.elf
          cp src/mips/openbios/openbios.bin "$GITHUB_WORKSPACE/dist/openbios/openbios.bin"
          cp src/mips/openbios/openbios.elf "$GITHUB_WORKSPACE/dist/openbios/openbios.elf"

          # Experimental third variant: read the main EXE in 8-sector chunks
          # and log each read result so a repeat test shows the exact stall point.
          ./dockermake.sh -C src/mips/openbios clean
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import os
          p = Path("src/mips/openbios/kernel/psxexe.c")
          original = p.read_text()
          old = "    syscall_read(fd, (char *)header->text_addr, header->text_size);"
          new = """    uint32_t remaining = header->text_size;
              char *destination = (char *)header->text_addr;
              unsigned chunkIndex = 0;
              psxprintf("[CHUNK8] begin text_size=%08x\\n", remaining);
              while (remaining > 0) {
                  int chunk = remaining > (8 * 2048) ? (8 * 2048) : (int)remaining;
                  uint32_t offset = header->text_size - remaining;
                  psxprintf("[CHUNK8] before idx=%u offset=%08x bytes=%d\\n", chunkIndex, offset, chunk);
                  int got = syscall_read(fd, destination, chunk);
                  psxprintf("[CHUNK8] after idx=%u got=%d\\n", chunkIndex, got);
                  if (got != chunk) {
                      syscall_close(fd);
                      return 0;
                  }
                  destination += chunk;
                  remaining -= chunk;
                  chunkIndex++;
              }
              psxprintf("[CHUNK8] done chunks=%u\\n", chunkIndex);"""
          if original.count(old) != 1:
              raise SystemExit("Expected exactly one stock EXE payload read to patch")
          patched = original.replace(old, new)
          dist = Path(os.environ["GITHUB_WORKSPACE"]) / "dist" / "openbios"
          dist.mkdir(exist_ok=True)
          (dist / "OPENBIOS-CHUNKED-PATCH.diff").write_text(
              "".join(difflib.unified_diff(
                  original.splitlines(keepends=True),
                  patched.splitlines(keepends=True),
                  fromfile="a/openbios/kernel/psxexe.c",
                  tofile="b/openbios/kernel/psxexe.c"
              ))
          )
          p.write_text(patched)
          PY
          ./dockermake.sh -C src/mips/openbios BOOT_MODE=fast
          test -s src/mips/openbios/openbios.bin
          test -s src/mips/openbios/openbios.elf
          cp src/mips/openbios/openbios.bin "$GITHUB_WORKSPACE/dist/openbios/openbios-chunked.bin"
          cp src/mips/openbios/openbios.elf "$GITHUB_WORKSPACE/dist/openbios/openbios-chunked.elf"

          cd "$GITHUB_WORKSPACE/dist/openbios"
          sha256sum openbios.bin openbios.elf openbios-shell.bin openbios-shell.elf openbios-chunked.bin openbios-chunked.elf > OPENBIOS-SHA256SUMS
          cat > OPENBIOS-SOURCE.txt <<'INFO'
          OpenBIOS builds for the PCSX-Redux PS1 emulator

          Both files are open-source BIOS replacements, not retail Sony PlayStation BIOS dumps.
          Upstream project: https://github.com/grumpycoders/pcsx-redux
          Upstream source commit: 0c3572c3db75f97542001e453ae80ba8c3f8acba
          Source submodule: https://github.com/pcsx-redux/nugget
          Default build: ./dockermake.sh -C src/mips/openbios
          Fast CD boot build: ./dockermake.sh -C src/mips/openbios BOOT_MODE=fast
          Official documentation: https://pcsx-redux.consoledev.net/openbios/
          openbios.bin / openbios.elf use BOOT_MODE=fast to skip the shell and attempt CD-ROM boot.
          openbios-shell.bin / openbios-shell.elf retain the OpenBIOS shell/menu behavior.
          openbios-chunked.bin / openbios-chunked.elf are experimental fastboot build that reads EXE payload in 8-sector chunks and logs progress after each read.
          INFO
          file openbios.bin openbios.elf openbios-shell.bin openbios-shell.elf openbios-chunked.bin openbios-chunked.elf
          cat OPENBIOS-SHA256SUMS

      - name: Upload OpenBIOS build for this run
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-redux-openbios-linux-2026-10-15
          path: |
            dist/openbios/openbios.bin
            dist/openbios/openbios.elf
            dist/openbios/OPENBIOS-SHA256SUMS
            dist/openbios/OPENBIOS-SOURCE.txt
            dist/openbios/openbios-shell.bin
            dist/openbios/openbios-shell.elf
            dist/openbios/openbios-chunked.bin
            dist/openbios/openbios-chunked.elf
            dist/openbios/OPENBIOS-CHUNKED-PATCH.diff
          if-no-files-found: error
          retention-days: 90

  publish-openbios:
    name: Attach OpenBIOS to research emulator release
    needs: build-openbios
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout research docs
        uses: actions/checkout@v4

      - name: Download OpenBIOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: pcsx-redux-openbios-linux-2026-10-15
          path: dist/openbios

      - name: Prepare release information
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/openbios/openbios.bin
          test -s dist/openbios/openbios.elf
          test -s dist/openbios/openbios-shell.bin
          test -s dist/openbios/openbios-shell.elf
          test -s dist/openbios/openbios-chunked.bin
          test -s dist/openbios/openbios-chunked.elf
          (cd dist/openbios && sha256sum --check OPENBIOS-SHA256SUMS)
          cat > dist/EMULATOR-ASSET-INFO.txt <<'INFO'
          PCSX-Redux research kit for Naruto Shinobi Jintori (PS1)

          Emulator: PCSX-Redux Linux x86_64 unofficial AppImage
          Package source: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/tag/0c3572c3d%402026-10-01_1790876682
          Emulator AppImage SHA-256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c

          BIOS replacements: openbios.bin is stock BOOT_MODE=fast (skip shell and attempt CD-ROM boot); openbios-shell.bin retains the normal OpenBIOS shell/menu; openbios-chunked.bin is an experimental fastboot variant that chunks EXE payload reads into 8 sectors per read.
          Both are built from the open-source PCSX-Redux project source commit 0c3572c3db75f97542001e453ae80ba8c3f8acba. OpenBIOS is not a retail Sony BIOS. Source and build directions: https://github.com/grumpycoders/pcsx-redux and https://pcsx-redux.consoledev.net/openbios/
          BIOS assets and their checksums are separate release assets; the AppImage itself does not include a BIOS configured for this game.

          No Naruto ROM/ISO, game assets, retail BIOS, memory card, save state, or memory dump is bundled here.
          The earlier GUI smoke test reached the PCSX-Redux interface but showed "No BIOS loaded"; no Naruto gameplay boot has been confirmed.
          INFO
          cat > dist/RELEASE-NOTES.md <<'NOTES'
          ## PS1 research kit — PCSX-Redux + OpenBIOS

          This prerelease stores a hash-verified Linux x86_64 emulator AppImage and an OpenBIOS replacement built from the open-source PCSX-Redux source.

          - Emulator AppImage: PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage (65,747,557 bytes; SHA-256 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c).
          - openbios.bin/openbios.elf: open-source OpenBIOS built with BOOT_MODE=fast to skip the shell and attempt CD-ROM boot.
          - openbios-shell.bin/openbios-shell.elf: default shell/menu build for manual selection.
          - openbios-chunked.bin/openbios-chunked.elf: experimental fastboot BIOS with a small source patch making loadExe read the payload in 8-sector chunks and log each read instead of one large CdRead request; source patch is attached as OPENBIOS-CHUNKED-PATCH.diff.
          - OpenBIOS is not a retail Sony BIOS; source commit 0c3572c3db75f97542001e453ae80ba8c3f8acba. Verify both variants with OPENBIOS-SHA256SUMS.
          - Upstream emulator: https://github.com/grumpycoders/pcsx-redux (GPL-2.0).
          - AppImage packaging source: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced (MIT).
          - OpenBIOS documentation: https://pcsx-redux.consoledev.net/openbios/
          - Launching the emulator GUI under Xvfb was observed; the first screen indicated no BIOS configured. This release adds OpenBIOS for that next step, but does not claim that the Naruto game has booted or that gameplay was tested.

          The release does not include a game ROM/ISO, game assets, a retail BIOS, memory card, save state, or RAM dump.
          NOTES

      - name: Update research prerelease notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: research-emulator-pcsx-redux-2026-10-15
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Research Tool: PCSX-Redux + OpenBIOS (Linux x86_64)" \
              --notes-file dist/RELEASE-NOTES.md
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Research Tool: PCSX-Redux + OpenBIOS (Linux x86_64)" \
              --notes-file dist/RELEASE-NOTES.md \
              --prerelease
          fi
          gh release upload "$TAG_NAME" \
            dist/openbios/openbios.bin \
            dist/openbios/openbios.elf \
            dist/openbios/OPENBIOS-SHA256SUMS \
            dist/openbios/OPENBIOS-SOURCE.txt \
            dist/openbios/openbios-shell.bin \
            dist/openbios/openbios-shell.elf \
            dist/openbios/openbios-chunked.bin \
            dist/openbios/openbios-chunked.elf \
            dist/openbios/OPENBIOS-CHUNKED-PATCH.diff \
            dist/EMULATOR-ASSET-INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload a long-term trace artifact for future chats
        uses: actions/upload-artifact@v4
        with:
          name: naruto-research-runtime-kit-2026-10-15
          path: |
            dist/openbios/openbios.bin
            dist/openbios/openbios.elf
            dist/openbios/OPENBIOS-SHA256SUMS
            dist/openbios/OPENBIOS-SOURCE.txt
            dist/openbios/openbios-shell.bin
            dist/openbios/openbios-shell.elf
            dist/openbios/openbios-chunked.bin
            dist/openbios/openbios-chunked.elf
            dist/openbios/OPENBIOS-CHUNKED-PATCH.diff
            dist/EMULATOR-ASSET-INFO.txt
          if-no-files-found: error
          retention-days: 90
