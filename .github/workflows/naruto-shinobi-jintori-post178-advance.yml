name: Naruto Story Mode post-f178 continuation probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-post178-advance"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-POST178-ADVANCE]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-post178
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research workflow
        uses: actions/checkout@v4

      - name: Install screenshot tools and prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil xvfb x11-utils curl unzip
          mkdir -p "$WORK"/{build-artifact,state-artifact,card-artifact,cards,resume,captures/raw,home,.config,.data,runtime,app}

      - name: Download already-built patched emulator from control probe
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-post178/build-artifact

      - name: Download verified parent checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-spu-sentinel-fix-probe-private
          run-id: 39426068247
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-post178/state-artifact

      - name: Download private derived checkpoint from the previous run
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-circle-followup-private
          run-id: 39530526794
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-post178/derived-artifact

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-post178/card-artifact

      - name: Validate derived checkpoint, immutable parent, binary and card
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          PARENT="$WORK/state-artifact/captures/storymode-checkpoint-next.raw.sstate"
          PARENT_MANIFEST="$WORK/state-artifact/captures/probe-manifest.txt"
          DERIVED="$WORK/derived-artifact/confirmed-checkpoint.raw.sstate"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$PARENT")" = 21162405
          test "$(sha256sum "$PARENT" | cut -d ' ' -f1)" = b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a
          grep -q '^PROBE_NEXT_CHECKPOINT_VALID=PASS$' "$PARENT_MANIFEST"
          grep -q '^PROBE_CONTROLLER_INPUT=none$' "$PARENT_MANIFEST"
          test "$(stat -c %s "$DERIVED")" = 21162838
          test "$(sha256sum "$DERIVED" | cut -d ' ' -f1)" = a87529407736b1b7648785db8644d3c10f0b8d5d12f1557c63d9a3155b22fa83
          grep -q '^CIRCLE_FOLLOWUP_CONFIRMED_STATE_BYTES=21162838$' "$WORK/derived-artifact/confirmation-checkpoint-manifest.txt"
          grep -q '^CIRCLE_FOLLOWUP_CONFIRMED_STATE_SHA256=a87529407736b1b7648785db8644d3c10f0b8d5d12f1557c63d9a3155b22fa83$' "$WORK/derived-artifact/confirmation-checkpoint-manifest.txt"
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$PARENT" "$WORK/resume/parent-checkpoint.sstate"
          cp "$DERIVED" "$WORK/resume/derived-checkpoint.sstate"
          sha256sum "$WORK/resume/parent-checkpoint.sstate" "$WORK/resume/derived-checkpoint.sstate" | tee "$WORK/captures/checkpoint-validation.txt"
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          echo "POST178_BINARY_VALID=PASS"
          echo "POST178_PARENT_CHECKPOINT_VALID=PASS bytes=21162405 sha256=b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a"
          echo "POST178_DERIVED_CHECKPOINT_VALID=PASS bytes=21162838 sha256=a87529407736b1b7648785db8644d3c10f0b8d5d12f1557c63d9a3155b22fa83"
          echo "POST178_MEMORY_CARD_VALID=PASS"
          echo "POST178_PARENT_AND_DERIVED_FILES_ARE_SEPARATE=PASS"

      - name: Download game and BIOS from the private runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0]); h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("POST178_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Create stable post-confirm checkpoint, restore in fresh processes, and compare controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          mkdir -p "$WORK/runtime"
          chmod 700 "$WORK/runtime"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null

          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("POSTCONF_PAD_SETUP=PASS")
          LUA
          )

          cat > "$WORK/create-stable-checkpoint.lua" <<'LUA'
          local frame=0
          local started=false
          local returned=false
          local loaded=false
          local captures={[1]=true,[10]=true,[30]=true,[60]=true,[62]=true}
          local pad=PCSX.SIO0.slots[1].pads[1]
          local function log(s) print(s); io.stdout:flush() end
          local function shot(f)
              local s=PCSX.GPU.takeScreenShot()
              assert(s and s.width>=100 and s.height>=100 and s.data,"invalid screenshot")
              local bpp=(s.bpp==0) and 16 or 24
              local label="STABILIZE-f"..string.format("%03d",f)
              local rawpath="captures/raw/"..label..".raw"
              local raw=assert(Support.File.open(rawpath,"TRUNCATE")); raw:writeMoveSlice(s.data); raw:close()
              local m=assert(io.open("captures/"..label..".json","wb"))
              m:write(string.format('{"label":"%s","raw":"%s","width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',label,rawpath,s.width,s.height,bpp,s.width*s.height*bpp/8)); m:close()
              log(string.format("POSTCONF_SCREENSHOT label=%s width=%d height=%d",label,s.width,s.height))
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("POSTCONF_SOURCE_LOAD_EVENT=PASS")
          end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not started then
                  started=true; log("POSTCONF_SOURCE_LOAD_BEGIN=1"); PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/derived-checkpoint.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("POSTCONF_SOURCE_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      returned=true; log("POSTCONF_SOURCE_LOAD_RETURNED=1"); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not returned then return end
              frame=frame+1
              if captures[frame] then shot(frame) end
              if frame==62 then
                  log("POSTCONF_STABLE_SAVE_BEGIN frame=62 no_input=true")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local ok,state=pcall(function() return PCSX.createSaveState() end)
                      if not ok or not state then
                          log("POSTCONF_STABLE_SAVE_ERROR="..tostring(state)); PCSX.quit(71); return
                      end
                      local opened,file=pcall(function()
                          return assert(Support.File.open("captures/stable-postconfirm-checkpoint.sstate","TRUNCATE"))
                      end)
                      if not opened or not file then
                          log("POSTCONF_STABLE_SAVE_OPEN_ERROR="..tostring(file)); PCSX.quit(72); return
                      end
                      local wrote,err=pcall(function() file:writeMoveSlice(state); file:close() end)
                      if not wrote then log("POSTCONF_STABLE_SAVE_WRITE_ERROR="..tostring(err)); PCSX.quit(73); return end
                      log("POSTCONF_STABLE_SAVE_CREATED=PASS")
                      log("POSTCONF_STABILIZE_BRANCH_DONE frame=62 load_event="..tostring(loaded).." load_returned="..tostring(returned))
                      PCSX.quit(0)
                  end)
                  return
              end
          end)
          log("POSTCONF_STABILIZE_READY")
          LUA
          cp "$WORK/create-stable-checkpoint.lua" "$WORK/captures/create-stable-checkpoint.lua"
          cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/card-STABILIZE.mcd"
          echo "POSTCONF_STABILIZE_PROCESS_BEGIN"
          set +e
          timeout --signal=TERM --kill-after=4s 25s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
            -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-STABILIZE.mcd" \
            -exec "$PAD_SETUP" -dofile "$WORK/create-stable-checkpoint.lua" -softgpu -dynarec -stdout -lua_stdout \
            -logfile "$WORK/captures/pcsx-STABILIZE.log" -run > "$WORK/captures/pcsx-STABILIZE.stdout" 2>&1
          stabilize_rc=$?
          set -e
          echo "POSTCONF_STABILIZE_EXIT_CODE=$stabilize_rc"
          grep -E 'POSTCONF_(SOURCE_LOAD_EVENT|SOURCE_LOAD_RETURNED|SCREENSHOT|STABLE_SAVE|STABILIZE_BRANCH_DONE|.*ERROR)' "$WORK/captures/pcsx-STABILIZE.stdout" || true
          test "$stabilize_rc" = 0
          grep -q 'POSTCONF_STABLE_SAVE_CREATED=PASS' "$WORK/captures/pcsx-STABILIZE.stdout"
          test -s "$WORK/captures/stable-postconfirm-checkpoint.sstate"

          stable_bytes="$(stat -c %s "$WORK/captures/stable-postconfirm-checkpoint.sstate")"
          stable_sha="$(sha256sum "$WORK/captures/stable-postconfirm-checkpoint.sstate" | cut -d ' ' -f1)"
          test "$stable_bytes" -gt 20000000
          cp "$WORK/captures/stable-postconfirm-checkpoint.sstate" "$WORK/resume/stable-postconfirm-checkpoint.sstate"
          {
            echo "POSTCONF_STABLE_CHECKPOINT_BYTES=$stable_bytes"
            echo "POSTCONF_STABLE_CHECKPOINT_SHA256=$stable_sha"
            echo "POSTCONF_STABLE_CHECKPOINT_SOURCE=restored post-second-Circle state, then 62 VSync without input"
            echo "POSTCONF_PARENT_CHECKPOINT_SHA256=b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a"
            echo "POSTCONF_ORIGINAL_DERIVED_CHECKPOINT_SHA256=a87529407736b1b7648785db8644d3c10f0b8d5d12f1557c63d9a3155b22fa83"
          } | tee "$WORK/captures/stable-checkpoint-manifest.txt"

          cat > "$WORK/fresh-restore-controls.lua" <<'LUA'
          local mode=os.getenv("PROBE_MODE") or "NONE"
          local frame=0
          local started=false
          local returned=false
          local loaded=false
          local finalFrame=60
          local captures={[1]=true,[10]=true,[30]=true,[40]=true,[44]=true,[45]=true,[46]=true,[47]=true,[48]=true,[50]=true,[52]=true,[53]=true,[54]=true,[55]=true,[60]=true}
          local pad=PCSX.SIO0.slots[1].pads[1]
          local buttons=PCSX.CONSTS.PAD.BUTTON
          local function log(s) print(s); io.stdout:flush() end
          local function shot(f)
              local s=PCSX.GPU.takeScreenShot()
              assert(s and s.width>=100 and s.height>=100 and s.data,"invalid screenshot")
              local bpp=(s.bpp==0) and 16 or 24
              local label=mode.."-f"..string.format("%03d",f)
              local rawpath="captures/raw/"..label..".raw"
              local raw=assert(Support.File.open(rawpath,"TRUNCATE")); raw:writeMoveSlice(s.data); raw:close()
              local m=assert(io.open("captures/"..label..".json","wb"))
              m:write(string.format('{"label":"%s","raw":"%s","width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',label,rawpath,s.width,s.height,bpp,s.width*s.height*bpp/8)); m:close()
              log(string.format("POSTCONF_SCREENSHOT label=%s width=%d height=%d",label,s.width,s.height))
          end
          local function input(action,phase)
              local b=(action=="START") and buttons.START or buttons.CIRCLE
              local ok,readback=pcall(function()
                  if phase=="press" then pad.setOverride(b) else pad.clearOverride(b) end
                  return pad.getButton(b)
              end)
              log(string.format("POSTCONF_INPUT mode=%s action=%s phase=%s readback=%s status=%s",mode,action,phase,tostring(readback),(ok and readback==(phase=="press")) and "PASS" or "FAIL"))
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("POSTCONF_LOAD_EVENT mode="..mode.." PASS")
          end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not started then
                  started=true; log("POSTCONF_LOAD_BEGIN mode="..mode); PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/stable-postconfirm-checkpoint.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("POSTCONF_LOAD_ERROR mode="..mode.." "..tostring(err)); PCSX.quit(32); return end
                      returned=true; log("POSTCONF_LOAD_RETURNED mode="..mode); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not returned then return end
              frame=frame+1
              if mode~="NONE" then
                  if frame==45 then input(mode,"press") elseif frame==53 then input(mode,"release") end
              end
              if captures[frame] then shot(frame) end
              if frame==finalFrame then
                  log("POSTCONF_BRANCH_DONE mode="..mode.." frame="..frame.." load_event="..tostring(loaded).." load_returned="..tostring(returned))
                  PCSX.pauseEmulator(); PCSX.nextTick(function() PCSX.quit(0) end); return
              end
          end)
          log("POSTCONF_BRANCH_READY mode="..mode)
          LUA
          cp "$WORK/fresh-restore-controls.lua" "$WORK/captures/fresh-restore-controls.lua"

          branches_ok=1
          for mode in NONE CIRCLE START; do
            cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/card-$mode.mcd"
            echo "POSTCONF_BRANCH_BEGIN=$mode"
            set +e
            PROBE_MODE="$mode" timeout --signal=TERM --kill-after=4s 25s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-$mode.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/fresh-restore-controls.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/pcsx-$mode.log" -run > "$WORK/captures/pcsx-$mode.stdout" 2>&1
            rc=$?
            set -e
            echo "POSTCONF_BRANCH_EXIT mode=$mode code=$rc"
            grep -E 'POSTCONF_(LOAD_EVENT|LOAD_RETURNED|INPUT|SCREENSHOT|BRANCH_DONE|LOAD_ERROR)' "$WORK/captures/pcsx-$mode.stdout" || true
            if [ "$rc" -ne 0 ] || ! grep -q "POSTCONF_BRANCH_DONE mode=$mode frame=60" "$WORK/captures/pcsx-$mode.stdout"; then
              echo "POSTCONF_BRANCH_REACHED_F60 mode=$mode NO"
              branches_ok=0
            else
              echo "POSTCONF_BRANCH_REACHED_F60 mode=$mode YES"
            fi
          done

          parent_after="$(sha256sum "$WORK/resume/parent-checkpoint.sstate" | cut -d ' ' -f1)"
          derived_after="$(sha256sum "$WORK/resume/derived-checkpoint.sstate" | cut -d ' ' -f1)"
          stable_after="$(sha256sum "$WORK/resume/stable-postconfirm-checkpoint.sstate" | cut -d ' ' -f1)"
          test "$parent_after" = b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a
          test "$derived_after" = a87529407736b1b7648785db8644d3c10f0b8d5d12f1557c63d9a3155b22fa83
          test "$stable_after" = "$stable_sha"
          echo "POSTCONF_PARENT_CHECKPOINT_UNCHANGED=PASS"
          echo "POSTCONF_ORIGINAL_DERIVED_CHECKPOINT_HASH_STABLE=PASS"
          echo "POSTCONF_NEW_CHECKPOINT_HASH_STABLE=PASS sha256=$stable_after"

          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path("captures")
          images={}
          malformed=[]
          for mp in sorted(root.glob("*.json")):
              try:
                  m=json.loads(mp.read_text())
                  raw=(root/m["raw"].split("captures/",1)[-1]).read_bytes() if m["raw"].startswith("captures/") else Path(m["raw"]).read_bytes()
                  if len(raw)!=int(m["expected_bytes"]):
                      malformed.append(mp.name+":wrong_bytes="+str(len(raw))); continue
                  w,h,bpp=int(m["width"]),int(m["height"]),int(m["bpp"])
                  if bpp==16:
                      rgb=bytearray()
                      for p in range(0,len(raw),2):
                          v=raw[p] | (raw[p+1]<<8)
                          rgb.extend(((v&31)*255//31,((v>>5)&31)*255//31,((v>>10)&31)*255//31))
                      im=Image.frombytes("RGB",(w,h),bytes(rgb))
                  elif bpp==24:
                      im=Image.frombytes("RGB",(w,h),raw)
                  else:
                      malformed.append(mp.name+":unsupported_bpp="+str(bpp)); continue
                  im.save(root/(m["label"]+".png"),optimize=True)
                  images[m["label"]]=im
              except Exception as e:
                  malformed.append(mp.name+":"+str(e))
          frames=[1,10,30,40,44,45,46,47,48,50,52,53,54,55,60]
          out=[
            "POSTCONF_EXPERIMENT=restore stable post-confirm checkpoint; compare NONE/CIRCLE/START with 8-VSync button holds after panel animation at equal VSync counts",
            "POSTCONF_STABLE_CHECKPOINT_BYTES="+str(Path("captures/stable-postconfirm-checkpoint.sstate").stat().st_size if Path("captures/stable-postconfirm-checkpoint.sstate").exists() else 0),
            "POSTCONF_STABLE_CHECKPOINT_SHA256="+__import__("hashlib").sha256(Path("captures/stable-postconfirm-checkpoint.sstate").read_bytes()).hexdigest() if Path("captures/stable-postconfirm-checkpoint.sstate").exists() else "missing",
            "POSTCONF_BRANCHES=NONE,CIRCLE,START; action input f45 press, f53 release (8 VSync hold) after panel animation; 60 VSync each",
            "POSTCONF_MALFORMED_SCREENSHOTS="+("; ".join(malformed) if malformed else "none")
          ]
          bad=False
          for mode in ["NONE","CIRCLE","START"]:
              if mode+"-f060" not in images:
                  out.append("POSTCONF_BRANCH_F60="+mode+":missing")
                  bad=True
          for f in frames:
              none=images.get("NONE-f"+str(f).zfill(3))
              for mode in ["CIRCLE","START"]:
                  other=images.get(mode+"-f"+str(f).zfill(3))
                  if none is None or other is None:
                      out.append(f"POSTCONF_COMPARE frame={f} NONE_vs_{mode}:missing")
                      bad=True
                  elif none.size!=other.size:
                      out.append(f"POSTCONF_COMPARE frame={f} NONE_vs_{mode}:dimension_mismatch")
                      bad=True
                  else:
                      d=ImageChops.difference(none,other)
                      mad=sum(ImageStat.Stat(d).mean)/3
                      exact=sum(1 for a,b in zip(none.getdata(),other.getdata()) if a==b)/(none.width*none.height)
                      out.append(f"POSTCONF_COMPARE frame={f} NONE_vs_{mode}:mad={mad:.3f},exact={exact:.5f}")
          if malformed: bad=True
          Path("captures/postconfirm-control-comparison.txt").write_text("\n".join(out)+"\n")
          print("\n".join(out))
          if bad: raise SystemExit("missing/malformed screenshots: comparison incomplete")
          PY
          cat "$WORK/captures/postconfirm-control-comparison.txt"
          test "$branches_ok" = 1
          echo "POSTCONF_GAMEPLAY_PROGRESS_NOT_ASSERTED=YES"

      - name: Upload private timeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-post178-advance-private
          path: |
            /tmp/naruto-storymode-post178/captures/*.png
            /tmp/naruto-storymode-post178/captures/*.txt
            /tmp/naruto-storymode-post178/captures/*.stdout
            /tmp/naruto-storymode-post178/captures/*.log
            /tmp/naruto-storymode-post178/captures/*.json
            /tmp/naruto-storymode-post178/captures/raw/*.raw
            /tmp/naruto-storymode-post178/captures/*.sstate
          if-no-files-found: warn
          retention-days: 14

      - name: Remove checkpoint, Memory Card, ROM and BIOS from ephemeral runner
        if: always()
        shell: bash
        run: rm -rf "$WORK"
