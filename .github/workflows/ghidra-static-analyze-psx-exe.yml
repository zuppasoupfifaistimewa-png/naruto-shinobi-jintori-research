name: Ghidra static analysis — SLPS_035.53

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ghidra-static-analyze-psx-exe.yml"
      - "tools/ghidra/**"
      - "tools/psx_rng_signature_scan.py"
      - "tools/psx_rng_resource_scan.py"

permissions:
  contents: read

concurrency:
  group: ghidra-psx-exe-static-analysis
  cancel-in-progress: true

jobs:
  analyze-main-exe:
    name: Verify and analyze PS-X EXE
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GHIDRA_VERSION: "12.2"
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
      EXPECTED_EXE_SHA256: "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569"
      EXPECTED_EXE_BYTES: "385024"
      ENTRY1_STATIC_BASE: "0x800AD450"
      ENTRY1_LENGTH: "0x919BC"
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install PS1 disc extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Download release disc image and extract SLPS_035.53
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/psx-disc-source"
          exe_dir="$RUNNER_TEMP/ghidra-input"
          out="$RUNNER_TEMP/ghidra-output"
          mkdir -p "$source_dir" "$exe_dir" "$out"
          # Use release-asset API endpoints; browser_download_url returned 404 on the hosted runner.
          bin_asset_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873"
          cue_asset_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760"
          disc="$source_dir/naruto-disc.bin"
          cue_raw="$source_dir/original.cue"
          cue="$source_dir/naruto-disc.cue"

          if ! curl --fail --location --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 --max-time 600 "$bin_asset_url" --output "$disc"; then
            echo "::error::Could not download the existing Naruto disc-image release asset."
            exit 1
          fi
          if [[ "$(stat -c '%s' "$disc")" != "325989552" ]] || ! echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $disc" | sha256sum --check --status; then
            rm -f "$disc"
            echo "::error::Release disc image size or SHA-256 mismatch; input discarded."
            exit 1
          fi

          if ! curl --fail --location --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 --max-time 60 "$cue_asset_url" --output "$cue_raw"; then
            echo "::error::Could not download the matching CUE asset."
            exit 1
          fi
          if [[ "$(stat -c '%s' "$cue_raw")" != "116" ]] || ! echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status; then
            rm -f "$disc" "$cue_raw"
            echo "::error::Release CUE size or SHA-256 mismatch; input discarded."
            exit 1
          fi

          # Normalize only the CUE FILE path so it points to the downloaded filename.
          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re
          import sys

          source, destination = map(Path, sys.argv[1:3])
          lines = source.read_text(encoding="utf-8").splitlines()
          rewritten = []
          replaced = 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  match = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.IGNORECASE)
                  if not match:
                      raise SystemExit("Unrecognized CUE FILE directive; refusing to extract.")
                  line = match.group(1) + '"naruto-disc.bin"' + match.group(2)
                  replaced += 1
              rewritten.append(line)
          if replaced != 1:
              raise SystemExit(f"Expected one CUE FILE directive, found {replaced}.")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

          mkdir -p "$source_dir/extracted-root"
          bchunk "$disc" "$cue" "$source_dir/track"
          iso="$(find "$source_dir" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          if [[ -z "$iso" ]]; then
            echo "::error::No data-track ISO was produced from the verified BIN/CUE pair."
            exit 1
          fi
          xorriso -osirrox on -indev "$iso" -extract / "$source_dir/extracted-root" > "$out/disc-extraction.log" 2>&1
          candidate="$(find "$source_dir/extracted-root" -type f -iname 'SLPS_035.53*' -print -quit)"
          if [[ -z "$candidate" ]]; then
            echo "::error::SLPS_035.53 was not found in the extracted disc filesystem."
            tail -n 80 "$out/disc-extraction.log" || true
            exit 1
          fi
          exe="$exe_dir/SLPS_035.53"
          cp "$candidate" "$exe"
          actual_bytes="$(stat -c '%s' "$exe")"
          if [[ "$actual_bytes" != "$EXPECTED_EXE_BYTES" ]] || ! echo "$EXPECTED_EXE_SHA256  $exe" | sha256sum --check --status; then
            rm -f "$exe"
            echo "::error::Extracted SLPS_035.53 size or SHA-256 mismatch; executable discarded."
            exit 1
          fi
          if [[ "$(head -c 8 "$exe")" != "PS-X EXE" ]]; then
            rm -f "$exe"
            echo "::error::Extracted file does not have a PS-X EXE signature."
            exit 1
          fi

          python3 - "$exe" "$out/psx-exe-header-validation.txt" <<'PY'
          from pathlib import Path
          import struct
          import sys
          exe, report = Path(sys.argv[1]), Path(sys.argv[2])
          data = exe.read_bytes()
          if len(data) != 385024 or data[:8] != b"PS-X EXE":
              raise SystemExit("FAIL: executable size or signature mismatch")
          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          pc, gp, load, text = u32(0x10), u32(0x14), u32(0x18), u32(0x1C)
          data_addr, data_size = u32(0x20), u32(0x24)
          bss_addr, bss_size = u32(0x28), u32(0x2C)
          sp_base, sp_offset = u32(0x30), u32(0x34)
          checks = {
              "entry_pc": pc == 0x80011448,
              "load_address": load == 0x80010000,
              "text_size": text == 0x5D800,
              "header_plus_text_equals_file": 0x800 + text == len(data),
              "entry_within_loaded_text": load <= pc < load + text,
              "file_length": len(data) == 0x5E000,
          }
          if not all(checks.values()):
              raise SystemExit("FAIL: " + ", ".join(k for k,v in checks.items() if not v))
          report.write_text("\n".join([
              "status=SUCCESS", "source=SLPS_035.53", f"file_bytes={len(data)}",
              "magic=PS-X EXE", "header_bytes=0x800", f"initial_pc=0x{pc:08X}",
              f"initial_gp=0x{gp:08X}", f"load_address=0x{load:08X}",
              f"text_size=0x{text:X}", f"loaded_range=[0x{load:08X},0x{load+text:08X})",
              f"data_address=0x{data_addr:08X}", f"data_size=0x{data_size:X}",
              f"bss_address=0x{bss_addr:08X}", f"bss_size=0x{bss_size:X}",
              f"initial_sp_base=0x{sp_base:08X}", f"initial_sp_offset=0x{sp_offset:X}",
              "validation=" + ",".join(f"{k}:PASS" for k,v in checks.items() if v),
              "input_executable_uploaded_as_artifact=no", ""
          ]), encoding="utf-8")
          print(report.read_text(), end="")
          PY
          {
            echo "status=source verified"
            echo "source=existing GitHub Release BIN/CUE assets"
            echo "disc_bin_bytes=325989552"
            echo "disc_bin_sha256=58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88"
            echo "filename=SLPS_035.53"
            echo "bytes=$actual_bytes"
            echo "sha256=$EXPECTED_EXE_SHA256"
            echo "game_binary_committed_to_git=no"
            echo "game_binary_uploaded_as_artifact=no"
          } > "$out/input-validation.txt"
          # Also retain one verified data file temporarily so Step 5 can extract a single catalogued resource.
          data_candidate="$source_dir/extracted-root/DATA.BIN"
          data_bin="$exe_dir/DATA.BIN"
          if [[ ! -f "$data_candidate" ]]; then
            echo "::error::DATA.BIN was not found in the verified disc filesystem."
            exit 1
          fi
          cp "$data_candidate" "$data_bin"
          if [[ "$(stat -c '%s' "$data_bin")" != "66015232" ]] || ! echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data_bin" | sha256sum --check --status; then
            rm -f "$data_bin"
            echo "::error::Extracted DATA.BIN size or SHA-256 mismatch; data file discarded."
            exit 1
          fi
          {
            echo "data_bin_bytes=66015232"
            echo "data_bin_sha256=69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822"
            echo "data_bin_temporary_runner_only=yes"
            echo "data_bin_uploaded_as_artifact=no"
          } >> "$out/input-validation.txt"

          # Scan all executable/resource files for raw direct-JAL and computed-address
          # references to the main-EXE RNG/seed setter. Outputs are text only.
          find_named_file() {
            local want="$1"
            find "$source_dir/extracted-root" -type f -iname "$want" -print -quit
          }
          data2_candidate="$(find_named_file 'DATA2.BIN')"
          dummy_candidate="$(find_named_file 'DUMMY.BIN')"
          xasect_candidate="$(find_named_file 'XASECT.BIN')"
          if [[ -z "$data2_candidate" || -z "$dummy_candidate" || -z "$xasect_candidate" ]]; then
            echo "::error::One or more expected disc files were not found for the static RNG reference scan."
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tools/psx_rng_resource_scan.py" \
            --output "$out/rng-resource-reference-scan.txt" \
            "$exe" "$data_bin" "$data2_candidate" "$dummy_candidate" "$xasect_candidate"

          # Keep the verified executable and DATA.BIN temporarily; discard disc image and extraction tree.
          rm -rf "$source_dir"
          echo "Release BIN/CUE validated; SLPS_035.53 and DATA.BIN verified."
          
      - name: Set up Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Restore cached Ghidra installation
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            if ! curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 "$url" --output "$archive" 2>/dev/null; then
              echo "::error::Could not download the pinned Ghidra archive."
              exit 1
            fi
            if ! echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status; then
              rm -f "$archive"
              echo "::error::Pinned Ghidra SHA-256 verification failed."
              exit 1
            fi
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          else
            echo "Cached Ghidra installation found; download skipped."
          fi

      - name: Scan RNG signature and direct callers
        shell: bash
        run: |
          set -euo pipefail
          exe="$RUNNER_TEMP/ghidra-input/SLPS_035.53"
          out="$RUNNER_TEMP/ghidra-output/rng-signature-scan.txt"
          python3 tools/psx_rng_signature_scan.py "$exe" > "$out"
          cat "$out"

      - name: Run Ghidra headless analysis and export function index
        shell: bash
        run: |
          set -euo pipefail
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          if [[ -z "$headless" || ! -x "$headless" ]]; then
            echo "::error::Ghidra headless launcher is unavailable."
            exit 1
          fi
          out="$RUNNER_TEMP/ghidra-output"
          exe="$RUNNER_TEMP/ghidra-input/SLPS_035.53"
          project="$RUNNER_TEMP/ghidra-project"
          # analyzeHeadless requires the project-location directory to exist.
          mkdir -p "$out" "$project"
          {
            echo "analysis=Ghidra headless"
            echo "ghidra_version=$GHIDRA_VERSION"
            echo "processor=MIPS:LE:32:default"
            echo "loader=BinaryLoader"
            echo "loaded_file_offset=0x800"
            echo "loaded_length=0x5D800"
            echo "load_address=0x80010000"
            echo "entry_point=0x80011448"
            echo "output=functions.tsv and rng-caller-analysis.txt (text only)"
          } > "$out/analysis-config.txt"
          set +e
          "$headless" "$project" Naruto_SLPS_035_53 \
            -import "$exe" \
            -loader BinaryLoader \
            -loader-baseAddr 0x80010000 \
            -loader-fileOffset 0x800 \
            -loader-length 0x5D800 \
            -loader-blockName MAIN_TEXT \
            -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -preScript PreparePsxExe.java \
            -postScript ExportFunctionIndex.java "$out/functions.tsv" \
            -postScript ExportRngCallerAnalysis.java "$out/rng-caller-analysis.txt" \
            -postScript ExportFunctionDetail.java "$out/loader-resource-call-paths.txt" \
              0x8002D838 0x8002DEC4 0x8002DF30 0x8002D00C 0x8002D5C0 \
              0x8002CF9C 0x8002DE60 0x8002DDEC 0x80035AA8 0x80035B08 \
            -postScript ExportNumericLiteralReferences.java "$out/main-numeric-instruction-literals.tsv" \
            -postScript ExportDN1WriterWindows.java "$out/dn1-main-exe-writer-instructions.tsv" "$GITHUB_WORKSPACE/reports/stage1_economy/DM1_TILE_LEVEL_WRITER_CENSUS_2026-11-05.tsv" \
            -analysisTimeoutPerFile 1800 \
            -max-cpu 2 \
            -deleteProject > "$out/ghidra-headless.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            {
              echo "status=FAILED"
              echo "exit_code=$status"
              echo "note=Text logs may be inspected; input executable is never included in the artifact."
            } > "$out/analysis-result.txt"
            tail -n 80 "$out/ghidra-headless.log" || true
            exit "$status"
          fi
          if [[ ! -s "$out/functions.tsv" ]]; then
            echo "status=FAILED: Ghidra completed but functions.tsv is missing or empty" > "$out/analysis-result.txt"
            echo "::error::Ghidra returned without a non-empty function index."
            exit 1
          fi
          if [[ ! -s "$out/rng-caller-analysis.txt" ]]; then
            echo "status=FAILED: targeted RNG caller analysis output is missing or empty" > "$out/analysis-result.txt"
            echo "::error::Ghidra targeted RNG caller analysis output is missing or empty."
            exit 1
          fi
          if [[ ! -s "$out/loader-resource-call-paths.txt" || ! -s "$out/main-numeric-instruction-literals.tsv" ]]; then
            echo "status=FAILED: loader/resource or numeric instruction reference output is missing or empty" > "$out/analysis-result.txt"
            echo "::error::Ghidra loader/resource or numeric reference output is missing or empty."
            exit 1
          fi
          count="$(awk 'END { if (NR > 1) print NR - 1; else print 0 }' "$out/functions.tsv")"
          {
            echo "status=SUCCESS"
            echo "ghidra_version=$GHIDRA_VERSION"
            echo "executable=SLPS_035.53"
            echo "executable_sha256=$EXPECTED_EXE_SHA256"
            echo "executable_bytes=$EXPECTED_EXE_BYTES"
            echo "function_rows=$count"
            echo "result=function index, RNG callers, 10 loader/resource functions, and immediate numeric instruction references exported"
            echo "loader_detail_targets=0x8002D838,0x8002DEC4,0x8002DF30,0x8002D00C,0x8002D5C0,0x8002CF9C,0x8002DE60,0x8002DDEC,0x80035AA8,0x80035B08"
            echo "caller_function_mapping=initial labels only; semantic interpretation pending"
            echo "emulator_or_gameplay_executed=no"
            echo "binary_uploaded_as_artifact=no"
          } > "$out/analysis-result.txt"
          echo "Ghidra analysis succeeded; exported $count function rows."

      - name: Extract and analyze DATA.BIN Entry 1 at buffer base 0x800AD450
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ghidra-output"
          databin="$RUNNER_TEMP/ghidra-input/DATA.BIN"
          resource="$RUNNER_TEMP/ghidra-input/DATA_BIN_ENTRY_0001.bin"
          python3 - "$databin" "$resource" <<'PY'
          from pathlib import Path
          import hashlib, sys
          source, destination = map(Path, sys.argv[1:3])
          data = source.read_bytes()
          if len(data) != 66015232:
              raise SystemExit(f"Unexpected DATA.BIN size: {len(data)}")
          if hashlib.sha256(data).hexdigest() != "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822":
              raise SystemExit("DATA.BIN SHA-256 mismatch; refusing Entry 1 extraction")
          offset, size = 0x10BB000, 596412
          entry = data[offset:offset+size]
          if len(entry) != size:
              raise SystemExit(f"Unexpected Entry 1 length: {len(entry)}")
          digest = hashlib.sha256(entry).hexdigest()
          if digest != "9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a":
              raise SystemExit(f"Entry 1 SHA-256 mismatch: {digest}")
          destination.write_bytes(entry)
          print(f"resource=DATA.BIN Entry 1; file_offset=0x{offset:X}; bytes={len(entry)}; sha256={digest}")
          PY

          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          if [[ -z "$headless" || ! -x "$headless" ]]; then
            echo "::error::Ghidra headless launcher unavailable."
            exit 1
          fi
          project="$RUNNER_TEMP/ghidra-entry1-correct-base-project"
          mkdir -p "$project"
          set +e
          "$headless" "$project" DATA_BIN_entry_0001_correct_base \
            -import "$resource" \
            -loader BinaryLoader \
            -loader-baseAddr "$ENTRY1_STATIC_BASE" \
            -loader-length "$ENTRY1_LENGTH" \
            -loader-blockName DATA_BIN_ENTRY_0001 \
            -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript ExportDN1WriterWindows.java "$out/dn1-entry1-writer-instructions.tsv" "$GITHUB_WORKSPACE/reports/stage1_economy/DM1_TILE_LEVEL_WRITER_CENSUS_2026-11-05.tsv" \
            -analysisTimeoutPerFile 1800 \
            -max-cpu 2 \
            -deleteProject > "$out/entry1-correct-base-ghidra.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "STATUS=FAILED" > "$out/DN1_GHIDRA_RUN_SUMMARY.txt"
            echo "JOB=analyze-main-exe" >> "$out/DN1_GHIDRA_RUN_SUMMARY.txt"
            echo "RUN_ID=$GITHUB_RUN_ID" >> "$out/DN1_GHIDRA_RUN_SUMMARY.txt"
            echo "SOURCE_SHA=$GITHUB_SHA" >> "$out/DN1_GHIDRA_RUN_SUMMARY.txt"
            echo "ENTRY1_BASE=$ENTRY1_STATIC_BASE" >> "$out/DN1_GHIDRA_RUN_SUMMARY.txt"
            echo "EXIT_CODE=$status" >> "$out/DN1_GHIDRA_RUN_SUMMARY.txt"
            tail -n 100 "$out/entry1-correct-base-ghidra.log" || true
            exit "$status"
          fi
          if [[ ! -s "$out/dn1-entry1-writer-instructions.tsv" ]]; then
            echo "::error::DN1 Entry 1 instruction export is missing or empty."
            exit 1
          fi
          echo "Entry 1 writer windows exported at $ENTRY1_STATIC_BASE."

      - name: Verify and summarize all 272 DN1 writer PCs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ghidra-output"
          python3 - "$GITHUB_WORKSPACE/reports/stage1_economy/DM1_TILE_LEVEL_WRITER_CENSUS_2026-11-05.tsv" "$out/dn1-entry1-writer-instructions.tsv" "$out" "$ENTRY1_STATIC_BASE" "$ENTRY1_LENGTH" <<'PY'
          from pathlib import Path
          import csv, sys
          from collections import Counter
          census_path, export_path, out_dir = map(Path, sys.argv[1:4])
          base, length = int(sys.argv[4],0), int(sys.argv[5],0)
          end = base + length

          lines = census_path.read_text(encoding="utf-8").splitlines()
          hi = next(i for i, line in enumerate(lines) if line.startswith("field_offset\tpc\t"))
          source_header = lines[hi].split("\t")
          targets = []
          for line in lines[hi+1:]:
              if not line.strip():
                  continue
              cells = line.split("\t")
              if len(cells) < len(source_header):
                  continue
              item = dict(zip(source_header,cells))
              ctx, label, alias = item["context_status"], item["label"], item["alias_status"]
              wanted = (ctx == "NO_STORE_IN_REVIEWED_EXPORT" or
                        (label == "LAIN" and alias == "BASE_ALIAS_UNPROVEN" and ctx != "NO_STORE_IN_REVIEWED_EXPORT"))
              if wanted:
                  targets.append(item)

          target_pcs = [x["pc"].upper() for x in targets]
          if len(target_pcs) != 272 or len(set(target_pcs)) != 272:
              raise SystemExit(f"DN1 expected 272 unique PCs, got rows={len(target_pcs)} unique={len(set(target_pcs))}")

          with export_path.open(encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f, delimiter="\t")
              header = reader.fieldnames
              exported_rows = list(reader)
          if not header:
              raise SystemExit("DN1 output has no header")
          exported = {}
          duplicates = []
          for row in exported_rows:
              pc = row.get("pc","").upper()
              if pc in exported:
                  duplicates.append(pc)
              else:
                  exported[pc] = row
          if duplicates:
              raise SystemExit(f"DN1 export has duplicate PCs: {duplicates[:10]}")

          expected_inside = {}
          outside = {}
          for x in targets:
              pc = x["pc"].upper()
              value = int(x["pc"],0)
              (expected_inside if base <= value < end else outside)[pc] = x

          unexpected = sorted(set(exported)-set(target_pcs))
          if unexpected:
              raise SystemExit(f"DN1 export contains non-target PCs: {unexpected[:10]}")

          merged = dict(exported)
          for pc, x in outside.items():
              merged[pc] = {
                  "field_offset":x["field_offset"], "pc":x["pc"],
                  "function_entry":x["function_entry"], "function_name":x["function_name"],
                  "instruction":"TIDAK_TERSEDIA", "instruction_bytes":"TIDAK_TERSEDIA",
                  "base_register":"TIDAK_TAHU", "value_register":"TIDAK_TAHU",
                  "seeded_instruction_count":"0", "previous_instruction_count":"0",
                  "previous_12_plus_store":"TIDAK_TERSEDIA",
                  "value_origin":"TIDAK TAHU — PC berada di luar rentang image Entry 1",
                  "nearest_value_def_candidate":"TIDAK_TAHU", "nearest_base_def_candidate":"TIDAK_TAHU",
                  "label":"LAIN", "alias_status":"NOT_MAPPED_TO_ENTRY1_IMAGE",
                  "context_status":"OUTSIDE_ENTRY1_STATIC_IMAGE",
                  "raw_excerpt_hex_max64":"TIDAK_TERSEDIA",
                  "reason":"TIDAK TAHU — PC berada di luar rentang Entry 1 pada base statis yang diuji",
                  "analysis_program":"NONE"
              }

          missing_inside = sorted(set(expected_inside)-set(exported))
          for pc in missing_inside:
              x = expected_inside[pc]
              merged[pc] = {
                  "field_offset":x["field_offset"], "pc":x["pc"],
                  "function_entry":x["function_entry"], "function_name":x["function_name"],
                  "instruction":"TIDAK_TERSEDIA", "instruction_bytes":"TIDAK_TERSEDIA",
                  "base_register":"TIDAK_TAHU", "value_register":"TIDAK_TAHU",
                  "seeded_instruction_count":"0", "previous_instruction_count":"0",
                  "previous_12_plus_store":"TIDAK_TERSEDIA",
                  "value_origin":"TIDAK TAHU — PC berada dalam Entry 1 tetapi tidak dikembalikan oleh exporter",
                  "nearest_value_def_candidate":"TIDAK_TAHU", "nearest_base_def_candidate":"TIDAK_TAHU",
                  "label":"LAIN", "alias_status":"ENTRY1_EXPORT_MISSING",
                  "context_status":"PC_IN_ENTRY1_EXPORT_MISSING",
                  "raw_excerpt_hex_max64":"TIDAK_TERSEDIA",
                  "reason":"TIDAK TAHU — PC ada di dalam image Entry 1 tetapi tidak muncul pada TSV Ghidra",
                  "analysis_program":"NONE"
              }

          rows = [merged[pc] for pc in target_pcs]
          if len(rows) != 272 or len({r["pc"].upper() for r in rows}) != 272:
              raise SystemExit("DN1 merged output does not contain exactly 272 unique PCs")

          final_path = out_dir / "DN1_UNRESOLVED_WRITER_INSTRUCTIONS_2026-11-05.tsv"
          with final_path.open("w",encoding="utf-8",newline="") as f:
              writer=csv.DictWriter(f,fieldnames=header,delimiter="\t",lineterminator="\n",extrasaction="ignore")
              writer.writeheader()
              writer.writerows(rows)

          labels = Counter(r.get("label","") for r in rows)
          contexts = Counter(r.get("context_status","") for r in rows)
          fields = Counter(r.get("field_offset","") for r in rows)
          previous12 = sum(r.get("previous_instruction_count")=="12" for r in rows)
          decoded = sum(r.get("instruction") not in ("","TIDAK_TERSEDIA") for r in rows)
          stores = sum(r.get("context_status","").startswith("STORE_DECODED") for r in rows)
          nonstores = sum(r.get("context_status")=="PC_NOT_STORE" for r in rows)
          notdecoded = sum(r.get("context_status")=="PC_NOT_DECODED" for r in rows)
          entry1_in = len(expected_inside)
          summary = [
              "STATUS=EXPORT_COVERAGE_COMPLETE; SEMANTIC_RESOLUTION_PARTIAL",
              "RUN_ID="+str(__import__("os").environ.get("GITHUB_RUN_ID","TIDAK_TAHU")),
              "JOB=analyze-main-exe",
              "SOURCE_SHA="+str(__import__("os").environ.get("GITHUB_SHA","TIDAK_TAHU")),
              "EXIT_CODE=0",
              "ENTRY1_STATIC_BASE=0x%08X"%base,
              "ENTRY1_END_EXCLUSIVE=0x%08X"%end,
              "ENTRY1_LENGTH=0x%X"%length,
              f"TARGET_UNIQUE_PC={len(target_pcs)}",
              f"EXPORT_ROWS={len(exported)}",
              f"TARGETS_IN_ENTRY1_RANGE={entry1_in}",
              f"TARGETS_OUTSIDE_ENTRY1_RANGE={len(outside)}",
              f"TARGETS_MISSING_FROM_GHIDRA_EXPORT={len(missing_inside)}",
              f"DECODED_INSTRUCTION_AT_PC={decoded}/272",
              f"PREVIOUS_12_AVAILABLE={previous12}/272",
              f"STORE_DECODED={stores}",
              f"PC_NOT_STORE={nonstores}",
              f"PC_NOT_DECODED={notdecoded}",
              "FIELD_COUNTS="+str(dict(fields)),
              "LABEL_COUNTS="+str(dict(labels)),
              "CONTEXT_COUNTS="+str(dict(contexts)),
              "COMPUTED_CONFIRMED=0 (base register and destination must be proven as tile array)",
              "LOADER_COPY_CONFIRMED=10 (prior FUN_800F7ADC export, copy from resource +0x0A..+0x13)",
              "HT=LV values are copied from resource; supported by loader-copy instructions, but exclusivity not proven",
              "HC=a computed writer to EA84+index*0x124 exists; no PC in this output is yet a fully proven computed writer",
              "HT_FALSIFIER=one non-loader write with proven tile-array base and computed level source",
              "HC_FALSIFIER=complete destination audit shows every LV field write comes only from resource-copy path",
              "RUNTIME_LIMIT=H6 DN2 matches resource 0x276 in two launches; it does not prove all selectors/modes"
          ]
          (out_dir/"DN1_WHOLE_CENSUS_SUMMARY.txt").write_text("\n".join(summary)+"\n",encoding="utf-8")
          print("\n".join(summary))
          PY
      - name: Upload text-only Ghidra results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-slps-03553-function-index
          path: ${{ runner.temp }}/ghidra-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove extracted executable and temporary project
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ghidra-input" "$RUNNER_TEMP/ghidra-project" "$RUNNER_TEMP/ghidra-overlay-project" "$RUNNER_TEMP/ghidra-entry0-project" "$RUNNER_TEMP/psx-disc-source"
