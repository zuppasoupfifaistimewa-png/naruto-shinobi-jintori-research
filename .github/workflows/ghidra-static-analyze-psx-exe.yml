name: Ghidra static analysis — SLPS_035.53

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghidra-psx-exe-static-analysis
  cancel-in-progress: false

jobs:
  analyze-main-exe:
    name: Verify and analyze PS-X EXE
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GHIDRA_VERSION: "12.2"
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
      EXPECTED_EXE_SHA256: "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569"
      EXPECTED_EXE_BYTES: "385024"
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install PS1 disc extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Download release disc image and extract SLPS_035.53
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/psx-disc-source"
          exe_dir="$RUNNER_TEMP/ghidra-input"
          out="$RUNNER_TEMP/ghidra-output"
          mkdir -p "$source_dir" "$exe_dir" "$out"
          base_url="https://github.com/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/download/research-emulator-pcsx-redux-2026-10-15"
          disc="$source_dir/naruto-disc.bin"
          cue_raw="$source_dir/original.cue"
          cue="$source_dir/naruto-disc.cue"

          if ! curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 --max-time 600 "$base_url/Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin" --output "$disc"; then
            echo "::error::Could not download the existing Naruto disc-image release asset."
            exit 1
          fi
          if [[ "$(stat -c '%s' "$disc")" != "325989552" ]] || ! echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $disc" | sha256sum --check --status; then
            rm -f "$disc"
            echo "::error::Release disc image size or SHA-256 mismatch; input discarded."
            exit 1
          fi

          if ! curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 --max-time 60 "$base_url/Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue" --output "$cue_raw"; then
            echo "::error::Could not download the matching CUE asset."
            exit 1
          fi
          if [[ "$(stat -c '%s' "$cue_raw")" != "116" ]] || ! echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status; then
            rm -f "$disc" "$cue_raw"
            echo "::error::Release CUE size or SHA-256 mismatch; input discarded."
            exit 1
          fi

          # Normalize only the CUE FILE path so it points to the downloaded filename.
          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re
          import sys

          source, destination = map(Path, sys.argv[1:3])
          lines = source.read_text(encoding="utf-8").splitlines()
          rewritten = []
          replaced = 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  match = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.IGNORECASE)
                  if not match:
                      raise SystemExit("Unrecognized CUE FILE directive; refusing to extract.")
                  line = match.group(1) + '"naruto-disc.bin"' + match.group(2)
                  replaced += 1
              rewritten.append(line)
          if replaced != 1:
              raise SystemExit(f"Expected one CUE FILE directive, found {replaced}.")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY

          mkdir -p "$source_dir/extracted-root"
          bchunk "$disc" "$cue" "$source_dir/track"
          iso="$(find "$source_dir" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          if [[ -z "$iso" ]]; then
            echo "::error::No data-track ISO was produced from the verified BIN/CUE pair."
            exit 1
          fi
          xorriso -osirrox on -indev "$iso" -extract / "$source_dir/extracted-root" > "$out/disc-extraction.log" 2>&1
          candidate="$(find "$source_dir/extracted-root" -type f -iname 'SLPS_035.53*' -print -quit)"
          if [[ -z "$candidate" ]]; then
            echo "::error::SLPS_035.53 was not found in the extracted disc filesystem."
            tail -n 80 "$out/disc-extraction.log" || true
            exit 1
          fi
          exe="$exe_dir/SLPS_035.53"
          cp "$candidate" "$exe"
          actual_bytes="$(stat -c '%s' "$exe")"
          if [[ "$actual_bytes" != "$EXPECTED_EXE_BYTES" ]] || ! echo "$EXPECTED_EXE_SHA256  $exe" | sha256sum --check --status; then
            rm -f "$exe"
            echo "::error::Extracted SLPS_035.53 size or SHA-256 mismatch; executable discarded."
            exit 1
          fi
          if [[ "$(head -c 8 "$exe")" != "PS-X EXE" ]]; then
            rm -f "$exe"
            echo "::error::Extracted file does not have a PS-X EXE signature."
            exit 1
          fi
          {
            echo "status=source verified"
            echo "source=existing GitHub Release BIN/CUE assets"
            echo "disc_bin_bytes=325989552"
            echo "disc_bin_sha256=58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88"
            echo "filename=SLPS_035.53"
            echo "bytes=$actual_bytes"
            echo "sha256=$EXPECTED_EXE_SHA256"
            echo "game_binary_committed_to_git=no"
            echo "game_binary_uploaded_as_artifact=no"
          } > "$out/input-validation.txt"
          # Keep only the verified executable for Ghidra; discard the disc image and extracted filesystem.
          rm -rf "$source_dir"
          echo "Release BIN/CUE validated and SLPS_035.53 extracted and verified."
          
      - name: Set up Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Restore cached Ghidra installation
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            if ! curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 "$url" --output "$archive" 2>/dev/null; then
              echo "::error::Could not download the pinned Ghidra archive."
              exit 1
            fi
            if ! echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status; then
              rm -f "$archive"
              echo "::error::Pinned Ghidra SHA-256 verification failed."
              exit 1
            fi
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          else
            echo "Cached Ghidra installation found; download skipped."
          fi

      - name: Scan RNG signature and direct callers
        shell: bash
        run: |
          set -euo pipefail
          exe="$RUNNER_TEMP/ghidra-input/SLPS_035.53"
          out="$RUNNER_TEMP/ghidra-output/rng-signature-scan.txt"
          python3 tools/psx_rng_signature_scan.py "$exe" > "$out"
          cat "$out"

      - name: Run Ghidra headless analysis and export function index
        shell: bash
        run: |
          set -euo pipefail
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          if [[ -z "$headless" || ! -x "$headless" ]]; then
            echo "::error::Ghidra headless launcher is unavailable."
            exit 1
          fi
          out="$RUNNER_TEMP/ghidra-output"
          exe="$RUNNER_TEMP/ghidra-input/SLPS_035.53"
          project="$RUNNER_TEMP/ghidra-project"
          mkdir -p "$out"
          {
            echo "analysis=Ghidra headless"
            echo "ghidra_version=$GHIDRA_VERSION"
            echo "processor=MIPS:LE:32:default"
            echo "loader=BinaryLoader"
            echo "loaded_file_offset=0x800"
            echo "loaded_length=0x5D800"
            echo "load_address=0x80010000"
            echo "entry_point=0x80011448"
            echo "output=functions.tsv (text only)"
          } > "$out/analysis-config.txt"
          set +e
          "$headless" "$project" Naruto_SLPS_035_53 \
            -import "$exe" \
            -loader BinaryLoader \
            -loader-baseAddr 0x80010000 \
            -loader-fileOffset 0x800 \
            -loader-length 0x5D800 \
            -loader-blockName MAIN_TEXT \
            -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -preScript PreparePsxExe.java \
            -postScript ExportFunctionIndex.java "$out/functions.tsv" \
            -analysisTimeoutPerFile 1800 \
            -max-cpu 2 \
            -deleteProject > "$out/ghidra-headless.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            {
              echo "status=FAILED"
              echo "exit_code=$status"
              echo "note=Text logs may be inspected; input executable is never included in the artifact."
            } > "$out/analysis-result.txt"
            tail -n 80 "$out/ghidra-headless.log" || true
            exit "$status"
          fi
          if [[ ! -s "$out/functions.tsv" ]]; then
            echo "status=FAILED: Ghidra completed but functions.tsv is missing or empty" > "$out/analysis-result.txt"
            echo "::error::Ghidra returned without a non-empty function index."
            exit 1
          fi
          count="$(awk 'END { if (NR > 1) print NR - 1; else print 0 }' "$out/functions.tsv")"
          {
            echo "status=SUCCESS"
            echo "ghidra_version=$GHIDRA_VERSION"
            echo "executable=SLPS_035.53"
            echo "executable_sha256=$EXPECTED_EXE_SHA256"
            echo "executable_bytes=$EXPECTED_EXE_BYTES"
            echo "function_rows=$count"
            echo "result=function index exported; interpretation and gameplay function mapping remain pending"
            echo "emulator_or_gameplay_executed=no"
            echo "binary_uploaded_as_artifact=no"
          } > "$out/analysis-result.txt"
          echo "Ghidra analysis succeeded; exported $count function rows."

      - name: Upload text-only Ghidra results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-slps-03553-function-index
          path: ${{ runner.temp }}/ghidra-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove extracted executable and temporary project
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ghidra-input" "$RUNNER_TEMP/ghidra-project" "$RUNNER_TEMP/psx-disc-source"
