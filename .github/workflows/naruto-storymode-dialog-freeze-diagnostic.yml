name: Naruto Story Mode VSync watchdog and lightweight native SIGSEGV trace (no START input)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-dialog-freeze-diagnostic"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-DIALOG-FREEZE-DIAGNOSTIC]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-dialog-freeze-diagnostic
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research workflow
        uses: actions/checkout@v4

      - name: Prepare private diagnostic workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil xvfb x11-utils x11-apps imagemagick curl unzip gdb file
          if ! command -v catchsegv >/dev/null 2>&1; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y glibc-tools || DEBIAN_FRONTEND=noninteractive apt-get install -y libc6-dbg
          fi
          mkdir -p "$WORK"/{build-artifact,state-artifact,dialog-checkpoint-artifact,card-artifact,cards,resume,captures/raw,home,.config,.data,runtime}
          chmod 700 "$WORK/runtime"

      - name: Download already-built patched emulator
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-dialog-freeze-diagnostic/build-artifact

      - name: Download and verify stable checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-post178-advance-private
          run-id: 39555023915
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-dialog-freeze-diagnostic/state-artifact

      - name: Download previously saved pre-START dialog checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-dialog-freeze-diagnostic-private
          run-id: 39563209277
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-dialog-freeze-diagnostic/dialog-checkpoint-artifact

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-dialog-freeze-diagnostic/card-artifact

      - name: Validate inputs and stage read-only source copies
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          CHECKPOINT="$WORK/state-artifact/stable-postconfirm-checkpoint.sstate"
          MANIFEST="$WORK/state-artifact/stable-checkpoint-manifest.txt"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$CHECKPOINT")" = 21163483
          test "$(sha256sum "$CHECKPOINT" | cut -d ' ' -f1)" = b7d86f572f929d13aeb24d9b710e455610c2723f336b68acf32f7cca2e8fe4ee
          grep -q '^POSTCONF_STABLE_CHECKPOINT_SHA256=b7d86f572f929d13aeb24d9b710e455610c2723f336b68acf32f7cca2e8fe4ee$' "$MANIFEST"
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          DIALOG_CHECKPOINT="$WORK/dialog-checkpoint-artifact/dialog-entry-f178.sstate"
          test "$(stat -c %s "$DIALOG_CHECKPOINT")" = 21162258
          test "$(sha256sum "$DIALOG_CHECKPOINT" | cut -d ' ' -f1)" = c47d2069ae9b1e589cce35df2dbaaa867b3365acfd501d2666a72ecd5fcc494c
          cp "$CHECKPOINT" "$WORK/resume/source-stable-checkpoint.sstate"
          cp "$DIALOG_CHECKPOINT" "$WORK/resume/dialog-entry-f178.sstate"
          chmod 400 "$WORK/resume/dialog-entry-f178.sstate"
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          echo "DIAG_ENTRY_CHECKPOINT_BYTES=21162258" | tee "$WORK/captures/diagnostic-report.txt"
          echo "DIAG_ENTRY_CHECKPOINT_SHA256=c47d2069ae9b1e589cce35df2dbaaa867b3365acfd501d2666a72ecd5fcc494c" | tee -a "$WORK/captures/diagnostic-report.txt"
          echo "DIAG_ENTRY_CHECKPOINT_SOURCE=previous verified run #39563209277, captured at frame 178 before START" | tee -a "$WORK/captures/diagnostic-report.txt"
          echo "DIAG_EMULATOR_VALID=PASS"
          echo "DIAG_SOURCE_CHECKPOINT_VALID=PASS bytes=21163483 sha256=b7d86f572f929d13aeb24d9b710e455610c2723f336b68acf32f7cca2e8fe4ee"
          echo "DIAG_SOURCE_CHECKPOINT_READ_ONLY=YES"
          echo "DIAG_MEMORY_CARD_VALID=PASS"

      - name: Download and verify private game and BIOS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0]); h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("DIAG_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Restore dialog checkpoint, timestamp VSync, and watch for a stall using external X11
        if: success()
        shell: bash
        run: |
          set -u
          cd "$WORK"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          if [ ! -s "$WORK/resume/dialog-entry-f178.sstate" ]; then
            echo "DIAG_NONE_RESULT=SKIPPED_NO_DIALOG_CHECKPOINT" | tee -a "$WORK/captures/diagnostic-report.txt"
            exit 0
          fi
          mkdir -p "$WORK/runtime"
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb-none.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          echo "DIAG_GALLIUM_DRIVER_REQUESTED=${GALLIUM_DRIVER:-default}" | tee -a "$WORK/captures/diagnostic-report.txt"
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          command -v xwd >/dev/null
          command -v convert >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("DIAG_NONE_PAD_SETUP=PASS")
          LUA
          )
          cat > "$WORK/restore-no-input.lua" <<'LUA'
          local frame=0
          local started=false
          local returned=false
          local loaded=false
          local captures={[1]=true,[8]=true,[16]=true,[24]=true,[32]=true,[40]=true,[48]=true,[56]=true,[64]=true,[72]=true,[80]=true,[88]=true,[96]=true,[104]=true,[112]=true,[116]=true,[117]=true,[118]=true,[119]=true,[120]=true,[121]=true,[122]=true,[123]=true,[124]=true,[125]=true,[126]=true,[128]=true,[130]=true}
          local function log(s) print(s); io.stdout:flush() end
          local function shot(f)
              local s=PCSX.GPU.takeScreenShot()
              assert(s and s.width>=100 and s.height>=100 and s.data,"invalid screenshot")
              local bpp=(s.bpp==0) and 16 or 24
              local label="DIAG-NONE-f"..string.format("%03d",f)
              local rawpath="captures/raw/"..label..".raw"
              local raw=assert(Support.File.open(rawpath,"TRUNCATE")); raw:writeMoveSlice(s.data); raw:close()
              local m=assert(io.open("captures/"..label..".json","wb"))
              m:write(string.format('{"label":"%s","raw":"%s","width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',label,rawpath,s.width,s.height,bpp,s.width*s.height*bpp/8)); m:close()
              log(string.format("DIAG_NONE_SCREENSHOT label=%s width=%d height=%d",label,s.width,s.height))
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("DIAG_NONE_LOAD_EVENT=PASS")
          end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not started then
                  started=true; log("DIAG_NONE_LOAD_BEGIN"); PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/dialog-entry-f178.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("DIAG_NONE_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      returned=true; log("DIAG_NONE_LOAD_RETURNED=1"); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not returned then return end
              frame=frame+1
              log(string.format("DIAG_NONE_FRAME=%d input=NONE",frame))
              if captures[frame] then shot(frame) end
              if frame==175 then
                  log("DIAG_NONE_BRANCH_DONE frame=175 input=NONE")
                  PCSX.pauseEmulator(); PCSX.nextTick(function() PCSX.quit(0) end)
                  return
              end
          end)
          log("DIAG_NONE_READY")
          LUA
          cp "$WORK/restore-no-input.lua" "$WORK/captures/restore-no-input.lua"
          cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/card-DIAGNONE.mcd"
          echo "DIAG_NO_START_INPUT_SENT=YES" | tee -a "$WORK/captures/diagnostic-report.txt"
          echo "DIAG_SCREENSHOT_CUTOFF_FRAME=130; watchdog external-capture gate begins at frame 135; no internal screenshot request from frame 131 onward" | tee -a "$WORK/captures/diagnostic-report.txt"
          set +e
          ulimit -c unlimited
          echo "DIAG_CORE_SOFT_LIMIT=$(ulimit -Sc)" | tee -a "$WORK/captures/diagnostic-report.txt"
          if [ -r /proc/sys/kernel/core_pattern ]; then echo "DIAG_KERNEL_CORE_PATTERN=$(cat /proc/sys/kernel/core_pattern)" | tee -a "$WORK/captures/diagnostic-report.txt"; else echo "DIAG_KERNEL_CORE_PATTERN=UNREADABLE" | tee -a "$WORK/captures/diagnostic-report.txt"; fi
          echo "DIAG_LAUNCHER_FILE=$(file -b "$WORK/squashfs-root/AppRun")" | tee -a "$WORK/captures/diagnostic-report.txt"
          echo "DIAG_LAUNCHER_REALPATH=$(readlink -f "$WORK/squashfs-root/AppRun" || true)" | tee -a "$WORK/captures/diagnostic-report.txt"
          export SEGFAULT_SIGNALS=all SEGFAULT_USE_ALTSTACK=1
          if command -v catchsegv >/dev/null 2>&1; then
            echo "DIAG_NATIVE_TRACE_MODE=catchsegv path=$(command -v catchsegv)" | tee -a "$WORK/captures/diagnostic-report.txt"
            signal_wrapper="$(command -v catchsegv)"
            timeout --signal=TERM --kill-after=3s 60s "$signal_wrapper" "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-DIAGNONE.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/restore-no-input.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/pcsx-DIAGNONE.log" -run > "$WORK/captures/pcsx-DIAGNONE.stdout" 2>&1 &
          else
            signal_library="$(find /lib /usr/lib -type f -name libSegFault.so -print -quit 2>/dev/null)"
            test -n "$signal_library"
            echo "DIAG_NATIVE_TRACE_MODE=LD_PRELOAD path=$signal_library" | tee -a "$WORK/captures/diagnostic-report.txt"
            export LD_PRELOAD="$signal_library${LD_PRELOAD:+:$LD_PRELOAD}"
            timeout --signal=TERM --kill-after=3s 60s "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-DIAGNONE.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/restore-no-input.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/pcsx-DIAGNONE.log" -run > "$WORK/captures/pcsx-DIAGNONE.stdout" 2>&1 &
          fi
          timeout_pid=$!
          python3 - "$timeout_pid" "$WORK/captures/pcsx-DIAGNONE.stdout" "$WORK/captures" <<'PY'
          import os, re, signal, sys, time, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image, ImageChops
          timeout_pid=int(sys.argv[1])
          stdout=Path(sys.argv[2])
          out=Path(sys.argv[3])
          watchdog=out/"vsync-watchdog.log"
          last_frame=0
          last_progress=time.monotonic()
          captured=False
          def utc():
              return datetime.now(timezone.utc).isoformat()
          def log(message):
              line=f"utc={utc()} monotonic_s={time.monotonic():.6f} {message}"
              with watchdog.open("a",encoding="utf-8") as f: f.write(line+"\n")
              print(line,flush=True)
          def frame_now():
              try: text=stdout.read_text(errors="replace")
              except FileNotFoundError: return 0
              frames=re.findall(r"DIAG_NONE_FRAME=(\d+)",text)
              return int(frames[-1]) if frames else 0
          def capture(label):
              xwd=out/(label+".xwd")
              png=out/(label+".png")
              run=subprocess.run(["xwd","-root","-silent","-out",str(xwd)],capture_output=True,text=True)
              log(f"X11_CAPTURE_BEGIN label={label} method=xwd-root-external xwd_rc={run.returncode}")
              if run.returncode==0 and xwd.is_file() and xwd.stat().st_size>0:
                  conv=subprocess.run(["convert",str(xwd),str(png)],capture_output=True,text=True)
                  log(f"X11_CAPTURE_CONVERT label={label} rc={conv.returncode} bytes={png.stat().st_size if png.exists() else 0}")
                  try:
                      with Image.open(png) as im:
                          colors=im.getcolors(maxcolors=1000000)
                          valid=im.size==(1280,800) and im.width>=100 and im.height>=100 and png.stat().st_size>1000 and not (colors is not None and len(colors)==1)
                          log(f"X11_CAPTURE_VERIFY label={label} size={im.size} colors={len(colors) if colors is not None else 'many'} valid={valid}")
                  except Exception as e: log(f"X11_CAPTURE_VERIFY label={label} error={e}")
              else:
                  log(f"X11_CAPTURE_FAILED label={label} error={run.stderr.strip()}")
              try: xwd.unlink()
              except FileNotFoundError: pass
          log("WATCHDOG_START source=stdout-frame-observer; clock=time.monotonic; input=NONE")
          while True:
              now=time.monotonic()
              f=frame_now()
              if f>last_frame:
                  log(f"FRAME_OBSERVED frame={f} frames_since_previous={f-last_frame}")
                  last_frame=f
                  last_progress=now
              state=subprocess.run(["ps","-o","stat=","-p",str(timeout_pid)],capture_output=True,text=True)
              proc_state=state.stdout.strip()
              alive=bool(proc_state) and not proc_state.startswith("Z")
              if not alive:
                  log(f"PROCESS_WRAPPER_EXITED last_frame={last_frame}")
                  break
              if last_frame>=135 and not captured and now-last_progress>=2.5:
                  captured=True
                  log(f"STALL_CONFIRMED last_frame={last_frame} no_new_frame_observed_s={now-last_progress:.3f}")
                  try:
                      ps=subprocess.run(["ps","-eo","pid,ppid,stat,pcpu,etime,wchan:32,comm,args"],capture_output=True,text=True)
                      selected=[line for line in ps.stdout.splitlines() if ("AppRun" in line or "PCSX" in line or "timeout --signal=TERM" in line)]
                      (out/"process-state-at-stall.txt").write_text("\n".join(selected)+"\n",encoding="utf-8")
                      log("PROCESS_STATE_CAPTURED file=process-state-at-stall.txt rows="+str(len(selected)))
                  except Exception as e: log("PROCESS_STATE_CAPTURE_ERROR="+str(e))
                  tree=subprocess.run(["xwininfo","-root","-tree"],capture_output=True,text=True)
                  (out/"x11-window-tree-at-stall.txt").write_text(tree.stdout+tree.stderr,encoding="utf-8")
                  log("X11_WINDOW_TREE_CAPTURED rc="+str(tree.returncode))
                  capture("X11-stall-first")
                  time.sleep(2.0)
                  after=frame_now()
                  log(f"SECOND_CAPTURE_CHECK frame_before={last_frame} frame_after={after} unchanged={after==last_frame}")
                  if after==last_frame:
                      capture("X11-stall-second")
                      try:
                          with Image.open(out/"X11-stall-first.png") as a, Image.open(out/"X11-stall-second.png") as b:
                              same=a.size==b.size and ImageChops.difference(a.convert("RGB"),b.convert("RGB")).getbbox() is None
                          log("X11_SCREEN_EQUAL_EXACT="+str(same))
                      except Exception as e: log("X11_SCREEN_COMPARE_ERROR="+str(e))
                  else:
                      log("STALL_CONTINUED_CAPTURE_SKIPPED reason=frame_advanced")
                  # Do not interrupt the emulator after capturing the stalled display.
                  # Leave the process untouched to allow a delayed natural SIGSEGV and
                  # its catchsegv trace to occur. The outer timeout(60s) bounds the run.
                  log("NATURAL_CRASH_OBSERVATION_CONTINUES_UNINTERRUPTED outer_timeout_s=60")
              time.sleep(0.1)
          log(f"WATCHDOG_END last_frame={last_frame} external_pair_captured={captured}")
          PY
          wait "$timeout_pid"
          rc=$?
          set -e
          echo "DIAG_NONE_PROCESS_EXIT_CODE=$rc" | tee -a "$WORK/captures/diagnostic-report.txt"
          grep -E 'DIAG_NONE_(LOAD_EVENT|LOAD_RETURNED|FRAME=|SCREENSHOT|BRANCH_DONE|.*ERROR)' "$WORK/captures/pcsx-DIAGNONE.stdout" || true
          frames="$( (grep -oE 'DIAG_NONE_FRAME=[0-9]+' "$WORK/captures/pcsx-DIAGNONE.stdout" || true) | sed 's/.*=//' | sort -n | tail -1)"
          if [ -z "$frames" ]; then frames=0; fi
          echo "DIAG_NONE_LAST_FRAME=$frames input=NONE" | tee -a "$WORK/captures/diagnostic-report.txt"
          if grep -Eiq 'Segmentation fault|Backtrace:|signal SIGSEGV' "$WORK/captures/pcsx-DIAGNONE.stdout"; then
            echo "DIAG_NONE_RESULT=SIGSEGV_SIGNAL_HANDLER_TRACE_CAPTURED_NO_START" | tee -a "$WORK/captures/diagnostic-report.txt"
          elif [ "$rc" -eq 139 ]; then
            echo "DIAG_NONE_RESULT=SEGMENTATION_FAULT_NO_HANDLER_TRACE" | tee -a "$WORK/captures/diagnostic-report.txt"
          elif [ "$rc" -eq 143 ] && [ "$frames" -ge 1 ]; then
            echo "DIAG_NONE_RESULT=STALL_CAPTURED_NO_NATURAL_SIGSEGV_IN_OBSERVATION_WINDOW" | tee -a "$WORK/captures/diagnostic-report.txt"
          elif [ "$rc" -eq 255 ] && [ "$frames" -ge 1 ] && ! grep -Eiq 'Segmentation fault|Backtrace:|signal SIGSEGV' "$WORK/captures/pcsx-DIAGNONE.stdout"; then
            echo "DIAG_NONE_RESULT=STALL_OR_TIMEOUT_WITHOUT_NATURAL_SIGSEGV_TRACE catchsegv_wrapper_rc=255" | tee -a "$WORK/captures/diagnostic-report.txt"
          elif [ "$rc" -eq 0 ] && grep -q 'DIAG_NONE_BRANCH_DONE frame=175' "$WORK/captures/pcsx-DIAGNONE.stdout"; then
            echo "DIAG_NONE_RESULT=PASS_175_VSYNC_NO_INPUT" | tee -a "$WORK/captures/diagnostic-report.txt"
          elif [ "$rc" -eq 124 ] && [ "$frames" -ge 1 ]; then
            echo "DIAG_NONE_RESULT=STALL_OR_TIMEOUT_WITHOUT_START" | tee -a "$WORK/captures/diagnostic-report.txt"
          else
            echo "DIAG_NONE_RESULT=INCONCLUSIVE rc=$rc" | tee -a "$WORK/captures/diagnostic-report.txt"
          fi

      - name: Analyze native core dump and collect backtrace without uploading memory image
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$WORK/captures"
          cd "$WORK"
          report="$WORK/captures/native-crash-backtrace.txt"
          {
            echo "DIAG_COREDUMP_ANALYSIS_BEGIN=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "DIAG_CORE_SOFT_LIMIT=$(ulimit -Sc)"
            echo "DIAG_CORE_HARD_LIMIT=$(ulimit -Hc)"
            if [ -r /proc/sys/kernel/core_pattern ]; then printf 'DIAG_KERNEL_CORE_PATTERN='; cat /proc/sys/kernel/core_pattern; fi
            echo "DIAG_COREDUMP_FILTER=$(cat /proc/self/coredump_filter 2>/dev/null || echo unavailable)"
          } > "$report"
          exe="$WORK/squashfs-root/AppRun"
          resolved="$(readlink -f "$exe" 2>/dev/null)"
          if [ -n "$resolved" ] && file -b "$resolved" 2>/dev/null | grep -q 'ELF'; then
            native="$resolved"
          else
            native=""
            for candidate in "$WORK"/squashfs-root/usr/bin/*; do
              [ -f "$candidate" ] || continue
              case "$(basename "$candidate")" in *pcsx*|*PCSX*|*redux*|*Redux*) ;;
                *) continue ;;
              esac
              if file -b "$candidate" 2>/dev/null | grep -q 'ELF'; then native="$candidate"; break; fi
            done
          fi
          echo "DIAG_NATIVE_EXECUTABLE=${native:-NOT_FOUND}" >> "$report"
          if [ -n "$native" ]; then echo "DIAG_NATIVE_EXECUTABLE_FILE=$(file -b "$native")" >> "$report"; fi
          {
            echo "DIAG_CORE_CANDIDATES_BEGIN"
            find "$WORK" -maxdepth 4 -type f \( -name 'core' -o -name 'core.*' -o -name '*.core' \) -printf '%p bytes=%s\n' 2>/dev/null
            echo "DIAG_CORE_CANDIDATES_END"
          } >> "$report"
          core="$(find "$WORK" -maxdepth 4 -type f \( -name 'core' -o -name 'core.*' -o -name '*.core' \) -size +1M -print -quit 2>/dev/null)"
          if [ -n "$core" ]; then
            echo "DIAG_CORE_FOUND=$core" >> "$report"
            echo "DIAG_CORE_BYTES=$(stat -c %s "$core" 2>/dev/null)" >> "$report"
            if [ -n "$native" ] && command -v gdb >/dev/null 2>&1; then
              timeout 150s gdb -q -batch "$native" "$core" \
                -ex 'set pagination off' \
                -ex 'set print thread-events off' \
                -ex 'info files' \
                -ex 'info threads' \
                -ex 'thread apply all bt 64' \
                -ex 'info registers' \
                -ex 'info proc mappings' >> "$report" 2>&1
              echo "DIAG_GDB_POSTMORTEM_RC=$?" >> "$report"
            else
              echo "DIAG_GDB_POSTMORTEM=SKIPPED reason=native_executable_or_gdb_missing" >> "$report"
            fi
            rm -f "$core"
            echo "DIAG_CORE_MEMORY_IMAGE_UPLOADED=NO deleted_after_local_analysis=YES" >> "$report"
          else
            echo "DIAG_CORE_FOUND=NO" >> "$report"
            echo "DIAG_GDB_POSTMORTEM=NOT_RUN" >> "$report"
          fi
          session="$WORK/captures/pcsx-DIAGNONE.stdout"
          if [ -s "$session" ] && grep -Eiq 'Segmentation fault|Backtrace:|signal SIGSEGV|stack trace' "$session"; then
            echo "DIAG_NATIVE_SIGNAL_TRACE_CAPTURED=YES" >> "$report"
            echo "DIAG_NATIVE_SIGNAL_TRACE_BEGIN" >> "$report"
            awk '/Segmentation fault|Backtrace:|signal SIGSEGV|Register dump|stack trace|Memory map:/{printing=1} printing {print}' "$session" >> "$report"
            echo "DIAG_NATIVE_SIGNAL_TRACE_END" >> "$report"
          else
            echo "DIAG_NATIVE_SIGNAL_TRACE_CAPTURED=NO" >> "$report"
          fi
          cat "$report"
          
      - name: Convert and verify original emulator screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path("captures")
          problems=[]
          converted=[]
          for mp in sorted(root.glob("DIAG-*.json")):
              try:
                  m=json.loads(mp.read_text())
                  raw_path=(root/m["raw"].split("captures/",1)[-1]) if m["raw"].startswith("captures/") else Path(m["raw"])
                  raw=raw_path.read_bytes()
                  w,h,bpp=int(m["width"]),int(m["height"]),int(m["bpp"])
                  expected=int(m["expected_bytes"])
                  if not raw:
                      problems.append(mp.name+":empty_raw_buffer"); continue
                  if w<100 or h<100:
                      problems.append(mp.name+":invalid_dimensions"); continue
                  if expected<=0 or expected != w*h*bpp//8:
                      problems.append(mp.name+":invalid_expected_bytes"); continue
                  if len(raw)!=expected:
                      problems.append(mp.name+":wrong_bytes="+str(len(raw))+"_expected="+str(expected)); continue
                  if bpp==16:
                      rgb=bytearray()
                      for p in range(0,len(raw),2):
                          v=raw[p] | (raw[p+1]<<8)
                          rgb.extend(((v&31)*255//31,((v>>5)&31)*255//31,((v>>10)&31)*255//31))
                      im=Image.frombytes("RGB",(w,h),bytes(rgb))
                  elif bpp==24:
                      im=Image.frombytes("RGB",(w,h),raw)
                  else:
                      problems.append(mp.name+":unsupported_bpp="+str(bpp)); continue
                  colors=im.getcolors(maxcolors=2)
                  if colors is not None and len(colors)==1:
                      problems.append(mp.name+":uniform_blank_frame"); continue
                  out=root/(m["label"]+".png")
                  im.save(out,optimize=True)
                  if not out.is_file() or out.stat().st_size<=0:
                      problems.append(mp.name+":empty_png"); continue
                  converted.append(m["label"])
              except Exception as e:
                  problems.append(mp.name+":"+str(e))
          for required in (root/"DIAG-NONE-f130.png",):
              if not required.is_file() or required.stat().st_size<=0:
                  problems.append("missing_required_pre-cutoff_capture_"+required.name)
          for mp in root.glob("DIAG-*.json"):
              try:
                  label=json.loads(mp.read_text())["label"]
                  frame=int(label.rsplit("f",1)[1])
                  if frame>130:
                      problems.append(mp.name+":screenshot_after_cutoff")
              except Exception as e:
                  problems.append(mp.name+":invalid_label:"+str(e))
          if not converted:
              problems.append("no_valid_original_screenshots")
          (root/"screenshot-verification.txt").write_text("\n".join(["DIAG_SCREENSHOT_COUNT="+str(len(converted)),"DIAG_SCREENSHOTS="+",".join(converted),"DIAG_SCREENSHOT_PROBLEMS="+("; ".join(problems) if problems else "none"),"DIAG_EMPTY_OR_UNIFORM_SCREENSHOTS_ACCEPTED=NO"])+"\n")
          print((root/"screenshot-verification.txt").read_text(),end="")
          if problems: raise SystemExit("invalid, empty, uniform, or incomplete original screenshot evidence")
          PY
          source_hash="$(sha256sum "$WORK/resume/source-stable-checkpoint.sstate" | cut -d ' ' -f1)"
          test "$source_hash" = b7d86f572f929d13aeb24d9b710e455610c2723f336b68acf32f7cca2e8fe4ee
          echo "DIAG_SOURCE_CHECKPOINT_HASH_UNCHANGED=PASS sha256=$source_hash" | tee -a "$WORK/captures/diagnostic-report.txt"
          echo "DIAG_NO_START_INPUT_SENT=YES" | tee -a "$WORK/captures/diagnostic-report.txt"
          echo "DIAG_GAMEPLAY_PROGRESS_NOT_ASSERTED=YES" | tee -a "$WORK/captures/diagnostic-report.txt"

      - name: Upload private diagnostic screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-dialog-freeze-diagnostic-private
          path: |
            /tmp/naruto-dialog-freeze-diagnostic/captures/*.png
            /tmp/naruto-dialog-freeze-diagnostic/captures/*.txt
            /tmp/naruto-dialog-freeze-diagnostic/captures/*.stdout
            /tmp/naruto-dialog-freeze-diagnostic/captures/*.log
            /tmp/naruto-dialog-freeze-diagnostic/captures/*.json
            /tmp/naruto-dialog-freeze-diagnostic/captures/raw/*.raw
            /tmp/naruto-dialog-freeze-diagnostic/captures/*.sstate
          if-no-files-found: warn
          retention-days: 14

      - name: Remove source checkpoint, generated checkpoint, Memory Card, ROM, and BIOS from runner
        if: always()
        shell: bash
        run: rm -rf "$WORK"
