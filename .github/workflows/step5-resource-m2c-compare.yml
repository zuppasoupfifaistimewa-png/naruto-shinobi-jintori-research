name: Step 5 — targeted DATA.BIN entry-1 Ghidra/m2c comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step5-resource-m2c-compare.yml"
      - "tools/step5/ExportResourceFunction.java"
      - "tools/step5_resource_m2c_compare.py"

permissions:
  contents: read

concurrency:
  group: step5-resource-m2c-compare
  cancel-in-progress: false

jobs:
  compare-entry1-function:
    name: Compare one entry-1 function at the same address
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
      M2C_COMMIT: "c632946b8cfbe8fce442b522dba92dfa72f1f317"
    steps:
      - name: Checkout the permitted research repository
        uses: actions/checkout@v4

      - name: Install disc extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso unzip

      - name: Extract and validate DATA.BIN entry 1 on runner only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/step5-resource"
          source="$root/source"
          input="$root/input"
          output="$root/output"
          mkdir -p "$source/extracted-root" "$input" "$output"
          bin="$source/disc.bin"
          cue_raw="$source/original.cue"
          cue="$source/disc.cue"
          bin_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873"
          cue_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760"
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 --max-time 600 "$bin_url" --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 --max-time 60 "$cue_url" --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status
          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          source, destination = map(Path, sys.argv[1:3])
          lines = source.read_text(encoding="utf-8").splitlines()
          rewritten, count = [], 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  match = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not match:
                      raise SystemExit("Unrecognized CUE FILE directive")
                  line = match.group(1) + '"disc.bin"' + match.group(2)
                  count += 1
              rewritten.append(line)
          if count != 1:
              raise SystemExit(f"Expected one FILE directive, got {count}")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY
          bchunk "$bin" "$cue" "$source/track"
          iso="$(find "$source" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$source/extracted-root" > "$output/disc-extraction.log" 2>&1
          data="$(find "$source/extracted-root" -type f -iname 'DATA.BIN' -print -quit)"
          [[ -n "$data" && -f "$data" && "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status
          python3 - "$data" "$input/DATA_BIN_ENTRY_0001.bin" "$output/input-validation.txt" <<'PY'
          from pathlib import Path
          import hashlib, sys
          src, dst, report = map(Path, sys.argv[1:4])
          blob = src.read_bytes()[0x10BB000:0x10BB000 + 596412]
          digest = hashlib.sha256(blob).hexdigest()
          expected = "9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a"
          if len(blob) != 596412 or digest != expected:
              raise SystemExit(f"Entry 1 mismatch: bytes={len(blob)} sha256={digest}")
          dst.write_bytes(blob)
          report.write_text(
              "resource=DATA.BIN entry index 1\nfile_offset=0x10BB000\n"
              f"bytes={len(blob)}\nsha256={digest}\n"
              "load_base=0x800D0000\nload_base_status=HYPOTHESIS_ONLY\n"
              "binary_uploaded_as_artifact=no\n", encoding="utf-8")
          PY
          rm -rf "$source"
          echo "Entry 1 slice retained only in RUNNER_TEMP; disc image and extracted tree removed."

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Restore cached Ghidra
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          fi

      - name: Install MIPS disassembler and pinned m2c
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "spimdisasm==1.42.4"
          python3 -m pip install --disable-pip-version-check --no-input "m2c @ git+https://github.com/matt-kempster/m2c.git@$M2C_COMMIT"
          python3 -m pip show spimdisasm m2c > "$RUNNER_TEMP/step5-resource-tool-versions.txt"
          echo "m2c_commit=$M2C_COMMIT" >> "$RUNNER_TEMP/step5-resource-tool-versions.txt"

      - name: Ghidra analyze the candidate resource function
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/step5-resource"
          input="$root/input/DATA_BIN_ENTRY_0001.bin"
          output="$root/output"
          mkdir -p "$output" "$RUNNER_TEMP/step5-resource-ghidra-project"
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          [[ -n "$headless" && -x "$headless" ]]
          "$headless" "$RUNNER_TEMP/step5-resource-ghidra-project" DATA_BIN_entry1_target_audit \
            -import "$input" -loader BinaryLoader \
            -loader-baseAddr 0x800D0000 -loader-length 0x919BC \
            -loader-blockName DATA_BIN_ENTRY_0001 \
            -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/step5" \
            -postScript ExportResourceFunction.java "$output/ghidra-resource-function.txt" 0x800ED8C8 \
            -analysisTimeoutPerFile 600 -max-cpu 2 -deleteProject \
            > "$output/ghidra-headless.log" 2>&1
          [[ -s "$output/ghidra-resource-function.txt" ]]
          grep -E '^(analysis=|resource=|hypothetical_load_base=|function_entry_validation=|function_entry=|function_body_bytes=|function_end_exclusive=|rng_callsite_|decompile_status=|export_status=)' "$output/ghidra-resource-function.txt" || true

      - name: Compare exact Ghidra body to m2c at same address
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/step5-resource"
          python3 tools/step5_resource_m2c_compare.py \
            --resource "$root/input/DATA_BIN_ENTRY_0001.bin" \
            --ghidra-report "$root/output/ghidra-resource-function.txt" \
            --out-dir "$root/output/compare" \
            --report "$root/output/step5-resource-m2c-comparison.md" \
            --tool-versions "$RUNNER_TEMP/step5-resource-tool-versions.txt"
          cat "$root/output/step5-resource-m2c-comparison.md"

      - name: Upload text-only analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step5-resource-entry1-m2c
          path: |
            ${{ runner.temp }}/step5-resource/output/**/*.txt
            ${{ runner.temp }}/step5-resource/output/**/*.md
            ${{ runner.temp }}/step5-resource/output/**/*.c
            ${{ runner.temp }}/step5-resource/output/**/*.s
            ${{ runner.temp }}/step5-resource/output/**/*.log
            ${{ runner.temp }}/step5-resource/output/*.txt
            ${{ runner.temp }}/step5-resource-tool-versions.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary private resource and project
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/step5-resource"
          rm -rf "$RUNNER_TEMP/step5-resource-ghidra-project"
          rm -f "$RUNNER_TEMP/step5-resource-tool-versions.txt"
