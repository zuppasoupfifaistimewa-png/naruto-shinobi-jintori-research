            fetch_asset() {
              name="$1"; dest="$2"; bytes="$3"; digest="$4"
              id="$(jq -r --arg n "$name" '.assets[]? | select(.name==$n) | .id' "$RELEASE" | head -n 1)"
              test -n "$id" && test "$id" != null
              curl --fail --silent --show-error --location --max-time 600 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$dest"
              test "$(stat -c %s "$dest")" = "$bytes"
