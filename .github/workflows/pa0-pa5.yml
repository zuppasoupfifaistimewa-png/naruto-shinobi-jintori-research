name: PA0-PA5 isolated harness repair and CONTROL audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pa0-pa5.yml"
      - "tools/pa/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-pa0-pa5-isolated
  cancel-in-progress: false

jobs:
  static:
    name: pa0-pa3-pa5-static
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      dest: ${{ steps.publish.outputs.dest }}
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
      BASELINE_INCLUSIVE: 3f730c73dc628d02f360b7ac12961e6f3e4b1584
      GHIDRA_ASSET: ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
      WORK: /tmp/naruto-pa-private-${{ github.run_id }}-${{ github.run_attempt }}-static
      OUT: /tmp/naruto-pa-output-${{ github.run_id }}-${{ github.run_attempt }}-static
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: PA0 self-test before downloads or Ghidra
        id: selftest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pa" "$OUT" "$WORK/pycache"
          cp tools/pa/RunPA0PA5.pytxt "$RUNNER_TEMP/pa/RunPA0PA5.py"
          cp tools/pa/RunPA4Control.pytxt "$RUNNER_TEMP/pa/RunPA4Control.py"
          cp tools/pa/PA0_HarnessSelfTest.pytxt "$RUNNER_TEMP/pa/PA0_HarnessSelfTest.py"
          python3 "$RUNNER_TEMP/pa/PA0_HarnessSelfTest.py" \
            "$RUNNER_TEMP/pa/RunPA0PA5.py" "$RUNNER_TEMP/pa/RunPA4Control.py" "$OUT/PA0_HARNESS_SELFTEST.txt"
          if grep -nF 'delimiter="\\t"' "$RUNNER_TEMP/pa/RunPA0PA5.py"; then
            echo "SELFTEST_FAIL_LITERAL_BACKSLASH_T=1"
            exit 1
          fi

      - name: Install static dependencies and compile every Python source
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bchunk xorriso unzip python3-pip jq curl git
          python3 -m pip install --break-system-packages "capstone==5.0.3"
          python3 - "$OUT/PA0_PYCOMPILE.tsv" "$WORK/pycache" "$RUNNER_TEMP/pa" <<'PY'
          import csv,hashlib,py_compile,subprocess,sys
          from pathlib import Path
          out,cache,temp=Path(sys.argv[1]),Path(sys.argv[2]),Path(sys.argv[3])
          names=subprocess.check_output(["git","ls-files","-z","--","*.py"]).decode().split("\0")
          names=[x for x in names if x]
          names += [str(p) for p in sorted(temp.glob("*.py"))]
          rows=[]
          for name in names:
              target=cache/(hashlib.sha256(name.encode()).hexdigest()+".pyc")
              try:
                  py_compile.compile(name,cfile=str(target),doraise=True)
                  rows.append((name,"PASS",""))
              except Exception as exc:
                  rows.append((name,"FAIL",type(exc).__name__+":"+str(exc)))
          with out.open("w",encoding="utf-8",newline="") as f:
              w=csv.writer(f,delimiter="\t",lineterminator="\n")
              w.writerow(["path","status","reason"]);w.writerows(rows)
          passed=sum(x[1]=="PASS" for x in rows)
          print(f"PY_COMPILE_TOTAL={len(rows)} PY_COMPILE_PASS={passed} PY_COMPILE_FAIL={len(rows)-passed}")
          if not rows or passed!=len(rows):raise SystemExit(1)
          PY
          COUNT="$(($(wc -l < "$OUT/PA0_PYCOMPILE.tsv")-1))"
          echo "PA0_PYCOUNT=$COUNT" >> "$GITHUB_ENV"
          echo "PA0_COMPILE_EXIT=0" >> "$GITHUB_ENV"

      - name: Restore pinned Ghidra cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install pinned Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            ARCHIVE="$RUNNER_TEMP/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 \
              "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET" -o "$ARCHIVE"
            echo "$GHIDRA_SHA256  $ARCHIVE" | sha256sum --check --status
            unzip -q "$ARCHIVE" -d "$GHIDRA_CACHE_DIR"
            rm -f "$ARCHIVE"
          fi
          HEADLESS="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -x "$HEADLESS"
          echo "HEADLESS=$HEADLESS" >> "$GITHUB_ENV"

      - name: Download and verify EXE and Entry 1 privately
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$RESEARCH_REPO"
          BIN="$WORK/source/naruto-disc.bin"
          CUE_RAW="$WORK/source/original.cue"
          CUE="$WORK/source/naruto-disc.cue"
          mkdir -p "$WORK/source" "$WORK/extracted" "$WORK/input" "$WORK/scripts" "$WORK/ghidra-exe" "$WORK/ghidra-entry1" "$WORK/ghidra-logs" "$OUT"
          curl --fail --silent --show-error --location --retry 2 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/647346873" -o "$BIN"
          test "$(stat -c %s "$BIN")" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $BIN" | sha256sum --check --status
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/647354760" -o "$CUE_RAW"
          test "$(stat -c %s "$CUE_RAW")" = 116
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $CUE_RAW" | sha256sum --check --status
          python3 - "$CUE_RAW" "$CUE" <<'PY'
          from pathlib import Path
          import re,sys
          src,dst=map(Path,sys.argv[1:3]); lines=[]; count=0
          for line in src.read_text(encoding="utf-8-sig").splitlines():
              if line.lstrip().upper().startswith("FILE "):
                  m=re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$',line,re.I)
                  if not m:raise SystemExit("INVALID_CUE_FILE_DIRECTIVE")
                  line=m.group(1)+'"naruto-disc.bin"'+m.group(2);count+=1
              lines.append(line)
          if count!=1:raise SystemExit("CUE_FILE_DIRECTIVE_COUNT="+str(count))
          dst.write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          bchunk "$BIN" "$CUE" "$WORK/source/track"
          ISO="$(find "$WORK/source" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          test -n "$ISO"
          xorriso -osirrox on -indev "$ISO" -extract / "$WORK/extracted" > "$WORK/source/extract.log" 2>&1
          EXE="$(find "$WORK/extracted" -type f -iname 'SLPS_035.53' -print -quit)"
          DATA="$(find "$WORK/extracted" -type f -iname 'DATA.BIN' -print -quit)"
          test -n "$EXE" && test -n "$DATA"
          test "$(stat -c %s "$EXE")" = 385024
          echo "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569  $EXE" | sha256sum --check --status
          test "$(stat -c %s "$DATA")" = 66015232
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $DATA" | sha256sum --check --status
          cp "$EXE" "$WORK/input/SLPS_035.53"
          python3 - "$DATA" "$WORK/input/ENTRY1.bin" <<'PY'
          from pathlib import Path
          import hashlib,struct,sys
          data=Path(sys.argv[1]).read_bytes()
          lbn,size=struct.unpack_from("<II",data,0x4c);off=(lbn-212)*2048
          entry=data[off:off+size]
          if (lbn,size,off,len(entry))!=(8778,596412,0x10BB000,596412):raise SystemExit("ENTRY1_DIRECTORY_MISMATCH")
          digest=hashlib.sha256(entry).hexdigest()
          if digest!="9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a":raise SystemExit("ENTRY1_SHA256_MISMATCH="+digest)
          Path(sys.argv[2]).write_bytes(entry)
          PY
          echo "EXTRACT_VERIFIED=1" >> "$GITHUB_OUTPUT"

      - name: Run Ghidra listings for requested static targets
        id: ghidra
        if: steps.extract.outputs.EXTRACT_VERIFIED == '1'
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE"/tools/ia-ghidra/*.java "$WORK/scripts/"
          cp "$GITHUB_WORKSPACE"/tools/ja-ghidra/*.java "$WORK/scripts/"
          set +e
          "$HEADLESS" "$WORK/ghidra-exe" Naruto_PA_EXE \
            -import "$WORK/input/SLPS_035.53" \
            -loader BinaryLoader -loader-baseAddr 0x80010000 -loader-fileOffset 0x800 -loader-length 0x5D800 \
            -processor "MIPS:LE:32:default" -scriptPath "$WORK/scripts" \
            -preScript PreparePsxExe.java \
            -postScript EnsureTargetFunctions.java 0x800154D4 0x8001552C 0x800121AC 0x800121F4 \
            -postScript ExportJATargetEvidence.java "$OUT/EXE_CODE.txt" 0x800154D4 0x8001552C \
            -analysisTimeoutPerFile 900 -max-cpu 2 -deleteProject > "$WORK/ghidra-logs/exe.log" 2>&1
          EXE_RC=$?
          "$HEADLESS" "$WORK/ghidra-entry1" Naruto_PA_ENTRY1 \
            -import "$WORK/input/ENTRY1.bin" \
            -loader BinaryLoader -loader-baseAddr 0x800AD450 -loader-length 0x919BC -loader-blockName ENTRY1_AT_800AD450 \
            -processor "MIPS:LE:32:default" -scriptPath "$WORK/scripts" \
            -postScript EnsureTargetFunctions.java 0x800B1E88 0x800B50AC 0x800B5020 0x800B2A58 0x800F2A9C 0x800F3658 0x800DC2E0 0x800BE5D8 0x800D49B0 0x800E3B1C \
            -postScript ExportJATargetEvidence.java "$OUT/ENTRY1_CODE.txt" 0x800B1E88 0x800B50AC 0x800B5020 0x800B2A58 0x800B24C8 0x800F5F54 0x800B54DC 0x800F5EBC 0x800BE5D8 0x800D49B0 0x800E3B1C \
            -analysisTimeoutPerFile 1200 -max-cpu 2 -deleteProject > "$WORK/ghidra-logs/entry1.log" 2>&1
          ENTRY_RC=$?
          set -e
          {
            echo "EXE_GHIDRA_EXIT=$EXE_RC"
            tail -n 80 "$WORK/ghidra-logs/exe.log" 2>/dev/null || true
            echo "ENTRY1_GHIDRA_EXIT=$ENTRY_RC"
            tail -n 100 "$WORK/ghidra-logs/entry1.log" 2>/dev/null || true
          } > "$OUT/PA_GHIDRA_DIAGNOSTICS.txt"
          echo "EXE_GHIDRA_EXIT=$EXE_RC" >> "$GITHUB_OUTPUT"
          echo "ENTRY1_GHIDRA_EXIT=$ENTRY_RC" >> "$GITHUB_OUTPUT"

      - name: Run PA0-PA3 and PA5 static analyzer
        id: analyzer
        if: steps.extract.outputs.EXTRACT_VERIFIED == '1'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PA0_PYCOUNT="${PA0_PYCOUNT:-0}" python3 "$RUNNER_TEMP/pa/RunPA0PA5.py" \
            "$WORK/input/SLPS_035.53" "$WORK/input/ENTRY1.bin" "$OUT" \
            "$OUT/EXE_CODE.txt" "$OUT/ENTRY1_CODE.txt"
          RC=$?
          set -e
          echo "PA0_ANALYZER_EXIT_CODE=$RC" > "$OUT/PA0_ANALYZER_EXIT.txt"
          echo "PA_ANALYZER_EXIT=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Remove private disc and extracted binaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          test ! -e "$WORK"
          echo "PRIVATE_INPUT_CLEANUP=PASS" > "$OUT/cleanup.txt"

      - name: Publish static text evidence and commit the run summary
        id: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEST="reports/stage1_economy/pa-run-$GITHUB_RUN_ID-static/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          find "$OUT" -maxdepth 1 -type f \( -name 'PA*.txt' -o -name 'PA*.tsv' -o -name 'PA*.md' -o -name 'cleanup.txt' \) -exec cp {} "$DEST/" \; 2>/dev/null || true
          ANALYSIS_RC="$(sed -n 's/^PA0_ANALYZER_EXIT_CODE=//p' "$DEST/PA0_ANALYZER_EXIT.txt" 2>/dev/null | head -n 1 || echo TIDAK_TAHU)"
          COMPILE_RC="${PA0_COMPILE_EXIT:-TIDAK_TAHU}"
          PY_SUMMARY="TIDAK TAHU"
          if [ -s "$DEST/PA0_PYCOMPILE.tsv" ]; then
            PY_SUMMARY="$(python3 - "$DEST/PA0_PYCOMPILE.tsv" <<'PY'
          import csv,sys
          rows=list(csv.DictReader(open(sys.argv[1],encoding="utf-8"),delimiter="\t"))
          print(f"{sum(x['status']=='PASS' for x in rows)}/{len(rows)}")
          PY
          )"
          fi
          if [ ! -s "$DEST/PA0_PA5_REPORT.md" ]; then
            printf '# PA0-PA5 static result\n\nPA static analyzer did not produce a complete report.\n' > "$DEST/PA0_PA5_REPORT.md"
          fi
          {
            echo
            echo "## Job and publication details"
            echo "JOB=pa0-pa3-pa5-static"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "PA0_SELFTEST=$([ -s "$DEST/PA0_HARNESS_SELFTEST.txt" ] && echo PASS || echo TIDAK_TAHU)"
            echo "PY_COMPILE=$PY_SUMMARY"
            echo "ANALYZER_EXIT_CODE=$ANALYSIS_RC"
            echo
            echo "## Static task scope"
            echo "PA1: callsite a2/a3, incoming edges, scene-base consumers and scene-chain."
            echo "PA2: s0 origin, M pointer, 144-byte row candidates, selector writers incl. E3B1C, v0 store paths, gp+0x118 v1 source."
            echo "PA3: B24C8 direct CFG reachability and twelve unresolved JALR target chains."
            echo "PA5 symbolic result is provisional; final H1/H2 falsifier review is in the PA5 dependent job."
            echo
            echo "## Commit file list"
            echo "See PA0_PUBLISH_COMMIT_FILES.tsv and PA0_COMMIT_LEDGER.tsv."
          } >> "$DEST/PA0_PA5_REPORT.md"
          JOB_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$RESEARCH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | jq -r '.jobs[] | select(.name=="pa0-pa3-pa5-static") | .id' | head -n 1)"
          STATUS=PARTIAL_OR_FAIL
          if [ "$ANALYSIS_RC" = "0" ] && [ "$COMPILE_RC" = "0" ] && [ "$PY_SUMMARY" != "TIDAK TAHU" ]; then STATUS=PASS; fi
          {
            echo "STATUS=$STATUS"
            echo "JOB=pa0-pa3-pa5-static"
            echo "JOB_ID=$JOB_ID"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXIT_CODE=$ANALYSIS_RC"
            echo "PY_COMPILE=$PY_SUMMARY"
            echo "SELFTEST=$([ -s "$DEST/PA0_HARNESS_SELFTEST.txt" ] && echo PASS || echo TIDAK_TAHU)"
            echo "PRIVATE_BINARY_COMMITTED=no"
            echo "RELEASES_MODIFIED=no"
          } > "$DEST/ACTIONS_RUN_SUMMARY.txt"
          git add -- "$DEST"
          git add -u -- reports/stage1_economy
          python3 - "$DEST" <<'PY'
          import subprocess,sys
          from pathlib import Path
          dest=Path(sys.argv[1])
          lines=subprocess.check_output(["git","diff","--cached","--name-status"],text=True).splitlines()
          bad=[]
          for line in lines:
              q=line.split("\t",1); p=q[-1]
              if p.startswith(str(dest)+"/"): continue
              if p.startswith("reports/stage1_economy/") and any("/"+x+"-run-" in p for x in ("ja","ka","la","ma","na","oa","pa")) and p.endswith(".tsv"): continue
              bad.append(line)
          if bad: raise SystemExit("UNAPPROVED_STAGED_PATHS="+repr(bad))
          with (dest/"PA0_PUBLISH_COMMIT_FILES.tsv").open("w",encoding="utf-8") as f:
              f.write("status\tpath\n")
              for line in lines:
                  q=line.split("\t",1); f.write(q[0]+"\t"+q[-1]+"\n")
              f.write("A\t"+str(dest/"PA0_PUBLISH_COMMIT_FILES.tsv")+"\n")
          PY
          git add -- "$DEST/PA0_PUBLISH_COMMIT_FILES.tsv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c pa-static-publish
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish PA0-PA3 static audit $GITHUB_RUN_ID [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          test "$PUSHED" = 1
          PUBLISH_SHA="$(git rev-parse HEAD)"
          REPORT_URL="https://raw.githubusercontent.com/$RESEARCH_REPO/$PUBLISH_SHA/$DEST/PA0_PA5_REPORT.md"
          SUMMARY_URL="https://raw.githubusercontent.com/$RESEARCH_REPO/$PUBLISH_SHA/$DEST/ACTIONS_RUN_SUMMARY.txt"
          REPORT_HTTP="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' "$REPORT_URL")"
          SUMMARY_HTTP="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' "$SUMMARY_URL")"
          echo "PUBLISH_SHA=$PUBLISH_SHA RAW_REPORT_HTTP=$REPORT_HTTP RAW_SUMMARY_HTTP=$SUMMARY_HTTP"
          test "$REPORT_HTTP" = 200 && test "$SUMMARY_HTTP" = 200
          echo "PUBLISHED_REPORT=$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISHED_SUMMARY=$SUMMARY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISH_SHA=$PUBLISH_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

  runtime:
    name: pa4-ha4-control
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      dest: ${{ steps.publish.outputs.dest }}
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
      WORK: /tmp/naruto-pa-private-${{ github.run_id }}-${{ github.run_attempt }}-runtime
      OUT: /tmp/naruto-pa-output-${{ github.run_id }}-${{ github.run_attempt }}-runtime
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: PA0 harness self-test before artifact or emulator download
        id: selftest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pa" "$WORK/source" "$WORK/resume" "$OUT" "$WORK/pycache"
          cp tools/pa/RunPA0PA5.pytxt "$RUNNER_TEMP/pa/RunPA0PA5.py"
          cp tools/pa/RunPA4Control.pytxt "$RUNNER_TEMP/pa/RunPA4Control.py"
          cp tools/pa/PA0_HarnessSelfTest.pytxt "$RUNNER_TEMP/pa/PA0_HarnessSelfTest.py"
          python3 "$RUNNER_TEMP/pa/PA0_HarnessSelfTest.py" "$RUNNER_TEMP/pa/RunPA0PA5.py" "$RUNNER_TEMP/pa/RunPA4Control.py" "$OUT/PA0_HARNESS_SELFTEST.txt"
          if grep -nF 'delimiter="\\t"' "$RUNNER_TEMP/pa/RunPA0PA5.py"; then exit 1; fi

      - name: Install runtime dependencies and compile every Python source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip python3-pip jq curl xvfb x11-utils zip git
          python3 - "$OUT/PA0_PYCOMPILE.tsv" "$WORK/pycache" "$RUNNER_TEMP/pa" <<'PY'
          import csv,hashlib,py_compile,subprocess,sys
          from pathlib import Path
          out,cache,temp=Path(sys.argv[1]),Path(sys.argv[2]),Path(sys.argv[3])
          names=subprocess.check_output(["git","ls-files","-z","--","*.py"]).decode().split("\0")
          names=[x for x in names if x]
          names += [str(p) for p in sorted(temp.glob("*.py"))]
          rows=[]
          for name in names:
              target=cache/(hashlib.sha256(name.encode()).hexdigest()+".pyc")
              try: py_compile.compile(name,cfile=str(target),doraise=True); rows.append((name,"PASS",""))
              except Exception as exc: rows.append((name,"FAIL",type(exc).__name__+":"+str(exc)))
          with out.open("w",encoding="utf-8",newline="") as f:
              w=csv.writer(f,delimiter="\t",lineterminator="\n"); w.writerow(["path","status","reason"]);w.writerows(rows)
          passed=sum(x[1]=="PASS" for x in rows)
          print(f"PY_COMPILE_TOTAL={len(rows)} PY_COMPILE_PASS={passed} PY_COMPILE_FAIL={len(rows)-passed}")
          if not rows or passed!=len(rows):raise SystemExit(1)
          PY

      - name: Validate HA4 artifact, checkpoint, emulator, disc and BIOS
        id: runtime_inputs
        shell: bash
        run: |
          set -uo pipefail
          RUNTIME_RC=99
          (
            set -euo pipefail
            API="https://api.github.com/repos/$RESEARCH_REPO"
            META="$WORK/source/ha4-artifact.json"
            ZIP="$WORK/source/ha4-private.zip"
            curl --fail --silent --show-error --location --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/actions/artifacts/12482055310" -o "$META"
            python3 - "$META" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          checks={"id":12482055310,"name":"naruto-storymode-adaptive-player-private","size_in_bytes":11407011,"digest":"sha256:a0f45156dfd489f24c8dc8e122c33a048c7b9ac34b935ac828523593d21ca2a8","expired":False}
          for k,v in checks.items():
              if j.get(k)!=v:raise SystemExit("HA4_ARTIFACT_METADATA_MISMATCH_"+k)
          if j.get("workflow_run",{}).get("id")!=39907655833:raise SystemExit("HA4_ARTIFACT_SOURCE_RUN_MISMATCH")
          print("HA4_ARTIFACT_METADATA=PASS")
          PY
            curl --fail --silent --show-error --location --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/actions/artifacts/12482055310/zip" -o "$ZIP"
            test "$(stat -c %s "$ZIP")" = 11407011
            echo "a0f45156dfd489f24c8dc8e122c33a048c7b9ac34b935ac828523593d21ca2a8  $ZIP" | sha256sum --check --status
            unzip -p "$ZIP" adaptive-cycle-02-f180.sstate > "$WORK/resume/adaptive-cycle-02-f180.sstate"
            test "$(stat -c %s "$WORK/resume/adaptive-cycle-02-f180.sstate")" = 21162799
            echo "705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35  $WORK/resume/adaptive-cycle-02-f180.sstate" | sha256sum --check --status
            RELEASE="$WORK/source/release.json"
