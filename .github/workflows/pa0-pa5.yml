            mkdir -p "$WORK/capstone" "$WORK/ffmpeg-libs"
            CAPSTONE_FILE="$(find -L "$APPDIR" -type f -name 'libcapstone.so.5' -print -quit)"
            test -n "$CAPSTONE_FILE"; cp -L "$CAPSTONE_FILE" "$WORK/capstone/libcapstone.so.5"
            while IFS= read -r -d '' lib; do cp -L "$lib" "$WORK/ffmpeg-libs/$(basename "$lib")"; done < <(find -L "$APPDIR" -type f \( -name 'libav*.so*' -o -name 'libsw*.so*' -o -name 'libpostproc.so*' \) -print0)
            test -s "$WORK/ffmpeg-libs/libavformat.so.63"
            Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/source/xvfb.log" 2>&1 &
            echo $! > "$WORK/source/xvfb.pid"
            export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
            for n in $(seq 1 80); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
            xdpyinfo -display "$DISPLAY" >/dev/null
            export LD_LIBRARY_PATH="$WORK/capstone:$WORK/ffmpeg-libs:$APPDIR/usr/lib:$APPDIR/usr/lib/x86_64-linux-gnu"
            export QT_PLUGIN_PATH="$APPDIR/usr/plugins"
            export QT_QPA_PLATFORM_PLUGIN_PATH="$APPDIR/usr/plugins/platforms"
            export QML2_IMPORT_PATH="$APPDIR/usr/qml"
            set +e
            python3 "$RUNNER_TEMP/pa/RunPA4Control.py" \
              --pcsx "$PCSX_BIN" --bios "$WORK/source/scph7502.bin" --cue "$WORK/source/game-run.cue" \
              --work "$WORK/runtime" --out "$OUT" --state "$WORK/resume/adaptive-cycle-02-f180.sstate"
            RUNTIME_RC=$?
            set -e
            exit "$RUNTIME_RC"
          )
          RUNTIME_RC=$?
          echo "PA4_RUNTIME_EXIT_CODE=$RUNTIME_RC" >> "$GITHUB_ENV"
          if [ ! -s "$OUT/PA4_RUNTIME_SUMMARY.txt" ]; then
            {
              echo "STATUS=TIDAK TAHU"
              echo "REASON=artifact_expired_or_restore_or_runtime_setup_failed; no cold boot or alternative path attempted"
              echo "SOURCE_RUN=39907655833"
              echo "ARTIFACT_ID=12482055310"
              echo "GAMEPLAY_INPUT=NONE"
              echo "WATCHPOINTS=0"
              echo "COLD_BOOT_FALLBACK=no"
              echo "SETUP_EXIT_CODE=$RUNTIME_RC"
            } > "$OUT/PA4_RUNTIME_SUMMARY.txt"
          fi
          if [ -f "$WORK/source/xvfb.pid" ]; then kill "$(cat "$WORK/source/xvfb.pid")" 2>/dev/null || true; fi
          exit 0

      - name: Remove private checkpoint, BIOS and emulator inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$WORK/source/xvfb.pid" ]; then kill "$(cat "$WORK/source/xvfb.pid")" 2>/dev/null || true; fi
          rm -rf "$WORK"
          test ! -e "$WORK"
          echo "PRIVATE_INPUT_CLEANUP=PASS" > "$OUT/cleanup.txt"

      - name: Publish PA4 decimal-value TSVs and run summary
        id: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEST="reports/stage1_economy/pa-run-$GITHUB_RUN_ID-pa4/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          find "$OUT" -maxdepth 1 -type f \( -name 'PA4_*' -o -name 'PA0_*' -o -name 'cleanup.txt' \) -exec cp {} "$DEST/" \; 2>/dev/null || true
          RUNTIME_RC="${PA4_RUNTIME_EXIT_CODE:-TIDAK_TAHU}"
          PA4_STATUS="$(sed -n 's/^STATUS=//p' "$DEST/PA4_RUNTIME_SUMMARY.txt" 2>/dev/null | head -n 1 || echo TIDAK_TAHU)"
          JOB_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$RESEARCH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | jq -r '.jobs[] | select(.name=="pa4-ha4-control") | .id' | head -n 1)"
          STATUS=PARTIAL_OR_FAIL
          if [ "$PA4_STATUS" = PASS ] && [ "$RUNTIME_RC" = 0 ]; then STATUS=PASS; fi
          {
            echo "STATUS=$STATUS"
            echo "JOB=pa4-ha4-control"
            echo "JOB_ID=$JOB_ID"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXIT_CODE=$RUNTIME_RC"
            echo "PA4_CONTROL_STATUS=$PA4_STATUS"
            echo "SCALAR_AND_M_REGION_TSV=YES_IF_PRESENT"
            echo "GAMEPLAY_INPUT=NONE"
            echo "WATCHPOINTS=0"
            echo "COLD_BOOT_FALLBACK=no"
            echo "PRIVATE_BINARY_COMMITTED=no"
            echo "RELEASES_MODIFIED=no"
          } > "$DEST/ACTIONS_RUN_SUMMARY.txt"
          if [ ! -s "$DEST/PA4_RUNTIME_SUMMARY.txt" ]; then printf 'STATUS=TIDAK TAHU\nREASON=PA4 summary unavailable\n' > "$DEST/PA4_RUNTIME_SUMMARY.txt"; fi
          {
            echo
            echo "## Commit file list"
            echo "See PA4_PUBLISH_COMMIT_FILES.tsv."
          } >> "$DEST/PA4_RUNTIME_SUMMARY.txt"
          git add -- "$DEST"
          python3 - "$DEST" <<'PY'
          import subprocess,sys
          from pathlib import Path
          dest=Path(sys.argv[1])
          lines=subprocess.check_output(["git","diff","--cached","--name-status"],text=True).splitlines()
          with (dest/"PA4_PUBLISH_COMMIT_FILES.tsv").open("w",encoding="utf-8") as f:
              f.write("status\tpath\n")
              for line in lines:
                  q=line.split("\t",1); f.write(q[0]+"\t"+q[-1]+"\n")
              f.write("A\t"+str(dest/"PA4_PUBLISH_COMMIT_FILES.tsv")+"\n")
          PY
          git add -- "$DEST/PA4_PUBLISH_COMMIT_FILES.tsv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c pa4-publish
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish PA4 HA4 CONTROL decimal snapshots $GITHUB_RUN_ID [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          test "$PUSHED" = 1
          PUBLISH_SHA="$(git rev-parse HEAD)"
          SUMMARY_URL="https://raw.githubusercontent.com/$RESEARCH_REPO/$PUBLISH_SHA/$DEST/ACTIONS_RUN_SUMMARY.txt"
          RUNTIME_URL="https://raw.githubusercontent.com/$RESEARCH_REPO/$PUBLISH_SHA/$DEST/PA4_RUNTIME_SUMMARY.txt"
          HTTP1="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' "$SUMMARY_URL")"
          HTTP2="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' "$RUNTIME_URL")"
          echo "PUBLISH_SHA=$PUBLISH_SHA RAW_SUMMARY_HTTP=$HTTP1 RAW_RUNTIME_HTTP=$HTTP2"
          test "$HTTP1" = 200 && test "$HTTP2" = 200
          echo "PUBLISHED_SUMMARY=$SUMMARY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISHED_RUNTIME=$RUNTIME_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISH_SHA=$PUBLISH_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Mark a failed or unavailable restore as a failed job after publication
        if: always()
        shell: bash
        run: |
          test "${PA4_RUNTIME_EXIT_CODE:-99}" = 0

  pa5:
    name: pa5-symbolic-falsifier-and-ledger
    needs: [static, runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      dest: ${{ steps.publish.outputs.dest }}
    env:
      GH_TOKEN: ${{ github.token }}
      PA4_DEST: ${{ needs.runtime.outputs.dest }}
      STATIC_DEST: ${{ needs.static.outputs.dest }}
    steps:
      - name: Checkout the latest main after independent static and runtime jobs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare PA5 script and compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pa" "$RUNNER_TEMP/pa-cache"
          cp tools/pa/RunPA5Symbolic.pytxt "$RUNNER_TEMP/pa/RunPA5Symbolic.py"
          python3 - "$RUNNER_TEMP/pa/RunPA5Symbolic.py" "$RUNNER_TEMP/pa-cache/RunPA5Symbolic.pyc" <<'PY'
          import py_compile,sys
          py_compile.compile(sys.argv[1],cfile=sys.argv[2],doraise=True)
          PY

      - name: Run PA5 symbolic review and refresh complete run/commit ledgers
        id: pa5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pa-output"
          python3 "$RUNNER_TEMP/pa/RunPA5Symbolic.py" --pa4 "$PA4_DEST" --static "$STATIC_DEST" --out "$RUNNER_TEMP/pa-output"

      - name: Publish PA5 report and run summary
        id: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEST="reports/stage1_economy/pa-run-$GITHUB_RUN_ID-pa5/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          find "$RUNNER_TEMP/pa-output" -maxdepth 1 -type f -name 'PA5_*' -exec cp {} "$DEST/" \; 2>/dev/null || true
          if [ ! -s "$DEST/PA5_FINAL_REPORT.md" ]; then printf '# PA5\n\nStatus: BELUM K1 — TIDAK TAHU.\n' > "$DEST/PA5_FINAL_REPORT.md"; fi
          JOB_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | jq -r '.jobs[] | select(.name=="pa5-symbolic-falsifier-and-ledger") | .id' | head -n 1)"
          {
            echo "STATUS=PARTIAL_OR_FAIL"
            echo "JOB=pa5-symbolic-falsifier-and-ledger"
            echo "JOB_ID=$JOB_ID"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXIT_CODE=0_IF_REPORT_EXISTS"
            echo "CORRELATION_IS_NOT_PROOF=yes"
            echo "PRIVATE_BINARY_COMMITTED=no"
          } > "$DEST/ACTIONS_RUN_SUMMARY.txt"
          {
            echo
            echo "## Commit file list"
            echo "See PA5_PUBLISH_COMMIT_FILES.tsv."
          } >> "$DEST/PA5_FINAL_REPORT.md"
          git add -- "$DEST"
          python3 - "$DEST" <<'PY'
          import subprocess,sys
          from pathlib import Path
          dest=Path(sys.argv[1])
          lines=subprocess.check_output(["git","diff","--cached","--name-status"],text=True).splitlines()
          with (dest/"PA5_PUBLISH_COMMIT_FILES.tsv").open("w",encoding="utf-8") as f:
              f.write("status\tpath\n")
              for line in lines:
                  q=line.split("\t",1); f.write(q[0]+"\t"+q[-1]+"\n")
              f.write("A\t"+str(dest/"PA5_PUBLISH_COMMIT_FILES.tsv")+"\n")
          PY
          git add -- "$DEST/PA5_PUBLISH_COMMIT_FILES.tsv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c pa5-publish
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish PA5 symbolic falsifier audit $GITHUB_RUN_ID [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          test "$PUSHED" = 1
          PUBLISH_SHA="$(git rev-parse HEAD)"
          REPORT_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$PUBLISH_SHA/$DEST/PA5_FINAL_REPORT.md"
          SUMMARY_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$PUBLISH_SHA/$DEST/ACTIONS_RUN_SUMMARY.txt"
          HTTP1="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' "$REPORT_URL")"
          HTTP2="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' "$SUMMARY_URL")"
          echo "PUBLISH_SHA=$PUBLISH_SHA RAW_REPORT_HTTP=$HTTP1 RAW_SUMMARY_HTTP=$HTTP2"
          test "$HTTP1" = 200 && test "$HTTP2" = 200
          echo "PUBLISHED_REPORT=$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISHED_SUMMARY=$SUMMARY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISH_SHA=$PUBLISH_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

