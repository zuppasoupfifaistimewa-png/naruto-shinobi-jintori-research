            }
            fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage "$WORK/source/pcsx-redux.AppImage" 65747557 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
            fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin "$WORK/source/game.bin" 325989552 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
            fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue "$WORK/source/game.cue" 116 be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8
            fetch_asset scph7502.zip "$WORK/source/scph7502.zip" 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a
            python3 - "$WORK/source/scph7502.zip" "$WORK/source/scph7502.bin" "$WORK/source/game.cue" "$WORK/source/game-run.cue" <<'PY'
          import hashlib,re,stat,sys,zipfile
          from pathlib import Path
          zpath,bios,cue,out=map(Path,sys.argv[1:])
          with zipfile.ZipFile(zpath) as z:
              found=[]
              for it in z.infolist():
                  p=Path(it.filename); mode=(it.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):raise SystemExit("UNSAFE_BIOS_ARCHIVE")
                  if not it.is_dir() and it.file_size==524288:found.append(it)
              if len(found)!=1:raise SystemExit("BIOS_MEMBER_COUNT_MISMATCH")
              b=z.read(found[0])
          if hashlib.sha256(b).hexdigest()!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1":raise SystemExit("BIOS_SHA256_MISMATCH")
          bios.write_bytes(b)
          lines=[];n=0
          for line in cue.read_text(encoding="utf-8-sig").splitlines():
              if line.lstrip().upper().startswith("FILE "):
                  m=re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$',line,re.I)
                  if not m:raise SystemExit("CUE_DIRECTIVE_INVALID")
                  line=m.group(1)+'"game.bin"'+m.group(2);n+=1
              lines.append(line)
          if n!=1:raise SystemExit("CUE_FILE_COUNT="+str(n))
          out.write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
            chmod +x "$WORK/source/pcsx-redux.AppImage"
            cd "$WORK/source"
            ./pcsx-redux.AppImage --appimage-extract >/dev/null
            APPDIR="$WORK/source/squashfs-root"
            PCSX_BIN="$(find -L "$APPDIR" -maxdepth 8 -type f -perm /111 | grep -E '/(pcsx-redux|pcsx-redux[^/]*)$' | head -n 1)"
