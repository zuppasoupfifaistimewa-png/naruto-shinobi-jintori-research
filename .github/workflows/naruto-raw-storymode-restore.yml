name: Naruto raw Story Mode restore and continuation

on:
  workflow_run:
    workflows:
      - "Naruto SCPH-7502 Story Mode playthrough"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing naruto-storymode-checkpoint-private and its raw savestate manifest"
        required: true
        type: string
  # One-shot fallback: only the exact launch commit for source run 39262213468 may trigger this.
  push:
    branches: [main]
    paths:
      - ".github/workflows/naruto-raw-storymode-restore.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: naruto-storymode-raw-resume
  cancel-in-progress: false

jobs:
  raw-restore-and-continue:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.name == 'Naruto SCPH-7502 Story Mode playthrough' && github.event.workflow_run.conclusion != 'cancelled') || (github.event_name == 'push' && github.event.head_commit.message == 'Launch raw Story Mode restore from source 39262213468') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      WORK: /tmp/naruto-storymode-raw-resume
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || (github.event_name == 'workflow_run' && github.event.workflow_run.id || (github.event_name == 'push' && github.event.head_commit.message == 'Launch raw Story Mode restore from source 39262213468' && '39262213468')) }}
      RESEARCH_REPO: ${{ github.repository }}
    steps:
      - name: Download raw checkpoint evidence from the source run
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-checkpoint-private
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || (github.event_name == 'workflow_dispatch' && inputs.source_run_id || (github.event_name == 'push' && github.event.head_commit.message == 'Launch raw Story Mode restore from source 39262213468' && '39262213468')) }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ env.WORK }}/source-artifact

      - name: Download matching private Memory Card artifact
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || (github.event_name == 'workflow_dispatch' && inputs.source_run_id || (github.event_name == 'push' && github.event.head_commit.message == 'Launch raw Story Mode restore from source 39262213468' && '39262213468')) }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ env.WORK }}/source-card

      - name: Verify source checkpoint is an identifiable post-dialog screen and verify raw bytes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$WORK/source-artifact"
          CARD="$WORK/source-card"
          MANIFEST="$SOURCE/storymode-raw-manifest.txt"
          RAW="$SOURCE/storymode-checkpoint.raw.sstate"
          SOURCE_PNG="$SOURCE/storymode-checkpoint-source.png"
          test -s "$MANIFEST" || { echo "::error::Missing raw-state manifest"; exit 41; }
          test -s "$RAW" || { echo "::error::Missing raw savestate; refusing to use sanitized fallback"; exit 42; }
          test -s "$SOURCE_PNG" || { echo "::error::Missing screenshot from the exact checkpoint safe point"; exit 43; }
          manifest_value() {
            awk -F= -v key="$1" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' "$MANIFEST"
          }
          test "$(manifest_value STORY_RAW_STATE_PRESENT)" = "1"
          test "$(manifest_value STORY_STATE_FORMAT)" = "raw-pcsx-createSaveState"
          expected_bytes="$(manifest_value STORY_RAW_STATE_BYTES)"
          expected_sha="$(manifest_value STORY_RAW_STATE_SHA256)"
          actual_bytes="$(stat -c '%s' "$RAW")"
          actual_sha="$(sha256sum "$RAW" | cut -d ' ' -f 1)"
          [[ "$expected_bytes" =~ ^[0-9]+$ ]] || { echo "::error::Invalid raw size in manifest"; exit 44; }
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid raw hash in manifest"; exit 45; }
          [[ "$actual_bytes" = "$expected_bytes" && "$actual_sha" = "$expected_sha" ]] || {
            echo "::error::Raw savestate integrity check failed bytes=$actual_bytes sha256=$actual_sha"; exit 46;
          }
          source_bytes="$(manifest_value STORY_SOURCE_SCREENSHOT_BYTES)"
          source_sha="$(manifest_value STORY_SOURCE_SCREENSHOT_SHA256)"
          [[ "$(manifest_value STORY_SOURCE_SCREENSHOT_PRESENT)" = "1" ]] || { echo "::error::Source checkpoint screenshot not validated"; exit 47; }
          [[ "$(stat -c '%s' "$SOURCE_PNG")" = "$source_bytes" ]] || { echo "::error::Source screenshot size mismatch"; exit 48; }
          [[ "$(sha256sum "$SOURCE_PNG" | cut -d ' ' -f 1)" = "$source_sha" ]] || { echo "::error::Source screenshot hash mismatch"; exit 49; }
          frame="$(manifest_value STORY_CHECKPOINT_FRAME)"
          reason="$(manifest_value STORY_CHECKPOINT_REASON)"
          dialog_gate="$(manifest_value STORY_DIALOG_VISUAL_GATE)"
          prior_restore_proof="$(manifest_value STORY_RAW_RESTORE_CROSS_RUN)"
          [[ "$frame" =~ ^[0-9]+$ ]] || { echo "::error::Checkpoint frame is not numeric"; exit 50; }
          [[ "$reason" = "stable_non_dialog" ]] || { echo "::error::Refusing checkpoint reason=$reason; a stable post-dialog checkpoint is required"; exit 51; }
          if [[ -n "$prior_restore_proof" ]]; then
            [[ "$prior_restore_proof" = "PASS" ]] || { echo "::error::Previous raw restore proof is not PASS"; exit 52; }
            (( frame >= 600 )) || { echo "::error::Follow-up checkpoint was captured before 600 VSyncs"; exit 53; }
          else
            (( frame >= 9000 )) || { echo "::error::Initial checkpoint is earlier than expected Story Mode intro frames"; exit 54; }
            [[ "$dialog_gate" = "PASS" ]] || { echo "::error::Initial Story Mode dialogue visual gate did not pass"; exit 55; }
          fi
          python3 - "$SOURCE_PNG" <<'PY'
          import sys
          from PIL import Image
          image = Image.open(sys.argv[1]).convert("RGB")
          if image.width < 100 or image.height < 100:
              raise SystemExit("Source checkpoint screenshot dimensions are too small")
          if image.getbbox() is None or len(set(image.resize((40, 30)).getdata())) <= 12:
              raise SystemExit("Source checkpoint screenshot is blank or visually constant")
          print(f"STORY_RAW_SOURCE_SCREENSHOT=PASS dimensions={image.width}x{image.height}")
          PY
          CARD_FILE="$CARD/naruto-storymode.mcd"
          CARD_MANIFEST="$CARD/memory-card-manifest.txt"
          test -s "$CARD_FILE" && test -s "$CARD_MANIFEST" || { echo "::error::Missing source Memory Card or manifest"; exit 56; }
          card_value() {
            awk -F= -v key="$1" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' "$CARD_MANIFEST"
          }
          [[ "$(stat -c '%s' "$CARD_FILE")" = "$(card_value STORY_MEMORY_CARD_BYTES)" ]] || { echo "::error::Memory Card size mismatch"; exit 57; }
          [[ "$(sha256sum "$CARD_FILE" | cut -d ' ' -f 1)" = "$(card_value STORY_MEMORY_CARD_SHA256)" ]] || { echo "::error::Memory Card hash mismatch"; exit 58; }
          echo "STORY_RAW_SOURCE_VALIDATION=PASS run=$SOURCE_RUN_ID frame=$frame reason=$reason bytes=$actual_bytes sha256=$actual_sha"
          echo "STORY_RAW_TRANSFER_POLICY=private_artifact; source state is raw; no sanitizer or BIOS rehydration is used"

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils libgl1-mesa-dri python3 python3-pil

      - name: Download and verify pinned emulator, game, and local BIOS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/home" "$WORK/captures/raw" "$WORK/resume" "$WORK/cards" "$WORK/logs"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private runtime asset: $name"; exit 61; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c '%s' scph7502.zip)" = "283463"
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as zf:
              entries = []
              expanded = 0
              for info in zf.infolist():
                  p = PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("Unsafe BIOS archive entry")
                  if info.file_size > 2*1024*1024:
                      raise SystemExit("BIOS member too large")
                  expanded += info.file_size
                  if expanded > 4*1024*1024:
                      raise SystemExit("BIOS expansion too large")
                  if not info.is_dir() and info.file_size == 524288:
                      entries.append(info)
              if len(entries) != 1:
                  raise SystemExit(f"Expected one 512 KiB BIOS entry, got {len(entries)}")
              with zf.open(entries[0]) as src:
                  bios = src.read()
              expected = "5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1"
              actual = hashlib.sha256(bios).hexdigest()
              if len(bios) != 524288 or actual != expected:
                  raise SystemExit(f"BIOS verification failed bytes={len(bios)} sha256={actual}")
              Path("scph7502.bin").write_bytes(bios)
              print(f"RETAIL_BIOS_SHA256={actual} BIOS_BYTES={len(bios)}")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          lines = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          ids = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "RAW_RESTORE_RUNTIME_ASSETS=PASS"

      - name: Stage raw checkpoint and continuation scripts without transforming state
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$WORK/source-artifact"
          cp "$SOURCE/storymode-checkpoint.raw.sstate" "$WORK/resume/storymode-checkpoint.sstate"
          cp "$WORK/source-card/naruto-storymode.mcd" "$WORK/cards/naruto-storymode.mcd"
          cp "$SOURCE/storymode-checkpoint-source.png" "$WORK/captures/storymode-checkpoint-source.png"
          cp "$SOURCE/storymode-checkpoint-source.png" "$WORK/captures/storymode-previous-checkpoint-source.png"
          cp "$SOURCE/storymode-raw-manifest.txt" "$WORK/captures/storymode-previous-raw-manifest.txt"
          cp "$SOURCE/gpu-traffic.lua" "$WORK/gpu-traffic.lua"
          cp "$SOURCE/story-dialog-watch.py" "$WORK/story-dialog-watch.py"
          : > "$WORK/resume/raw-resume.flag"
          : > "$WORK/cards/memory-card-restored.flag"
          expected_sha="$(awk -F= '$1 == "STORY_RAW_STATE_SHA256" {sub(/^[^=]*=/, ""); print; exit}' "$SOURCE/storymode-raw-manifest.txt")"
          source_sha="$(sha256sum "$SOURCE/storymode-checkpoint.raw.sstate" | cut -d ' ' -f 1)"
          staged_sha="$(sha256sum "$WORK/resume/storymode-checkpoint.sstate" | cut -d ' ' -f 1)"
          cmp --silent "$SOURCE/storymode-checkpoint.raw.sstate" "$WORK/resume/storymode-checkpoint.sstate"
          [[ "$source_sha" = "$expected_sha" && "$staged_sha" = "$source_sha" ]] || { echo "::error::Staged savestate differs from raw source"; exit 62; }
          echo "STORY_RAW_STATE_STAGED_UNCHANGED=PASS bytes=$(stat -c '%s' "$WORK/resume/storymode-checkpoint.sstate") sha256=$staged_sha"
          echo "STORY_RAW_BIOS_REHYDRATION=DISABLED; exact raw file passed directly to PCSX.loadSaveState"

      - name: Restore on a fresh process, compare screenshot, continue Story Mode and create next raw checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          GPU_BACKEND_TIMEOUT="1800s"
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          emu_pid=""
          cleanup() {
            if [ -n "$emu_pid" ]; then kill "$emu_pid" 2>/dev/null || true; fi
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1
          unset MESA_GL_VERSION_OVERRIDE MESA_GLSL_VERSION_OVERRIDE
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print(string.format("PAD_SETUP=Port 1 connected=%s device_type=%s input_type=%s",
              tostring(PCSX.settings.pads[1].Connected),
              tostring(PCSX.settings.pads[1].DeviceType),
              tostring(PCSX.settings.pads[1].PadType)))
          LUA
          )
          timeout --signal=TERM --kill-after=5s "$GPU_BACKEND_TIMEOUT" \
            stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/naruto-storymode.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/gpu-traffic.lua" \
              -softgpu -dynarec -stdout -lua_stdout -logfile "$WORK/pcsx.log" -run \
            > "$WORK/pcsx.stdout" 2>&1 &
          emu_pid=$!
          RESUME_MODE=true RAW_RESUME_VERIFY=true EMU_PID="$emu_pid" python3 -u "$WORK/story-dialog-watch.py" > "$WORK/captures/story-dialog-watch-summary.txt" 2>&1 &
          watcher_pid=$!
          set +e
          wait "$emu_pid"
          emu_rc=$?
          set -e
          emu_pid=""
          echo "EMULATOR_EXIT_CODE=$emu_rc"
          grep -E 'STORY_|RESTORE_|PAD_SETUP|PAD_INJECT|GPU_SCREENSHOT_CAPTURE|ExecutionFlow|Loaded BIOS:|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM.CNF|BOOT =|EXEC:PC0|Execute !|FATAL|Exception|error|Error|ERROR|Failed|failed' \
            "$WORK/pcsx.stdout" "$WORK/pcsx.log" > "$WORK/captures/important-log-lines.txt" || true
          cp "$WORK/pcsx.stdout" "$WORK/captures/pcsx.stdout.txt" || true
          cp "$WORK/pcsx.log" "$WORK/captures/pcsx.log.txt" || true
          cat "$WORK/captures/important-log-lines.txt" || true
          wait "$watcher_pid" 2>/dev/null || true
          echo "STORY_DIALOG_WATCH_SUMMARY_BEGIN"
          cat "$WORK/captures/story-dialog-watch-summary.txt" || true
          echo "STORY_DIALOG_WATCH_SUMMARY_END"
          if [ "$emu_rc" -ne 0 ]; then
            echo "::error::Restored emulator exited with code $emu_rc"
            exit "$emu_rc"
          fi
          grep -q 'STORY_SAVESTATE_LOAD_EVENT=ExecutionFlow::SaveStateLoaded' "$WORK/pcsx.stdout" || { echo "::error::Missing SaveStateLoaded event"; exit 76; }
          grep -q 'STORY_SAVESTATE_LOAD_CALL_RETURNED=1' "$WORK/pcsx.stdout" || { echo "::error::Savestate loader did not return"; exit 77; }
          grep -q 'STORY_RAW_RESTORE_POST_RESTORE_VSYNC=180' "$WORK/pcsx.stdout" || { echo "::error::Fewer than 180 verified post-restore VSyncs"; exit 78; }
          grep -q 'STORY_RAW_RESTORE_CROSS_RUN=PASS' "$WORK/pcsx.stdout" || { echo "::error::Cross-run screenshot gate did not pass"; exit 79; }
          grep -q 'STORY_RAW_RESTORE_SCREENSHOT_COMPARE=PASS' "$WORK/captures/storymode-restore-comparison.txt" || { echo "::error::Screenshot comparison report not PASS"; exit 80; }
          test -s "$WORK/captures/raw/storymode-checkpoint.raw" || { echo "::error::No new raw checkpoint was produced after continuation"; exit 81; }
          echo "STORY_RAW_RESTORE_CONTINUATION_GATE=PASS"

      - name: Package checkpoint manifest and remove temporary raw captures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 - <<'PY'
          import hashlib, json, os, re, struct
          from pathlib import Path
          from PIL import Image

          root = Path("captures")
          raw_dir = root / "raw"
          output = []
          # Convert only temporary emulator screenshots; never persist or upload raw VRAM/GPU dumps.
          for meta_path in sorted(root.glob("frame-*.json")):
              try:
                  meta = json.loads(meta_path.read_text())
                  frame = int(meta["frame"])
                  width, height = int(meta["width"]), int(meta["height"])
                  bpp = int(meta["bpp"])
                  expected = int(meta["expected_bytes"])
                  raw_path = raw_dir / f"frame-{frame:06d}.raw"
                  raw = raw_path.read_bytes() if raw_path.exists() else b""
                  if width <= 0 or height <= 0 or len(raw) != expected:
                      output.append(f"FRAME_{frame}_SCREENSHOT=INVALID")
                  elif bpp == 16:
                      rgb = bytearray()
                      for (word,) in struct.iter_unpack("<H", raw):
                          rgb.extend(((word & 31) * 255 // 31, ((word >> 5) & 31) * 255 // 31, ((word >> 10) & 31) * 255 // 31))
                      Image.frombytes("RGB", (width, height), bytes(rgb)).save(root / f"internal-frame-{frame}.png", optimize=True)
                      output.append(f"FRAME_{frame}_SCREENSHOT=PASS")
                  elif bpp == 24:
                      Image.frombytes("RGB", (width, height), raw).save(root / f"internal-frame-{frame}.png", optimize=True)
                      output.append(f"FRAME_{frame}_SCREENSHOT=PASS")
                  else:
                      output.append(f"FRAME_{frame}_SCREENSHOT=UNSUPPORTED_BPP_{bpp}")
              except Exception as exc:
                  output.append(f"SCREENSHOT_CONVERSION_ERROR={type(exc).__name__}:{exc}")
              finally:
                  meta_path.unlink(missing_ok=True)

          raw_state = raw_dir / "storymode-checkpoint.raw"
          new_state_copy = root / "storymode-checkpoint.raw.sstate"
          if raw_state.is_file() and raw_state.stat().st_size > 0:
              # Keep the direct savestate bytes untouched; no protobuf rewriting.
              raw_bytes = raw_state.read_bytes()
              new_state_copy.write_bytes(raw_bytes)
              log_parts = []
              for path in (root / "important-log-lines.txt", root / "story-dialog-watch-summary.txt"):
                  if path.exists():
                      log_parts.append(path.read_text(errors="replace"))
              logs = "\n".join(log_parts)
              points = re.findall(r"STORY_CHECKPOINT_SAFE_POINT frame=(\d+) save_ok=true reason=([A-Za-z0-9_-]+)", logs)
              frame, reason = points[-1] if points else ("unknown", "unknown")
              source_png = root / f"internal-frame-{frame}.png" if frame != "unknown" else root / "missing.png"
              source_ok = source_png.is_file()
              screen_bytes, screen_sha, dimensions = 0, "missing", "unknown"
              if source_ok:
                  try:
                      image = Image.open(source_png).convert("RGB")
                      if image.width < 100 or image.height < 100 or image.getbbox() is None:
                          source_ok = False
                      else:
                          screen_bytes = source_png.stat().st_size
                          screen_sha = hashlib.sha256(source_png.read_bytes()).hexdigest()
                          dimensions = f"{image.width}x{image.height}"
                          (root / "storymode-checkpoint-source.png").write_bytes(source_png.read_bytes())
                  except Exception:
                      source_ok = False
              loaded = "PASS" if "STORY_SAVESTATE_LOAD_EVENT=ExecutionFlow::SaveStateLoaded" in logs else "FAIL"
              compare_path = root / "storymode-restore-comparison.txt"
              compare_text = compare_path.read_text(errors="replace") if compare_path.exists() else ""
              compare = "PASS" if "STORY_RAW_RESTORE_SCREENSHOT_COMPARE=PASS" in compare_text else "FAIL"
              post180 = "PASS" if "STORY_RAW_RESTORE_POST_RESTORE_VSYNC=180" in logs else "FAIL"
              continuation = "PASS" if "STORY_RAW_RESTORE_CROSS_RUN=PASS" in logs else "FAIL"
              manifest = [
                  "STORY_RAW_STATE_PRESENT=1",
                  "STORY_STATE_FORMAT=raw-pcsx-createSaveState",
                  f"STORY_RAW_STATE_RUN_ID={os.environ.get('GITHUB_RUN_ID', 'unknown')}",
                  f"STORY_RAW_STATE_COMMIT={os.environ.get('GITHUB_SHA', 'unknown')}",
                  f"STORY_PREVIOUS_STATE_RUN_ID={os.environ.get('SOURCE_RUN_ID', 'unknown')}",
                  f"STORY_CHECKPOINT_FRAME={frame}",
                  f"STORY_CHECKPOINT_REASON={reason}",
                  f"STORY_RAW_STATE_BYTES={len(raw_bytes)}",
                  f"STORY_RAW_STATE_SHA256={hashlib.sha256(raw_bytes).hexdigest()}",
                  f"STORY_RAW_RESTORE_LOAD_EVENT={loaded}",
                  f"STORY_RAW_RESTORE_POST180_VSYNC={post180}",
                  f"STORY_RAW_RESTORE_SCREENSHOT_COMPARE={compare}",
                  f"STORY_RAW_RESTORE_CROSS_RUN={continuation}",
                  f"STORY_SOURCE_SCREENSHOT_PRESENT={int(source_ok)}",
                  "STORY_SOURCE_SCREENSHOT_FILE=storymode-checkpoint-source.png",
                  f"STORY_SOURCE_SCREENSHOT_BYTES={screen_bytes}",
                  f"STORY_SOURCE_SCREENSHOT_SHA256={screen_sha}",
                  f"STORY_SOURCE_SCREENSHOT_DIMENSIONS={dimensions}",
              ]
              (root / "storymode-raw-manifest.txt").write_text("\n".join(manifest) + "\n")
              output.extend(manifest)
          else:
              (root / "storymode-raw-manifest.txt").write_text("STORY_RAW_STATE_PRESENT=0\n")
              output.append("STORY_RAW_STATE_PRESENT=0")

          # Keep the source manifest/screen used for the restore comparison, not only the new checkpoint.
          prev_manifest = root / "storymode-previous-raw-manifest.txt"
          prev_screen = root / "storymode-previous-checkpoint-source.png"
          if not prev_manifest.exists():
              prev_manifest.write_text("STORY_PREVIOUS_SOURCE_MANIFEST=missing\n")
          if not prev_screen.exists():
              output.append("STORY_PREVIOUS_SOURCE_SCREENSHOT=missing")

          # Fingerprint Memory Card state; its actual in-game save/reload semantics remain unverified.
          card = Path("cards/naruto-storymode.mcd")
          card_manifest = Path("cards/memory-card-manifest.txt")
          if card.is_file() and card.stat().st_size:
              digest = hashlib.sha256(card.read_bytes()).hexdigest()
              fields = [
                  "STORY_MEMORY_CARD_PRESENT=1",
                  f"STORY_MEMORY_CARD_BYTES={card.stat().st_size}",
                  f"STORY_MEMORY_CARD_SHA256={digest}",
                  "STORY_MEMORY_CARD_GAME_SAVE_STATUS=UNVERIFIED_REQUIRES_IN_GAME_SAVE_AND_RELOAD",
                  "STORY_MEMORY_CARD_SOURCE=restored_private_artifact",
              ]
              card_manifest.write_text("\n".join(fields) + "\n")
              output.extend(fields)
          else:
              card_manifest.write_text("STORY_MEMORY_CARD_PRESENT=0\nSTORY_MEMORY_CARD_GAME_SAVE_STATUS=UNVERIFIED\n")
              output.append("STORY_MEMORY_CARD_PRESENT=0")

          # These captures are temporary diagnostics, not standalone RAM/VRAM/GPU dumps.
          if raw_dir.exists():
              for item in raw_dir.iterdir():
                  if item.is_file(): item.unlink(missing_ok=True)
                  elif item.is_dir():
                      import shutil
                      shutil.rmtree(item)
              raw_dir.rmdir()
          for path in root.glob("frame-*.json"):
              path.unlink(missing_ok=True)
          (root / "raw-restore-continuation-summary.txt").write_text("\n".join(output) + "\n")
          print("\n".join(output))
          PY

      - name: Upload private raw checkpoint and restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-checkpoint-private
          path: |
            ${{ env.WORK }}/captures/storymode-checkpoint.raw.sstate
            ${{ env.WORK }}/captures/storymode-raw-manifest.txt
            ${{ env.WORK }}/captures/storymode-checkpoint-source.png
            ${{ env.WORK }}/captures/storymode-previous-checkpoint-source.png
            ${{ env.WORK }}/captures/storymode-previous-raw-manifest.txt
            ${{ env.WORK }}/captures/storymode-checkpoint-restore-immediate.png
            ${{ env.WORK }}/captures/storymode-restore-comparison.txt
            ${{ env.WORK }}/captures/internal-frame-*.png
            ${{ env.WORK }}/captures/important-log-lines.txt
            ${{ env.WORK }}/captures/pcsx.stdout.txt
            ${{ env.WORK }}/captures/pcsx.log.txt
            ${{ env.WORK }}/captures/story-dialog-watch-summary.txt
            ${{ env.WORK }}/captures/raw-restore-continuation-summary.txt
            ${{ env.WORK }}/captures/gpu-traffic.lua
            ${{ env.WORK }}/captures/story-dialog-watch.py
          if-no-files-found: warn
          retention-days: 14

      - name: Upload private Memory Card after continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          path: |
            ${{ env.WORK }}/cards/naruto-storymode.mcd
            ${{ env.WORK }}/cards/memory-card-manifest.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Remove runtime assets and source savestate from ephemeral runner
        if: always()
        shell: bash
        run: |
          rm -rf "$WORK"
