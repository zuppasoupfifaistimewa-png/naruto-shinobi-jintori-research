name: Naruto private guest-screen capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-private-guest-screen.yml"

permissions:
  contents: read

concurrency:
  group: naruto-private-guest-screen
  cancel-in-progress: true

jobs:
  guest-screen:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Install image-analysis dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dri imagemagick python3-pil python3-numpy tesseract-ocr tesseract-ocr-jpn

      - name: Download and verify private ROM/CUE/OpenBIOS
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
          RELEASE_TAG: research-emulator-pcsx-redux-2026-10-15
          EXPECTED_ROM_SIZE: "325989552"
          EXPECTED_ROM_SHA256: 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
          APPIMAGE_URL: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/0c3572c3d%402026-10-01_1790876682/PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
          EXPECTED_APPIMAGE_SHA256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-private-guest-screen"
          mkdir -p "$WORK/captures" "$WORK/home"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/$RELEASE_TAG" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::error::Private release asset missing: $name"; exit 1
            fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset openbios-chunked.bin openbios-chunked.bin
          curl --fail --location --retry 2 --max-time 180 "$APPIMAGE_URL" -o pcsx-redux.AppImage
          echo "$EXPECTED_APPIMAGE_SHA256  pcsx-redux.AppImage" | sha256sum --check -
          echo "$EXPECTED_ROM_SHA256  game.bin" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "$EXPECTED_ROM_SIZE"
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          text = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
          lines = text.splitlines()
          files = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(files) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE structure")
          lines[files[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("CUE validated; only temporary FILE reference was normalized.")
          PY
          echo "ROM size/hash verified; private media remain inside this private workflow."

      - name: Capture internal guest display through Lua GPU API (no UI, no injected input)
        run: |
          set -eu
          cd "$WORK"
          cat > guest-capture.lua <<'LUA'
          local pad = PCSX.SIO0.slots[1].pads[1]
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          pad.map()
          print("PAD_SETUP=port1 analog connected and remapped")
          local frame = 0
          local target_frames = {1500, 1680, 1800, 2100, 2700, 3600, 4800}
          local taken = {}
          local function capture(tag, at_frame)
            local ok, err = pcall(function()
              local shot = PCSX.GPU.takeScreenShot()
              local raw_path = os.getenv("WORK") .. "/captures/" .. tag .. ".raw"
              local f = Support.File.open(raw_path, "TRUNCATE")
              f:writeMoveSlice(shot.data)
              f:close()
              local m = Support.File.open(raw_path .. ".meta", "TRUNCATE")
              m:write(string.format("%d %d %s\n", shot.width, shot.height, tostring(shot.bpp)))
              m:close()
              print(string.format("GUEST_CAPTURE tag=%s frame=%d width=%d height=%d bpp=%s", tag, at_frame, shot.width, shot.height, tostring(shot.bpp)))
            end)
            if not ok then print("GUEST_CAPTURE_ERROR tag=" .. tag .. " reason=" .. tostring(err)) end
          end
          local listener
          listener = PCSX.Events.createEventListener("GPU::Vsync", function()
            frame = frame + 1
            for _, wanted in ipairs(target_frames) do
              if frame == wanted and not taken[wanted] then
                taken[wanted] = true
                local this_tag = "frame-" .. tostring(wanted)
                local this_frame = wanted
                PCSX.nextTick(function() capture(this_tag, this_frame) end)
              end
            end
            if frame == 4800 then
              PCSX.nextTick(function()
                print("GUEST_CAPTURE_DONE frames=" .. tostring(frame))
                PCSX.quit(0)
              end)
            end
          end)
          print("GUEST_CAPTURE_LISTENER=armed; waiting for guest GPU VSync")
          LUA
          set +e
          timeout --signal=TERM --kill-after=5s 110s \
            env HOME="$WORK/home" WORK="$WORK" LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$WORK/squashfs-root/AppRun" -no-ui -bios "$WORK/openbios-chunked.bin" \
            -iso "$WORK/game-run.cue" -exec "$(cat guest-capture.lua)" \
            -run -interpreter -softgpu -stdout -lua_stdout -logfile "$WORK/pcsx.log" \
            > "$WORK/pcsx.stdout" 2>&1
          rc=$?
          set -e
          echo "EMULATOR_EXIT=$rc (0 means Lua capture schedule completed; 124 is observation limit)"
          grep -E 'PAD_SETUP=|GUEST_CAPTURE|GUEST_CAPTURE_ERROR|GUEST_CAPTURE_DONE|Loaded BIOS:|OpenBIOS detected|CD-ROM Label:|SYSTEM.CNF|BOOT =|CHUNK1.*done|EXEC:PC0|Execute !|Unknown command for pad|FATAL|Exception|ERROR|Error' "$WORK/pcsx.stdout" "$WORK/pcsx.log" 2>/dev/null | tail -100 || true
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::warning::Emulator exited before normal capture completion (code $rc)."
          fi
          echo "No input was injected in this pass; it checks internal rendering independently of the GUI window."

      - name: Convert guest buffers and measure frame changes
        if: always()
        run: |
          set -eu
          cd "$WORK"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          from PIL import Image
          base = Path("captures")
          summary = []
          for raw in sorted(base.glob("*.raw")):
              meta = raw.with_suffix(raw.suffix + ".meta")
              if not meta.exists(): continue
              parts = meta.read_text().strip().split()
              width, height = int(parts[0]), int(parts[1])
              blob = raw.read_bytes()
              pixels = width * height
              if len(blob) == pixels * 2:
                  v = np.frombuffer(blob, dtype="<u2").reshape(height, width).astype(np.uint16)
                  r = ((v & 0x1f) * 255 // 31).astype(np.uint8)
                  g = (((v >> 5) & 0x1f) * 255 // 31).astype(np.uint8)
                  b = (((v >> 10) & 0x1f) * 255 // 31).astype(np.uint8)
                  arr = np.dstack((r, g, b))
              elif len(blob) == pixels * 3:
                  arr = np.frombuffer(blob, dtype=np.uint8).reshape(height, width, 3)
              else:
                  summary.append({"file": raw.name, "status": "unsupported-buffer-size", "bytes": len(blob), "width": width, "height": height, "bpp": parts[2]})
                  continue
              image = Image.fromarray(arr, "RGB")
              png = raw.with_suffix(".png")
              image.save(png, optimize=True)
              flat = arr.reshape(-1, 3).astype(np.float64)
              unique = len(np.unique(arr.reshape(-1, 3)[::max(1, pixels // 200000)], axis=0))
              summary.append({
                  "file": png.name, "width": width, "height": height, "source_bpp": parts[2], "raw_bytes": len(blob),
                  "mean_rgb": [round(float(x), 2) for x in flat.mean(axis=0)],
                  "stddev_rgb": round(float(flat.std()), 3), "sampled_unique_rgb": int(unique),
                  "black_fraction": round(float(np.all(arr == 0, axis=2).mean()), 5)
              })
          (base / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print("GUEST_IMAGE_SUMMARY=" + json.dumps(summary))
          PY
          for image in "$WORK"/captures/frame-*.png; do
            [ -f "$image" ] || continue
            echo "OCR_START $(basename "$image")"
            tesseract "$image" stdout -l jpn+eng 2>/dev/null | head -12 || true
            echo "OCR_END $(basename "$image")"
          done

      - name: Upload guest-only captures to private artifact (3-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-private-guest-screen-captures
          path: |
            ${{ runner.temp }}/naruto-private-guest-screen/captures/frame-*.png
            ${{ runner.temp }}/naruto-private-guest-screen/captures/summary.json
          if-no-files-found: warn
          retention-days: 3

      - name: Remove ROM, BIOS, emulator and raw buffers
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi
          echo "Cleanup complete: private game files, BIOS, emulator and raw captures removed from the ephemeral runner."
