name: Step 4–10 read-only static evidence audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/step4_10_static_evidence_audit.py"
      - ".github/workflows/step4-10-static-evidence-audit.yml"

permissions:
  contents: write

concurrency:
  group: step4-10-read-only-static-evidence-audit
  cancel-in-progress: false

jobs:
  static-audit:
    name: Verify private source transiently, scan MIPS bytes, emit text/CSV only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout permitted research repository
        uses: actions/checkout@v4

      - name: Install disc extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Download validated private release assets and extract inputs on runner
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/step4-10-static-audit"
          source_dir="$root/source"
          extracted="$root/extracted"
          input="$root/input"
          out="$root/output"
          mkdir -p "$source_dir" "$extracted" "$input" "$out"
          bin="$source_dir/naruto-disc.bin"
          cue_raw="$source_dir/original.cue"
          cue="$source_dir/naruto-disc.cue"
          bin_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873"
          cue_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760"

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 600 "$bin_url" --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check --status

          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 60 "$cue_url" --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check --status

          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          src, dst = map(Path, sys.argv[1:3])
          output, count = [], 0
          for line in src.read_text(encoding="utf-8").splitlines():
              if line.lstrip().upper().startswith("FILE "):
                  m = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not m:
                      raise SystemExit("Unrecognized CUE FILE directive")
                  line = m.group(1) + '"naruto-disc.bin"' + m.group(2)
                  count += 1
              output.append(line)
          if count != 1:
              raise SystemExit(f"Expected one CUE FILE directive, got {count}")
          dst.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

          bchunk "$bin" "$cue" "$source_dir/track"
          iso="$(find "$source_dir" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$out/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          exe="$(find "$extracted" -type f -iname 'SLPS_035.53*' -print -quit)"
          [[ -n "$data" && -n "$exe" ]]
          [[ "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check --status
          [[ "$(stat -c '%s' "$exe")" == "385024" ]]
          echo "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569  $exe" | sha256sum --check --status
          cp "$data" "$input/DATA.BIN"
          cp "$exe" "$input/SLPS_035.53"
          echo "verified_private_inputs=true" > "$out/input-identity.txt"
          echo "data_bin_bytes=66015232" >> "$out/input-identity.txt"
          echo "data_bin_sha256=69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822" >> "$out/input-identity.txt"
          echo "exe_bytes=385024" >> "$out/input-identity.txt"
          echo "exe_sha256=a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569" >> "$out/input-identity.txt"
          echo "binary_uploaded_as_artifact=no" >> "$out/input-identity.txt"
          rm -rf "$source_dir" "$extracted"

      - name: Run reproducible static analysis only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/step4_10_static_evidence_audit.py \
            --exe "$RUNNER_TEMP/step4-10-static-audit/input/SLPS_035.53" \
            --data "$RUNNER_TEMP/step4-10-static-audit/input/DATA.BIN" \
            --out "$RUNNER_TEMP/step4-10-static-audit/output"
          cp "$RUNNER_TEMP/step4-10-static-audit/input-identity.txt" "$RUNNER_TEMP/step4-10-static-audit/output/"

      - name: Remove private source binaries before artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/step4-10-static-audit/input" \
                 "$RUNNER_TEMP/step4-10-static-audit/source" \
                 "$RUNNER_TEMP/step4-10-static-audit/extracted"
          if find "$RUNNER_TEMP/step4-10-static-audit/output" -type f \
              | grep -E '\.(bin|iso|cue|sstate|rom|exe)$'; then
            echo "Unexpected binary in output directory" >&2
            exit 1
          fi
          echo "PRIVATE_BINARY_CLEANUP=PASS"

      - name: Commit sanitized CSV and text reports to the permitted repository
        shell: bash
        run: |
          set -euo pipefail
          destination="reports/step4_10_static_evidence_audit/run_${GITHUB_RUN_ID}"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/step4-10-static-audit/output/"* "$destination/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if git diff --cached --quiet; then
            echo "REPORT_REPO_COMMIT=NO_CHANGES"
          else
            git commit -m "Record read-only static evidence audit ${GITHUB_RUN_ID}"
            git push origin HEAD:main
            echo "REPORT_REPO_COMMIT=PASS"
          fi

      - name: Upload sanitized CSV and text reports
        uses: actions/upload-artifact@v4
        with:
          name: step4-10-read-only-static-audit
          path: ${{ runner.temp }}/step4-10-static-audit/output/*
          if-no-files-found: error
          retention-days: 7
