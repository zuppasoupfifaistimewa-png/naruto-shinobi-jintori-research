name: Step 5 — Ghidra/m2c same-function comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step5-m2c-compare.yml"
      - "tools/step5_m2c_compare.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step5-m2c-comparison
  cancel-in-progress: false

jobs:
  compare-same-functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GHIDRA_VERSION: "12.2"
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
      EXPECTED_EXE_SHA256: "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569
"
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso unzip

      - name: Download verified disc assets and extract executable on runner
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/psx-disc-source"
          input_dir="$RUNNER_TEMP/step5-input"
          out="$RUNNER_TEMP/step5-output"
          mkdir -p "$source_dir" "$input_dir" "$out" "$source_dir/extracted-root"
          bin_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647346873"
          cue_url="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/647354760"
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 --max-time 600 "$bin_url" --output "$source_dir/disc.bin"
          test "$(stat -c '%s' "$source_dir/disc.bin")" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $source_dir/disc.bin" | sha256sum --check --status
          curl --fail --location --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 --max-time 60 "$cue_url" --output "$source_dir/original.cue"
          test "$(stat -c '%s' "$source_dir/original.cue")" = "116"
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $source_dir/original.cue" | sha256sum --check --status
          python - "$source_dir/original.cue" "$source_dir/disc.cue" <<'PY'
          from pathlib import Path
          import re, sys
          source, destination = map(Path, sys.argv[1:3])
          lines = source.read_text(encoding="utf-8").splitlines()
          rewritten = []
          count = 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  match = re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$', line, re.I)
                  if not match:
                      raise SystemExit("Unrecognized CUE FILE directive")
                  line = match.group(1) + '"disc.bin"' + match.group(2)
                  count += 1
              rewritten.append(line)
          if count != 1:
              raise SystemExit(f"Expected one CUE FILE directive, got {count}")
          destination.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY
          bchunk "$source_dir/disc.bin" "$source_dir/disc.cue" "$source_dir/track"
          iso="$(find "$source_dir" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          test -n "$iso"
          xorriso -osirrox on -indev "$iso" -extract / "$source_dir/extracted-root" > "$out/disc-extraction.log" 2>&1
          candidate="$(find "$source_dir/extracted-root" -type f -iname 'SLPS_035.53*' -print -quit)"
          test -n "$candidate"
          cp "$candidate" "$input_dir/SLPS_035.53"
          test "$(stat -c '%s' "$input_dir/SLPS_035.53")" = "385024"
          echo "$EXPECTED_EXE_SHA256  $input_dir/SLPS_035.53" | sha256sum --check --status
          test "$(head -c 8 "$input_dir/SLPS_035.53")" = "PS-X EXE"
          echo "executable=SLPS_035.53" > "$out/input-validation.txt"
          echo "executable_bytes=385024" >> "$out/input-validation.txt"
          echo "executable_sha256=$EXPECTED_EXE_SHA256" >> "$out/input-validation.txt"
          echo "game_binary_uploaded_as_artifact=no" >> "$out/input-validation.txt"
          rm -rf "$source_dir"
          echo "Verified executable extracted; disc image and extraction tree deleted."

      - name: Set up Java runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Restore cached Ghidra installation
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          fi

      - name: Install MIPS disassembler and m2c
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "spimdisasm==1.42.4"
          m2c_commit="$(git ls-remote https://github.com/matt-kempster/m2c.git refs/heads/master | awk 'NR==1 {print $1}')"
          [[ "$m2c_commit" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$m2c_commit" > "$RUNNER_TEMP/m2c-commit.txt"
          python3 -m pip install --disable-pip-version-check --no-input "m2c @ git+https://github.com/matt-kempster/m2c.git@$m2c_commit"
          python3 -m pip show spimdisasm m2c > "$RUNNER_TEMP/step5-tool-versions.txt"
          cat "$RUNNER_TEMP/m2c-commit.txt" >> "$RUNNER_TEMP/step5-tool-versions.txt"

      - name: Run targeted Ghidra decompilation on the verified executable
        shell: bash
        run: |
          set -euo pipefail
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$headless" && test -x "$headless"
          project="$RUNNER_TEMP/step5-ghidra-project"
          out="$RUNNER_TEMP/step5-output"
          mkdir -p "$project" "$out"
          "$headless" "$project" Naruto_SLPS_035_53_step5 \
            -import "$RUNNER_TEMP/step5-input/SLPS_035.53" \
            -loader BinaryLoader \
            -loader-baseAddr 0x80010000 \
            -loader-fileOffset 0x800 \
            -loader-length 0x5D800 \
            -loader-blockName MAIN_TEXT \
            -processor "MIPS:LE:32:default" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -preScript PreparePsxExe.java \
            -postScript ExportRngCallerAnalysis.java "$out/rng-caller-analysis.txt" \
            -analysisTimeoutPerFile 1800 \
            -max-cpu 2 \
            -deleteProject > "$out/ghidra-headless.log" 2>&1
          test -s "$out/rng-caller-analysis.txt"
          grep -q "=== FUNCTION entry=0x80015ADC" "$out/rng-caller-analysis.txt"
          grep -q "=== FUNCTION entry=0x80015B7C" "$out/rng-caller-analysis.txt"
          grep -q "=== FUNCTION entry=0x8001A328" "$out/rng-caller-analysis.txt"
          grep -q "=== FUNCTION entry=0x80020BF4" "$out/rng-caller-analysis.txt"
          echo "Ghidra exported all four target functions."

      - name: Compare same functions with m2c
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/step5_m2c_compare.py \
            --exe "$RUNNER_TEMP/step5-input/SLPS_035.53" \
            --ghidra "$RUNNER_TEMP/step5-output/rng-caller-analysis.txt" \
            --out-dir "$RUNNER_TEMP/step5-output/compare" \
            --report "$RUNNER_TEMP/step5-output/step5-m2c-comparison.md" \
            --m2c-commit "$RUNNER_TEMP/m2c-commit.txt"
          cat "$RUNNER_TEMP/step5-output/step5-m2c-comparison.md"

      - name: Upload text-only comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step5-ghidra-m2c-same-functions
          path: |
            ${{ runner.temp }}/step5-output/step5-m2c-comparison.md
            ${{ runner.temp }}/step5-output/rng-caller-analysis.txt
            ${{ runner.temp }}/step5-output/input-validation.txt
            ${{ runner.temp }}/step5-output/step5-tool-versions.txt
            ${{ runner.temp }}/step5-output/compare/*.c
            ${{ runner.temp }}/step5-output/compare/*.log
            ${{ runner.temp }}/step5-output/compare/*.s
            ${{ runner.temp }}/step5-output/compare/*.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Require all Ghidra/m2c comparisons to complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/step5-output/step5-m2c-comparison.md"
          test -s "$report"
          grep -q '^status=SUCCESS$' "$report"

      - name: Delete executable and temporary projects
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/step5-input" "$RUNNER_TEMP/step5-ghidra-project" "$RUNNER_TEMP/psx-disc-source"
