name: AN2 AN3 H6 hybrid C/A/B isolated Memory Card replay and byte diff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/an2-an3-h6-isolated-mcd.yml"
      - "experiments/an2_an3_h6_isolated_mcd.py"
      - "experiments/AN2_AN3_INPUT_SCHEDULE.tsv"

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-an2-an3-h6-isolated-mcd
  cancel-in-progress: true

jobs:
  an2-an3-h6-isolated-mcd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_REPO: ${{ github.repository }}
      WORK: /tmp/naruto-an2-an3-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Allocate run output and private scratch
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/reports/an_2026-10-30/runs/run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$OUTDIR" "$WORK"/{source,inputs,cards,resume,logs,home,.config,.data,runtime}
          echo "OUTDIR=$OUTDIR" >> "$GITHUB_ENV"

      - name: Install bounded headless tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb x11-utils curl jq unzip python3 gdb

      - name: Download and verify pinned emulator, disc, BIOS and target checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/source"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"; bytes="$3"; digest="$4"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 600 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$out"
            test "$(stat -c %s "$out")" = "$bytes"
            echo "$digest  $out" | sha256sum --check -
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage 65747557 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin 325989552 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue 116 be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8
          fetch_asset scph7502.zip scph7502.zip 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/686794219" -o target.sstate
          test "$(stat -c %s target.sstate)" = 21163286
          echo "00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d  target.sstate" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          import stat, zipfile, hashlib
          with zipfile.ZipFile("scph7502.zip") as archive:
              candidates=[]; total=0
              for member in archive.infolist():
                  p=Path(member.filename); mode=(member.external_attr>>16)&0xffff; total+=member.file_size
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS member")
                  if member.file_size>2*1024*1024 or total>4*1024*1024: raise SystemExit("BIOS expansion bound")
                  if not member.is_dir() and member.file_size==524288: candidates.append(member)
              if len(candidates)!=1: raise SystemExit("expected one BIOS-sized member")
              bios=archive.read(candidates[0]); digest=hashlib.sha256(bios).hexdigest()
              if digest!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS SHA mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("BIOS_SHA256="+digest)
          cue=Path("game.cue").read_text(encoding="utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          indexes=[i for i,row in enumerate(cue) if row.strip().upper().startswith("FILE ")]
          if len(indexes)!=1: raise SystemExit("expected one CUE FILE row")
          cue[indexes[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(cue)+"\n",encoding="ascii")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          APPDIR="$WORK/source/squashfs-root"
          test -x "$APPDIR/AppRun"
          PCSX_BIN="$(find -L "$APPDIR" -maxdepth 8 -type f -perm /111 | grep -E '/(pcsx-redux|pcsx-redux[^/]*)$' | head -n 1)"
          test -n "$PCSX_BIN" && test -x "$PCSX_BIN"
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"
          echo "PCSX_BIN=$PCSX_BIN" >> "$GITHUB_ENV"
          cp target.sstate "$WORK/resume/target.sstate"
          chmod 400 "$WORK/resume/target.sstate"

      - name: Download previously verified control checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: "39867730674"
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/naruto-an2-an3-${{ github.run_id }}-${{ github.run_attempt }}/inputs

      - name: Download reference Memory Card temporarily
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: "39262213468"
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/naruto-an2-an3-${{ github.run_id }}-${{ github.run_attempt }}/cards

      - name: Validate private inputs and initialize headless display
        shell: bash
        run: |
          set -euo pipefail
          echo "CONTROL_ARTIFACT_FILE_MANIFEST_BEGIN"
          find "$WORK/inputs" -type f -printf '%p %s bytes\\n' | sort
          echo "CONTROL_ARTIFACT_FILE_MANIFEST_END"
          CONTROL_PATH="$(find "$WORK/inputs" -type f -size 21162546c -print -quit)"
          test -n "$CONTROL_PATH" || { echo "CONTROL_ARTIFACT_EXPECTED_SIZE_FILE_NOT_FOUND"; exit 1; }
          cp "$CONTROL_PATH" "$WORK/resume/control.sstate"
          test "$(stat -c %s "$WORK/resume/control.sstate")" = 21162546
          echo "9eef83b1590773159b95180447aaa1f35139468b3ea51c7beec00bfb89f41492  $WORK/resume/control.sstate" | sha256sum --check -
          echo "MEMCARD_ARTIFACT_FILE_MANIFEST_BEGIN"
          find "$WORK/cards" -type f -printf '%p %s bytes\\n' | sort
          echo "MEMCARD_ARTIFACT_FILE_MANIFEST_END"
          CARD_PATH="$(find "$WORK/cards" -type f -size 131072c -print -quit)"
          test -n "$CARD_PATH" || { echo "MEMCARD_ARTIFACT_EXPECTED_SIZE_FILE_NOT_FOUND"; exit 1; }
          cp "$CARD_PATH" "$WORK/reference.mcd"
          test "$(stat -c %s "$WORK/reference.mcd")" = 131072
          echo "ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5  $WORK/reference.mcd" | sha256sum --check -
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/logs/xvfb.log" 2>&1 &
          echo $! > "$WORK/xvfb.pid"
          export DISPLAY=:99
          for n in $(seq 1 80); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null

      - name: Run H6 C/A/B schedules twice each
        id: an2_an3_probe
        shell: bash
        run: |
          set +e
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" \
            XDG_DATA_HOME="$WORK/home/.data" XDG_RUNTIME_DIR="$WORK/home/runtime"
          export LIBGL_ALWAYS_SOFTWARE=1
          export LD_LIBRARY_PATH="$APPDIR/usr/lib:$APPDIR/usr/lib/x86_64-linux-gnu"
          export QT_PLUGIN_PATH="$APPDIR/usr/plugins"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$APPDIR/usr/plugins/platforms"
          export QML2_IMPORT_PATH="$APPDIR/usr/qml"
          python3 experiments/an2_an3_h6_isolated_mcd.py \
            --target "$WORK/resume/target.sstate" --control "$WORK/resume/control.sstate" \
            --pcsx-bin "$PCSX_BIN" --appdir "$APPDIR" --bios "$WORK/source/scph7502.bin" \
            --cue "$WORK/source/game-run.cue" --card "$WORK/reference.mcd" \
            --work "$WORK" --out "$OUTDIR" --schedule "$GITHUB_WORKSPACE/experiments/AN2_AN3_INPUT_SCHEDULE.tsv" \
            --timeout 600
          rc=$?
          echo "AN2_AN3_SCRIPT_EXIT_CODE=$rc" > "$OUTDIR/AN2_AN3_SCRIPT_EXIT_CODE.txt"
          exit "$rc"

      - name: Publish text-only run evidence and numeric job ID
        if: always()
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          OUTDIR="reports/an_2026-10-30/runs/run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$OUTDIR"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          JOB_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -r '.jobs[] | select(.name=="an2-an3-h6-isolated-mcd") | .id' | head -n 1)"
          test -n "$JOB_ID" && test "$JOB_ID" != null || JOB_ID="TIDAK TAHU"
          if [ ! -f "$OUTDIR/AN2_AN3_SUMMARY.txt" ]; then
            echo "STATUS=INCOMPLETE (runner did not produce a completed summary)" > "$OUTDIR/AN2_AN3_SUMMARY.txt"
          fi
          if [ ! -f "$OUTDIR/AN2_CAPTURE_SUMMARY.tsv" ]; then
            printf 'schedule\tattempt\tframe\tcapture_status\ttime_to_frame_s\tram_first_2mib_sha256\n' > "$OUTDIR/AN2_CAPTURE_SUMMARY.tsv"
          fi
          if [ ! -f "$OUTDIR/AN3_DIFF_RANGES.tsv" ]; then
            printf 'record_type\tgroup_index\tcomparison\tattempt\tframe\tstart_address\tend_address_inclusive\tspan_bytes\tchanged_bytes_in_range\ttotal_diff_bytes\tCHAKRA\tRNG\tSLOT_0x8013A554\tBLOCK_0x801CEF08\t0x80066E7C\tTIDAK_TAHU\tlabel_plus_unknown_equals_total\tgroup_gap_rule\n' > "$OUTDIR/AN3_DIFF_RANGES.tsv"
          fi
          SCRIPT_EXIT_CODE="$(sed -n 's/^AN2_AN3_SCRIPT_EXIT_CODE=//p' "$OUTDIR/AN2_AN3_SCRIPT_EXIT_CODE.txt" 2>/dev/null | head -n 1)"
          test -n "$SCRIPT_EXIT_CODE" || SCRIPT_EXIT_CODE="TIDAK TAHU"
          if [ ! -f "$OUTDIR/ACTIONS_RUN_SUMMARY.txt" ]; then
            {
              echo "STATUS=INCOMPLETE"
              echo "JOB=an2-an3-h6-isolated-mcd"
              echo "JOB_ID=$JOB_ID"
              echo "RUN_ID=$GITHUB_RUN_ID"
              echo "SOURCE_SHA=$GITHUB_SHA"
              echo "EXIT_CODE=$SCRIPT_EXIT_CODE"
            } > "$OUTDIR/ACTIONS_RUN_SUMMARY.txt"
          else
            sed -i "s/^JOB_ID=.*/JOB_ID=$JOB_ID/" "$OUTDIR/ACTIONS_RUN_SUMMARY.txt"
          fi
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "JOB=an2-an3-h6-isolated-mcd"
            echo "JOB_ID=$JOB_ID"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "PUBLISH_PATH=$OUTDIR"
          } > "$OUTDIR/PUBLICATION_METADATA.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # OUTDIR is text-only: summaries, TSVs, and emulator/GDB text logs. Private binaries stay under WORK and are never staged.
          git add "$OUTDIR"
          if ! git diff --cached --quiet; then
            git commit -m "Publish AN2_AN3 H6 Circle A-B replay run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            published=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if [ $? -ne 0 ]; then git rebase --abort; sleep "$n"; continue; fi
              git push origin HEAD:main
              if [ $? -eq 0 ]; then published=1; break; fi
              sleep "$n"
            done
            test "$published" -eq 1
          fi
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)"

      - name: Remove temporary ISO, BIOS, savestates, Memory Card, RAM state and emulator
        if: always()
        shell: bash
        run: |
          kill "$(cat "$WORK/xvfb.pid" 2>/dev/null)" 2>/dev/null || true
          rm -rf "$WORK"
