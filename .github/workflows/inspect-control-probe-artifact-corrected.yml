name: Corrected runner-only control-probe artifact inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.inspect-control-probe-artifact-12308661246"

permissions:
  contents: read
  actions: read

concurrency:
  group: corrected-inspect-control-probe-artifact-12308661246
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[INSPECT-CONTROL-PROBE-ARTIFACT-12308661246-CORRECTED]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository text
        uses: actions/checkout@v4
      - name: Validate one-shot selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat experiments/.inspect-control-probe-artifact-12308661246)" = "ARTIFACT_ID=12308661246 RUN_ID=39513285641"
          echo "INSPECTION_SCOPE=artifact 12308661246; run 39513285641; no emulator/input/restore"
      - name: Download existing artifact to runner temp
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/control-probe-artifact
      - name: Install OCR and image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y python3-pil tesseract-ocr tesseract-ocr-jpn
      - name: Read text and analyze authentic 320x240-or-native screenshots on runner
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/control-probe-artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from PIL import Image, ImageChops, ImageEnhance, ImageOps

          root=Path(os.environ["ARTIFACT_DIR"])
          files=sorted(p for p in root.rglob("*") if p.is_file())
          infos=[SimpleNamespace(name=p.relative_to(root).as_posix(), size=p.stat().st_size, path=p) for p in files]
          total=sum(x.size for x in infos)
          print(f"RUNNER_FILE_COUNT={len(infos)} TOTAL_BYTES={total}")
          if total>150*1024*1024: raise SystemExit("size limit exceeded")
          for x in infos: print(f"ENTRY name={x.name} bytes={x.size}")
          # Only parse small text/JSON/log files and PNG screenshots. Never read or execute
          # the bundled AppImage, savestates, or any other binary payload.
          for x in infos:
              low=x.name.lower()
              if low.endswith(".sstate"):
                  print(f"SAVESTATE_SKIPPED name={x.name}"); continue
              if x.size>2*1024*1024: continue
              if low.endswith(".json"):
                  try:
                      obj=json.loads(x.path.read_text(encoding="utf-8",errors="replace"))
                      if isinstance(obj,dict):
                          print(f"JSON name={x.name} data={json.dumps(obj,ensure_ascii=False)[:900]}")
                  except Exception as e: print(f"JSON_ERROR name={x.name} type={type(e).__name__}")
              elif low.endswith((".txt",".log",".stdout",".stderr")):
                  lines=x.path.read_text(encoding="utf-8",errors="replace").splitlines()
                  if any(k in low for k in ("control-probe-report","manifest")):
                      print(f"TEXT_BEGIN name={x.name}")
                      for line in lines[:100]: print(line[:800])
                      print(f"TEXT_END name={x.name}")
                  else:
                      hits=[line for line in lines if re.search(r"CONTROL_PROBE_|INPUT|readback|BRANCH|SCREENSHOT|LOAD_|restore",line,re.I)]
                      for line in hits[:100]: print(f"LOG name={x.name} {line[:800]}")
          branches=("NONE","START","CIRCLE","CROSS","TRIANGLE","SQUARE","UP","DOWN","LEFT","RIGHT")
          rx=re.compile(r"(NONE|START|CIRCLE|CROSS|TRIANGLE|SQUARE|UP|DOWN|LEFT|RIGHT)-(pre|post)\.png$",re.I)
          images={}
          unique={}
          for x in infos:
              m=rx.search(Path(x.name).name)
              if not m or x.size>2*1024*1024: continue
              key=(m.group(1).upper(),m.group(2).lower())
              digest=hashlib.sha256(x.path.read_bytes()).hexdigest()
              try:
                  im=Image.open(x.path).convert("RGB")
                  images[key]=(im,x.name,digest)
                  print(f"IMAGE key={key[0]}-{key[1]} name={x.name} dims={im.width}x{im.height} sha256={digest}")
                  unique.setdefault(digest,(im,x.name))
              except Exception as e: print(f"IMAGE_ERROR name={x.name} type={type(e).__name__}")
          print(f"UNIQUE_SCREENSHOTS={len(unique)}")
          for digest,(im,name) in unique.items():
              # Try multiple OCR layouts on a 4x grayscale, autocontrasted copy.
              gray=ImageOps.autocontrast(im.convert("L"))
              gray=ImageEnhance.Contrast(gray).enhance(1.6).resize((im.width*4,im.height*4))
              with tempfile.NamedTemporaryFile(suffix=".png",delete=False) as tmp:
                  gray.save(tmp.name); tmpname=tmp.name
              try:
                  for psm in ("6","11"):
                      o=subprocess.run(["tesseract",tmpname,"stdout","-l","jpn+eng","--psm",psm],capture_output=True,text=True,timeout=25)
                      print(f"OCR sha256={digest} source={name} dims={im.width}x{im.height} psm={psm} rc={o.returncode} text={' '.join(o.stdout.split())[:1000]}")
              finally: Path(tmpname).unlink(missing_ok=True)
          control_pre=images.get(("NONE","pre"))
          control_post=images.get(("NONE","post"))
          for branch in branches:
              if branch=="NONE": continue
              for phase,control in (("pre",control_pre),("post",control_post)):
                  cand=images.get((branch,phase))
                  if not control or not cand: continue
                  a,b=control[0],cand[0]
                  if a.size!=b.size: print(f"PAIR_SIZE_MISMATCH {branch}-{phase}"); continue
                  diff=ImageChops.difference(a,b)
                  hist=diff.convert("L").histogram()
                  differing=sum(hist[1:])
                  channels=diff.getextrema()
                  bbox=diff.getbbox()
                  # Mean absolute error calculated directly per channel.
                  import statistics
                  vals=[sum(ch)/len(ch) for ch in diff.split()]
                  mae=sum(vals)/3
                  print(f"PAIR_DIFF branch={branch} phase={phase} dims={a.width}x{a.height} differing_pixels={differing} total_pixels={a.width*a.height} mean_abs_rgb={mae:.6f} bbox={bbox} extrema={channels}")
          print("ARTIFACT_CONTENT_PROCESSING=RUNNER_ONLY")
          print("NO_EMULATOR=1 NO_GAMEPLAY_INPUT=1 NO_RESTORE=1 NO_PLAYER_WORKFLOW=1")
          PY
