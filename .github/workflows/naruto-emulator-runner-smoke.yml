name: Naruto emulator runner smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/naruto-emulator-runner-smoke.yml"

permissions:
  contents: read

concurrency:
  group: naruto-emulator-runner-smoke
  cancel-in-progress: true

jobs:
  linux-runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check remote Linux runner
        run: |
          set -eu
          echo "Runner: $(uname -a)"
          echo "Architecture: $(uname -m)"
          echo "OS:"
          cat /etc/os-release
          echo "Disk space:"
          df -h .

      - name: Download the documented PCSX-Redux research build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/naruto-emulator-smoke
          cd /tmp/naruto-emulator-smoke
          curl --fail --location --retry 2 --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/642919476" \
            --output pcsx-redux.AppImage
          curl --fail --location --retry 2 --max-time 45 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research/releases/assets/643033573" \
            --output openbios-chunked.bin
          chmod +x pcsx-redux.AppImage
          echo "Downloaded emulator package:"
          ls -lh pcsx-redux.AppImage openbios-chunked.bin
          sha256sum pcsx-redux.AppImage openbios-chunked.bin
          file pcsx-redux.AppImage openbios-chunked.bin

      - name: Check executable compatibility
        run: |
          set -eu
          cd /tmp/naruto-emulator-smoke
          ./pcsx-redux.AppImage --appimage-extract >/tmp/appimage-extract.log 2>&1 || {
            cat /tmp/appimage-extract.log
            exit 1
          }
          test -x squashfs-root/AppRun
          echo "AppImage extraction succeeded."
          echo "Bundled entry point:"
          file squashfs-root/AppRun
          echo "This is only an environment/package smoke test. It does not claim the game booted."
