name: Naruto fastboot CPU and CP0 polling

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-fastboot-cpu-poll.yml"

permissions:
  contents: read

concurrency:
  group: naruto-fastboot-cpu-poll
  cancel-in-progress: true

jobs:
  cpu-poll:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - name: Install private runtime tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils libgl1-mesa-dri python3

      - name: Download and verify private runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-fastboot-cpu-poll"
          mkdir -p "$WORK/home"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private release asset: $name"; exit 1; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset openbios.bin openbios-fastboot.bin
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          echo "25c789eb66608847907217c367f04a3ec6e62c08530e97c437ce99d29f4c156d  openbios-fastboot.bin" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          lines = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          ids = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "ROM, BIOS and AnyLinux hashes verified."

      - name: Run baseline and poll CPU registers without breakpoints
        run: |
          set -eu
          cd "$WORK"
          Xvfb :99 -ac -screen 0 1280x800x24 -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          emu_pid=""
          cleanup() {
            if [ -n "$emu_pid" ]; then kill "$emu_pid" 2>/dev/null || true; fi
            kill "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped")
          LUA
          )
          EMU_LAUNCH_EPOCH="$(date +%s.%N)"
          export EMU_LAUNCH_EPOCH
          echo "EMULATOR_LAUNCH_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout --signal=TERM --kill-after=5s 100s \
            "$WORK/squashfs-root/AppRun" -bios "$WORK/openbios-fastboot.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -gdb -gdb-port 3333 -run -interpreter -stdout -lua_stdout \
            -logfile "$WORK/pcsx.log" > "$WORK/pcsx.stdout" 2>&1 &
          emu_pid=$!
          PCSX_LOG_PATH="$WORK/pcsx.log" python3 - <<'PY' > "$WORK/cpu-poll-summary.txt" 2>&1 &
          import os, re, socket, time
          from pathlib import Path

          HOST, PORT = "127.0.0.1", 3333
          POLL_SECONDS, INTERVAL_SECONDS = 70.0, 1.0
          LOG_PATH = Path(os.environ["PCSX_LOG_PATH"])
          try:
              LAUNCH_EPOCH = float(os.environ["EMU_LAUNCH_EPOCH"])
          except (KeyError, ValueError):
              LAUNCH_EPOCH = time.time()
          MARKERS = (
              ("system_cnf", "setup file    : cdrom:SYSTEM.CNF;1"),
              ("boot_path", "BOOT ="),
              ("exe_header", "EXEC:PC0(80011448)"),
              ("execute_handoff", "Execute !"),
          )
          seen_markers = set()

          def packet(payload):
              raw = payload.encode("ascii")
              return b"$" + raw + b"#" + f"{sum(raw) & 255:02x}".encode("ascii")

          def elapsed_launch():
              return max(0.0, time.time() - LAUNCH_EPOCH)

          def record_loader_markers():
              try:
                  text = LOG_PATH.read_text(errors="replace")
              except OSError:
                  return
              observed = elapsed_launch()
              for name, needle in MARKERS:
                  if name not in seen_markers and needle in text:
                      seen_markers.add(name)
                      print("LOADER_MARKER marker={} first_observed_elapsed_s={:.2f} source=pcsx_log_poll".format(name, observed), flush=True)

          class RSP:
              def __init__(self, sock):
                  self.sock = sock
                  self.buf = bytearray()
                  self.console_packets = 0

              def receive_packet(self, deadline):
                  while time.monotonic() < deadline:
                      start = self.buf.find(b"$")
                      if start > 0:
                          del self.buf[:start]
                          start = 0
                      if start == 0:
                          mark = self.buf.find(b"#", 1)
                          if mark >= 0 and len(self.buf) >= mark + 3:
                              body = bytes(self.buf[1:mark])
                              got = bytes(self.buf[mark + 1:mark + 3]).lower()
                              del self.buf[:mark + 3]
                              want = f"{sum(body) & 255:02x}".encode("ascii")
                              if got != want:
                                  raise ValueError("RSP checksum mismatch")
                              # PCSX-Redux console output is an O packet, never a stop event.
                              if body.startswith(b"O"):
                                  self.console_packets += 1
                                  continue
                              return body.decode("ascii", "replace")
                      elif self.buf:
                          # Ignore standalone ACK/NACK bytes while preserving incomplete '$' frames.
                          self.buf.clear()
                      self.sock.settimeout(max(0.05, deadline - time.monotonic()))
                      try:
                          chunk = self.sock.recv(4096)
                      except socket.timeout:
                          continue
                      if not chunk:
                          raise ConnectionError("RSP peer closed")
                      self.buf.extend(chunk)
                  raise TimeoutError("no non-console RSP response before deadline")

              def request(self, command, expected, timeout=2.0):
                  self.sock.sendall(packet(command))
                  deadline = time.monotonic() + timeout
                  unexpected = []
                  while time.monotonic() < deadline:
                      reply = self.receive_packet(deadline)
                      if expected == "bulk" and len(reply) == 576 and re.fullmatch(r"[0-9a-fA-F]{576}", reply):
                          return reply
                      if expected == "status" and reply[:1] in ("T", "S", "W", "X"):
                          return reply
                      if expected == "any":
                          return reply
                      unexpected.append(reply[:48])
                  raise TimeoutError("unexpected response(s): " + ",".join(unexpected[-3:]))

          def reg_value(field):
              if len(field) != 8 or not re.fullmatch(r"[0-9a-fA-F]{8}", field):
                  return "unavailable"
              # PCSX-Redux serializes each 32-bit register least-significant byte first.
              return f"0x{int.from_bytes(bytes.fromhex(field), 'little'):08x}"

          def parse_bulk(reply):
              # Source at PCSX-Redux commit 0c3572c3: g packet has 72 32-bit registers.
              regs = [reply[i * 8:(i + 1) * 8] for i in range(72)]
              return {
                  "status": reg_value(regs[32]),
                  "badvaddr": reg_value(regs[35]),
                  "cause": reg_value(regs[36]),
                  "pc": reg_value(regs[37]),
              }

          def classify(pc):
              if not pc.startswith("0x"):
                  return "unavailable"
              value = int(pc, 16)
              if 0x80010000 <= value < 0x8006d800:
                  return "main-exe-range"
              if 0x80000000 <= value < 0x80001000:
                  return "low-ram/exception-vector"
              if 0xbfc00000 <= value < 0xbfc80000:
                  return "bios-range"
              if 0xa0010000 <= value < 0xa006d800:
                  return "main-exe-alias"
              return "other"

          rsp = None
          sock = None
          for attempt in range(30):
              record_loader_markers()
              try:
                  sock = socket.create_connection((HOST, PORT), timeout=1.0)
                  rsp = RSP(sock)
                  break
              except OSError:
                  time.sleep(0.5)
          if rsp is None:
              print("RSP_CONNECT=failed port=3333", flush=True)
              raise SystemExit(0)

          sock.settimeout(3.0)
          print("RSP_CONNECT=connected port=3333", flush=True)
          try:
              try:
                  caps = rsp.request("qSupported:multiprocess+", "any", timeout=3.0)
                  print("RSP_QSUPPORTED=" + caps[:220], flush=True)
              except Exception as error:
                  print("RSP_QSUPPORTED=error:" + type(error).__name__, flush=True)

              poll_start = time.monotonic()
              poll_deadline = poll_start + POLL_SECONDS
              samples = []
              while time.monotonic() < poll_deadline:
                  cycle_start = time.monotonic()
                  record_loader_markers()
                  row = {"elapsed_launch_s": elapsed_launch()}
                  try:
                      bulk = rsp.request("g", "bulk", timeout=3.0)
                      row.update(parse_bulk(bulk))
                      row["region"] = classify(row["pc"])
                      row["bulk_valid"] = "yes"
                      print("CPU_SAMPLE index={} elapsed_launch_s={:.2f} pc={} region={} cp0_status={} cp0_badvaddr={} cp0_cause={} bulk_valid=yes".format(
                          len(samples), row["elapsed_launch_s"], row["pc"], row["region"], row["status"], row["badvaddr"], row["cause"]
                      ), flush=True)
                  except Exception as error:
                      row.update({"pc":"unavailable","region":"unavailable","status":"unavailable","badvaddr":"unavailable","cause":"unavailable","bulk_valid":"no"})
                      print("CPU_SAMPLE_ERROR index={} elapsed_launch_s={:.2f} error={}".format(
                          len(samples), row["elapsed_launch_s"], type(error).__name__
                      ), flush=True)
                  samples.append(row)

                  # This explicit query only reports running/paused state; S00 is not a stop event.
                  if len(samples) == 1 or len(samples) % 10 == 0:
                      try:
                          status_reply = rsp.request("?", "status", timeout=2.0)
                          meaning = "running-not-stop-event" if status_reply == "S00" else ("paused-or-stop-state-query" if status_reply.startswith(("S", "T", "W", "X")) else "other")
                          print("TARGET_QUERY index={} reply={} meaning={}".format(len(samples)-1, status_reply, meaning), flush=True)
                      except Exception as error:
                          print("TARGET_QUERY index={} error={}".format(len(samples)-1, type(error).__name__), flush=True)

                  record_loader_markers()
                  delay = INTERVAL_SECONDS - (time.monotonic() - cycle_start)
                  if delay > 0:
                      time.sleep(delay)

              counts = {}
              unique_pc = set()
              valid_count = 0
              for row in samples:
                  counts[row.get("region", "unavailable")] = counts.get(row.get("region", "unavailable"), 0) + 1
                  unique_pc.add(row.get("pc", "unavailable"))
                  valid_count += row.get("bulk_valid") == "yes"
              record_loader_markers()
              missing = sorted(set(name for name, _ in MARKERS) - seen_markers)
              print("CPU_SUMMARY sample_count={} valid_bulk_count={} unique_pc_count={} region_counts={} console_packets_ignored={} missing_markers={}".format(
                  len(samples), valid_count, len(unique_pc), ",".join(f"{key}:{value}" for key,value in sorted(counts.items())), rsp.console_packets, ",".join(missing) or "none"
              ), flush=True)
          finally:
              sock.close()
          PY
          sampler_pid=$!
          set +e
          wait "$sampler_pid"
          sampler_rc=$?
          wait "$emu_pid"
          emu_rc=$?
          set -e
          echo "CPU_SAMPLER_EXIT=$sampler_rc"
          echo "GUI_PROCESS_EXIT=$emu_rc (124 means the 100-second observation cap)"
          echo "BOOT_MARKERS_BEGIN"
          grep -E 'Loaded BIOS:|OpenBIOS detected|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM\.CNF|BOOT =|EXEC:PC0|Execute !|PAD_SETUP=|First chance exception|Unknown GDB command|Exception|FATAL|ERROR|Error|Failed|failed' "$WORK/pcsx.stdout" "$WORK/pcsx.log" 2>/dev/null | tail -100 || true
          echo "BOOT_MARKERS_END"
          echo "CPU_SUMMARY_BEGIN"
          cat "$WORK/cpu-poll-summary.txt" || true
          echo "CPU_SUMMARY_END"

      - name: Upload private CPU summary and loader logs for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-fastboot-cpu-poll-private
          path: |
            ${{ runner.temp }}/naruto-fastboot-cpu-poll/cpu-poll-summary.txt
            ${{ runner.temp }}/naruto-fastboot-cpu-poll/pcsx.stdout
            ${{ runner.temp }}/naruto-fastboot-cpu-poll/pcsx.log
          if-no-files-found: warn
          retention-days: 3

      - name: Clean private ROM, BIOS, emulator and logs
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi
          echo "Cleanup complete; private ROM, BIOS, emulator and logs removed from runner."
