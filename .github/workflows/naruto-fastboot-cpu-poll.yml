name: Naruto cloud visual boot probe (PCSX-Redux framebuffer capture)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/naruto-fastboot-cpu-poll.yml"

permissions:
  contents: read

concurrency:
  group: naruto-cloud-visual-boot-probe
  cancel-in-progress: true

jobs:
  visual-probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    env:
      WORK: ${{ runner.temp }}/naruto-cloud-visual-boot-probe
    steps:
      - name: Install cloud display and image tools
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils libgl1-mesa-dri python3 python3-pil

      - name: Download and verify private runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p "$WORK/home" "$WORK/captures"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private release asset: $name"; exit 1; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset openbios.bin openbios-fastboot.bin
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          echo "25c789eb66608847907217c367f04a3ec6e62c08530e97c437ce99d29f4c156d  openbios-fastboot.bin" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          lines = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          ids = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "ROM, CUE, BIOS and AnyLinux hashes/structure verified."

      - name: Run normal emulation and capture the emulated display
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          mkdir -p captures
          Xvfb :99 -ac -screen 0 1280x800x24 -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          emu_pid=""
          cleanup() {
            if [ -n "$emu_pid" ]; then kill "$emu_pid" 2>/dev/null || true; fi
            kill "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null

          # Preserve the already-tested Port 1 Analog/remap setup. Do not attach GDB
          # or force the interpreter in this visual run: first measure ordinary
          # emulator execution, then add debugger instrumentation only if needed.
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped")
          LUA
          )

          cat > "$WORK/cloud-capture.lua" <<'LUA'
          local output_dir = "captures"
          local frame_count = 0
          local targets = { [60]=true, [300]=true, [600]=true, [900]=true, [1800]=true, [3000]=true, [3600]=true }
          local function capture_frame(n)
              local ok, err = pcall(function()
                  local shot = PCSX.GPU.takeScreenShot()
                  local bpp = (shot.bpp == 0) and 16 or 24
                  local raw_path = string.format("%s/frame-%06d.raw", output_dir, n)
                  local raw = Support.File.open(raw_path, "TRUNCATE")
                  assert(raw, "cannot create raw screenshot: " .. raw_path)
                  raw:writeMoveSlice(shot.data)
                  raw:close()
                  local meta_path = string.format("%s/frame-%06d.json", output_dir, n)
                  local meta = assert(io.open(meta_path, "wb"), "cannot create screenshot metadata")
                  meta:write(string.format(
                      '{"frame":%d,"width":%d,"height":%d,"bpp":%d,"expected_bytes":%d,"guest_fps":%.4f}\n',
                      n, shot.width, shot.height, bpp, shot.width * shot.height * bpp / 8,
                      PCSX.GPU.getGuestFPS()
                  ))
                  meta:close()
                  print(string.format(
                      "GPU_CAPTURE status=ok frame=%d width=%d height=%d bpp=%d",
                      n, shot.width, shot.height, bpp
                  ))
              end)
              if not ok then
                  printError(string.format("GPU_CAPTURE status=error frame=%d error=%s", n, tostring(err)))
              end
          end

          -- Keep this listener global; PCSX removes listeners that are garbage-collected.
          cloudCaptureListener = PCSX.Events.createEventListener("GPU::Vsync", function()
              frame_count = frame_count + 1
              if frame_count % 300 == 0 then
                  print(string.format("GPU_VSYNC frame=%d guest_fps=%.4f", frame_count, PCSX.GPU.getGuestFPS()))
              end
              if targets[frame_count] then
                  local n = frame_count
                  PCSX.nextTick(function() capture_frame(n) end)
              end
              if frame_count == 4200 then
                  PCSX.nextTick(function()
                      print("CLOUD_PROBE_END=target_frame_reached")
                      PCSX.quit(0)
                  end)
              end
          end)
          print("CLOUD_PROBE=armed checkpoints=60,300,600,900,1800,3000,3600")
          LUA

          echo "EMULATOR_MODE=normal-run-without-GDB-or-forced-interpreter"
          echo "SCREENSHOT_SOURCE=PCSX.GPU.takeScreenShot (emulated GPU display, not Xvfb root)"
          timeout --signal=TERM --kill-after=5s 90s \
            "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/openbios-fastboot.bin" -iso "$WORK/game-run.cue" \
              -exec "$PAD_SETUP" -dofile "$WORK/cloud-capture.lua" \
              -no-debugger -no-gdb -dynarec -stdout -lua_stdout -logfile "$WORK/pcsx.log" -run \
              > "$WORK/pcsx.stdout" 2>&1 &
          emu_pid=$!
          set +e
          wait "$emu_pid"
          emu_rc=$?
          set -e
          emu_pid=""
          echo "EMULATOR_EXIT_CODE=$emu_rc"
          cp "$WORK/pcsx.stdout" "$WORK/captures/pcsx.stdout" 2>/dev/null || true
          cp "$WORK/pcsx.log" "$WORK/captures/pcsx.log" 2>/dev/null || true
          grep -E 'PAD_SETUP|CLOUD_PROBE|GPU_CAPTURE|GPU_VSYNC|SYSTEM.CNF|BOOT =|EXEC:PC0|Execute !|error|Error|ERROR' \
            "$WORK/pcsx.stdout" "$WORK/pcsx.log" > "$WORK/captures/important-log-lines.txt" || true
          echo "EMULATOR_STEP_DONE=1"

      - name: Convert framebuffer checkpoints and summarize visual activity
        if: always()
        shell: bash
        run: |
          set -eu
          cd "$WORK"
          python3 - <<'PY'
          import json, hashlib, math, struct
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path("captures")
          summary = []
          images = []
          for meta_path in sorted(root.glob("frame-*.json")):
              meta = json.loads(meta_path.read_text())
              raw_path = meta_path.with_suffix(".raw")
              if not raw_path.exists():
                  summary.append(f"frame {meta['frame']}: missing raw data")
                  continue
              raw = raw_path.read_bytes()
              width, height, bpp = meta["width"], meta["height"], meta["bpp"]
              expected = width * height * (bpp // 8)
              if width <= 0 or height <= 0 or len(raw) != expected:
                  summary.append(f"frame {meta['frame']}: invalid image dimensions/data actual={len(raw)} expected={expected}")
                  continue
              if bpp == 16:
                  rgb = bytearray()
                  for i in range(0, len(raw), 2):
                      v = raw[i] | (raw[i + 1] << 8)
                      rgb.extend(((v & 31) * 255 // 31,
                                  ((v >> 5) & 31) * 255 // 31,
                                  ((v >> 10) & 31) * 255 // 31))
                  pixels = bytes(rgb)
              elif bpp == 24:
                  pixels = raw
              else:
                  summary.append(f"frame {meta['frame']}: unsupported bpp={bpp}")
                  continue
              img = Image.frombytes("RGB", (width, height), pixels)
              png_path = root / f"frame-{meta['frame']:06d}.png"
              img.save(png_path)
              # Useful diagnostics if the image is black or stale; visual inspection remains authoritative.
              colors = len(set(img.getdata()))
              nonblack = sum(1 for r,g,b in img.getdata() if r > 8 or g > 8 or b > 8)
              ratio = nonblack / (width * height)
              digest = hashlib.sha256(png_path.read_bytes()).hexdigest()
              summary.append(
                  f"frame={meta['frame']} size={width}x{height} bpp={bpp} "
                  f"guest_fps={meta['guest_fps']:.2f} unique_colors={colors} "
                  f"nonblack_ratio={ratio:.4f} png_sha256={digest}"
              )
              thumb = img.copy()
              thumb.thumbnail((340, 220), Image.Resampling.NEAREST)
              images.append((meta["frame"], thumb))
          if images:
              cols = 2
              rows = math.ceil(len(images) / cols)
              sheet = Image.new("RGB", (cols * 360, rows * 255), (24,24,24))
              draw = ImageDraw.Draw(sheet)
              for i, (frame, img) in enumerate(images):
                  x, y = (i % cols) * 360, (i // cols) * 255
                  draw.text((x + 8, y + 6), f"Emulated frame {frame}", fill=(255,255,255))
                  sheet.paste(img, (x + 8, y + 28))
              sheet.save(root / "contact-sheet.png")
          else:
              summary.append("NO_VALID_GPU_SCREENSHOTS")
          (root / "visual-summary.txt").write_text("\n".join(summary) + "\n")
          print("\n".join(summary))
          PY

      - name: Upload short-lived private diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-private-gpu-frame-captures
          path: |
            ${{ runner.temp }}/naruto-cloud-visual-boot-probe/captures/*.png
            ${{ runner.temp }}/naruto-cloud-visual-boot-probe/captures/*.json
            ${{ runner.temp }}/naruto-cloud-visual-boot-probe/captures/visual-summary.txt
            ${{ runner.temp }}/naruto-cloud-visual-boot-probe/captures/important-log-lines.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Remove runtime files from the ephemeral runner
        if: always()
        shell: bash
        run: |
          rm -rf "$WORK"
