name: Naruto Story Mode f175 controlled input versus no-input probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-konoha-f175-direction-diff"

permissions:
  contents: read
  actions: read

concurrency:
  group: naruto-storymode-f175-direction-diff
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-KONOHA-F175-DIRECTION-DIFF]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-f175-direction-diff
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install external X11 capture tools and create private workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil xvfb x11-utils x11-apps imagemagick curl unzip
          mkdir -p "$WORK"/{build-artifact,state-artifact,card-artifact,cards,resume,captures,home,.config,.data,runtime}
          chmod 700 "$WORK/runtime"

      - name: Download the previously built patched PCSX-Redux
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-f175-direction-diff/build-artifact

      - name: Download the verified f175 successor checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-konoha-resume-private
          run-id: 39591032125
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-f175-direction-diff/state-artifact

      - name: Download the original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-f175-direction-diff/card-artifact

      - name: Validate immutable inputs and stage a read-only work copy
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(sed -n 's/^ACTION=//p' experiments/.run-storymode-konoha-f175-direction-diff | tail -n 1)"
          case "$ACTION" in UP|DOWN|LEFT|RIGHT) ;; *) echo "::error::ACTION must be UP, DOWN, LEFT or RIGHT"; exit 2 ;; esac
          echo "F175_ACTION=$ACTION" >> "$GITHUB_ENV"
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          SOURCE="$WORK/state-artifact/konoha-successor-checkpoint-f175.sstate"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          test -f "$APP" && chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$SOURCE")" = 21163375
          test "$(sha256sum "$SOURCE" | cut -d ' ' -f1)" = f8bd00074877ef583e35b8eaf2fc65b3877acda9bebd5f2d8e9a13abee094615
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$SOURCE" "$WORK/resume/storymode-checkpoint.sstate"
          chmod 400 "$WORK/resume/storymode-checkpoint.sstate"
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          {
            echo "SOURCE_BYTES=21163375"
            echo "SOURCE_SHA256=f8bd00074877ef583e35b8eaf2fc65b3877acda9bebd5f2d8e9a13abee094615"
            echo "SOURCE_COPY_READ_ONLY=YES"
            echo "BRANCHES=NONE,$ACTION"
            echo "ACTION_PRESS_FRAME=30; RELEASE_FRAME=38"
            echo "SCREENSHOTS=external X11 only; internal emulator screenshot API forbidden"
          } | tee "$WORK/captures/input-validation.txt"

      - name: Download game and BIOS from private runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0])
              import hashlib
              h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Run no-input control and one RIGHT tap from independent f175 restores
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=PASS")
          LUA
          )
          cat > "$WORK/f175-probe.lua" <<'LUA'
          local mode=os.getenv("PROBE_MODE") or "NONE"
          local action=os.getenv("PROBE_ACTION") or "DOWN"
          local frame=0; local started=false; local returned=false; local loaded=false; local pressed=false; local released=false
          local pad=PCSX.SIO0.slots[1].pads[1]
          local buttons=PCSX.CONSTS.PAD.BUTTON
          local function log(s) print(s); io.stdout:flush() end
          local function gateCapture(label)
              PCSX.pauseEmulator()
              local gate="captures/go-"..label:lower().."-"..mode:lower()
              log("F175_CAPTURE_READY label="..label.." mode="..mode.." frame="..frame)
              PCSX.nextTick(function()
                  while true do
                      local f=io.open(gate,"r")
                      if f then f:close(); break end
                      os.execute("sleep 0.05")
                  end
                  PCSX.resumeEmulator()
              end)
          end
          local function input(phase)
              local ok,v=pcall(function()
                  if phase=="press" then pad.setOverride(buttons[action]) else pad.clearOverride(buttons[action]) end
                  return pad.getButton(buttons[action])
              end)
              local pass=ok and v==(phase=="press")
              log("F175_INPUT mode="..mode.." action="..action.." phase="..phase.." readback="..tostring(v).." status="..(pass and "PASS" or "FAIL"))
              if not pass then PCSX.quit(83) end
              if phase=="press" then pressed=true else released=true end
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("F175_LOAD_EVENT=PASS mode="..mode)
          end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not started then
                  started=true; log("F175_LOAD_BEGIN=1 mode="..mode); PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/storymode-checkpoint.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("F175_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      returned=true; log("F175_LOAD_CALL_RETURNED=1 mode="..mode); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not returned then return end
              frame=frame+1
              if frame==20 then gateCapture("PRE")
              elseif frame==30 and mode~="NONE" and not pressed then input("press")
              elseif frame==38 and mode~="NONE" and pressed and not released then input("release")
              elseif frame==90 then gateCapture("POST")
              elseif frame==120 then
                  log("F175_FINAL_FRAME=120 mode="..mode.." input_pressed="..tostring(pressed).." input_released="..tostring(released))
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local ok,state=pcall(function() return PCSX.createSaveState() end)
                      if not ok or not state then log("F175_SAVE_ERROR="..tostring(state)); PCSX.quit(71); return end
                      local path="captures/f175-probe-result-"..mode:lower().."-f120.sstate"
                      local opened,file=pcall(function() return assert(Support.File.open(path,"TRUNCATE")) end)
                      if not opened or not file then log("F175_SAVE_OPEN_ERROR="..tostring(file)); PCSX.quit(72); return end
                      local wrote,err=pcall(function() file:writeMoveSlice(state); file:close() end)
                      if not wrote then log("F175_SAVE_WRITE_ERROR="..tostring(err)); PCSX.quit(73); return end
                      log("F175_SAVE_CREATED=PASS mode="..mode.." path="..path)
                      PCSX.quit(0)
                  end)
                  return
              end
          end)
          log("F175_SCRIPT_READY mode="..mode.." action="..action.." screenshots=EXTERNAL_X11_ONLY")
          LUA
          cp "$WORK/f175-probe.lua" "$WORK/captures/f175-probe.lua"
          failed=0
          for mode in NONE "$F175_ACTION"; do
            cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/card-$mode.mcd"
            stdout="$WORK/captures/pcsx-$mode.stdout"
            echo "F175_BRANCH_BEGIN=$mode"
            PROBE_MODE="$mode" PROBE_ACTION="$F175_ACTION" timeout --signal=TERM --kill-after=4s 60s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-$mode.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/f175-probe.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/pcsx-$mode.log" -run > "$stdout" 2>&1 &
            pid=$!
            python3 - "$pid" "$mode" "$stdout" "$WORK/captures" <<'PY'
          import sys,time,subprocess
          from pathlib import Path
          from PIL import Image
          pid=int(sys.argv[1]); mode=sys.argv[2]; stdout=Path(sys.argv[3]); out=Path(sys.argv[4]); done=set()
          def alive():
              r=subprocess.run(["ps","-o","stat=","-p",str(pid)],capture_output=True,text=True)
              s=r.stdout.strip(); return bool(s) and not s.startswith("Z")
          def capture(label):
              xwd=out/(mode+"-"+label+".xwd"); png=out/(mode+"-"+label+".png")
              a=subprocess.run(["xwd","-root","-silent","-out",str(xwd)],capture_output=True,text=True)
              if a.returncode or not xwd.is_file() or xwd.stat().st_size==0: print("X11_FAILED",mode,label,a.stderr,flush=True); return False
              b=subprocess.run(["convert",str(xwd),str(png)],capture_output=True,text=True)
              try: xwd.unlink()
              except FileNotFoundError: pass
              if b.returncode or not png.is_file(): print("X11_CONVERT_FAILED",mode,label,b.stderr,flush=True); return False
              try:
                  with Image.open(png) as im:
                      colors=im.getcolors(maxcolors=1000000)
                      valid=im.size==(1280,800) and png.stat().st_size>1000 and not (colors is not None and len(colors)==1)
                      print(f"X11_CAPTURE mode={mode} label={label} size={im.size} bytes={png.stat().st_size} colors={len(colors) if colors is not None else 'many'} valid={valid}",flush=True)
                      return bool(valid)
              except Exception as e: print("X11_VERIFY_ERROR",mode,label,str(e),flush=True); return False
          while alive():
              try: content=stdout.read_text(errors="replace")
              except FileNotFoundError: content=""
              for label in ("PRE","POST"):
                  token=f"F175_CAPTURE_READY label={label} mode={mode}"
                  if label not in done and token in content:
                      ok=capture(label)
                      if ok: (out/f"go-{label.lower()}-{mode.lower()}").write_text("validated\n",encoding="utf-8")
                      else: (out/f"capture-failed-{label.lower()}-{mode.lower()}").write_text("invalid\n",encoding="utf-8")
                      done.add(label)
              time.sleep(.01)
          print("F175_WATCHDOG_END mode="+mode+" captures="+",".join(sorted(done)),flush=True)
          PY
            set +e
            wait "$pid"
            rc=$?
            set -e
            echo "F175_BRANCH_EXIT mode=$mode rc=$rc"
            grep -E 'F175_(LOAD_EVENT|LOAD_CALL_RETURNED|INPUT|CAPTURE_READY|FINAL_FRAME|SAVE_CREATED|.*ERROR)' "$stdout" || true
            if [ "$rc" -ne 0 ]; then failed=$((failed+1)); fi
            for label in PRE POST; do
              if [ ! -s "$WORK/captures/$mode-$label.png" ]; then failed=$((failed+1)); fi
            done
            localname="$(echo "$mode" | tr '[:upper:]' '[:lower:]')"
            if [ ! -s "$WORK/captures/f175-probe-result-$localname-f120.sstate" ]; then failed=$((failed+1)); fi
            if [ "$mode" = "$F175_ACTION" ]; then
              grep -q "F175_INPUT mode=$F175_ACTION action=$F175_ACTION phase=press.*status=PASS" "$stdout" || failed=$((failed+1))
              grep -q "F175_INPUT mode=$F175_ACTION action=$F175_ACTION phase=release.*status=PASS" "$stdout" || failed=$((failed+1))
            else
              if grep -q 'F175_INPUT' "$stdout"; then failed=$((failed+1)); fi
            fi
          done
          python3 - "$WORK/captures" "$F175_ACTION" <<'PY'
          import hashlib,sys
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path(sys.argv[1]); action=sys.argv[2]
          def load(name):
              p=root/name
              if not p.exists(): return None
              with Image.open(p) as im: return im.convert("RGB").copy()
          none=load("NONE-POST.png"); right=load(action+"-POST.png")
          if none is None or right is None: raise SystemExit("matched-frame X11 post captures missing")
          if none.size!=right.size: raise SystemExit("matched-frame dimensions differ")
          d=ImageChops.difference(none,right)
          mean=sum(ImageStat.Stat(d).mean)/3
          exact=sum(1 for a,b in zip(none.getdata(),right.getdata()) if a==b)/(none.width*none.height)
          report=[
            "F175_SOURCE_SHA256=f8bd00074877ef583e35b8eaf2fc65b3877acda9bebd5f2d8e9a13abee094615",
            f"F175_ACTION={action} press f30; release f38",
            "F175_CONTROL=NONE, same restored checkpoint and same relative frames",
            "F175_SCREENSHOTS=external X11 only; internal screenshot API not called",
            f"POST_MEAN_ABS_RGB_DIFF={mean:.6f}",
            f"POST_EXACT_PIXEL_FRACTION={exact:.6f}",
            f"NONE_POST_SHA256={hashlib.sha256((root/'NONE-POST.png').read_bytes()).hexdigest()}",
            f"INPUT_POST_SHA256={hashlib.sha256((root/(action+'-POST.png')).read_bytes()).hexdigest()}",
            "INTERPRETATION=visual divergence must be reviewed; image difference alone does not prove the intended game action succeeded."
          ]
          (root/"f175-direction-diff-report.txt").write_text("\n".join(report)+"\n",encoding="utf-8")
          print("\n".join(report))
          PY
          if [ "$failed" -ne 0 ]; then echo "::error::$failed branch/capture/checkpoint checks failed; see private artifact"; exit 44; fi

      - name: Upload private external X11 evidence, logs, and successor checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-konoha-f175-direction-diff-private
          path: |
            /tmp/naruto-storymode-f175-direction-diff/captures/*.png
            /tmp/naruto-storymode-f175-direction-diff/captures/*.txt
            /tmp/naruto-storymode-f175-direction-diff/captures/*.stdout
            /tmp/naruto-storymode-f175-direction-diff/captures/*.log
            /tmp/naruto-storymode-f175-direction-diff/captures/*.sstate
          retention-days: 14

      - name: Remove ROM, BIOS, Memory Card and source checkpoint copies
        if: always()
        shell: bash
        run: rm -rf "$WORK"
