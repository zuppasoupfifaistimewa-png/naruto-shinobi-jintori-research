name: Step 7 — cold-boot loader mapping diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step7-loader-coldboot-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: step7-loader-coldboot-diagnostic
  cancel-in-progress: false

jobs:
  coldboot-loader:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-STEP7-LOADER-BOOT]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: "/tmp/step7-loader-private"
      OUT: "/tmp/step7-loader-text"
    steps:
      - name: Checkout permitted research source
        uses: actions/checkout@v4

      - name: Install bounded X11 and extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl jq unzip xorriso x11-utils xvfb python3
          mkdir -p "$WORK" "$OUT"
          chmod 700 "$WORK"
          printf 'stage=dependencies_ready\n' > "$OUT/stage.txt"

      - name: Download only verified source assets to the private runner
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research"
          fetch_asset() {
            id="$1"; name="$2"; bytes="$3"; sha="$4"; max_seconds="$5"
            dst="$WORK/$name"
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 2 \
              --max-time "$max_seconds" "$API/releases/assets/$id" --output "$dst"
            test "$(stat -c '%s' "$dst")" = "$bytes"
            echo "$sha  $dst" | sha256sum --check --status
            echo "PRIVATE_ASSET_VALID name=$name bytes=$bytes sha256=$sha"
          }
          printf 'stage=asset_download\n' > "$OUT/stage.txt"
          fetch_asset 647346873 game.bin 325989552 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88 600
          fetch_asset 647354760 game.cue 116 be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8 60
          fetch_asset 652373928 scph7502.zip 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a 60
          fetch_asset 669480936 pcsx-redux.AppImage 65747557 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c 180
          python3 - "$WORK/game.cue" "$WORK/game-run.cue" <<'PY'
          from pathlib import Path
          import re,sys
          src,dst=map(Path,sys.argv[1:3])
          lines=src.read_text(encoding="utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          indexes=[i for i,s in enumerate(lines) if s.lstrip().upper().startswith("FILE ")]
          if len(indexes)!=1 or not any(s.lstrip().upper().startswith("TRACK ") for s in lines):
              raise SystemExit("invalid CUE; refusing launch")
          lines[indexes[0]]='FILE "game.bin" BINARY'
          dst.write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          python3 - "$WORK/scph7502.zip" "$WORK/scph7502.bin" <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,stat,sys,zipfile
          src,dst=map(Path,sys.argv[1:3])
          with zipfile.ZipFile(src) as z:
              found=[]; total=0
              for item in z.infolist():
                  p=PurePosixPath(item.filename); mode=(item.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("unsafe BIOS archive")
                  total+=item.file_size
                  if item.file_size>2*1024*1024 or total>4*1024*1024:
                      raise SystemExit("BIOS expansion bound exceeded")
                  if not item.is_dir() and item.file_size==524288: found.append(item)
              if len(found)!=1: raise SystemExit("expected one 512 KiB BIOS")
              b=z.read(found[0]); sha=hashlib.sha256(b).hexdigest()
              if sha!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1":
                  raise SystemExit("BIOS hash mismatch")
              dst.write_bytes(b)
              print("BIOS_VALID bytes=524288 sha256="+sha)
          PY
          chmod +x "$WORK/pcsx-redux.AppImage"
          (cd "$WORK" && ./pcsx-redux.AppImage --appimage-extract >/dev/null)
          test -x "$WORK/squashfs-root/AppRun"
          printf 'stage=assets_verified\n' > "$OUT/stage.txt"

      - name: Cold boot and observe loader plus RNG seed candidates
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/config" XDG_DATA_HOME="$WORK/data" XDG_RUNTIME_DIR="$WORK/runtime"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -ac -screen 0 1280x800x24 -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null

          # Preserve the proven Port 1 Analog/remap setup but do not send any button input.
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped; no button presses")
          LUA
          )

          # First establish that a cold boot advances without breakpoints or button input.
          cat > "$WORK/step7-vsync-preflight.lua" <<'LUA'
          local frame=0
          local function log(s) print(s); pcall(function() io.stdout:flush() end) end
          step7PreflightListener = PCSX.Events.createEventListener("GPU::Vsync",function()
            frame=frame+1
            if frame<=3 or frame%50==0 then log("STEP7_PREFLIGHT_VSYNC frame="..frame) end
            if frame>=300 then PCSX.quit(0) end
          end)
          log("STEP7_PREFLIGHT_READY no_breakpoints=no_input no_savestate_restore limit_frames=300")
          LUA

          set +e
          timeout --signal=TERM --kill-after=3s 25s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
            -noupdate -no-debugger -no-gdb -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -dofile "$WORK/step7-vsync-preflight.lua" -dynarec -softgpu -stdout -lua_stdout -logfile "$WORK/pcsx-preflight.log" -run \
            > "$OUT/preflight.stdout" 2>&1
          preflight_rc=$?
          set -e
          max_frame="$(sed -n 's/.*STEP7_PREFLIGHT_VSYNC frame=\([0-9][0-9]*\).*/\1/p' "$OUT/preflight.stdout" | sort -n | tail -n 1)"
          max_frame="${max_frame:-0}"
          {
            echo "STEP7_PREFLIGHT_EXIT=$preflight_rc"
            echo "STEP7_PREFLIGHT_MAX_FRAME=$max_frame"
            cat "$OUT/preflight.stdout"
          } >> "$OUT/step7-loader.stdout"
          if [ "$max_frame" -lt 10 ]; then
            echo "STEP7_PREFLIGHT_STALLED=YES; instrumented probe skipped after bounded 25-second preflight" >> "$OUT/step7-loader.stdout"
            printf 'stage=preflight_stalled\n' > "$OUT/stage.txt"
            exit 0
          fi
          echo "STEP7_PREFLIGHT_STALLED=NO" >> "$OUT/step7-loader.stdout"

          # A/B control: prior -debugger mode with VSync only; no breakpoints,
          # savestate restore, or button input. This isolates debugger mode.
          cat > "$WORK/step7-debugger-vsync-control.lua" <<'LUA'
          local frame=0
          local function log(s) print(s); pcall(function() io.stdout:flush() end) end
          step7DebuggerControlListener = PCSX.Events.createEventListener("GPU::Vsync",function()
            frame=frame+1
            if frame<=3 or frame%10==0 then log("STEP7_DEBUGGER_CONTROL_VSYNC frame="..frame) end
            if frame>=80 then
              log("STEP7_DEBUGGER_CONTROL_DONE frames="..frame)
              PCSX.quit(0)
            end
          end)
          log("STEP7_DEBUGGER_CONTROL_READY debugger=yes breakpoints=no no_input=no_restore limit_frames=80")
          LUA
          printf 'stage=debugger_mode_control\n' > "$OUT/stage.txt"
          set +e
          timeout --signal=TERM --kill-after=2s 18s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
            -noupdate -debugger -no-gdb -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -dofile "$WORK/step7-debugger-vsync-control.lua" -dynarec -softgpu -stdout -lua_stdout -logfile "$WORK/pcsx-control.log" -run \
            > "$OUT/debugger-control.stdout" 2>&1
          control_rc=$?
          set -e
          control_max="$(sed -n 's/.*STEP7_DEBUGGER_CONTROL_VSYNC frame=\\([0-9][0-9]*\\).*/\\1/p' "$OUT/debugger-control.stdout" | sort -n | tail -n 1)"
          control_max="${control_max:-0}"
          {
            echo "STEP7_DEBUGGER_CONTROL_EXIT=$control_rc"
            echo "STEP7_DEBUGGER_CONTROL_MAX_FRAME=$control_max"
            cat "$OUT/debugger-control.stdout"
          } >> "$OUT/step7-loader.stdout"

          cat > "$WORK/step7-loader-probe.lua" <<'LUA'
          local ffi=require("ffi")
          local frame=0
          local loaderBefore=0
          local loaderAfter=0
          local seedHits=0
          local rngHits=0
          local ended=false
          local function log(s) print(s); pcall(function() io.stdout:flush() end) end
          local function U32(x) return tonumber(x) or 0 end
          local function reg(name)
            local ok,r=pcall(function() return PCSX.getRegisters() end)
            if not ok or not r or not r.GPR or not r.GPR.n then return 0 end
            return U32(r.GPR.n[name])
          end
          local function checksum(virtual,size)
            local offset=virtual-0x80000000
            if offset<0 or offset+size>0x200000 then return "OUT_OF_RAM" end
            local p=ffi.cast("uint8_t*",PCSX.getMemPtr()+offset)
            local a,b=1,0
            for i=0,size-1 do
              a=(a+tonumber(p[i]))%65521
              b=(b+a)%65521
            end
            return string.format("%08X",b*65536+a)
          end
          local function words(addr,count)
            local result={}
            for i=0,count-1 do
              local off=addr-0x80000000+i*4
              local v=tonumber(ffi.cast("uint32_t*",PCSX.getMemPtr()+off)[0])
              result[#result+1]=string.format("%08X",v)
            end
            return table.concat(result,",")
          end
          local function endProbe(reason)
            if ended then return end
            ended=true
            log("STEP7_DIAG_END reason="..reason.." frames="..frame.." loader_before="..loaderBefore.." loader_after="..loaderAfter.." seed_setter_hits="..seedHits.." rng_hits="..rngHits)
            PCSX.quit(0)
          end

          _G.step7LoaderBefore=PCSX.addBreakpoint(0x800AD454,"Exec",4,"Step 7 candidate directory-copy call before",function()
            if loaderBefore>0 then return end
            loaderBefore=loaderBefore+1
            local src=checksum(0x800AD494,0x2F00)
            local dst=checksum(0x8006D830,0x2F00)
            log(string.format("STEP7_LOADER_BEFORE frame=%d pc=0x800AD454 ra=0x%08X sp=0x%08X gp=0x%08X a0=0x%08X a1=0x%08X a2=0x%08X t0=0x%08X src_adler=%s dst_adler=%s words=%s",frame,reg("ra"),reg("sp"),reg("gp"),reg("a0"),reg("a1"),reg("a2"),reg("t0"),src,dst,words(0x800AD454,6)))
            log("STEP7_LOADER_EXPECTED_RETURN_ADDRESS=0x"..string.format("%08X",reg("ra")))
          end)

          _G.step7LoaderAfter=PCSX.addBreakpoint(0x800AD45C,"Exec",4,"Step 7 candidate directory-copy return",function()
            if loaderAfter>0 then return end
            loaderAfter=loaderAfter+1
            local src=checksum(0x800AD494,0x2F00)
            local dst=checksum(0x8006D830,0x2F00)
            log(string.format("STEP7_LOADER_AFTER frame=%d pc=0x800AD45C ra=0x%08X src_adler=%s dst_adler=%s source_equals_destination=%s",frame,reg("ra"),src,dst,tostring(src==dst)))
            endProbe("POST_COPY_CANDIDATE_REACHED")
          end)

          _G.step7SeedSetter=PCSX.addBreakpoint(0x80035DA8,"Exec",4,"Step 4 seed setter candidate",function()
            if seedHits>=16 then return end
            seedHits=seedHits+1
            local ra=reg("ra")
            log(string.format("STEP4_COLD_BOOT_SEED_SETTER frame=%d seq=%d a0=0x%08X caller=0x%08X",frame,seedHits,reg("a0"),(ra>=8) and (ra-8) or 0))
          end)

          _G.step7RngEntry=PCSX.addBreakpoint(0x80035D78,"Exec",4,"Step 4 cold boot RNG entry",function()
            if rngHits>=24 then return end
            rngHits=rngHits+1
            local ra=reg("ra")
            local state=tonumber(ffi.cast("uint32_t*",PCSX.getMemPtr()+0xA3118)[0])
            log(string.format("STEP4_COLD_BOOT_RNG frame=%d seq=%d ra=0x%08X caller=0x%08X state_before=0x%08X",frame,rngHits,ra,(ra>=8) and (ra-8) or 0,state))
          end)

          step7ColdBootProgressListener = PCSX.Events.createEventListener("GPU::Vsync",function()
            frame=frame+1
            if frame<=3 or frame%250==0 then
              log("STEP7_COLD_BOOT_PROGRESS frame="..frame)
            end
            if frame>=3000 then endProbe("BOUNDED_NO_TARGET_HIT") end
          end)
          log("STEP7_LOADER_PROBE_READY targets=0x800AD454,0x800AD45C,0x80035DA8,0x80035D78 limit_frames=3000 no_input=no_savestate_restore")
          LUA

          printf 'stage=coldboot_observation\n' > "$OUT/stage.txt"
          set +e
          timeout --signal=TERM --kill-after=5s 70s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
            -noupdate -no-debugger -no-gdb -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -dofile "$WORK/step7-loader-probe.lua" -dynarec -softgpu -stdout -lua_stdout -logfile "$WORK/pcsx.log" -run \
            >> "$OUT/step7-loader.stdout" 2>&1
          rc=$?
          set -e
          echo "STEP7_EMULATOR_EXIT=$rc"
          grep -E 'STEP7_|STEP4_COLD_BOOT_|SEGV|ERROR|Error|panic|failed' "$OUT/step7-loader.stdout" | tail -n 220 || true
          if [ -f "$WORK/pcsx.log" ]; then
            {
              echo "STEP7_PCSX_LOG_TAIL_BEGIN"
              tail -n 160 "$WORK/pcsx.log"
              echo "STEP7_PCSX_LOG_TAIL_END"
            } >> "$OUT/step7-loader.stdout"
          fi
          printf 'stage=observation_finished\n' > "$OUT/stage.txt"
          if [ "$rc" -eq 124 ]; then
            echo "STEP7_TIMEOUT=YES" | tee -a "$OUT/step7-loader.stdout"
          elif [ "$rc" -ne 0 ]; then
            echo "STEP7_EMULATOR_NONZERO_EXIT=$rc" | tee -a "$OUT/step7-loader.stdout"
          fi

      - name: Save text-only diagnostic report
        if: always()
        shell: bash
        run: |
          set +e
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import re,sys
          root=Path(sys.argv[1])
          p=root/"step7-loader.stdout"
          log=p.read_text(errors="replace") if p.exists() else ""
          lines=[
            "# Step 7 / Step 4 — cold-boot loader and seed diagnostic",
            "",
            "- Scope: bounded cold boot using verified PS-X disc/BIOS; no savestate restore, no gameplay input, no adaptive player or Story Mode completion attempt.",
            "- Observability A/B: 18-second -debugger control with only a VSync listener, then 70-second -no-debugger run with target breakpoints; both cold boots are input-free and restore-free.",
            "- Targets: candidate bootstrap/copy call 0x800AD454 and its return 0x800AD45C; RNG setter candidate 0x80035DA8; RNG entry 0x80035D78.",
            "- Instrumentation emits registers and Adler-32 checksums for the 0x2F00-byte source/destination directory buffers; no RAM dump or private screenshot is produced.",
            "- Script raw log is included below verbatim for audit.",
            "",
            "## Result",
            "",
          ]
          useful=[x for x in log.splitlines() if re.search(r"STEP7_|STEP4_COLD_BOOT_|STEP7_TIMEOUT|STEP7_EMULATOR_EXIT|ERROR|Error|SEGV|panic",x)]
          before=any("STEP7_LOADER_BEFORE" in x for x in useful)
          after=any("STEP7_LOADER_AFTER" in x for x in useful)
          seed=any("STEP4_COLD_BOOT_SEED_SETTER" in x for x in useful)
          progress=any("STEP7_COLD_BOOT_PROGRESS" in x for x in useful)
          control_frames=[]
          for x in useful:
              m=re.search(r"STEP7_DEBUGGER_CONTROL_VSYNC frame=(\\d+)",x)
              if m: control_frames.append(int(m.group(1)))
          control_exit=next((x.split("=",1)[1] for x in useful if x.startswith("STEP7_DEBUGGER_CONTROL_EXIT=")),"UNKNOWN")
          lines += [
            f"- TARGET_LOADER_BEFORE_HIT={'YES' if before else 'NO'}",
            f"- TARGET_LOADER_AFTER_HIT={'YES' if after else 'NO'}",
            f"- COLD_BOOT_SEED_SETTER_HIT={'YES' if seed else 'NO'}",
            f"- VSYNC_PROGRESS_SEEN={'YES' if progress else 'NO'}",
            f"- DEBUGGER_CONTROL_MAX_VSYNC_FRAME={max(control_frames) if control_frames else 0}",
            f"- DEBUGGER_CONTROL_EXIT={control_exit}",
            "- The target probe uses -no-debugger while retaining bounded breakpoint callbacks, to distinguish debugger mode from instrumentation behavior.",
            "- A no-hit or timeout is only a negative result within the bounded observation window; it does not prove the target is absent or unreachable.",
            "",
            "## Raw evidence lines",
            "",
          ]
          lines += ["    "+x for x in useful[-240:]]
          lines += ["", "## Emulator debug log tails", ""]
          for pcsxlog in (Path("/tmp/step7-loader-private/pcsx-preflight.log"), Path("/tmp/step7-loader-private/pcsx.log")):
              lines += ["", "### "+pcsxlog.name]
              if pcsxlog.exists():
                  lines += ["    "+x for x in pcsxlog.read_text(errors="replace").splitlines()[-100:]]
              else:
                  lines += ["    Logfile was not created."]
          lines += ["", "## Privacy and cleanup", "", "- Binary game/BIOS and extracted AppImage remain under runner-private /tmp and are deleted after the job. Artifact contains only report/log text, stage metadata, register values and checksums; no RAM dump, savestate, Memory Card or screenshot.", "- Private cleanup is recorded in the job log.", ""]
          (root/"STEP7_COLD_BOOT_RESULT.md").write_text("\n".join(lines),encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload text-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step7-loader-coldboot-text-only
          path: |
            /tmp/step7-loader-text/STEP7_COLD_BOOT_RESULT.md
            /tmp/step7-loader-text/step7-loader.stdout
            /tmp/step7-loader-text/stage.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Delete all private runner files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$WORK" "$OUT"
          if [ ! -e "$WORK" ] && [ ! -e "$OUT" ]; then
            echo "STEP7_PRIVATE_CLEANUP=PASS"
          else
            echo "STEP7_PRIVATE_CLEANUP=FAIL"
            exit 1
          fi
