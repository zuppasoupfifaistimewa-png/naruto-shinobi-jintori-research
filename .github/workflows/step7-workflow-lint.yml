name: Validate Step 7 loader diagnostic workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step7-loader-coldboot-diagnostic.yml"
      - ".github/workflows/step7-workflow-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-step7:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout permitted research repository
        uses: actions/checkout@v4
      - name: Install pinned actionlint and validate the Step 7 workflow
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.7
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/step7-loader-coldboot-diagnostic.yml
          python3 - <<'PY'
          import re
          import subprocess

          sample = "\n".join(
              f"STEP7_DEBUGGER_CONTROL_VSYNC frame={frame}"
              for frame in (1, 2, 3, 10, 20, 30, 40)
          )
          frames = []
          for line in sample.splitlines():
              match = re.search(r"STEP7_DEBUGGER_CONTROL_VSYNC frame=(\d+)", line)
              if match:
                  frames.append(int(match.group(1)))
          assert frames == [1, 2, 3, 10, 20, 30, 40], frames
          assert max(frames) == 40, max(frames)

          sed_expr = r"s/.*STEP7_DEBUGGER_CONTROL_VSYNC frame=\([0-9][0-9]*\).*/\1/p"
          sed = subprocess.run(
              ["sed", "-n", sed_expr], input=sample, text=True,
              capture_output=True, check=True
          )
          sed_frames = [int(value) for value in sed.stdout.splitlines()]
          assert sed_frames == [1, 2, 3, 10, 20, 30, 40], sed_frames
          assert max(sed_frames) == 40, max(sed_frames)
          print("STEP7_FRAME_PARSER_FIXTURE_PASS frames=1,2,3,10,20,30,40 max=40")
          PY
