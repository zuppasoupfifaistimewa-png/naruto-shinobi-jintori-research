name: Naruto Story Mode Konoha Roulette outcome no-input continuation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-konoha-roulette-continue"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-KONOHA-ROULETTE-CONTINUE]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-konoha-roulette-continue
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research workflow
        uses: actions/checkout@v4

      - name: Install screenshot tools and prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil xvfb x11-utils x11-apps imagemagick curl unzip
          mkdir -p "$WORK"/{build-artifact,state-artifact,card-artifact,cards,resume,captures/raw,home,.config,.data,runtime}
          chmod 700 "$WORK/runtime"

      - name: Download already-built patched emulator
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-roulette-continue/build-artifact

      - name: Download verified post-Roulette f120 branch checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-konoha-roulette-confirm-private
          run-id: 39593536028
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-roulette-continue/state-artifact

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-roulette-continue/card-artifact

      - name: Validate inputs and stage isolated copies
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          CHECKPOINT="$WORK/state-artifact/konoha-after-roulette-confirm-f120.sstate"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$CHECKPOINT")" = 21161627
          test "$(sha256sum "$CHECKPOINT" | cut -d ' ' -f1)" = 825534db4193a6c93b6ca658694b2d77875deb0f2536873ca555961366b0e766
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$CHECKPOINT" "$WORK/resume/source-roulette-f120.sstate"
          chmod 400 "$WORK/resume/source-roulette-f120.sstate"
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          echo "KONOHA_CONTROL_EMULATOR_VALID=PASS"
          echo "KONOHA_ROULETTE_CONTINUE_SOURCE_CHECKPOINT_VALID=PASS bytes=21161627 sha256=825534db4193a6c93b6ca658694b2d77875deb0f2536873ca555961366b0e766"
          echo "KONOHA_CONTROL_SOURCE_CHECKPOINT_READ_ONLY=YES"
          echo "KONOHA_CONTROL_MEMORY_CARD_VALID=PASS"

      - name: Download game and BIOS from the private runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0])
              import hashlib
              h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("DIALOG_START_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Observe Roulette outcome with no input, X11-only captures, and a successor checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null

          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("KONOHA_ROULETTE_CONTINUE_PAD_SETUP=PASS")
          LUA
          )

          cat > "$WORK/continue-roulette-no-input.lua" <<'LUA'
          local frame=0
          local started=false
          local returned=false
          local loaded=false
          local function log(s) print(s); io.stdout:flush() end
          local function waitForExternalRelease(path,callback)
              PCSX.nextTick(function()
                  while true do
                      local f=io.open(path,"r")
                      if f then
                          f:close()
                          log("KONOHA_ROULETTE_CONTINUE_RESUME_GATE="..path)
                          break
                      end
                      os.execute("sleep 0.05")
                  end
                  callback()
              end)
          end
          local function pauseForExternalCapture(point)
              PCSX.pauseEmulator()
              local marker="captures/go-"..point:lower()
              log("KONOHA_ROULETTE_CONTINUE_"..point.."_CAPTURE_READY frame="..frame)
              waitForExternalRelease(marker,function() PCSX.resumeEmulator() end)
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("KONOHA_ROULETTE_CONTINUE_LOAD_EVENT=PASS")
          end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not started then
                  started=true; log("KONOHA_ROULETTE_CONTINUE_LOAD_BEGIN")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/source-roulette-f120.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("KONOHA_ROULETTE_CONTINUE_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      returned=true; log("KONOHA_ROULETTE_CONTINUE_LOAD_RETURNED=1 input=NONE"); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not returned then return end
              frame=frame+1
              log(string.format("KONOHA_ROULETTE_CONTINUE_FRAME=%d input=NONE internal_screenshot=DISABLED",frame))
              if frame==20 then
                  pauseForExternalCapture("F20")
                  return
              elseif frame==60 then
                  pauseForExternalCapture("F60")
                  return
              elseif frame==120 then
                  pauseForExternalCapture("F120")
                  return
              elseif frame==180 then
                  pauseForExternalCapture("F180")
                  return
              elseif frame==220 then
                  pauseForExternalCapture("F220")
                  return
              elseif frame==240 then
                  log("KONOHA_ROULETTE_CONTINUE_SAVE_BEGIN frame=240 input=NONE")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local ok,state=pcall(function() return PCSX.createSaveState() end)
                      if not ok or not state then log("KONOHA_ROULETTE_CONTINUE_SAVE_ERROR="..tostring(state)); PCSX.quit(71); return end
                      local opened,file=pcall(function()
                          return assert(Support.File.open("captures/konoha-after-roulette-wait-f240.sstate","TRUNCATE"))
                      end)
                      if not opened or not file then log("KONOHA_ROULETTE_CONTINUE_SAVE_OPEN_ERROR="..tostring(file)); PCSX.quit(72); return end
                      local wrote,err=pcall(function() file:writeMoveSlice(state); file:close() end)
                      if not wrote then log("KONOHA_ROULETTE_CONTINUE_SAVE_WRITE_ERROR="..tostring(err)); PCSX.quit(73); return end
                      log("KONOHA_ROULETTE_CONTINUE_CHECKPOINT_CREATED=PASS frame=240 input=NONE")
                      log("KONOHA_ROULETTE_CONTINUE_BRANCH_DONE frame=240 source_checkpoint_untouched=YES")
                      PCSX.quit(0)
                  end)
                  return
              end
          end)
          log("KONOHA_ROULETTE_CONTINUE_READY no_controller_input=true internal_screenshots=DISABLED x11_frames=20,60,120,180,220 successor_frame=240")
          LUA
          cp "$WORK/continue-roulette-no-input.lua" "$WORK/captures/continue-roulette-no-input.lua"
          cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/card-KONOHA-ROULETTE-CONTINUE.mcd"
          echo "KONOHA_ROULETTE_CONTINUE_PROCESS_BEGIN"
          set +e
          timeout --signal=TERM --kill-after=3s 45s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
            -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-KONOHA-ROULETTE-CONTINUE.mcd" \
            -exec "$PAD_SETUP" -dofile "$WORK/continue-roulette-no-input.lua" -softgpu -dynarec -stdout -lua_stdout \
            -logfile "$WORK/captures/pcsx-KONOHA-ROULETTE-CONTINUE.log" -run > "$WORK/captures/pcsx-KONOHA-ROULETTE-CONTINUE.stdout" 2>&1 &
          pid=$!
          python3 - "$pid" "$WORK/captures/pcsx-KONOHA-ROULETTE-CONTINUE.stdout" "$WORK/captures" <<'PY'
          import sys,time,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          from PIL import Image
          pid=int(sys.argv[1]); stdout=Path(sys.argv[2]); out=Path(sys.argv[3])
          done=set()
          logpath=out/"konoha-roulette-continue-x11-watchdog.log"
          points=("F20","F60","F120","F180","F220")
          def log(s):
              line=f"utc={datetime.now(timezone.utc).isoformat()} {s}"
              with logpath.open("a",encoding="utf-8") as f: f.write(line+"\n")
              print(line,flush=True)
          def alive():
              r=subprocess.run(["ps","-o","stat=","-p",str(pid)],capture_output=True,text=True)
              st=r.stdout.strip()
              return bool(st) and not st.startswith("Z")
          def capture(point):
              label="KONOHA-ROULETTE-CONTINUE-"+point
              xwd=out/(label+".xwd"); png=out/(label+".png")
              a=subprocess.run(["xwd","-root","-silent","-out",str(xwd)],capture_output=True,text=True)
              if a.returncode or not xwd.is_file() or xwd.stat().st_size==0:
                  log(f"X11_CAPTURE_FAILED point={point} rc={a.returncode} error={a.stderr.strip()}")
                  return False
              b=subprocess.run(["convert",str(xwd),str(png)],capture_output=True,text=True)
              try: xwd.unlink()
              except FileNotFoundError: pass
              if b.returncode or not png.is_file():
                  log(f"X11_CONVERT_FAILED point={point} rc={b.returncode}")
                  return False
              try:
                  with Image.open(png) as im:
                      colors=im.getcolors(maxcolors=1000000)
                      valid=im.size==(1280,800) and png.stat().st_size>1000 and not (colors is not None and len(colors)==1)
                      log(f"X11_CAPTURE_VERIFY point={point} path={png.name} size={im.size} bytes={png.stat().st_size} colors={len(colors) if colors is not None else 'many'} valid={valid}")
                      return bool(valid)
              except Exception as e:
                  log(f"X11_CAPTURE_VERIFY_ERROR point={point} error={e}")
                  return False
          log("WATCHDOG_START controller_input=NONE internal_screenshots=DISABLED")
          while True:
              try: content=stdout.read_text(errors="replace")
              except FileNotFoundError: content=""
              for point in points:
                  token=f"KONOHA_ROULETTE_CONTINUE_{point}_CAPTURE_READY"
                  if point not in done and token in content:
                      ok=capture(point)
                      (out/f"go-{point.lower()}").write_text("captured="+str(ok)+"\n",encoding="utf-8")
                      done.add(point)
              if not alive():
                  log("PROCESS_EXITED captured="+",".join(sorted(done)))
                  break
              time.sleep(0.01)
          log("WATCHDOG_END captured="+",".join(sorted(done)))
          PY
          wait "$pid"
          p_rc=$?
          set -e
          echo "KONOHA_ROULETTE_CONTINUE_PROCESS_EXIT_CODE=$p_rc"
          grep -E 'KONOHA_ROULETTE_CONTINUE_(LOAD_EVENT|LOAD_RETURNED|FRAME=|F[0-9]+_CAPTURE_READY|SAVE|CHECKPOINT_CREATED|BRANCH_DONE|.*ERROR)' "$WORK/captures/pcsx-KONOHA-ROULETTE-CONTINUE.stdout" || true
          test "$p_rc" -eq 0
          test -s "$WORK/captures/konoha-after-roulette-wait-f240.sstate"
          for p in F20 F60 F120 F180 F220; do test -s "$WORK/captures/KONOHA-ROULETTE-CONTINUE-$p.png"; done
          source_hash="$(sha256sum "$WORK/resume/source-roulette-f120.sstate" | cut -d ' ' -f1)"
          test "$source_hash" = 825534db4193a6c93b6ca658694b2d77875deb0f2536873ca555961366b0e766
          derived_hash="$(sha256sum "$WORK/captures/konoha-after-roulette-wait-f240.sstate" | cut -d ' ' -f1)"
          derived_bytes="$(stat -c %s "$WORK/captures/konoha-after-roulette-wait-f240.sstate")"
          {
            echo "KONOHA_ROULETTE_CONTINUE_SOURCE_CHECKPOINT_SHA256=$source_hash"
            echo "KONOHA_ROULETTE_CONTINUE_SOURCE_CHECKPOINT_UNCHANGED=PASS"
            echo "KONOHA_ROULETTE_CONTINUE_DERIVED_CHECKPOINT_BYTES=$derived_bytes"
            echo "KONOHA_ROULETTE_CONTINUE_DERIVED_CHECKPOINT_SHA256=$derived_hash"
            echo "KONOHA_ROULETTE_CONTINUE_INPUT=NONE through relative f240"
            echo "KONOHA_ROULETTE_CONTINUE_INTERNAL_SCREENSHOTS=DISABLED"
            echo "KONOHA_ROULETTE_CONTINUE_VISUALS=external X11 only while paused at relative f20,60,120,180,220"
          } > "$WORK/captures/konoha-roulette-continue-report.txt"
          cat "$WORK/captures/konoha-roulette-continue-report.txt"

      - name: Upload private Konoha Roulette continuation X11 captures, logs, and successor checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-konoha-roulette-continue-private
          path: |
            /tmp/naruto-storymode-konoha-roulette-continue/captures/*.png
            /tmp/naruto-storymode-konoha-roulette-continue/captures/*.txt
            /tmp/naruto-storymode-konoha-roulette-continue/captures/*.stdout
            /tmp/naruto-storymode-konoha-roulette-continue/captures/*.log
            /tmp/naruto-storymode-konoha-roulette-continue/captures/*.json
            /tmp/naruto-storymode-konoha-roulette-continue/captures/raw/*.raw
            /tmp/naruto-storymode-konoha-roulette-continue/captures/*.sstate

      - name: Remove read-only source checkpoint and disposable Memory Cards, ROM, and BIOS from ephemeral runner
        if: always()
        shell: bash
        run: rm -rf "$WORK"
