name: Naruto Story Mode settle Konoha route movement without further input

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-konoha-route-settle"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-KONOHA-ROUTE-SETTLE]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-konoha-route-settle
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research workflow
        uses: actions/checkout@v4

      - name: Install screenshot tools and prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil xvfb x11-utils x11-apps imagemagick curl unzip
          mkdir -p "$WORK"/{build-artifact,state-artifact,card-artifact,cards,resume,captures/raw,home,.config,.data,runtime}
          chmod 700 "$WORK/runtime"

      - name: Download already-built patched emulator
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-route-settle/build-artifact

      - name: Download isolated Konoha route branch checkpoints at f80
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-konoha-map-direction-private
          run-id: 39596338264
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-route-settle/state-artifact

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-route-settle/card-artifact

      - name: Validate inputs and stage immutable route source checkpoints
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          for branch in none right down; do
            if [ "$branch" = none ]; then expected_size=21163022; expected_hash=3dec2e9fd0cb2a7974579e58858f5c6d6fd038f62759413f376d6c26ed500295
            elif [ "$branch" = right ]; then expected_size=21163220; expected_hash=0f267b65fd0ba12a658e12e763e16f511ee4eddac80b1457a44de98e192d3829
            else expected_size=21163198; expected_hash=7bec71db8a307688370c9e822e2cddf47c99c0ad8f39ca76eec243f781f62427; fi
            source="$WORK/state-artifact/konoha-map-direction-$branch-f80.sstate"
            test "$(stat -c %s "$source")" = "$expected_size"
            test "$(sha256sum "$source" | cut -d ' ' -f1)" = "$expected_hash"
            cp "$source" "$WORK/resume/route-$branch-f80.sstate"
            chmod 400 "$WORK/resume/route-$branch-f80.sstate"
            echo "KONOHA_ROUTE_SOURCE_VALID branch=$branch bytes=$expected_size sha256=$expected_hash"
          done
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          echo "KONOHA_ROUTE_APPIMAGE_VALID=PASS"
          echo "KONOHA_ROUTE_MEMORY_CARD_VALID=PASS"
          echo "KONOHA_ROUTE_SOURCE_CHECKPOINTS_READ_ONLY=YES"
      - name: Download game and BIOS from the private runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0])
              import hashlib
              h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("DIALOG_START_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Resume NONE/RIGHT/DOWN branch states without input and capture movement settlement via X11
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("KONOHA_ROUTE_SETTLE_PAD_SETUP=PASS")
          LUA
          )

          cat > "$WORK/settle-route-without-input.lua" <<'LUA'
          local frame=0
          local started=false
          local returned=false
          local loaded=false
          local mode=os.getenv("PROBE_BRANCH") or "NONE"
          local lower=os.getenv("PROBE_BRANCH_LOWER") or "none"
          local function log(s) print(s); io.stdout:flush() end
          local function waitForExternalRelease(path,callback)
              PCSX.nextTick(function()
                  while true do
                      local f=io.open(path,"r")
                      if f then f:close(); log("KONOHA_ROUTE_SETTLE_RESUME_GATE="..path); break end
                      os.execute("sleep 0.05")
                  end
                  callback()
              end)
          end
          local function pauseForExternalCapture(point)
              PCSX.pauseEmulator()
              local marker="captures/go-"..point:lower().."-"..lower
              log("KONOHA_ROUTE_SETTLE_"..point.."_CAPTURE_READY branch="..mode.." frame="..frame)
              waitForExternalRelease(marker,function() PCSX.resumeEmulator() end)
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("KONOHA_ROUTE_SETTLE_LOAD_EVENT=PASS branch="..mode)
          end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not started then
                  started=true; log("KONOHA_ROUTE_SETTLE_LOAD_BEGIN branch="..mode)
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local path="resume/route-"..lower.."-f80.sstate"
                      local f=assert(Support.File.open(path))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("KONOHA_ROUTE_SETTLE_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      returned=true; log("KONOHA_ROUTE_SETTLE_LOAD_RETURNED=1 branch="..mode.." input=NONE"); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not returned then return end
              frame=frame+1
              log(string.format("KONOHA_ROUTE_SETTLE_FRAME=%d branch=%s input=NONE internal_screenshot=DISABLED",frame,mode))
              if frame==20 then pauseForExternalCapture("F20"); return
              elseif frame==60 then pauseForExternalCapture("F60"); return
              elseif frame==100 then pauseForExternalCapture("F100"); return
              elseif frame==120 then
                  log("KONOHA_ROUTE_SETTLE_SAVE_BEGIN frame=120 branch="..mode.." input=NONE")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local ok,state=pcall(function() return PCSX.createSaveState() end)
                      if not ok or not state then log("KONOHA_ROUTE_SETTLE_SAVE_ERROR="..tostring(state)); PCSX.quit(71); return end
                      local output="captures/konoha-route-settled-"..lower.."-f120.sstate"
                      local opened,file=pcall(function() return assert(Support.File.open(output,"TRUNCATE")) end)
                      if not opened or not file then log("KONOHA_ROUTE_SETTLE_SAVE_OPEN_ERROR="..tostring(file)); PCSX.quit(72); return end
                      local wrote,err=pcall(function() file:writeMoveSlice(state); file:close() end)
                      if not wrote then log("KONOHA_ROUTE_SETTLE_SAVE_WRITE_ERROR="..tostring(err)); PCSX.quit(73); return end
                      log("KONOHA_ROUTE_SETTLE_BRANCH_DONE branch="..mode.." frame=120 source_checkpoint_untouched=YES")
                      PCSX.quit(0)
                  end)
                  return
              end
          end)
          log("KONOHA_ROUTE_SETTLE_READY branch="..mode.." input=NONE frames20,60,100 external X11 only; successor frame120")
          LUA
          cp "$WORK/settle-route-without-input.lua" "$WORK/captures/settle-route-without-input.lua"
          failed=0
          for mode in NONE RIGHT DOWN; do
            lower_mode="$(printf '%s' "$mode" | tr '[:upper:]' '[:lower:]')"
            cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/card-KONOHA-SETTLE-$mode.mcd"
            stdout="$WORK/captures/pcsx-KONOHA-SETTLE-$mode.stdout"
            echo "KONOHA_ROUTE_SETTLE_BRANCH_BEGIN=$mode"
            set +e
            PROBE_BRANCH="$mode" PROBE_BRANCH_LOWER="$lower_mode" timeout --signal=TERM --kill-after=3s 30s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-KONOHA-SETTLE-$mode.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/settle-route-without-input.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/pcsx-KONOHA-SETTLE-$mode.log" -run > "$stdout" 2>&1 &
            pid=$!
            python3 - "$pid" "$mode" "$lower_mode" "$stdout" "$WORK/captures" <<'PY'
          import sys,time,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          pid=int(sys.argv[1]); mode=sys.argv[2]; lower=sys.argv[3]; stdout=Path(sys.argv[4]); out=Path(sys.argv[5])
          done=set(); points=("F20","F60","F100")
          logpath=out/"konoha-route-settle-x11-watchdog.log"
          def log(s):
              line=f"utc={datetime.now(timezone.utc).isoformat()} branch={mode} {s}"
              with logpath.open("a",encoding="utf-8") as f: f.write(line+"\n")
              print(line,flush=True)
          def alive():
              r=subprocess.run(["ps","-o","stat=","-p",str(pid)],capture_output=True,text=True)
              st=r.stdout.strip()
              return bool(st) and not st.startswith("Z")
          def capture(point):
              label=f"KONOHA-SETTLE-{mode}-{point}"
              xwd=out/(label+".xwd"); png=out/(label+".png")
              a=subprocess.run(["xwd","-root","-silent","-out",str(xwd)],capture_output=True,text=True)
              if a.returncode or not xwd.is_file() or xwd.stat().st_size==0:
                  log(f"X11_CAPTURE_FAILED point={point} rc={a.returncode} error={a.stderr.strip()}"); return False
              b=subprocess.run(["convert",str(xwd),str(png)],capture_output=True,text=True)
              try: xwd.unlink()
              except FileNotFoundError: pass
              if b.returncode or not png.is_file():
                  log(f"X11_CONVERT_FAILED point={point} rc={b.returncode}"); return False
              try:
                  with Image.open(png) as im:
                      colors=im.getcolors(maxcolors=1000000)
                      valid=im.size==(1280,800) and png.stat().st_size>1000 and not (colors is not None and len(colors)==1)
                      log(f"X11_CAPTURE_VERIFY point={point} path={png.name} size={im.size} bytes={png.stat().st_size} colors={len(colors) if colors is not None else 'many'} valid={valid}")
                      return bool(valid)
              except Exception as e:
                  log(f"X11_CAPTURE_VERIFY_ERROR point={point} error={e}"); return False
          log("WATCHDOG_START controller_input=NONE internal_screenshots=DISABLED")
          while True:
              try: content=stdout.read_text(errors="replace")
              except FileNotFoundError: content=""
              for point in points:
                  token=f"KONOHA_ROUTE_SETTLE_{point}_CAPTURE_READY branch={mode}"
                  if point not in done and token in content:
                      ok=capture(point)
                      (out/f"go-{point.lower()}-{lower}").write_text("captured="+str(ok)+"\n",encoding="utf-8")
                      done.add(point)
              if not alive():
                  log("PROCESS_EXITED captured="+",".join(sorted(done))); break
              time.sleep(0.01)
          log("WATCHDOG_END captured="+",".join(sorted(done)))
          PY
            wait "$pid"
            rc=$?
            set -e
            echo "KONOHA_ROUTE_SETTLE_PROCESS_EXIT branch=$mode rc=$rc"
            grep -E 'KONOHA_ROUTE_SETTLE_(LOAD_EVENT|LOAD_RETURNED|F[0-9]+_CAPTURE_READY|BRANCH_DONE|.*ERROR)' "$stdout" || true
            if [ "$rc" -ne 0 ]; then failed=$((failed+1)); fi
            for p in F20 F60 F100; do
              if [ ! -s "$WORK/captures/KONOHA-SETTLE-$mode-$p.png" ]; then failed=$((failed+1)); fi
            done
            if [ ! -s "$WORK/captures/konoha-route-settled-$lower_mode-f120.sstate" ]; then failed=$((failed+1)); fi
          done

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path("captures")
          report=[
            "KONOHA_ROUTE_SETTLE_INPUT=NONE for all three continuation branches",
            "KONOHA_ROUTE_SETTLE_INTERNAL_SCREENSHOTS=DISABLED",
            "KONOHA_ROUTE_SETTLE_CAPTURE_METHOD=external X11 only while emulator paused",
            "KONOHA_ROUTE_SETTLE_BRANCHES=NONE,RIGHT,DOWN",
            "",
            "X11 progression comparisons from each branch's own F20 baseline:"
          ]
          for mode in ["NONE","RIGHT","DOWN"]:
              baseline=root/f"KONOHA-SETTLE-{mode}-F20.png"
              for point in ["F60","F100"]:
                  path=root/f"KONOHA-SETTLE-{mode}-{point}.png"
                  if not baseline.is_file() or not path.is_file():
                      report.append(f"{mode}-{point}: missing image"); continue
                  with Image.open(baseline) as b, Image.open(path) as im:
                      diff=ImageChops.difference(b.convert("RGB"),im.convert("RGB"))
                      mean=sum(ImageStat.Stat(diff).mean)/3
                      exact=sum(1 for a,b in zip(b.convert("RGB").getdata(),im.convert("RGB").getdata()) if a==b)/(im.width*im.height)
                      report.append(f"{mode}-{point}: mean_abs_rgb_diff_from_{mode}_F20={mean:.6f}; exact_pixel_fraction={exact:.6f}")
          (root/"konoha-route-settle-report.txt").write_text("\n".join(report)+"\n",encoding="utf-8")
          print("\n".join(report))
          PY
          test "$(sha256sum "$WORK/resume/route-none-f80.sstate" | cut -d ' ' -f1)" = 3dec2e9fd0cb2a7974579e58858f5c6d6fd038f62759413f376d6c26ed500295
          test "$(sha256sum "$WORK/resume/route-right-f80.sstate" | cut -d ' ' -f1)" = 0f267b65fd0ba12a658e12e763e16f511ee4eddac80b1457a44de98e192d3829
          test "$(sha256sum "$WORK/resume/route-down-f80.sstate" | cut -d ' ' -f1)" = 7bec71db8a307688370c9e822e2cddf47c99c0ad8f39ca76eec243f781f62427
          echo "KONOHA_ROUTE_SETTLE_SOURCE_CHECKPOINTS_UNCHANGED=PASS" | tee -a "$WORK/captures/konoha-route-settle-report.txt"
          if [ "$failed" -ne 0 ]; then echo "::error::$failed route settle branches had incomplete results"; exit 44; fi

      - name: Upload private Konoha route settle X11 captures, logs, and successor checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-konoha-route-settle-private
          path: |
            /tmp/naruto-storymode-konoha-route-settle/captures/*.png
            /tmp/naruto-storymode-konoha-route-settle/captures/*.txt
            /tmp/naruto-storymode-konoha-route-settle/captures/*.stdout
            /tmp/naruto-storymode-konoha-route-settle/captures/*.log
            /tmp/naruto-storymode-konoha-route-settle/captures/*.sstate

      - name: Remove read-only source checkpoint and disposable Memory Cards, ROM, and BIOS from ephemeral runner
        if: always()
        shell: bash
        run: rm -rf "$WORK"
