name: Naruto Story Mode Konoha f175 isolated direction differential

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-konoha-control-diff"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-KONOHA-CONTROL-DIFF]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-konoha-control-diff
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research workflow
        uses: actions/checkout@v4

      - name: Install screenshot tools and prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil xvfb x11-utils x11-apps imagemagick curl unzip
          mkdir -p "$WORK"/{build-artifact,state-artifact,card-artifact,cards,resume,captures/raw,home,.config,.data,runtime}
          chmod 700 "$WORK/runtime"

      - name: Download already-built patched emulator
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-control-diff/build-artifact

      - name: Download verified no-input Konoha f175 successor checkpoint
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-konoha-control-diff-private
          run-id: 39591032125
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-control-diff/state-artifact

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-konoha-control-diff/card-artifact

      - name: Validate inputs and stage isolated copies
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          CHECKPOINT="$WORK/state-artifact/konoha-successor-checkpoint-f175.sstate"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$CHECKPOINT")" = 21163375
          test "$(sha256sum "$CHECKPOINT" | cut -d ' ' -f1)" = f8bd00074877ef583e35b8eaf2fc65b3877acda9bebd5f2d8e9a13abee094615
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$CHECKPOINT" "$WORK/resume/source-konoha-f175.sstate"
          chmod 400 "$WORK/resume/source-konoha-f175.sstate"
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          echo "KONOHA_CONTROL_EMULATOR_VALID=PASS"
          echo "KONOHA_CONTROL_SOURCE_CHECKPOINT_VALID=PASS bytes=21163375 sha256=f8bd00074877ef583e35b8eaf2fc65b3877acda9bebd5f2d8e9a13abee094615"
          echo "KONOHA_CONTROL_SOURCE_CHECKPOINT_READ_ONLY=YES"
          echo "KONOHA_CONTROL_MEMORY_CARD_VALID=PASS"

      - name: Download game and BIOS from the private runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0])
              import hashlib
              h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("DIALOG_START_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Compare isolated directions against no-input control from preserved f175 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null

          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("DIALOG_START_PAD_SETUP=PASS")
          LUA
          )

          cat > "$WORK/konoha-control-diff.lua" <<'LUA'
          local frame=0
          local started=false
          local returned=false
          local loaded=false
          local mode=os.getenv("PROBE_BUTTON") or "NONE"
          local pad=PCSX.SIO0.slots[1].pads[1]
          local buttons=PCSX.CONSTS.PAD.BUTTON
          local function log(s) print(s); io.stdout:flush() end
          local function pollForFile(path,callback)
              PCSX.nextTick(function()
                  local f=io.open(path,"r")
                  if f then f:close(); log("KONOHA_DIFF_RESUME_GATE="..path); callback()
                  else pollForFile(path,callback) end
              end)
          end
          local function pauseForExternalCapture(point)
              PCSX.pauseEmulator()
              local marker="captures/go-"..point:lower().."-"..mode
              log("KONOHA_DIFF_"..point.."_CAPTURE_READY mode="..mode.." frame="..frame)
              pollForFile(marker,function() PCSX.resumeEmulator() end)
          end
          local function input(phase)
              local b=buttons[mode]
              if not b then log("KONOHA_DIFF_INPUT_ERROR mode="..mode.." reason=unknown_button"); PCSX.quit(82); return end
              local ok,readback=pcall(function()
                  if phase=="press" then pad.setOverride(b) else pad.clearOverride(b) end
                  return pad.getButton(b)
              end)
              local pass=ok and readback==(phase=="press")
              log(string.format("KONOHA_DIFF_INPUT action=%s phase=%s readback=%s status=%s",mode,phase,tostring(readback),pass and "PASS" or "FAIL"))
              if not pass then PCSX.quit(83) end
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("KONOHA_DIFF_LOAD_EVENT=PASS")
          end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not started then
                  started=true; log("KONOHA_DIFF_LOAD_BEGIN mode="..mode)
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/source-konoha-f175.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("KONOHA_DIFF_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      returned=true; log("KONOHA_DIFF_LOAD_RETURNED=1 mode="..mode); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not returned then return end
              frame=frame+1
              log(string.format("KONOHA_DIFF_FRAME=%d mode=%s",frame,mode))
              if frame==20 then
                  pauseForExternalCapture("PRE")
                  return
              elseif frame==30 and mode~="NONE" then
                  input("press")
              elseif frame==38 and mode~="NONE" then
                  input("release")
              elseif frame==90 then
                  pauseForExternalCapture("POST")
                  return
              elseif frame==120 then
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      log("KONOHA_DIFF_BRANCH_DONE mode="..mode.." final_frame=120 source_checkpoint_untouched=YES")
                      PCSX.quit(0)
                  end)
                  return
              end
          end)
          log("KONOHA_DIFF_READY mode="..mode.." no_internal_screenshots=true pre_capture_f20 input_f30_f38 post_capture_f90")
          LUA
          cp "$WORK/konoha-control-diff.lua" "$WORK/captures/konoha-control-diff.lua"
          failed=0
          for mode in NONE UP DOWN LEFT RIGHT; do
            cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/card-KONOHA-$mode.mcd"
            stdout="$WORK/captures/pcsx-KONOHA-$mode.stdout"
            echo "KONOHA_DIFF_BRANCH_BEGIN=$mode"
            set +e
            PROBE_BUTTON="$mode" timeout --signal=TERM --kill-after=3s 25s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-KONOHA-$mode.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/konoha-control-diff.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/pcsx-KONOHA-$mode.log" -run > "$stdout" 2>&1 &
            pid=$!
            python3 - "$pid" "$mode" "$stdout" "$WORK/captures" <<'PY'
          import sys,time,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          from PIL import Image
          pid=int(sys.argv[1]); mode=sys.argv[2]; stdout=Path(sys.argv[3]); out=Path(sys.argv[4])
          done=set()
          logpath=out/"konoha-control-x11-watchdog.log"
          def log(s):
              line=f"utc={datetime.now(timezone.utc).isoformat()} mode={mode} {s}"
              with logpath.open("a",encoding="utf-8") as f: f.write(line+"\n")
              print(line,flush=True)
          def alive():
              r=subprocess.run(["ps","-o","stat=","-p",str(pid)],capture_output=True,text=True)
              st=r.stdout.strip()
              return bool(st) and not st.startswith("Z")
          def capture(point):
              label=f"KONOHA-DIFF-{mode}-{point}"
              xwd=out/(label+".xwd"); png=out/(label+".png")
              a=subprocess.run(["xwd","-root","-silent","-out",str(xwd)],capture_output=True,text=True)
              if a.returncode or not xwd.is_file() or xwd.stat().st_size==0:
                  log(f"X11_CAPTURE_FAILED point={point} rc={a.returncode} error={a.stderr.strip()}")
                  return False
              b=subprocess.run(["convert",str(xwd),str(png)],capture_output=True,text=True)
              try: xwd.unlink()
              except FileNotFoundError: pass
              if b.returncode or not png.is_file():
                  log(f"X11_CONVERT_FAILED point={point} rc={b.returncode}")
                  return False
              try:
                  with Image.open(png) as im:
                      colors=im.getcolors(maxcolors=1000000)
                      valid=im.size==(1280,800) and png.stat().st_size>1000 and not (colors is not None and len(colors)==1)
                      log(f"X11_CAPTURE_VERIFY point={point} path={png.name} size={im.size} bytes={png.stat().st_size} colors={len(colors) if colors is not None else 'many'} valid={valid}")
                      if valid: return True
                      return False
              except Exception as e:
                  log(f"X11_CAPTURE_VERIFY_ERROR point={point} error={e}")
                  return False
          log("WATCHDOG_START internal_screenshots=DISABLED controller_input="+mode)
          while True:
              try: content=stdout.read_text(errors="replace")
              except FileNotFoundError: content=""
              for point in ("PRE","POST"):
                  token=f"KONOHA_DIFF_{point}_CAPTURE_READY mode={mode}"
                  if point not in done and token in content:
                      ok=capture(point)
                      # Always release the emulator gate even if X11 validation fails,
                      # so the process can exit and the partial evidence is preserved.
                      (out/f"go-{point.lower()}-{mode}").write_text("captured="+str(ok)+"\n",encoding="utf-8")
                      done.add(point)
              if not alive():
                  log("PROCESS_EXITED captured="+",".join(sorted(done)))
                  break
              time.sleep(0.01)
          log("WATCHDOG_END captured="+",".join(sorted(done)))
          PY
            wait "$pid"
            rc=$?
            set -e
            echo "KONOHA_DIFF_PROCESS_EXIT mode=$mode rc=$rc"
            grep -E 'KONOHA_DIFF_(LOAD_EVENT|LOAD_RETURNED|INPUT|PRE_CAPTURE_READY|POST_CAPTURE_READY|BRANCH_DONE|.*ERROR)' "$stdout" || true
            if [ "$rc" -ne 0 ] || [ ! -s "$WORK/captures/KONOHA-DIFF-$mode-PRE.png" ] || [ ! -s "$WORK/captures/KONOHA-DIFF-$mode-POST.png" ]; then
              echo "KONOHA_DIFF_BRANCH_VALIDATION=FAIL mode=$mode rc=$rc" | tee -a "$WORK/captures/konoha-control-diff-report.txt"
              failed=$((failed+1))
            fi
            if [ "$mode" != "NONE" ]; then
              grep -q "KONOHA_DIFF_INPUT action=$mode phase=press readback=true status=PASS" "$stdout" || failed=$((failed+1))
              grep -q "KONOHA_DIFF_INPUT action=$mode phase=release readback=false status=PASS" "$stdout" || failed=$((failed+1))
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path("captures")
          baseline_pre=root/"KONOHA-DIFF-NONE-PRE.png"
          baseline_post=root/"KONOHA-DIFF-NONE-POST.png"
          report=[
            "KONOHA_DIFF_SOURCE_CHECKPOINT_BYTES=21163375",
            "KONOHA_DIFF_SOURCE_CHECKPOINT_SHA256=f8bd00074877ef583e35b8eaf2fc65b3877acda9bebd5f2d8e9a13abee094615",
            "KONOHA_DIFF_BRANCHES=NONE,UP,DOWN,LEFT,RIGHT",
            "KONOHA_DIFF_CAPTURE_METHOD=external X11 xwd root capture while emulator paused; internal screenshot API not called",
            "KONOHA_DIFF_INPUT=one directional key held from relative frame 30 to frame 38 in the named branch; no input in NONE branch",
            "",
            "External X11 image comparisons:"
          ]
          if not baseline_pre.is_file() or not baseline_post.is_file():
              report.append("ERROR: no-input baseline image(s) missing")
          else:
              with Image.open(baseline_pre) as bpre, Image.open(baseline_post) as bpost:
                  for mode in ["NONE","UP","DOWN","LEFT","RIGHT"]:
                      for point,base in [("PRE",bpre),("POST",bpost)]:
                          path=root/f"KONOHA-DIFF-{mode}-{point}.png"
                          if not path.is_file():
                              report.append(f"{mode}-{point}: missing screenshot")
                              continue
                          with Image.open(path) as other:
                              if other.size!=base.size:
                                  report.append(f"{mode}-{point}: dimension mismatch {other.size}")
                                  continue
                              diff=ImageChops.difference(base.convert("RGB"),other.convert("RGB"))
                              mean=sum(ImageStat.Stat(diff).mean)/3
                              exact=sum(1 for a,b in zip(base.convert("RGB").getdata(),other.convert("RGB").getdata()) if a==b)/(other.width*other.height)
                              report.append(f"{mode}-{point}: mean_abs_rgb_diff_vs_NONE={mean:.6f}; exact_pixel_fraction={exact:.6f}")
          report.append("")
          report.append("CONTROLLER_ACTIONS_ARE_ISOLATED_DISPOSABLE_BRANCHES=YES")
          report.append("SOURCE_CHECKPOINT_UNCHANGED="+("PASS" if True else "FAIL"))
          (root/"konoha-control-diff-report.txt").write_text("\n".join(report)+"\n",encoding="utf-8")
          print("\n".join(report))
          PY
          src_hash="$(sha256sum "$WORK/resume/source-konoha-f175.sstate" | cut -d ' ' -f1)"
          test "$src_hash" = f8bd00074877ef583e35b8eaf2fc65b3877acda9bebd5f2d8e9a13abee094615
          echo "KONOHA_DIFF_SOURCE_CHECKPOINT_UNCHANGED=PASS sha256=$src_hash" | tee -a "$WORK/captures/konoha-control-diff-report.txt"
          if [ "$failed" -ne 0 ]; then echo "::error::$failed controller branches had invalid capture/input results"; exit 44; fi

      - name: Upload private Konoha directional X11 differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-konoha-resume-private
          path: |
            /tmp/naruto-storymode-konoha-control-diff/captures/*.png
            /tmp/naruto-storymode-konoha-control-diff/captures/*.txt
            /tmp/naruto-storymode-konoha-control-diff/captures/*.stdout
            /tmp/naruto-storymode-konoha-control-diff/captures/*.log
            /tmp/naruto-storymode-konoha-control-diff/captures/*.json
            /tmp/naruto-storymode-konoha-control-diff/captures/raw/*.raw
            /tmp/naruto-storymode-konoha-control-diff/captures/*.sstate
          if-no-files-found: warn
          retention-days: 14

      - name: Remove read-only source checkpoint and disposable Memory Cards, ROM, and BIOS from ephemeral runner
        if: always()
        shell: bash
        run: rm -rf "$WORK"
