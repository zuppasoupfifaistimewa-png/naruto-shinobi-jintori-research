name: One-shot runner-only submenu RIGHT versus no-input diagnostic

on:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-submenu-right-ab"

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[RUN-NARUTO-SUBMENU-RIGHT-AB]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-submenu-right-ab
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install capture tools and create private workspace
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
          timeout 240s env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y jq python3-pil python3-numpy xvfb x11-utils imagemagick curl unzip
          mkdir -p "$WORK"/{build,state,card,captures,home,.config,.data,runtime}
          chmod 700 "$WORK/runtime"

      - name: Download pinned runner build, verified submenu checkpoint, and memory card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-submenu-right-ab/build

      - name: Download source checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39907655833
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-submenu-right-ab/state

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-submenu-right-ab/card

      - name: Validate immutable source files and clone cards
        shell: bash
        run: |
          set -euo pipefail
          STATE="$WORK/state/adaptive-cycle-02-f180.sstate"
          APP="$WORK/build/PCSX-Redux-spu-adpcm-patched.AppImage"
          CARD="$WORK/card/naruto-storymode.mcd"
          test -s "$STATE" && test -s "$APP" && test -s "$CARD"
          test "$(stat -c %s "$STATE")" -gt 21000000
          test "$(sha256sum "$STATE" | cut -d ' ' -f1)" = 705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35
          head -c 96 "$STATE" | grep -Fq 'PCSX-Redux SaveState v4'
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$STATE" "$WORK/state/source.sstate"
          chmod 400 "$WORK/state/source.sstate"
          cp "$CARD" "$WORK/card/action.mcd"
          cp "$CARD" "$WORK/card/control.mcd"
          cmp -s "$WORK/card/action.mcd" "$WORK/card/control.mcd"
          echo "SOURCE_CHECKPOINT=PASS sha256=705d4005dacee3b492ae99f273b1572bb5be3e3b66ad32c0b556dd5065e58a35" | tee "$WORK/captures/validation.txt"
          echo "MEMORY_CARD_CLONES=PASS sha256=$(sha256sum "$WORK/card/action.mcd" | cut -d ' ' -f1)" | tee -a "$WORK/captures/validation.txt"

      - name: Download pinned game and SCPH-7502 BIOS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0]); h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Start isolated X11 display and extract emulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          "$WORK/build/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          cat > "$WORK/pad-setup.lua" <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("DIAGNOSTIC_PAD_SETUP=PASS")
          LUA
          cat > "$WORK/submenu-ab.lua" <<'LUA'
          local branch=os.getenv("DIAG_BRANCH")
          if branch~="ACTION" and branch~="CONTROL" then error("invalid diagnostic branch") end
          local total=0; local loaded=false; local loadStarted=false; local loadReturned=false
          local active=nil; local done=false; local pad=PCSX.SIO0.slots[1].pads[1]; local buttons=PCSX.CONSTS.PAD.BUTTON
          local function log(s) print(s); io.stdout:flush() end
          local function capture(label)
              local xwd="captures/"..label..".xwd"; local tmp="captures/."..label..".tmp.png"; local png="captures/"..label..".png"
              os.remove(xwd); os.remove(tmp); os.remove(png)
              local cmd="xwd -root -silent -out "..xwd.." && convert "..xwd.." "..tmp.." && mv "..tmp.." "..png.." && rm -f "..xwd
              local a,b,c=os.execute(cmd)
              local ok=(a==true or a==0 or c==0)
              local f=io.open(png,"rb")
              if not ok or not f then if f then f:close() end; log("CAPTURE_FAIL="..label); PCSX.quit(86); return nil,nil end
              local bytes=f:seek("end"); f:close()
              if not bytes or bytes<1000 then log("CAPTURE_INVALID="..label); PCSX.quit(87); return nil,nil end
              local script="python3 tools/storymode_adaptive_agent.py "..png
              local p=io.popen(script.." 2>&1","r"); if not p then log("CLASSIFIER_START_FAIL="..label); PCSX.quit(88); return nil,nil end
              local result=p:read("*a") or ""; p:close()
              local state=result:match('"state"%s*:%s*"([%w_]+)')
              local action=result:match('"action"%s*:%s*"([%w_]+)')
              if not state or not action then log("CLASSIFIER_FAIL="..label.." output="..result:gsub("[\r\n]"," ")); PCSX.quit(89); return nil,nil end
              log("CAPTURE="..label.." bytes="..bytes.." state="..state.." action="..action)
              return state,action
          end
          local function press(button,frame)
              local b=buttons[button]; if not b or active then log("INPUT_FAIL=press_precondition"); PCSX.quit(90); return end
              local ok,v=pcall(function() pad.setOverride(b); return pad.getButton(b) end)
              log("INPUT action="..button.." phase=press frame="..frame.." readback="..tostring(v).." status="..(ok and v==true and "PASS" or "FAIL"))
              if not ok or v~=true then PCSX.quit(91); return end
              active=b
          end
          local function release(frame)
              if not active then return end
              local b=active; local ok,v=pcall(function() pad.clearOverride(b); return pad.getButton(b) end)
              active=nil
              log("INPUT action=RIGHT phase=release frame="..frame.." readback="..tostring(v).." status="..(ok and v==false and "PASS" or "FAIL"))
              if not ok or v~=false then PCSX.quit(92) end
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function() loaded=true; total=0; log("LOAD_EVENT=PASS") end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if done then return end
              if not loadStarted then
                  loadStarted=true; PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("state/source.sstate")); local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      loadReturned=true; PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not loadReturned then return end
              total=total+1; local phase=((total-1)%180)+1
              if phase==20 then
                  local state,action=capture(branch.."-F20"); if not state then return end
                  if state~="barrier_level_selection" or action~="WAIT" then
                      log("PRECONDITION=FAIL expected=barrier_level_selection/WAIT observed="..state.."/"..action.." input_suppressed=YES")
                      PCSX.quit(90); return
                  end
                  log("PRECONDITION=PASS branch="..branch.." state=barrier_level_selection action=WAIT")
              elseif phase==30 then
                  if branch=="ACTION" then press("RIGHT",total) else log("INPUT action=WAIT phase=press frame="..total.." status=PASS") end
              elseif phase==38 then
                  if branch=="ACTION" then release(total) end
              elseif phase==60 or phase==100 or phase==110 or phase==180 then
                  local label=branch.."-F"..phase
                  local state,action=capture(label); if not state then return end
                  if phase==60 then log("POST_F60_STATE="..state.." action="..action) end
                  if phase==180 then done=true; log("DIAGNOSTIC_BRANCH_FINISHED="..branch) end
              end
          end)
          log("DIAGNOSTIC_SCRIPT_READY branch="..branch.." action=RIGHT frames=30-38 control=NONE")
          LUA
          cp "$GITHUB_WORKSPACE/tools/storymode_adaptive_agent.py" "$WORK/tools/storymode_adaptive_agent.py"
          cd "$WORK"

      - name: Run action branch and no-input control from identical checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          run_branch() {
            branch="$1"; card="$2"
            rm -f "$WORK/captures/$branch"-F*.png "$WORK/captures/$branch".stdout "$WORK/captures/$branch".log
            set +e
            DIAG_BRANCH="$branch" timeout --signal=TERM --kill-after=5s 70s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/card/$card" \
              -exec "$(cat "$WORK/pad-setup.lua")" -dofile "$WORK/submenu-ab.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/$branch.log" -run > "$WORK/captures/$branch.stdout" 2>&1
            rc=$?
            set -e
            cat "$WORK/captures/$branch.stdout" >> "$WORK/captures/runner.log"
            test "$rc" -eq 0
            grep -q "DIAGNOSTIC_BRANCH_FINISHED=$branch" "$WORK/captures/$branch.stdout"
            grep -q "PRECONDITION=PASS branch=$branch" "$WORK/captures/$branch.stdout"
            if [ "$branch" = ACTION ]; then
              grep -q "INPUT action=RIGHT phase=press .*status=PASS" "$WORK/captures/$branch.stdout"
              grep -q "INPUT action=RIGHT phase=release .*status=PASS" "$WORK/captures/$branch.stdout"
            fi
          }
          run_branch ACTION action.mcd
          run_branch CONTROL control.mcd
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          import numpy as np
          from PIL import Image
          root=Path("captures")
          def load(name):
              p=root/name
              with Image.open(p) as im:
                  a=np.asarray(im.convert("RGB"))
              if a.shape!=(800,1280,3): raise SystemExit(f"bad dimensions {name} {a.shape}")
              return a
          report=[]
          for f in (20,60,100,110,180):
              a=load(f"ACTION-F{f}.png"); c=load(f"CONTROL-F{f}.png")
              d=np.abs(a.astype(np.int16)-c.astype(np.int16))
              report.append({"frame":f,"action_sha256":hashlib.sha256((root/f"ACTION-F{f}.png").read_bytes()).hexdigest(),
                             "control_sha256":hashlib.sha256((root/f"CONTROL-F{f}.png").read_bytes()).hexdigest(),
                             "different_pixels":int(np.count_nonzero(np.any(d!=0,axis=2))),
                             "mean_abs_rgb":round(float(d.mean()),6)})
          if report[0]["different_pixels"]!=0:
              raise SystemExit("initial frame parity failed; do not interpret post-action differences")
          # Diagnostic negative-control statistic only: the pink badge ROI used in prior audits.
          for row,f in zip(report,(20,60,100,110,180)):
              a=load(f"ACTION-F{f}.png")[145:225,525:660,:].astype(np.int16)
              c=load(f"CONTROL-F{f}.png")[145:225,525:660,:].astype(np.int16)
              def pink(x):
                  r,g,b=x[:,:,0],x[:,:,1],x[:,:,2]
                  return (r>150)&(r>1.3*g)&(b>100)&(np.abs(r-b)<100)
              row["pink_badge_mask_pixels_action"]=int(np.count_nonzero(pink(a)))
              row["pink_badge_mask_pixels_control"]=int(np.count_nonzero(pink(c)))
          (root/"ab-metrics.json").write_text(json.dumps({"pre_parity":"PASS","frames":report,"interpretation":"descriptive only; badge mask is not a target cue"} ,indent=2)+"\n")
          print(json.dumps({"pre_parity":"PASS","frames":report,"interpretation":"descriptive only; badge mask is not a target cue"},sort_keys=True))
          PY

      - name: Upload private diagnostic captures for runner-only future processing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-submenu-right-ab-private
          path: /tmp/naruto-submenu-right-ab/captures/
          retention-days: 7
          if-no-files-found: warn
