name: Naruto fastboot GPU register watchpoints

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-fastboot-gpu-watchpoints.yml"

permissions:
  contents: read

concurrency:
  group: naruto-fastboot-gpu-watchpoints
  cancel-in-progress: true

jobs:
  gpu-watchpoints:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Install private runtime tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils libgl1-mesa-dri python3

      - name: Download and verify private runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-fastboot-gpu-watch"
          mkdir -p "$WORK/home"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private release asset: $name"; exit 1; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset openbios.bin openbios-fastboot.bin
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          echo "25c789eb66608847907217c367f04a3ec6e62c08530e97c437ce99d29f4c156d  openbios-fastboot.bin" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          lines = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          ids = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "ROM, BIOS and AnyLinux hashes verified."

      - name: Pause before execution, trap EXE entry, and probe GPU/DMA writes
        run: |
          set -eu
          cd "$WORK"
          Xvfb :99 -ac -screen 0 1280x800x24 -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped")
          LUA
          )
          timeout --signal=TERM --kill-after=5s 95s \
            "$WORK/squashfs-root/AppRun" -bios "$WORK/openbios-fastboot.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -gdb -gdb-port 3333 -interpreter -stdout -lua_stdout -logfile "$WORK/pcsx.log" \
            > "$WORK/pcsx.stdout" 2>&1 &
          emu_pid=$!
          python3 - <<'PY' > "$WORK/gpu-watchpoint-summary.txt" 2>&1
          import socket, time
          HOST, PORT = "127.0.0.1", 3333
          def packet(payload):
              raw = payload.encode("ascii")
              return b"$" + raw + b"#" + f"{sum(raw) & 255:02x}".encode("ascii")
          class RSP:
              def __init__(self, sock):
                  self.sock = sock
                  self.buf = bytearray()
              def receive(self, timeout=3.0, stop_only=False, ignore_console=False):
                  deadline = time.monotonic() + timeout
                  while time.monotonic() < deadline:
                      start = self.buf.find(b"$")
                      if start >= 0:
                          if start: del self.buf[:start]
                          mark = self.buf.find(b"#", 1)
                          if mark >= 0 and len(self.buf) >= mark + 3:
                              body = bytes(self.buf[1:mark])
                              got = bytes(self.buf[mark + 1:mark + 3]).lower()
                              del self.buf[:mark + 3]
                              want = f"{sum(body) & 255:02x}".encode("ascii")
                              if got != want: raise ValueError("response checksum mismatch")
                              # PCSX-Redux streams console output as RSP 'O' packets
                              # while the target runs; these are NOT debugger stop events.
                              if ignore_console and body.startswith(b"O"):
                                  continue
                              if stop_only and not body.startswith((b"T", b"S", b"W", b"X")):
                                  continue
                              return body.decode("ascii", "replace")
                      elif self.buf:
                          # ACK/NACK bytes may be interleaved with framed replies.
                          self.buf.clear()
                      self.sock.settimeout(max(0.1, deadline - time.monotonic()))
                      try: chunk = self.sock.recv(4096)
                      except socket.timeout: continue
                      if not chunk: raise ConnectionError("peer closed")
                      self.buf.extend(chunk)
                  raise TimeoutError("no matching RSP packet before deadline")
              def request(self, payload, timeout=3.0):
                  self.sock.sendall(packet(payload))
                  return self.receive(timeout=timeout)
              def wait_stop(self, timeout=5.0):
                  return self.receive(timeout=timeout, stop_only=True, ignore_console=True)
              def interrupt(self):
                  self.sock.sendall(bytes([3]))
                  try: return self.wait_stop(3.0)
                  except Exception as e: return "interrupt-no-stop:" + type(e).__name__
          def request(rsp, payload, timeout=3.0):
              return rsp.request(payload, timeout)
          def reg_value(value):
              if len(value) != 8: return "unavailable"
              try: return f"0x{int.from_bytes(bytes.fromhex(value), 'little'):08x}"
              except ValueError: return "unavailable"
          def sample(rsp, label):
              vals = {}
              for name, command in [("pc","p25"),("status","p20"),("badvaddr","p23"),("cause","p24")]:
                  try: vals[name] = reg_value(request(rsp, command))
                  except Exception as e: vals[name] = "error:" + type(e).__name__
              try: vals["target_status"] = request(rsp, "?")
              except Exception as e: vals["target_status"] = "error:" + type(e).__name__
              print("RSP_STATE label=" + label + " " + " ".join(f"{k}={v}" for k,v in vals.items()), flush=True)
              return vals
          def wait_stop(rsp, timeout):
              return rsp.wait_stop(timeout)
          sock = None
          for attempt in range(24):
              try: sock = socket.create_connection((HOST, PORT), timeout=1.0); break
              except OSError: time.sleep(0.5)
          if sock is None:
              print("RSP_CONNECT=failed port=3333"); raise SystemExit(0)
          sock.settimeout(3.0)
          rsp = RSP(sock)
          print("RSP_CONNECT=connected port=3333")
          try:
              print("RSP_QSUPPORTED=" + request(rsp, "qSupported:multiprocess+")[:220])
              try:
                  print("ENTRY_BREAKPOINT_SET=" + request(rsp, "Z1,80011448,4"))
              except Exception as e:
                  print("ENTRY_BREAKPOINT_SET=error:" + type(e).__name__)
                  raise SystemExit(0)
              sock.sendall(packet("c"))
              try:
                  event = wait_stop(rsp, 40.0)
                  print("ENTRY_BREAKPOINT_STOP_EVENT=" + event)
              except Exception as e:
                  print("ENTRY_BREAKPOINT_STOP_EVENT=timeout:" + type(e).__name__)
                  print("ENTRY_INTERRUPT_EVENT=" + rsp.interrupt())
                  sample(rsp, "after-entry-timeout")
                  raise SystemExit(0)
              entry_state = sample(rsp, "after-entry-stop")
              entry_pc = entry_state.get("pc", "")
              if entry_pc != "0x80011448":
                  print("ENTRY_BREAKPOINT_VERIFIED=no expected_pc=0x80011448 observed_pc=" + entry_pc)
                  raise SystemExit(0)
              print("ENTRY_BREAKPOINT_VERIFIED=yes")
              try: print("ENTRY_BREAKPOINT_CLEAR=" + request(rsp, "z1,80011448,4"))
              except Exception as e: print("ENTRY_BREAKPOINT_CLEAR=error:" + type(e).__name__)
              phases = [
                ("gpu-gp0-write", ["1f801810"]),
                ("gpu-gp1-write", ["1f801814"]),
                ("gpu-dma2-register-write", ["1f8010a0","1f8010a4","1f8010a8"]),
              ]
              for label, addresses in phases:
                  active=[]
                  for addr in addresses:
                      try:
                          reply=request(rsp, f"Z2,{addr},4")
                          if reply=="OK": active.append(addr)
                          else: print(f"WATCHPOINT_SET label={label} address={addr} reply={reply}")
                      except Exception as e:
                          print(f"WATCHPOINT_SET label={label} address={addr} error={type(e).__name__}")
                  if not active:
                      print(f"WATCHPOINT_RESULT label={label} result=none-installed", flush=True)
                      continue
                  print(f"WATCHPOINT_SET label={label} installed={','.join(active)}", flush=True)
                  sock.sendall(packet("c"))
                  try:
                      event=rsp.wait_stop(5.0)
                      print(f"WATCHPOINT_RESULT label={label} result=stop-event event={event}", flush=True)
                      state = sample(rsp, label + "-stop")
                      print(f"WATCHPOINT_STOP_PC label={label} pc={state.get('pc','unavailable')} cause={state.get('cause','unavailable')}", flush=True)
                  except Exception as e:
                      print(f"WATCHPOINT_RESULT label={label} result=no-stop-within-5s error={type(e).__name__}", flush=True)
                      print("WATCHPOINT_INTERRUPT_EVENT=" + rsp.interrupt(), flush=True)
                      sample(rsp, label + "-timeout")
                  for addr in active:
                      try: request(rsp, f"z2,{addr},4")
                      except Exception: pass
              print("WATCHPOINT_TEST_COMPLETE", flush=True)
          finally:
              sock.close()
          PY
          echo "RSP_SUMMARY_BEGIN"
          cat "$WORK/gpu-watchpoint-summary.txt"
          echo "RSP_SUMMARY_END"
          echo "BOOT_MARKERS_BEGIN"
          grep -E 'Loaded BIOS:|OpenBIOS detected|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM\.CNF|BOOT =|EXEC:PC0|Execute !|First chance exception|Unknown GDB command|Exception|FATAL|ERROR|Error|Failed|failed' "$WORK/pcsx.stdout" "$WORK/pcsx.log" 2>/dev/null | tail -100 || true
          echo "BOOT_MARKERS_END"
          set +e
          wait "$emu_pid"
          emu_rc=$?
          set -e
          echo "GUI_PROCESS_EXIT=$emu_rc (124 means bounded observation cap)"

      - name: Upload private register summary for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-fastboot-gpu-watchpoints-private
          path: |
            ${{ runner.temp }}/naruto-fastboot-gpu-watch/gpu-watchpoint-summary.txt
            ${{ runner.temp }}/naruto-fastboot-gpu-watch/pcsx.stdout
            ${{ runner.temp }}/naruto-fastboot-gpu-watch/pcsx.log
          if-no-files-found: warn
          retention-days: 3

      - name: Clean private ROM, BIOS, emulator and debug logs
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi
          echo "Cleanup complete; private game data and diagnostic logs removed from runner."
