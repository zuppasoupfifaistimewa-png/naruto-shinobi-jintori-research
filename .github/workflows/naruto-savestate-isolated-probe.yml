name: Naruto savestate isolated diagnostic (no Story Mode input)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/naruto-savestate-isolated-probe.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: naruto-savestate-isolated-probe
  cancel-in-progress: false

jobs:
  isolate-savestate-restore:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Install diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils libgl1-mesa-dri python3 python3-pil

      - name: Download and verify private runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/naruto-savestate-isolated-probe"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/home" "$WORK/captures/raw" "$WORK/logs" "$WORK/cards" "$WORK/resume"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::Missing private release asset: $name"; exit 1; fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c '%s' scph7502.zip)" = "283463"
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as zf:
              members = []
              expanded = 0
              for info in zf.infolist():
                  p = PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("Unsafe BIOS archive entry")
                  if info.file_size > 2*1024*1024:
                      raise SystemExit("BIOS archive member exceeds safety limit")
                  expanded += info.file_size
                  if expanded > 4*1024*1024:
                      raise SystemExit("BIOS archive expansion exceeds safety limit")
                  if not info.is_dir() and info.file_size == 524288:
                      members.append(info)
              if len(members) != 1:
                  raise SystemExit(f"Expected one BIOS-sized member, found {len(members)}")
              out = Path("scph7502.bin")
              digest = hashlib.sha256()
              with zf.open(members[0]) as src, out.open("wb") as dst:
                  while True:
                      chunk = src.read(65536)
                      if not chunk:
                          break
                      digest.update(chunk)
                      dst.write(chunk)
              actual = digest.hexdigest()
              expected = "5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1"
              print("RETAIL_BIOS_SHA256=" + actual)
              if actual != expected:
                  raise SystemExit("Retail BIOS reference mismatch")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game.cue")
          lines = p.read_bytes().decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").splitlines()
          ids = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(ids) != 1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[ids[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "DIAGNOSTIC_RUNTIME=verified"

      - name: Restore source checkpoint and reference Memory Card artifacts
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-checkpoint-private
          run-id: 39205699071
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/naruto-savestate-isolated-probe/checkpoint-source

      - name: Restore reference blank Memory Card artifact
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39242130783
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/naruto-savestate-isolated-probe/card-source

      - name: Validate artifact files and prepare probe scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          state="$(find "$WORK/checkpoint-source" -type f -name 'storymode-checkpoint.sstate' -print -quit)"
          card="$(find "$WORK/card-source" -type f -name 'naruto-storymode.mcd' -print -quit)"
          manifest="$(find "$WORK/card-source" -type f -name 'memory-card-manifest.txt' -print -quit)"
          test -n "$state" && test -s "$state"
          test -n "$card" && test -s "$card"
          test -n "$manifest" && test -s "$manifest"
          if [ "$state" != "$WORK/checkpoint-source/storymode-checkpoint.sstate" ]; then
            cp "$state" "$WORK/checkpoint-source/storymode-checkpoint.sstate"
          fi
          cp "$card" "$WORK/cards/reference.mcd"
          bytes="$(stat -c '%s' "$WORK/cards/reference.mcd")"
          actual_sha="$(sha256sum "$WORK/cards/reference.mcd" | cut -d ' ' -f 1)"
          expected_bytes="$(awk -F= '$1=="STORY_MEMORY_CARD_BYTES"{print $2;exit}' "$manifest")"
          expected_sha="$(awk -F= '$1=="STORY_MEMORY_CARD_SHA256"{print $2;exit}' "$manifest")"
          test "$bytes" = "$expected_bytes"
          test "$actual_sha" = "$expected_sha"
          test "$bytes" = "131072"
          echo "SOURCE_CHECKPOINT_BYTES=$(stat -c '%s' "$WORK/checkpoint-source/storymode-checkpoint.sstate")" | tee "$WORK/captures/diagnostic-summary.txt"
          echo "SOURCE_CHECKPOINT_SHA256=$(sha256sum "$WORK/checkpoint-source/storymode-checkpoint.sstate" | cut -d ' ' -f 1)" | tee -a "$WORK/captures/diagnostic-summary.txt"
          echo "REFERENCE_CARD_BYTES=$bytes" | tee -a "$WORK/captures/diagnostic-summary.txt"
          echo "REFERENCE_CARD_SHA256=$actual_sha" | tee -a "$WORK/captures/diagnostic-summary.txt"
          cat > "$WORK/probe-no-load.lua" <<'LUA'
          local frame_count = 0
          local state_file = io.open("resume/storymode-checkpoint.sstate", "rb")
          print("SAVESTATE_PROBE_LUA_READY=1")
          print("SAVESTATE_PROBE_STATE_FILE_PRESENT=" .. (state_file and "1" or "0"))
          if state_file then state_file:close() end

          local function capture(name, n)
              local shot = PCSX.GPU.takeScreenShot()
              local bpp = (shot.bpp == 0) and 16 or 24
              local raw = assert(Support.File.open("captures/raw/" .. name .. ".raw", "TRUNCATE"))
              raw:writeMoveSlice(shot.data)
              raw:close()
              local meta = assert(io.open("captures/raw/" .. name .. ".json", "wb"))
              meta:write(string.format('{"frame":%d,"width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',
                  n, shot.width, shot.height, bpp, shot.width * shot.height * bpp / 8))
              meta:close()
              print(string.format("SAVESTATE_PROBE_SCREENSHOT_CAPTURED=1 name=%s frame=%d", name, n))
          end

          local pending = false
          local vsync = PCSX.Events.createEventListener("GPU::Vsync", function()
              frame_count = frame_count + 1
              if frame_count == 240 and not pending then
                  pending = true
                  print("SAVESTATE_PROBE_VSYNC_REACHED=240")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local ok, err = pcall(function() capture("probe-frame", frame_count) end)
                      if not ok then
                          print("SAVESTATE_PROBE_SCREENSHOT_ERROR=" .. tostring(err))
                          PCSX.quit(61)
                          return
                      end
                      PCSX.quit(0)
                  end)
              elseif frame_count >= 1500 and not pending then
                  pending = true
                  print("SAVESTATE_PROBE_VSYNC_TIMEOUT=1")
                  PCSX.quit(62)
              end
          end)
          print("SAVESTATE_PROBE_ARMED=1 target_vsync=240; no controller buttons will be sent")
          LUA

          cat > "$WORK/probe-load.lua" <<'LUA'
          local frame_count = 0
          local first_vsync_seen = false
          local load_call_returned = false
          local state_loaded = false
          local post_restore_frames = 0
          local pause_pending = false

          local function capture(name, n)
              local shot = PCSX.GPU.takeScreenShot()
              local bpp = (shot.bpp == 0) and 16 or 24
              local raw = assert(Support.File.open("captures/raw/" .. name .. ".raw", "TRUNCATE"))
              raw:writeMoveSlice(shot.data)
              raw:close()
              local meta = assert(io.open("captures/raw/" .. name .. ".json", "wb"))
              meta:write(string.format('{"frame":%d,"width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',
                  n, shot.width, shot.height, bpp, shot.width * shot.height * bpp / 8))
              meta:close()
              print(string.format("SAVESTATE_PROBE_SCREENSHOT_CAPTURED=1 name=%s frame=%d", name, n))
          end

          local loaded_listener = PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded", function()
              state_loaded = true
              post_restore_frames = 0
              print("SAVESTATE_PROBE_LOAD_EVENT=ExecutionFlow::SaveStateLoaded")
          end)

          local function stop_at_safe_tick(name, n, final)
              if pause_pending then return end
              pause_pending = true
              PCSX.pauseEmulator()
              PCSX.nextTick(function()
                  local ok, err = pcall(function() capture(name, n) end)
                  if not ok then
                      print("SAVESTATE_PROBE_SCREENSHOT_ERROR=" .. tostring(err))
                      PCSX.quit(61)
                      return
                  end
                  if final then
                      local proof_ok = state_loaded and load_call_returned and post_restore_frames >= 180
                      print("SAVESTATE_PROBE_POST_RESTORE_VSYNC=" .. tostring(post_restore_frames))
                      print("SAVESTATE_PROBE_RESTORE_PROOF=" .. (proof_ok and "PASS" or "FAIL"))
                      PCSX.quit(proof_ok and 0 or 52)
                  else
                      pause_pending = false
                      PCSX.resumeEmulator()
                  end
              end)
          end

          local gpu_listener = PCSX.Events.createEventListener("GPU::Vsync", function()
              if not first_vsync_seen then
                  first_vsync_seen = true
                  frame_count = frame_count + 1
                  print("SAVESTATE_PROBE_FIRST_VSYNC=1; scheduling load after callback unwinds")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local opened, file = pcall(function()
                          return assert(Support.File.open("resume/storymode-checkpoint.sstate"), "cannot open checkpoint")
                      end)
                      if not opened or not file then
                          print("SAVESTATE_PROBE_OPEN_ERROR=" .. tostring(file))
                          PCSX.quit(50)
                          return
                      end
                      local ok, err = pcall(function() PCSX.loadSaveState(file) end)
                      file:close()
                      if not ok then
                          print("SAVESTATE_PROBE_LOAD_CALL_ERROR=" .. tostring(err))
                          PCSX.quit(51)
                          return
                      end
                      load_call_returned = true
                      print("SAVESTATE_PROBE_LOAD_CALL_RETURNED=1")
                      PCSX.resumeEmulator()
                  end)
                  return
              end

              frame_count = frame_count + 1
              if state_loaded then
                  post_restore_frames = post_restore_frames + 1
                  if post_restore_frames == 60 then
                      stop_at_safe_tick("restore-post-60", post_restore_frames, false)
                  elseif post_restore_frames == 180 then
                      stop_at_safe_tick("restore-post-180", post_restore_frames, true)
                  end
              elseif frame_count >= 1500 and not pause_pending then
                  print("SAVESTATE_PROBE_LOAD_EVENT_TIMEOUT=1")
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function() PCSX.quit(53) end)
              end
          end)
          print("SAVESTATE_PROBE_LUA_READY=1")
          print("SAVESTATE_PROBE_ARMED=1; load only at paused nextTick, observe SaveStateLoaded event, then 180 VSyncs")
          LUA
          echo "PROBE_SCRIPTS_READY=1" | tee -a "$WORK/captures/diagnostic-summary.txt"

      - name: Run isolated one-factor-at-a-time emulator probes
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          export LIBGL_ALWAYS_SOFTWARE=1
          unset MESA_GL_VERSION_OVERRIDE MESA_GLSL_VERSION_OVERRIDE
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'PADLUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("SAVESTATE_PROBE_PAD_SETUP=1")
          PADLUA
          )
          run_probe() {
            phase="$1"; lua_file="$2"
            echo "SAVESTATE_PROBE_PHASE_BEGIN=$phase" | tee -a "$WORK/captures/diagnostic-summary.txt"
            rm -rf "$WORK/home" "$WORK/captures/raw"
            mkdir -p "$WORK/home/.config" "$WORK/home/.local/share" "$WORK/captures/raw" "$WORK/cards"
            cp "$WORK/cards/reference.mcd" "$WORK/cards/naruto-storymode.mcd"
            set +e
            timeout --signal=TERM --kill-after=5s 60s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" \
              -memcard1 "$WORK/cards/naruto-storymode.mcd" -exec "$PAD_SETUP" \
              -dofile "$WORK/$lua_file" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/logs/$phase-pcsx.log" -run > "$WORK/logs/$phase-stdout.log" 2>&1
            rc=$?
            set -e
            echo "SAVESTATE_PROBE_PHASE_EXIT=$phase:$rc" | tee -a "$WORK/captures/diagnostic-summary.txt"
            grep -E 'SAVESTATE_PROBE|Loaded BIOS:|CD-ROM Label:|CD-ROM ID:|Execute !|KERNEL SETUP|SIGSEGV|Segmentation fault|FATAL|ERROR' \
              "$WORK/logs/$phase-stdout.log" "$WORK/logs/$phase-pcsx.log" \
              >> "$WORK/captures/diagnostic-summary.txt" || true
            for f in "$WORK/captures/raw/"*.raw "$WORK/captures/raw/"*.json; do
              [ -f "$f" ] || continue
              cp "$f" "$WORK/captures/$phase-$(basename "$f")"
            done
            if [ "$rc" -ne 0 ]; then
              echo "SAVESTATE_PROBE_PHASE_RESULT=$phase:FAIL exit=$rc" | tee -a "$WORK/captures/diagnostic-summary.txt"
              return 1
            fi
            echo "SAVESTATE_PROBE_PHASE_RESULT=$phase:PASS" | tee -a "$WORK/captures/diagnostic-summary.txt"
          }

          # A is the cold-boot control: no checkpoint file exists and loading is disabled.
          rm -f "$WORK/resume/storymode-checkpoint.sstate"
          run_probe A-control-no-state probe-no-load.lua

          # B changes only one factor: the sanitized checkpoint file exists, but the Lua probe never loads it.
          cp "$WORK/checkpoint-source/storymode-checkpoint.sstate" "$WORK/resume/storymode-checkpoint.sstate"
          run_probe B-sanitized-file-present-no-load probe-no-load.lua

          # C changes only one factor from B: restore the checkpoint's BIOS field; loading remains disabled.
          cp "$WORK/checkpoint-source/storymode-checkpoint.sstate" "$WORK/resume/storymode-checkpoint.sstate"
          python3 - "$WORK/resume/storymode-checkpoint.sstate" "$WORK/scph7502.bin" <<'PY'
          import sys
          from pathlib import Path
          state_path, bios_path = Path(sys.argv[1]), Path(sys.argv[2])
          bios, data = bios_path.read_bytes(), state_path.read_bytes()
          if len(bios) != 0x80000:
              raise SystemExit("PROBE_REHYDRATE_FAIL wrong BIOS size")
          def read_varint(buf, pos):
              value = shift = 0
              while pos < len(buf):
                  byte = buf[pos]; pos += 1
                  value |= (byte & 0x7f) << shift
                  if not byte & 0x80: return value, pos
                  shift += 7
                  if shift > 70: raise ValueError("protobuf varint too long")
              raise ValueError("truncated protobuf varint")
          def varint(value):
              out = bytearray()
              while value > 0x7f:
                  out.append((value & 0x7f) | 0x80); value >>= 7
              out.append(value); return bytes(out)
          def fields(buf):
              out, pos = [], 0
              while pos < len(buf):
                  start = pos; tag, pos = read_varint(buf, pos)
                  number, wire = tag >> 3, tag & 7
                  if wire == 0:
                      _, pos = read_varint(buf, pos); payload_start = payload_end = pos
                  elif wire == 1:
                      payload_start, payload_end = pos, pos + 8; pos += 8
                  elif wire == 2:
                      size, pos = read_varint(buf, pos); payload_start = pos; pos += size; payload_end = pos
                  elif wire == 5:
                      payload_start, payload_end = pos, pos + 4; pos += 4
                  else:
                      raise ValueError(f"unsupported protobuf wire type {wire}")
                  if pos > len(buf): raise ValueError("truncated protobuf field")
                  out.append((number, wire, start, payload_start, payload_end, pos))
              return out
          top = fields(data)
          mem = [f for f in top if f[0] == 3 and f[1] == 2]
          if len(mem) != 1: raise SystemExit(f"PROBE_REHYDRATE_FAIL memory messages={len(mem)}")
          _, _, _, ms, me, _ = mem[0]
          nested = fields(data[ms:me])
          if any(n == 2 and w == 2 for n,w,*_ in nested): raise SystemExit("PROBE_REHYDRATE_FAIL BIOS already present")
          if not any(n == 1 and w == 2 for n,w,*_ in nested): raise SystemExit("PROBE_REHYDRATE_FAIL Memory.ram missing")
          rebuilt_mem = bytearray(); inserted = False
          for n,w,start,ps,pe,end in nested:
              rebuilt_mem.extend(data[ms+start:ms+end])
              if n == 1 and w == 2:
                  rebuilt_mem.extend(varint((2<<3)|2)); rebuilt_mem.extend(varint(len(bios))); rebuilt_mem.extend(bios); inserted = True
          if not inserted: raise SystemExit("PROBE_REHYDRATE_FAIL cannot insert BIOS")
          rebuilt = bytearray(); replaced = 0
          for n,w,start,ps,pe,end in top:
              if n == 3 and w == 2:
                  rebuilt.extend(varint((3<<3)|2)); rebuilt.extend(varint(len(rebuilt_mem))); rebuilt.extend(rebuilt_mem); replaced += 1
              else: rebuilt.extend(data[start:end])
          if replaced != 1: raise SystemExit("PROBE_REHYDRATE_FAIL top-level replacement count")
          state_path.write_bytes(rebuilt)
          print(f"PROBE_REHYDRATE=PASS bytes={len(rebuilt)}")
          PY
          cp "$WORK/resume/storymode-checkpoint.sstate" "$WORK/checkpoint-source/rehydrated-checkpoint.sstate"
          run_probe C-rehydrated-file-present-no-load probe-no-load.lua

          # D changes only one factor from C: call the real savestate loader at paused nextTick.
          cp "$WORK/checkpoint-source/rehydrated-checkpoint.sstate" "$WORK/resume/storymode-checkpoint.sstate"
          run_probe D-rehydrated-checkpoint-load probe-load.lua
          echo "SAVESTATE_PROBE_ALL_PHASES_COMPLETED=1" | tee -a "$WORK/captures/diagnostic-summary.txt"

      - name: Convert captured emulator frames to PNG evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path("captures")
          for meta_path in sorted(root.glob("*.json")):
              try:
                  meta = json.loads(meta_path.read_text())
                  raw_path = meta_path.with_suffix(".raw")
                  if not raw_path.exists():
                      continue
                  raw = raw_path.read_bytes()
                  width, height, bpp = int(meta["width"]), int(meta["height"]), int(meta["bpp"])
                  if len(raw) != width * height * bpp // 8:
                      print(f"PROBE_PNG_SKIP={meta_path.name} reason=byte_count_mismatch")
                      continue
                  if bpp == 16:
                      rgb = bytearray()
                      for i in range(0, len(raw), 2):
                          word = raw[i] | (raw[i+1] << 8)
                          rgb.extend(((word & 31)*255//31, ((word>>5)&31)*255//31, ((word>>10)&31)*255//31))
                      image = Image.frombytes("RGB", (width, height), bytes(rgb))
                  elif bpp == 24:
                      image = Image.frombytes("RGB", (width, height), raw)
                  else:
                      print(f"PROBE_PNG_SKIP={meta_path.name} reason=unsupported_bpp")
                      continue
                  output = root / (meta_path.stem + ".png")
                  image.save(output)
                  print(f"PROBE_PNG_CREATED={output.name} size={width}x{height}")
              except Exception as exc:
                  print(f"PROBE_PNG_ERROR={meta_path.name} type={type(exc).__name__} detail={exc}")
          PY

      - name: Upload isolated diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-savestate-isolated-probe-evidence
          path: |
            ${{ runner.temp }}/naruto-savestate-isolated-probe/captures/diagnostic-summary.txt
            ${{ runner.temp }}/naruto-savestate-isolated-probe/captures/*.png
            ${{ runner.temp }}/naruto-savestate-isolated-probe/logs/*.log
            ${{ runner.temp }}/naruto-savestate-isolated-probe/xvfb.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Require explicit post-restore evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY="$WORK/captures/diagnostic-summary.txt"
          if [ ! -s "$SUMMARY" ]; then
            echo "::error::SAVESTATE_PROBE_RESULT=FAIL reason=diagnostic_summary_missing"
            exit 1
          fi
          cat "$SUMMARY"
          if ! grep -q 'SAVESTATE_PROBE_PHASE_RESULT=A-control-no-state:PASS' "$SUMMARY"; then
            echo "::error::SAVESTATE_PROBE_RESULT=FAIL reason=control_failed"
            exit 1
          fi
          if ! grep -q 'SAVESTATE_PROBE_PHASE_RESULT=B-sanitized-file-present-no-load:PASS' "$SUMMARY"; then
            echo "::error::SAVESTATE_PROBE_RESULT=FAIL reason=state_file_presence_control_failed"
            exit 1
          fi
          if ! grep -q 'SAVESTATE_PROBE_PHASE_RESULT=C-rehydrated-file-present-no-load:PASS' "$SUMMARY"; then
            echo "::error::SAVESTATE_PROBE_RESULT=FAIL reason=rehydrated_file_control_failed"
            exit 1
          fi
          if ! grep -q 'SAVESTATE_PROBE_PHASE_RESULT=D-rehydrated-checkpoint-load:PASS' "$SUMMARY"; then
            echo "::error::SAVESTATE_PROBE_RESULT=FAIL reason=actual_restore_failed"
            exit 1
          fi
          if ! grep -q 'SAVESTATE_PROBE_RESTORE_PROOF=PASS' "$SUMMARY"; then
            echo "::error::SAVESTATE_PROBE_RESULT=FAIL reason=load_event_or_post_restore_progress_missing"
            exit 1
          fi
          if ! find "$WORK/captures" -maxdepth 1 -type f -name 'D-rehydrated-checkpoint-load-restore-post-180.png' | grep -q .; then
            echo "::error::SAVESTATE_PROBE_RESULT=FAIL reason=post_restore_screenshot_missing"
            exit 1
          fi
          echo "SAVESTATE_PROBE_RESULT=PASS"

      - name: Remove runtime assets from ephemeral runner
        if: always()
        shell: bash
        run: |
          rm -rf "$WORK"
