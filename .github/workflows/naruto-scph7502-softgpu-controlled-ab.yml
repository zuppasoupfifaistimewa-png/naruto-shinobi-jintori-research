name: Naruto SCPH-7502 controlled software-GPU A/B probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-scph7502-softgpu-controlled-ab.yml"

permissions:
  contents: read

concurrency:
  group: naruto-scph7502-softgpu-controlled-ab
  cancel-in-progress: true

jobs:
  controlled-bios-ab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - name: Install private runtime and capture tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils xdotool imagemagick tesseract-ocr tesseract-ocr-jpn gdb-multiarch libgl1-mesa-dri mesa-utils

      - name: Download and verify private game, pinned emulator and both BIOS candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-scph7502-softgpu-ab"
          mkdir -p "$WORK/captures" "$WORK/gdb"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            ids="$(jq -r --arg name "$name" '[.assets[]? | select(.name == $name) | .id] | .[]' release.json)"
            if [ "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "::error::Expected exactly one release asset named $name"
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$ids" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          fetch_asset openbios.bin openbios-fastboot.bin
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c '%s' scph7502.zip)" = "283463"
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          echo "25c789eb66608847907217c367f04a3ec6e62c08530e97c437ce99d29f4c156d  openbios-fastboot.bin" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as zf:
              members=[]
              for info in zf.infolist():
                  p=PurePosixPath(info.filename)
                  mode=(info.external_attr >> 16) & 0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("Unsafe BIOS archive entry")
                  if info.file_size > 2*1024*1024:
                      raise SystemExit("BIOS archive member exceeds safety limit")
                  if not info.is_dir() and info.file_size == 524288:
                      members.append(info)
              if len(members) != 1:
                  raise SystemExit(f"Expected one BIOS-sized member, found {len(members)}")
              digest=hashlib.sha256()
              out=Path("scph7502.bin")
              with zf.open(members[0]) as src, out.open("wb") as dst:
                  while True:
                      chunk=src.read(65536)
                      if not chunk: break
                      digest.update(chunk); dst.write(chunk)
              actual=digest.hexdigest()
              expected="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1"
              print("RETAIL_BIOS_SHA256="+actual)
              print("RETAIL_BIOS_REFERENCE_MATCH="+str(actual == expected).upper())
              if actual != expected: raise SystemExit("Retail BIOS identity mismatch")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p=Path("game.cue")
          lines=p.read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          files=[i for i,line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(files)!=1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE: expected one FILE and at least one TRACK")
          lines[files[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          echo "ASSET_CHECKS=PASS"
          echo "EMULATOR_PIN=0c3572c3db75f97542001e453ae80ba8c3f8acba"
          echo "ROM_AND_BIOS_REMAIN_ON_EPHEMERAL_PRIVATE_RUNNER=TRUE"

      - name: Controlled A/B with identical software-GPU, display, timing and controller setup
        run: |
          set -eu
          cd "$WORK"
          Xvfb :99 -ac -screen 0 1280x800x24 -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          run_variant() {
            label="$1"
            bios="$2"
            variant_home="$WORK/home-$label"
            mkdir -p "$variant_home/.config" "$variant_home/.local/share"
            export HOME="$variant_home" XDG_CONFIG_HOME="$variant_home/.config" XDG_DATA_HOME="$variant_home/.local/share"
            PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped")
          print("DIAGNOSTIC=PC sampled only by external GDB; no VSync register polling")
          LUA
          )
            echo "===== BIOS_VARIANT=$label ====="
            timeout --signal=TERM --kill-after=5s 112s \
              "$WORK/squashfs-root/AppRun" -bios "$WORK/$bios" -iso "$WORK/game-run.cue" \
              -exec "$PAD_SETUP" -gdb -run -interpreter -softgpu -stdout -lua_stdout \
              -logfile "$WORK/$label.log" > "$WORK/$label.stdout" 2>&1 &
            emu_pid=$!
            capture_window() {
              shot="$1"
              tree="$(xwininfo -root -tree 2>&1 || true)"
              printf '%s\n' "$tree" > "$WORK/window-tree-$label-$shot.txt"
              root_hex="$(xwininfo -root 2>/dev/null | awk '/Window id:/{print $4; exit}')"
              [ -n "$root_hex" ] || root_hex=0x0
              root_id=$((root_hex))
              window_id=""
              best_area=0
              while IFS= read -r id; do
                [ -n "$id" ] || continue
                id_num=$((id))
                [ "$id_num" -eq "$root_id" ] && continue
                stats="$(xwininfo -id "$id" 2>/dev/null || true)"
                width="$(printf '%s\n' "$stats" | awk '/Width:/{print $2; exit}')"
                height="$(printf '%s\n' "$stats" | awk '/Height:/{print $2; exit}')"
                name="$(printf '%s\n' "$stats" | sed -n 's/.*Window id: [^"]*"\(.*\)".*/\1/p' | head -n 1)"
                case "$width:$height" in *[!0-9:]*|:*) continue;; esac
                area=$((width*height))
                if [ "$width" -ge 400 ] && [ "$height" -ge 250 ] && [ "$area" -gt "$best_area" ]; then
                  window_id="$id_num"; best_area="$area"; best_name="$name"; best_width="$width"; best_height="$height"
                fi
              done < <(printf '%s\n' "$tree" | awk '$1 ~ /^0x[[:xdigit:]]+$/ {print $1}')
              if [ -z "$window_id" ]; then
                echo "CAPTURE_RESULT=$label/$shot no eligible non-root X11 window"
                return 1
              fi
              echo "CAPTURE_WINDOW=$label/$shot id=$window_id name=$best_name width=$best_width height=$best_height"
              import -window "$window_id" "$WORK/captures/$label-$shot.png"
              identify -format 'FRAME_METRICS label=%f width=%w height=%h mean=%[mean] stddev=%[standard-deviation] colors=%k\n' "$WORK/captures/$label-$shot.png"
              echo "OCR_BEGIN=$label/$shot"
              tesseract "$WORK/captures/$label-$shot.png" stdout -l jpn+eng 2>/dev/null | head -12 || true
              echo "OCR_END=$label/$shot"
              echo "$window_id" > "$WORK/last-window-$label"
              return 0
            }
            gdb_snapshot() {
              point="$1"
              raw="$WORK/gdb/$label-$point.internal.txt"
              set +e
              timeout --signal=TERM --kill-after=1s 5s gdb-multiarch -q -batch \
                -ex "set pagination off" -ex "target remote 127.0.0.1:3333" \
                -ex "info registers pc" -ex "detach" > "$raw" 2>&1
              rc=$?
              set -e
              pc="$(sed -nE 's/^[[:space:]]*pc[[:space:]]+(0x[[:xdigit:]]+).*/\1/p' "$raw" | head -n 1)"
              if [ -n "$pc" ]; then
                echo "GDB_PC_SAMPLE bios=$label point=$point pc=$pc result=ok"
              else
                echo "GDB_PC_SAMPLE bios=$label point=$point result=unavailable exit=$rc"
                grep -iE 'connection refused|remote connection|no registers|target architecture|timed out|error|failed|unrecognized option' "$raw" | tail -3 || true
              fi
              rm -f "$raw"
            }
            sleep 28
            capture_window frame-28s || true
            gdb_snapshot t28
            sleep 12
            capture_window frame-40s || true
            gdb_snapshot t40
            sleep 20
            capture_window frame-60s || true
            gdb_snapshot t60
            if [ -s "$WORK/last-window-$label" ]; then
              wid="$(cat "$WORK/last-window-$label")"
              timeout 2s xdotool windowfocus "$wid" 2>/dev/null || true
              echo "INPUT_TEST_BEGIN bios=$label checkpoint=t60 actions=Return,Z"
              xdotool key --clearmodifiers Return
              sleep 2
              capture_window after-return || true
              xdotool key --clearmodifiers z
              sleep 2
              capture_window after-cross || true
              echo "INPUT_TEST_END bios=$label"
            else
              echo "INPUT_TEST_SKIPPED bios=$label reason=no-window"
            fi
            sleep 16
            capture_window frame-80s || true
            gdb_snapshot t80
            sleep 20
            capture_window frame-100s || true
            gdb_snapshot t100
            set +e
            wait "$emu_pid"
            rc=$?
            set -e
            echo "GUI_PROCESS_EXIT bios=$label code=$rc (124=observation cap)"
            echo "BOOT_MARKERS_BEGIN bios=$label"
            grep -E 'Loaded BIOS:|Known BIOS detected|OpenBIOS detected|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM\.CNF|BOOT =|EXEC:PC0|Execute !|ResetCallback|unknown GPU data word|PAD_SETUP=|FATAL|Exception|ERROR|Error|Failed|failed' \
              "$WORK/$label.stdout" "$WORK/$label.log" 2>/dev/null | tail -100 || true
            echo "BOOT_MARKERS_END bios=$label"
          }
          run_variant retail scph7502.bin
          run_variant openbios openbios-fastboot.bin
          for shot in frame-28s frame-40s frame-60s after-return after-cross frame-80s frame-100s; do
            a="$WORK/captures/retail-$shot.png"
            b="$WORK/captures/openbios-$shot.png"
            if [ -s "$a" ] && [ -s "$b" ]; then
              diff="$(compare -metric AE "$a" "$b" null: 2>&1 || true)"
              echo "BIOS_IMAGE_DIFF checkpoint=$shot absolute_pixel_difference=$diff"
            fi
          done
          echo "CONTROLLED_AB_COMPLETE=TRUE"
          echo "INTERPRETATION=Actions success is not a game-boot claim; verify actual images and runtime PC samples."

      - name: Upload private captures and safe runtime summaries for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-scph7502-softgpu-controlled-ab-private
          path: |
            ${{ runner.temp }}/naruto-scph7502-softgpu-ab/captures/*.png
            ${{ runner.temp }}/naruto-scph7502-softgpu-ab/retail.stdout
            ${{ runner.temp }}/naruto-scph7502-softgpu-ab/retail.log
            ${{ runner.temp }}/naruto-scph7502-softgpu-ab/openbios.stdout
            ${{ runner.temp }}/naruto-scph7502-softgpu-ab/openbios.log
            ${{ runner.temp }}/naruto-scph7502-softgpu-ab/window-tree-*.txt
            ${{ runner.temp }}/naruto-scph7502-softgpu-ab/xvfb.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove private media, emulator extracts and raw diagnostics
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi
          echo "Cleanup complete; no BIOS, ROM, save state, VRAM dump or raw GDB transcript was retained."
