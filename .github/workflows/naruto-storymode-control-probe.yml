name: Naruto Story Mode checkpoint control probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-control-probe"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-CONTROL-PROBE]')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-control-probe
      BASE_COMMIT: 0c3572c3db75f97542001e453ae80ba8c3f8acba
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install probe utilities and create private workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil xvfb x11-utils curl git unzip zip
          mkdir -p "$WORK"/{source-state,source-card,resume,cards,captures/raw,home,.config,.data,runtime,build,pinned}

      - name: Download verified checkpoint from run 39426068247
        uses: actions/download-artifact@v4
        with:
          name: naruto-spu-sentinel-fix-probe-private
          run-id: 39426068247
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-control-probe/source-state

      - name: Download matching private Memory Card from source run
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-control-probe/source-card

      - name: Validate checkpoint bytes, source screenshot and Memory Card
        shell: bash
        run: |
          set -euo pipefail
          RAW="$WORK/source-state/captures/storymode-checkpoint-next.raw.sstate"
          MANIFEST="$WORK/source-state/captures/probe-manifest.txt"
          PNG="$WORK/source-state/captures/storymode-checkpoint-next.png"
          CARD="$WORK/source-card/naruto-storymode.mcd"
          CM="$WORK/source-card/memory-card-manifest.txt"
          test -s "$RAW" && test -s "$MANIFEST" && test -s "$PNG" && test -s "$CARD" && test -s "$CM"
          val() { awk -F= -v k="$1" '$1==k {sub(/^[^=]*=/,"");print;exit}' "$MANIFEST"; }
          test "$(val PROBE_NEXT_STATE_BYTES)" = 21162405
          test "$(val PROBE_NEXT_STATE_SHA256)" = b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a
          test "$(val PROBE_NEXT_CHECKPOINT_VALID)" = PASS
          test "$(val PROBE_CONTROLLER_INPUT)" = none
          test "$(stat -c %s "$RAW")" = 21162405
          test "$(sha256sum "$RAW" | cut -d ' ' -f1)" = b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$RAW" "$WORK/resume/storymode-checkpoint.sstate"
          cp "$PNG" "$WORK/captures/checkpoint-parent.png"
          echo "CONTROL_PROBE_CHECKPOINT_VALID=PASS bytes=21162405 sha256=$(sha256sum "$RAW" | cut -d ' ' -f1)"
          echo "CONTROL_PROBE_CARD_VALID=PASS; each input branch uses a disposable copy"

      - name: Download pinned game and BIOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0]); h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("CONTROL_PROBE_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Rebuild pinned base plus only the two-file SPU ADPCM fix
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/build"
          git clone --no-checkout https://github.com/grumpycoders/pcsx-redux.git pcsx-src
          cd pcsx-src
          git checkout --detach "$BASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          ./.github/scripts/update-submodules.sh
          git apply "$GITHUB_WORKSPACE/experiments/pcsx-redux-spu-adpcm-stopped-cursor.patch"
          git diff --check
          git diff --binary -- src/spu/adpcm.cc src/spu/adpcm.h > "$WORK/applied-fix.diff"
          patch_sha="$(sha256sum "$GITHUB_WORKSPACE/experiments/pcsx-redux-spu-adpcm-stopped-cursor.patch" | cut -d ' ' -f1)"
          diff_sha="$(sha256sum "$WORK/applied-fix.diff" | cut -d ' ' -f1)"
          test "$patch_sha" = 9588ee95651c9841c4bc5e25bd34b4be41ac100a955511817f8a92901245b7b5
          test "$diff_sha" = 754d471acb8b7c468251d20ef19ac7fe8a4f66ec0d7f67807d07ac7aa9b0b46c
          make -j 2 all pcsx-redux-tests tools
          make -C src/mips/tests -j 2 PCSX_TESTS=true
          make -C src/mips/openbios clean
          make -C src/mips/openbios -j 2 all
          mkdir -p "$WORK/test-results"
          export GTEST_OUTPUT=xml:"$WORK/test-results/"
          xvfb-run catchsegv ./pcsx-redux-tests
          make install install-openbios DESTDIR=AppDir/usr
          sed -i 's:/usr/bin/::' AppDir/usr/share/applications/pcsx-redux.desktop
          linuxdeploy -v 3 --appdir=AppDir -e AppDir/usr/bin/pcsx-redux -d AppDir/usr/share/applications/pcsx-redux.desktop -i AppDir/usr/share/icons/hicolor/256x256/apps/pcsx-redux.png -o appimage
          mv PCSX-Redux-x86_64.AppImage "$WORK/PCSX-Redux-spu-adpcm-patched.AppImage"
          chmod +x "$WORK/PCSX-Redux-spu-adpcm-patched.AppImage"
          variant_sha="$(sha256sum "$WORK/PCSX-Redux-spu-adpcm-patched.AppImage" | cut -d ' ' -f1)"
          {
            echo "CONTROL_PROBE_BASE_COMMIT=$BASE_COMMIT"
            echo "CONTROL_PROBE_PATCH_SHA256=$patch_sha"
            echo "CONTROL_PROBE_APPLIED_DIFF_SHA256=$diff_sha"
            echo "CONTROL_PROBE_PATCHED_APPIMAGE_SHA256=$variant_sha"
          } > "$WORK/captures/patched-build-manifest.txt"
          cp "$WORK/PCSX-Redux-spu-adpcm-patched.AppImage" "$WORK/captures/PCSX-Redux-spu-adpcm-patched.AppImage"
          cd "$WORK/pinned"
          ../PCSX-Redux-spu-adpcm-patched.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          echo "CONTROL_PROBE_PATCHED_BUILD=PASS sha256=$variant_sha"

      - name: Restore the same checkpoint independently for each one-button trial
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          chmod 700 "$WORK/runtime"
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("CONTROL_PROBE_PAD_SETUP=PASS")
          LUA
          )
          cat > "$WORK/control-probe.lua" <<'LUA'
          local name=os.getenv("PROBE_BUTTON") or "NONE"
          local frame=0; local startup=0; local load_started=false; local load_returned=false; local loaded=false; local pressed=false; local released=false
          local pad=PCSX.SIO0.slots[1].pads[1]; local buttons=PCSX.CONSTS.PAD.BUTTON
          local function log(s) print(s); io.stdout:flush() end
          local function shot(label)
              local s=PCSX.GPU.takeScreenShot()
              assert(s and s.width>=100 and s.height>=100 and s.data,"invalid screenshot")
              local bpp=(s.bpp==0) and 16 or 24
              local rawpath="captures/raw/"..label..".raw"
              local f=assert(Support.File.open(rawpath,"TRUNCATE")); f:writeMoveSlice(s.data); f:close()
              local m=assert(io.open("captures/"..label..".json","wb"))
              m:write(string.format('{"label":"%s","raw":"%s","width":%d,"height":%d,"bpp":%d,"expected_bytes":%d}\n',label,rawpath,s.width,s.height,bpp,s.width*s.height*bpp/8)); m:close()
              log(string.format("CONTROL_PROBE_SCREENSHOT=%s size=%dx%d",label,s.width,s.height))
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function() loaded=true; frame=0; log("CONTROL_PROBE_LOAD_EVENT=ExecutionFlow::SaveStateLoaded") end)
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not load_started then
                  load_started=true; startup=startup+1; log("CONTROL_PROBE_LOAD_BEGIN=1"); PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/storymode-checkpoint.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("CONTROL_PROBE_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      load_returned=true; log("CONTROL_PROBE_LOAD_CALL_RETURNED=1"); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not load_returned then
                  startup=startup+1
                  if startup>120 then log("CONTROL_PROBE_RESTORE_GATE=FAIL"); PCSX.pauseEmulator(); PCSX.nextTick(function() PCSX.quit(33) end) end
                  return
              end
              frame=frame+1
              if frame==20 then shot(name.."-pre")
              elseif frame==30 and name~="NONE" and not pressed then
                  local b=buttons[name]
                  if b then
                      local ok,v=pcall(function() pad.setOverride(b); return pad.getButton(b) end)
                      pressed=ok and v==true
                      log("CONTROL_PROBE_INPUT action="..name.." phase=press readback="..tostring(v).." status="..(pressed and "PASS" or "FAIL"))
                  else log("CONTROL_PROBE_INPUT action="..name.." status=BUTTON_NOT_FOUND") end
              elseif frame==38 and pressed and not released then
                  local b=buttons[name]; local ok,v=pcall(function() pad.clearOverride(b); return pad.getButton(b) end)
                  released=ok and v==false
                  log("CONTROL_PROBE_INPUT action="..name.." phase=release readback="..tostring(v).." status="..(released and "PASS" or "FAIL"))
              elseif frame==90 then shot(name.."-post")
              elseif frame==120 then
                  log("CONTROL_PROBE_BRANCH_DONE action="..name.." load_event="..tostring(loaded).." load_returned="..tostring(load_returned).." input_pressed="..tostring(pressed).." input_released="..tostring(released))
                  PCSX.pauseEmulator(); PCSX.nextTick(function() PCSX.quit(0) end); return
              end
          end)
          log("CONTROL_PROBE_SCRIPT_READY action="..name)
          LUA
          cp "$WORK/control-probe.lua" "$WORK/captures/control-probe.lua"

          failed=0
          for name in NONE START CIRCLE CROSS TRIANGLE SQUARE UP DOWN LEFT RIGHT; do
            cp "$WORK/source-card/naruto-storymode.mcd" "$WORK/cards/card-$name.mcd"
            echo "CONTROL_PROBE_BRANCH_BEGIN=$name"
            set +e
            PROBE_BUTTON="$name" timeout --signal=TERM --kill-after=5s 180s stdbuf -oL -eL "$WORK/pinned/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/card-$name.mcd" \
              -exec "$PAD_SETUP" -dofile "$WORK/control-probe.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$WORK/captures/pcsx-$name.log" -run > "$WORK/captures/pcsx-$name.stdout" 2>&1
            rc=$?
            set -e
            echo "CONTROL_PROBE_BRANCH_EXIT action=$name code=$rc"
            if [ "$rc" -ne 0 ] || [ ! -s "$WORK/captures/$name-pre.json" ] || [ ! -s "$WORK/captures/$name-post.json" ]; then failed=$((failed+1)); fi
            grep -E 'CONTROL_PROBE_(LOAD_EVENT|LOAD_CALL_RETURNED|INPUT|SCREENSHOT|BRANCH_DONE|RESTORE_GATE)' "$WORK/captures/pcsx-$name.stdout" || true
          done

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path("captures")
          images={}
          for mp in sorted(root.glob("*.json")):
              m=json.loads(mp.read_text()); b=Path(m["raw"]).read_bytes()
              if len(b)!=int(m["expected_bytes"]): raise SystemExit("screenshot byte count mismatch: "+mp.name)
              w,h,bpp=int(m["width"]),int(m["height"]),int(m["bpp"])
              if bpp==16:
                  rgb=bytearray()
                  for p in range(0,len(b),2):
                      v=b[p] | (b[p+1]<<8); rgb.extend(((v&31)*255//31,((v>>5)&31)*255//31,((v>>10)&31)*255//31))
                  im=Image.frombytes("RGB",(w,h),bytes(rgb))
              elif bpp==24: im=Image.frombytes("RGB",(w,h),b)
              else: raise SystemExit("unsupported bpp")
              im.save(root/(m["label"]+".png"),optimize=True); images[m["label"]]=im
          base=images.get("NONE-post")
          if base is None: raise SystemExit("no-input baseline screenshot missing")
          report=[
              "CONTROL_PROBE_CHECKPOINT_RUN_ID=39426068247",
              "CONTROL_PROBE_CHECKPOINT_BYTES=21162405",
              "CONTROL_PROBE_CHECKPOINT_SHA256=b23668dd295dc2db7e8e21cd66e663f8055418e794b393434562b9119d41ad8a",
              "CONTROL_PROBE_BRANCHES=NONE,START,CIRCLE,CROSS,TRIANGLE,SQUARE,UP,DOWN,LEFT,RIGHT",
              "CONTROL_PROBE_PLAN=pre screenshot at 20 VSync; one tap at 30-38; post screenshot at 90",
              "CONTROL_PROBE_PARENT_CHECKPOINT_CHANGED=NO",
              "",
              "post screenshot comparison against NONE-post at the same frame count:"
          ]
          for n in ["NONE","START","CIRCLE","CROSS","TRIANGLE","SQUARE","UP","DOWN","LEFT","RIGHT"]:
              im=images.get(n+"-post")
              if im is None: report.append(n+": missing post screenshot"); continue
              if im.size!=base.size: report.append(n+": dimension mismatch"); continue
              d=ImageChops.difference(base,im)
              mean=sum(ImageStat.Stat(d).mean)/3
              exact=sum(1 for a,b in zip(base.getdata(),im.getdata()) if a==b)/(im.width*im.height)
              report.append(f"{n}: mean_abs_rgb_diff={mean:.5f}; exact_pixel_fraction={exact:.6f}; screenshot_sha256={hashlib.sha256((root/(n+'-post.png')).read_bytes()).hexdigest()}")
          (root/"control-probe-report.txt").write_text("\n".join(report)+"\n")
          print("\n".join(report))
          PY
          cat "$WORK/captures/control-probe-report.txt"
          if [ "$failed" -ne 0 ]; then echo "::error::$failed control branches failed; inspect uploaded partial evidence"; exit 44; fi

      - name: Upload private screenshots, logs and reusable patched emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          path: |
            /tmp/naruto-storymode-control-probe/captures/*.png
            /tmp/naruto-storymode-control-probe/captures/*.txt
            /tmp/naruto-storymode-control-probe/captures/*.stdout
            /tmp/naruto-storymode-control-probe/captures/*.log
            /tmp/naruto-storymode-control-probe/captures/*.json
            /tmp/naruto-storymode-control-probe/PCSX-Redux-spu-adpcm-patched.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Remove private runtime assets and all savestate/card copies
        if: always()
        shell: bash
        run: rm -rf "$WORK"
