name: Prepare PCSX-Redux research emulator

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-pcsx-redux.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Download, verify, smoke-check, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG_NAME: research-emulator-pcsx-redux-2026-10-15
      APPIMAGE_NAME: PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
      APPIMAGE_SHA256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
      APPIMAGE_URL: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/0c3572c3d%402026-10-01_1790876682/PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Download and verify pinned AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 --retry-delay 2 \
            "$APPIMAGE_URL" \
            --output "dist/$APPIMAGE_NAME"
          echo "$APPIMAGE_SHA256  dist/$APPIMAGE_NAME" | sha256sum --check -
          chmod +x "dist/$APPIMAGE_NAME"
          file "dist/$APPIMAGE_NAME"
          test "$(stat -c %s "dist/$APPIMAGE_NAME")" -eq 65747557

      - name: Extract AppImage and smoke-check package structure
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          "./$APPIMAGE_NAME" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -d squashfs-root/usr
          test -f squashfs-root/AppRun
          echo "AppImage extraction and required launcher checks passed."

      - name: Write checksums and provenance
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "$APPIMAGE_NAME" > SHA256SUMS
          cat > EMULATOR-ASSET-INFO.txt <<'INFO'
          PCSX-Redux Linux x86_64 AppImage for Naruto Shinobi Jintori research

          This is an unofficial packaged AppImage; it is not an official release made by the PCSX-Redux upstream project.
          Packaged release source: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/tag/0c3572c3d%402026-10-01_1790876682
          Packaged source commit: 0c3572c3d (PCSX-Redux)
          Upstream project and GPL-2.0 license: https://github.com/grumpycoders/pcsx-redux
          Build/packaging source (MIT): https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced
          Pinned upstream package asset SHA-256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
          Purpose: PS1 emulation and reverse-engineering support. The app may require a graphical display/OpenGL driver.
          No BIOS, ROM, ISO, memory card, save state, or game asset is bundled with this emulator.
          INFO
          cat > RELEASE-NOTES.md <<'NOTES'
          ## Research Tool: PCSX-Redux Linux x86_64

          Stored here as a separate prerelease asset to keep the main Git history small.
          - Package: unofficial x86_64 AppImage from Package Forge's enhanced packaging repository.
          - PCSX-Redux source commit: 0c3572c3d.
          - The downloaded binary is SHA-256 verified against the digest published by the source release before republishing.
          - AppImage extraction and package-launcher structure checks are run in GitHub Actions.
          - Upstream source/license: https://github.com/grumpycoders/pcsx-redux (GPL-2.0).
          - Packaging source/license: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced (MIT).
          - No game data or BIOS is included.

          This workflow verifies the package and extracts its AppImage filesystem. It does not claim a gameplay test or GUI boot of the Naruto game.
          NOTES

      - name: Upload verified package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-redux-linux-x86_64-2026-10-15
          path: |
            dist/\${{ env.APPIMAGE_NAME }}
            dist/SHA256SUMS
            dist/EMULATOR-ASSET-INFO.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create prerelease and attach emulator asset
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Research Tool: PCSX-Redux Linux x86_64" \
              --notes-file dist/RELEASE-NOTES.md \
              --prerelease
          fi
          gh release upload "$TAG_NAME" \
            "dist/$APPIMAGE_NAME" \
            dist/SHA256SUMS \
            dist/EMULATOR-ASSET-INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
