name: AA1 checkpoint load diagnostic (GDB, no input)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aa1-restore-gdb-diagnostic.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-aa1-restore-gdb-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install bounded GDB and X11 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bchunk xorriso xvfb x11-utils curl jq unzip python3 gdb
          WORK="$RUNNER_TEMP/naruto-aa1-gdb"
          mkdir -p "$WORK"/{source,inputs,resume,cards,logs}
          chmod 700 "$WORK"
          echo "AA_WORK=$WORK" >> "$GITHUB_ENV"

      - name: Fetch and validate pinned emulator, game, BIOS and target checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$AA_WORK/source"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          fetch_asset() {
            local asset_id="$1" out="$2" bytes="$3" sha="$4" limit="$5"
            curl --fail --location --silent --show-error --retry 2 --retry-delay 2 \
              --max-time "$limit" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/octet-stream" \
              "$API/releases/assets/$asset_id" --output "$out"
            test "$(stat -c '%s' "$out")" = "$bytes"
            echo "$sha  $out" | sha256sum --check -
          }
          fetch_asset 669480936 pcsx-redux.AppImage 65747557 c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c 180
          fetch_asset 647346873 game.bin 325989552 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88 600
          fetch_asset 647354760 game.cue 116 be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8 60
          fetch_asset 652373928 scph7502.zip 283463 b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a 60
          fetch_asset 686794219 target-checkpoint.raw.sstate 21163286 00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d 180
          cp target-checkpoint.raw.sstate "$AA_WORK/resume/target.sstate"
          chmod 400 "$AA_WORK/resume/target.sstate"
          python3 - "$AA_WORK/source/scph7502.zip" "$AA_WORK/source/scph7502.bin" <<'PY'
          from pathlib import Path
          import stat,sys,zipfile,hashlib
          src,dst=map(Path,sys.argv[1:])
          with zipfile.ZipFile(src) as z:
              xs=[]; total=0
              for x in z.infolist():
                  mode=(x.external_attr>>16)&0xffff; p=Path(x.filename); total+=x.file_size
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("unsafe BIOS archive entry")
                  if x.file_size>2*1024*1024 or total>4*1024*1024:
                      raise SystemExit("BIOS expansion bound exceeded")
                  if not x.is_dir() and x.file_size==524288: xs.append(x)
              if len(xs)!=1: raise SystemExit(f"expected one 512KiB BIOS, found {len(xs)}")
              b=z.read(xs[0]); h=hashlib.sha256(b).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1":
                  raise SystemExit("BIOS SHA-256 mismatch")
              dst.write_bytes(b); print("BIOS_VALID=PASS sha256="+h)
          PY
          python3 - <<'PY'
          from pathlib import Path
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ids=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ids)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines):
              raise SystemExit("invalid CUE structure")
          lines[ids[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          APPDIR="$PWD/squashfs-root"
          {
            echo "APPDIR=$APPDIR"
            file "$APPDIR/AppRun" || true
            echo "TREE_BEGIN"
            find "$APPDIR" -maxdepth 3 -printf '%y %m %p -> %l\n' | sed -n '1,200p'
            echo "TREE_END"
            echo "FOLLOWED_EXECUTABLES_BEGIN"
            find -L "$APPDIR" -maxdepth 8 -type f -perm /111 -print | sed -n '1,200p'
            echo "FOLLOWED_EXECUTABLES_END"
            echo "APP_RUN_STRINGS_BEGIN"
            strings "$APPDIR/AppRun" | grep -Ei 'pcsx|redux|exec|sharun|APPDIR|APPIMAGE|default|\.env' | head -n 80 || true
            echo "APP_RUN_STRINGS_END"
          } > "$AA_WORK/logs/appimage-layout.txt"
          cat "$AA_WORK/logs/appimage-layout.txt"
          find -L "$APPDIR" -maxdepth 8 -type f -perm /111 -print > "$AA_WORK/logs/executable-paths.txt"
          PCSX_BIN="$(grep -Ei '(^|/)[^/]*(pcsx|redux)[^/]*$' "$AA_WORK/logs/executable-paths.txt" | sed -n '1p' || true)"
          if [ -z "$PCSX_BIN" ] || [ ! -x "$PCSX_BIN" ]; then
            echo "PCSX_BINARY_DISCOVERY_FAIL=1"
            echo "EXECUTABLE_PATHS_BEGIN"
            cat "$AA_WORK/logs/executable-paths.txt"
            echo "EXECUTABLE_PATHS_END"
            echo "APP_RUN_STRINGS_BEGIN"
            strings "$APPDIR/AppRun" | grep -Ei 'pcsx|redux|exec|sharun|APPDIR|APPIMAGE|default|\.env|bwrap|gio-launch' | sed -n '1,120p' || true
            echo "APP_RUN_STRINGS_END"
            exit 1
          fi
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"
          echo "PCSX_BIN=$PCSX_BIN" >> "$GITHUB_ENV"
          echo "PCSX_BINARY=$PCSX_BIN"
          echo "PCSX_PIN=0c3572c3db75f97542001e453ae80ba8c3f8acba"
          echo "APPIMAGE_SHA256=c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c"
          echo "TARGET_STATE_SHA256=00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d"
          echo "BIOS=SCPH-7502"

      - name: Download the control state and original Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: "39867730674"
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/naruto-aa1-gdb/inputs

      - name: Download Memory Card from original checkpoint run
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: "39262213468"
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/naruto-aa1-gdb/cards

      - name: Verify control state and Memory Card
        shell: bash
        run: |
          set -euo pipefail
          find "$AA_WORK/inputs" -type f -name 'adaptive-cycle-01-f180.sstate' -print -quit | grep -q .
          cp "$(find "$AA_WORK/inputs" -type f -name 'adaptive-cycle-01-f180.sstate' -print -quit)" "$AA_WORK/resume/control.sstate"
          test "$(stat -c '%s' "$AA_WORK/resume/control.sstate")" = 21162546
          echo "9eef83b1590773159b95180447aaa1f35139468b3ea51c7beec00bfb89f41492  $AA_WORK/resume/control.sstate" | sha256sum --check -
          cp "$(find "$AA_WORK/cards" -type f -name 'naruto-storymode.mcd' -print -quit)" "$AA_WORK/cards/reference.mcd"
          test "$(stat -c '%s' "$AA_WORK/cards/reference.mcd")" = 131072
          echo "ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5  $AA_WORK/cards/reference.mcd" | sha256sum --check -
          chmod 400 "$AA_WORK/resume/control.sstate" "$AA_WORK/cards/reference.mcd"

      - name: Prepare read-only restore probe and X11
        shell: bash
        run: |
          set -euo pipefail
          cat > "$AA_WORK/pad-setup.lua" <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("AA1_PAD_CONNECTED_NO_BUTTONS_PRESSED")
          LUA
          cat > "$AA_WORK/restore.lua" <<'LUA'
          if io.stdout then io.stdout:setvbuf("no") end
          local vsync, started, loaded, after = 0, false, false, 0
          local function log(s) print(s); pcall(function() io.stdout:flush() end) end
          _G.aaLoaded = PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded", function()
            loaded = true; after = 0; log("AA1_EVENT_SAVE_STATE_LOADED=1")
          end)
          _G.aaVsync = PCSX.Events.createEventListener("GPU::Vsync", function()
            vsync = vsync + 1
            if not started then
              started = true
              local path = os.getenv("AA_TEST_STATE") or "resume/target.sstate"
              log("AA1_LOAD_BEGIN=1 path="..path.." vsync="..vsync.." controller=NONE")
              PCSX.pauseEmulator()
              PCSX.nextTick(function()
                local open_ok, file = pcall(function() return assert(Support.File.open(path), "state open failed") end)
                if not open_ok or not file then log("AA1_OPEN_FAIL="..tostring(file)); PCSX.quit(50); return end
                local load_ok, err = pcall(function() PCSX.loadSaveState(file) end)
                file:close()
                if not load_ok then log("AA1_LOAD_LUA_ERROR="..tostring(err)); PCSX.quit(51); return end
                log("AA1_LOAD_CALL_RETURNED=1")
                PCSX.resumeEmulator()
              end)
              return
            end
            if loaded then
              after = after + 1
              if after >= 180 then
                log("AA1_POST_LOAD_VSYNC=180")
                PCSX.pauseEmulator()
                PCSX.nextTick(function() PCSX.quit(0) end)
              end
            elseif vsync >= 900 then
              log("AA1_LOAD_EVENT_TIMEOUT=1"); PCSX.pauseEmulator()
              PCSX.nextTick(function() PCSX.quit(53) end)
            end
          end)
          log("AA1_RESTORE_PROBE_READY_NO_INPUT=1")
          LUA
          mkdir -p "$AA_WORK/home/.config" "$AA_WORK/home/.local/share" "$AA_WORK/home/runtime"
          chmod 700 "$AA_WORK/home/runtime"
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$AA_WORK/logs/xvfb.log" 2>&1 &
          echo $! > "$AA_WORK/xvfb.pid"
          export DISPLAY=:99
          for n in $(seq 1 80); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null

      - name: Static savestate protobuf audit (no emulator load)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AA_WORK/logs"
          python3 - "$AA_WORK/source/target-checkpoint.raw.sstate" "$AA_WORK/resume/control.sstate" "$AA_WORK/logs/AC2_savestate_protobuf_static.txt" <<'PY'
          import gzip, hashlib, sys, zlib
          from pathlib import Path
          from collections import defaultdict
          target_path, control_path, out_path = map(Path, sys.argv[1:])
          ADDR, RAM_BASE = 0x801CEF04, 0x80000000
          def vi(buf,p):
              val=0; shift=0; start=p
              while p<len(buf) and shift<70:
                  b=buf[p]; p+=1; val|=(b&127)<<shift
                  if not b&128: return val,p,p-start
                  shift+=7
              raise ValueError("invalid/truncated varint at %d"%start)
          def parse(buf):
              out=[]; p=0
              while p<len(buf):
                  s=p; tag,p,_=vi(buf,p); num,wire=tag>>3,tag&7
                  if num==0: raise ValueError("field number zero")
                  if wire==0:
                      ps=p; _,p,_=vi(buf,p); plen=p-ps
                  elif wire==1:
                      ps=p; plen=8; p+=8
                  elif wire==2:
                      n,p,_=vi(buf,p); ps=p; plen=n
                      if n>len(buf)-p: raise ValueError("length overrun field %d"%num)
                      p+=n
                  elif wire==5:
                      ps=p; plen=4; p+=4
                  else: raise ValueError("unsupported wire type %d"%wire)
                  if p>len(buf): raise ValueError("truncated field")
                  out.append(dict(num=num,wire=wire,plen=plen,start=s,end=p,ps=ps,pe=p,enc=buf[s:p]))
              return out
          def load(path):
              raw=path.read_bytes()
              if raw.startswith(b"\x1f\x8b"): dec=gzip.decompress(raw); how="gzip magic 1f 8b; gzip.decompress"
              elif len(raw)>2 and raw[0]==0x78 and ((raw[0]<<8)|raw[1])%31==0:
                  try: dec=zlib.decompress(raw); how="zlib header/checksum; zlib.decompress"
                  except zlib.error: dec=raw; how="zlib probe failed; parse raw"
              else: dec=raw; how="no gzip/zlib magic; parse raw protobuf"
              return dict(raw=raw,dec=dec,how=how,prefix=raw[:16].hex(" "),f=parse(dec))
          a,b=load(target_path),load(control_path); lines=[]
          say=lines.append
          say("AC2 STATIC SAVESTATE PROTOBUF AUDIT — NO EMULATOR LOAD")
          for name,x in (("TARGET",a),("CONTROL",b)):
              say(f"{name}: raw_bytes={len(x['raw'])}; raw_sha256={hashlib.sha256(x['raw']).hexdigest()}")
              say(f"{name}: raw_first16_hex={x['prefix']}; detect/decompress={x['how']}")
              say(f"{name}: parsed_bytes={len(x['dec'])}; parsed_sha256={hashlib.sha256(x['dec']).hexdigest()}; top_field_encoded_sum={sum(r['end']-r['start'] for r in x['f'])}")
          say(f"RAW_SIZE_DELTA_TARGET_MINUS_CONTROL={len(a['raw'])-len(b['raw'])}")
          say(f"PARSED_SIZE_DELTA_TARGET_MINUS_CONTROL={len(a['dec'])-len(b['dec'])}")
          def idx(rows):
              d=defaultdict(list)
              for r in rows:d[r['num']].append(r)
              return d
          ia,ib=idx(a['f']),idx(b['f']); dif=[]
          say("\nTOP LEVEL (SHA is the entire encoded field including tag/length/payload)")
          say("key | T wire | T payload_len | T encoded_len | T sha256 | C wire | C payload_len | C encoded_len | C sha256 | encoded_delta_T-C")
          for n in sorted(set(ia)|set(ib)):
              for j in range(max(len(ia[n]),len(ib[n]))):
                  x=ia[n][j] if j<len(ia[n]) else None; y=ib[n][j] if j<len(ib[n]) else None
                  ex=x['end']-x['start'] if x else 0; ey=y['end']-y['start'] if y else 0
                  hx=hashlib.sha256(x['enc']).hexdigest() if x else "-"; hy=hashlib.sha256(y['enc']).hexdigest() if y else "-"
                  say(f"{n}#{j+1} | {x['wire'] if x else '-'} | {x['plen'] if x else '-'} | {ex if x else '-'} | {hx} | {y['wire'] if y else '-'} | {y['plen'] if y else '-'} | {ey if y else '-'} | {hy} | {ex-ey}")
                  if not x or not y or x['enc']!=y['enc']: dif.append((n,j,x,y))
          total_t=sum(r['end']-r['start'] for r in a['f']); total_c=sum(r['end']-r['start'] for r in b['f'])
          say(f"TOP_FIELD_ENCODED_SUM_DELTA={total_t-total_c}")
          say(f"PARSED_BYTES_MINUS_TOP_FIELD_SUM_DELTA={(len(a['dec'])-len(b['dec']))-(total_t-total_c)}")
          say("DIFFERING_TOP_FIELDS="+(",".join(f"{n}#{j+1}" for n,j,_,_ in dif) or "none"))
          say("\nONE LEVEL DOWN FOR DIFFERING WIRE-2 FIELDS")
          for n,j,x,y in dif:
              if not x or not y or x['wire']!=2 or y['wire']!=2: continue
              px=a['dec'][x['ps']:x['ps']+x['plen']]; py=b['dec'][y['ps']:y['ps']+y['plen']]
              try: fx,fy=parse(px),parse(py)
              except Exception as e: say(f"parent {n}#{j+1}: nested parse TIDAK TAHU ({type(e).__name__}: {e})"); continue
              say(f"parent {n}#{j+1}: nested_bytes T={len(px)} C={len(py)} delta={len(px)-len(py)}")
              ix,iy=idx(fx),idx(fy)
              for cn in sorted(set(ix)|set(iy)):
                  for k in range(max(len(ix[cn]),len(iy[cn]))):
                      u=ix[cn][k] if k<len(ix[cn]) else None; v=iy[cn][k] if k<len(iy[cn]) else None
                      eu=u['end']-u['start'] if u else 0; ev=v['end']-v['start'] if v else 0
                      hu=hashlib.sha256(u['enc']).hexdigest() if u else "-"; hv=hashlib.sha256(v['enc']).hexdigest() if v else "-"
                      say(f" child {cn}#{k+1}: wire={u['wire'] if u else '-'}/{v['wire'] if v else '-'} payload_len={u['plen'] if u else '-'}/{v['plen'] if v else '-'} encoded_len={eu if u else '-'}/{ev if v else '-'} sha256={hu}/{hv} delta={eu-ev}")
          def ramword(x):
              try:
                  m=next(r for r in x['f'] if r['num']==3 and r['wire']==2)
                  mb=x['dec'][m['ps']:m['ps']+m['plen']]; mf=parse(mb)
                  r=next(r for r in mf if r['num']==1 and r['wire']==2)
                  ram=mb[r['ps']:r['ps']+r['plen']]; off=ADDR-RAM_BASE
                  if off<0 or off+4>len(ram): return f"UNAVAILABLE RAM_BYTES={len(ram)} offset=0x{off:X}"
                  word=ram[off:off+4]; val=int.from_bytes(word,"little")
                  return f"offset=0x{off:X} bytes={word.hex(' ')} LE_word=0x{val:08X} equals_0x16C={val==0x16C} RAM_bytes={len(ram)}"
              except Exception as e:return f"TIDAK TAHU ({type(e).__name__}: {e})"
          say(f"\nRAM WORD [0x{ADDR:08X}] TARGET: {ramword(a)}")
          say(f"RAM WORD [0x{ADDR:08X}] CONTROL: {ramword(b)}")
          say("Field interpretation: PCSX-Redux save-state v4 aggregate uses top-level field 3 for Memory; nested field 1 for RAM. Parser does not load either state into the emulator.")
          out_path.write_text("\n".join(lines)+"\n",encoding="utf-8")
          print(out_path.read_text(encoding="utf-8"))
          PY

      - name: Anonymous Release metadata and zero-byte range checks (no token)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AA_WORK/logs"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          META="$AA_WORK/logs/anonymous-release-response.json"
          OUT="$AA_WORK/logs/anonymous-release-assets.txt"
          {
            echo "ANONYMOUS_RELEASE_AUDIT_BEGIN token=UNSET"
            list_code="$(env -u GH_TOKEN curl -sSL -H 'Accept: application/vnd.github+json' -H 'User-Agent: Naruto-Research-Audit' -o "$META" -w '%{http_code}' "$API/releases?per_page=100" || true)"
            if [ "$list_code" = "200" ] && jq -e 'type=="array"' "$META" >/dev/null 2>&1; then
              echo "ANONYMOUS_RELEASE_LIST_HTTP=$list_code source=REST_list_releases"
              jq -r '.[] as $r | if ($r.assets|length)==0 then [$r.tag_name,($r.draft|tostring),($r.prerelease|tostring),"(no assets)"]|@tsv else $r.assets[] | [$r.tag_name,($r.draft|tostring),($r.prerelease|tostring),.name,(.size|tostring)]|@tsv end' "$META"
            else
              msg="$(jq -r 'if type=="object" then (.message // "(no message)") else "(unexpected response type)" end' "$META" 2>/dev/null || printf '(unreadable response)')"
              echo "ANONYMOUS_RELEASE_LIST_HTTP=$list_code message=$msg"
              echo "ANONYMOUS_RELEASE_LIST_FALLBACK=per-tag REST lookups, still without token"
              # Two known published tags are queried individually if the list endpoint is rate-limited.
              for tag in naruto-checkpoint-39262213468 research-emulator-pcsx-redux-2026-10-15; do
                tag_code="$(env -u GH_TOKEN curl -sSL -H 'Accept: application/vnd.github+json' -H 'User-Agent: Naruto-Research-Audit' -o "$META" -w '%{http_code}' "$API/releases/tags/$tag" || true)"
                if [ "$tag_code" = "200" ] && jq -e 'type=="object" and has("assets")' "$META" >/dev/null 2>&1; then
                  echo "ANONYMOUS_RELEASE_TAG_HTTP=$tag_code"
                  jq -r '. as $r | if ($r.assets|length)==0 then [$r.tag_name,($r.draft|tostring),($r.prerelease|tostring),"(no assets)"]|@tsv else $r.assets[] | [$r.tag_name,($r.draft|tostring),($r.prerelease|tostring),.name,(.size|tostring)]|@tsv end' "$META"
                else
                  tag_msg="$(jq -r 'if type=="object" then (.message // "(no message)") else "(unexpected response type)" end' "$META" 2>/dev/null || printf '(unreadable response)')"
                  echo "ANONYMOUS_RELEASE_TAG tag=$tag http=$tag_code message=$tag_msg"
                fi
              done
            fi
            echo "ANONYMOUS_RELEASE_LIST_END"
            for id in 647346873 652373928 686794219; do
              # Exact requested curl form; no -L, no Authorization, no response body retained.
              raw="$(env -u GH_TOKEN curl -s -o /dev/null -w '%{http_code} %{redirect_url}' \
                -H 'Range: bytes=0-0' -H 'Accept: application/octet-stream' \
                "$API/releases/assets/$id" || true)"
              code="$(printf '%s' "$raw" | cut -d ' ' -f1)"
              redirect="$(printf '%s' "$raw" | cut -s -d ' ' -f2-)"
              redirect="$(printf '%s' "$redirect" | cut -d '?' -f1)"
              [ -n "$redirect" ] || redirect="(no redirect URL)"
              printf 'ANON_ASSET_HTTP asset_id=%s code=%s redirect=%s\n' "$id" "$code" "$redirect"
            done
          } > "$OUT"
          cat "$OUT"

      - name: Probe target and control checkpoint under external GDB (two attempts each, no input)
        shell: bash
        run: |
          set -euo pipefail
          cd "$AA_WORK"
          export DISPLAY=:99 HOME="$AA_WORK/home" XDG_CONFIG_HOME="$AA_WORK/home/.config" XDG_DATA_HOME="$AA_WORK/home/.local/share" XDG_RUNTIME_DIR="$AA_WORK/home/runtime"
          export LIBGL_ALWAYS_SOFTWARE=1
          export LD_LIBRARY_PATH="$APPDIR/usr/lib:$APPDIR/usr/lib/x86_64-linux-gnu"
          export QT_PLUGIN_PATH="$APPDIR/usr/plugins"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$APPDIR/usr/plugins/platforms"
          export QML2_IMPORT_PATH="$APPDIR/usr/qml"
          {
            echo "AA1_ENV_METADATA_BEGIN"
            gdb --version | sed -n '1,2p'
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
            uname -a
            echo "timeout_per_attempt=110s external_timeout_signal=INT kill_after=10s"
            echo "emulator_flags=-noupdate -no-debugger -no-gdb -softgpu -dynarec -stdout -lua_stdout -logfile <CASE>.pcsx.log -run"
            echo "target/control attempts=2 each; buttons=NONE; PCSX AppImage SHA256=c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c; PCSX pin=0c3572c3db75f97542001e453ae80ba8c3f8acba"
            echo "AA1_ENV_METADATA_END"
          } > "$AA_WORK/logs/runtime-metadata.txt"
          for label in target control; do
            if [ "$label" = "target" ]; then state="resume/target.sstate"; else state="resume/control.sstate"; fi
            for attempt in 1 2; do
              echo "AA1_GDB_CASE=$label attempt=$attempt state_path=$state"
              cat > "$AA_WORK/gdb.commands" <<'GDB'
          set pagination off
          set confirm off
          set print thread-events off
          handle SIGSEGV stop print nopass
          handle SIGABRT stop print nopass
          handle SIGBUS stop print nopass
          run
          echo \n=== AA1_THREADS_BEGIN ===\n
          info threads
          echo \n=== AA1_THREAD_BACKTRACES_BEGIN ===\n
          thread apply all bt 12
          echo \n=== AA1_PC_INSTRUCTIONS_BEGIN ===\n
          x/3i $pc
          echo \n=== AA1_REQUIRED_REGISTERS_BEGIN ===\n
          info registers rip rsi rdi rcx
          echo \n=== AA1_PROCESS_MAPPINGS_BEGIN ===\n
          info proc mappings
          echo \n=== AA1_FULL_BACKTRACE_BEGIN ===\n
          bt full
          echo \n=== AA1_DIAGNOSTICS_END ===\n
          GDB
              set +e
              AA_TEST_STATE="$state" timeout --signal=INT --kill-after=10s 110s \
                gdb --quiet --nx --batch -x "$AA_WORK/gdb.commands" \
                --args "$PCSX_BIN" \
                  -noupdate -no-debugger -no-gdb \
                  -bios "$AA_WORK/source/scph7502.bin" -iso "$AA_WORK/source/game-run.cue" \
                  -memcard1 "$AA_WORK/cards/reference.mcd" -exec "$(cat "$AA_WORK/pad-setup.lua")" \
                  -dofile "$AA_WORK/restore.lua" -softgpu -dynarec -stdout -lua_stdout \
                  -logfile "$AA_WORK/logs/$label.attempt$attempt.pcsx.log" -run \
                  > "$AA_WORK/logs/$label.attempt$attempt.gdb.log" 2>&1
              rc=$?
              set -e
              echo "AA1_GDB_EXIT_CODE=$rc" >> "$AA_WORK/logs/$label.attempt$attempt.gdb.log"
              echo "AA1_CASE_DONE=$label attempt=$attempt wrapper_exit=$rc"
            done
          done
          sanitize() {
            sed -E \
              -e 's#/home/runner[^[:space:]]*#<RUNNER_PATH>#g' \
              -e 's#/__w[^[:space:]]*#<RUNNER_PATH>#g' \
              -e 's#/tmp/naruto[^[:space:]]*#<PRIVATE_TMP>#g' \
              -e 's#(Authorization: Bearer)[[:space:]]+[^[:space:]]+#\1 <REDACTED>#Ig' \
              -e 's#(github_pat_|gh[pousr]_|AKIA)[A-Za-z0-9_:/+-]+#\1<REDACTED>#g' \
              -e 's#(https?://[^?[:space:]]+)\?[^[:space:]]+#\1?<REDACTED>#g'
          }
          make_excerpt() {
            input="$1"; output="$2"
            if [ ! -f "$input" ]; then printf 'LOG_NOT_CREATED\n' > "$output"; return; fi
            count="$(wc -l < "$input")"
            if [ "$count" -le 290 ]; then
              cat "$input" | sanitize > "$output"
            else
              { sed -n '1,40p' "$input"; echo "[... omitted middle; source lines=$count ...]"; sed -n "$((count-249)),\$p" "$input"; } | sanitize > "$output"
            fi
          }
          outdir="$GITHUB_WORKSPACE/reports/aa_2026-10-29/aa1_runtime_logs"
          mkdir -p "$outdir"
          for label in target control; do
            for attempt in 1 2; do
              make_excerpt "$AA_WORK/logs/$label.attempt$attempt.gdb.log" "$outdir/$label-attempt$attempt.gdb.txt"
              make_excerpt "$AA_WORK/logs/$label.attempt$attempt.pcsx.log" "$outdir/$label-attempt$attempt.pcsx.txt"
            done
          done
          cp "$AA_WORK/logs/runtime-metadata.txt" "$GITHUB_WORKSPACE/reports/aa_2026-10-29/AA1_runtime_metadata.txt"
          cp "$AA_WORK/logs/anonymous-release-assets.txt" "$GITHUB_WORKSPACE/reports/aa_2026-10-29/anonymous-release-assets.txt"
          cp "$AA_WORK/logs/AC2_savestate_protobuf_static.txt" "$GITHUB_WORKSPACE/reports/aa_2026-10-29/AC2_savestate_protobuf_static.txt"
          {
            echo "AA1_RUNTIME_SUMMARY — run=$GITHUB_RUN_ID"
            for label in target control; do
              for attempt in 1 2; do
                gl="$AA_WORK/logs/$label.attempt$attempt.gdb.log"
                pl="$AA_WORK/logs/$label.attempt$attempt.pcsx.log"
                echo
                echo "CASE=$label attempt=$attempt"
                echo "wrapper_exit=$(grep -E '^AA1_GDB_EXIT_CODE=' "$gl" | tail -n 1 | cut -d= -f2- || echo NOT_RECORDED)"
                echo "signal_or_inferior_exit=$(grep -E 'Program received signal|Thread .* received signal|Inferior .*exited' "$gl" | tail -n 1 || echo NOT_RECORDED)"
                echo "frame_0=$(grep -m 1 -E '^#0[[:space:]]' "$gl" || echo NOT_RECORDED)"
                echo "thread=$(grep -m 1 -E '^[[:space:]]*\*[[:space:]]*[0-9]+[[:space:]]|^[[:space:]]*[0-9]+[[:space:]]+Thread ' "$gl" || echo NOT_RECORDED)"
                echo "last_load_log_line=$(grep -hE 'AA1_(LOAD_BEGIN|EVENT_SAVE_STATE_LOADED|LOAD_CALL_RETURNED|POST_LOAD_VSYNC|LOAD_EVENT_TIMEOUT|OPEN_FAIL|LOAD_LUA_ERROR)' "$gl" "$pl" 2>/dev/null | tail -n 1 || echo NO_LOAD_MARKER)"
              done
            done
          } > "$GITHUB_WORKSPACE/reports/aa_2026-10-29/AA1_runtime_summary.txt"
          cat "$GITHUB_WORKSPACE/reports/aa_2026-10-29/AA1_runtime_summary.txt"

      - name: Commit sanitized evidence and one-file final report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/aa_2026-10-29/aa1_runtime_logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/aa_2026-10-29/aa1_runtime_logs \
                  reports/aa_2026-10-29/AA1_runtime_metadata.txt \
                  reports/aa_2026-10-29/AA1_runtime_summary.txt \
                  reports/aa_2026-10-29/AC2_savestate_protobuf_static.txt \
                  reports/aa_2026-10-29/anonymous-release-assets.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record sanitized AA1 AC2 AC4 evidence"
            git push origin HEAD:main
          fi
          EVIDENCE_COMMIT="$(git rev-parse HEAD)"
          JOB_ID="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$RESEARCH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" | jq -r '.jobs[] | select(.name=="diagnose") | .id' | head -n 1)"
          REPORT=reports/aa_2026-10-29/AC1_AC4_restore_report_2026-10-29.txt
          cat > "$REPORT" <<EOF
          K SCALE: K1 dugaan; K2 indikasi terbatas; K3 bukti pendukung konvergen; K4 bukti langsung yang dapat diperiksa ulang (statis maksimal K4); K5 runtime konsisten pada >=2 peluncuran terpisah.
          Repo: $RESEARCH_REPO
          Evidence commit (teks saja): $EVIDENCE_COMMIT
          Runtime run/job: $GITHUB_RUN_ID / $JOB_ID — https://github.com/$RESEARCH_REPO/actions/runs/$GITHUB_RUN_ID/job/$JOB_ID
          Workflow source: https://raw.githubusercontent.com/$RESEARCH_REPO/$GITHUB_SHA/.github/workflows/aa1-restore-gdb-diagnostic.yml
          PCSX-Redux save-state schema at pin 0c3572c3d: https://raw.githubusercontent.com/pcsx-redux/pcsx-redux/0c3572c3db75f97542001e453ae80ba8c3f8acba/src/core/sstate.h
          Source workflows for historical comparison:
            run 39262213468: https://raw.githubusercontent.com/$RESEARCH_REPO/e396eac00631001b7a0e68d7701c70aec10dec19/.github/workflows/naruto-scph7502-gpu-traffic-summary.yml
            run 40844474886: https://raw.githubusercontent.com/$RESEARCH_REPO/2ef56f8e6d3c3612e03357b34cfae1d65cfd23ab/.github/workflows/storymode-fixed-schedule-ram-compare.yml
            run 40848251356: https://raw.githubusercontent.com/$RESEARCH_REPO/64be99b0ea2d927216a7195dd95e85fbf8cd3612/.github/workflows/aa1-restore-gdb-diagnostic.yml
            control producer run 39867730674: https://raw.githubusercontent.com/$RESEARCH_REPO/c9b1438292041f972b712f248fb7052032635b59/.github/workflows/naruto-storymode-adaptive-player.yml
          Runtime summary: https://raw.githubusercontent.com/$RESEARCH_REPO/$EVIDENCE_COMMIT/reports/aa_2026-10-29/AA1_runtime_summary.txt
          Static protobuf/RAM: https://raw.githubusercontent.com/$RESEARCH_REPO/$EVIDENCE_COMMIT/reports/aa_2026-10-29/AC2_savestate_protobuf_static.txt
          Anonymous Release/HTTP results: https://raw.githubusercontent.com/$RESEARCH_REPO/$EVIDENCE_COMMIT/reports/aa_2026-10-29/anonymous-release-assets.txt
          GDB/runner metadata: https://raw.githubusercontent.com/$RESEARCH_REPO/$EVIDENCE_COMMIT/reports/aa_2026-10-29/AA1_runtime_metadata.txt
          Raw GDB/PCSX log permalinks:
          EOF
          for label in target control; do
            for attempt in 1 2; do
              echo "  $label attempt $attempt GDB: https://raw.githubusercontent.com/$RESEARCH_REPO/$EVIDENCE_COMMIT/reports/aa_2026-10-29/aa1_runtime_logs/$label-attempt$attempt.gdb.txt" >> "$REPORT"
              echo "  $label attempt $attempt PCSX: https://raw.githubusercontent.com/$RESEARCH_REPO/$EVIDENCE_COMMIT/reports/aa_2026-10-29/aa1_runtime_logs/$label-attempt$attempt.pcsx.txt" >> "$REPORT"
            done
          done
          cat >> "$REPORT" <<EOF
          AC1: dua Actions run terpisah dengan harness yang sama (baseline run 40852693434/job 123375850554 dan run ini $GITHUB_RUN_ID/job $JOB_ID), masing-masing dua peluncuran target + dua control, tanpa tombol. Pada baseline, target dua kali menerima SIGSEGV di Thread 15, PC #0=0x00007ffff0dd36d0; stack #0-#3 hanya alamat ?? dan #4=0; PC berada dalam executable mapping 0x7ffff088c000-0x7ffff1892000 tetapi jalur berkas disamarkan. Last load marker hanya AA1_LOAD_BEGIN at VSync 1. Jadi crash saat jalur pemulihan sangat terkait waktunya, tetapi fungsi penyebab tidak teridentifikasi: TIDAK TAHU. Control dua kali mencapai AA1_POST_LOAD_VSYNC=180 dan inferior keluar normal; GDB wrapper exit=1 karena perintah diagnostik pasca-exit melaporkan No registers, bukan crash emulator. Semua sinyal/stack/mapping/thread/regs ada di raw excerpt.
          AC2: kedua file protobuf mentah, bukan gzip/zlib: magic awal 0a 1b 0a 17 50 43 53 58 2d 52 65 64 75 78 20 53. Raw dan parsed target sama-sama 21,163,286 B; control 21,162,546 B; masing-masing parsed hash sama dengan raw. Delta +740 B cocok seluruhnya dengan field protobuf ter-encode. Field 6 (SPU) +748 B, field 4 (registers) +1 B, field 8 (CD-ROM) -9 B, total +740 B; SHA/wire/payload length tabel lengkap dan anak satu tingkat ada di static report. [0x801CEF04] berisi 0x0000016C pada keduanya. Schema reference: sstate.h pada pin PCSX-Redux 0c3572c3d.
          AC3(i): kontrol berasal dari run 39867730674/job 120134061270, head c9b1438292041f972b712f248fb7052032635b59; workflow menulis captures/adaptive-cycle-01-f180.sstate (ADAPTIVE_CHECKPOINT_WRITE_RETURNED=PASS) lalu mengunggah artifact 12464258211. Run sumber berakhir failure; provenance state terverifikasi, stabilitas sesi sumber tidak.
          AC3(ii): 39262213468/job 118092519254; workflow commit e396eac00631001b7a0e68d7701c70aec10dec19; ubuntu-26.04; timeout workflow 100m; frame gate/save 10055; PCSX AppImage downloaded from public Release asset 669480936, SHA c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c, source pin 0c3572c3d; flags -softgpu -dynarec via Xvfb (no --headless CLI flag); GDB 17.1-2ubuntu1 installed. 40844474886/job 123348484949; workflow commit 2ef56f8e6d3c3612e03357b34cfae1d65cfd23ab; ubuntu-24.04; workflow timeout 25m, per-emulator timeout 240s; cold boot only; frame gates 2649/5999/8999/9030/9105 and final save 10055; same AppImage SHA and -softgpu -dynarec via Xvfb; no GDB dependency/use in workflow; wrapper timed out (124). 40848251356/job 123360980473; workflow commit 64be99b0ea2d927216a7195dd95e85fbf8cd3612; ubuntu-24.04; timeout 18m; one target and control restore attempt, 180 post-load VSync target and timeout gate at 900 VSync; same AppImage SHA; -noupdate -no-debugger -no-gdb -softgpu -dynarec -stdout -lua_stdout; GDB 15.1-1ubuntu1~24.04.1. Current run uses ubuntu-24.04.5, 18m workflow timeout, 110s per emulator attempt (2 of each), 900-VSync pre-load marker timeout/180 post-load frame gate, same AppImage SHA/PCSX pin, same runtime flags, and GDB 15.1-1ubuntu1~24.04.1. No workflow invokes a literal --headless CLI flag; graphical session is Xvfb.
          AC3(iii): hipotesis target disimpan dengan build PCSX berbeda atau flag -softgpu/-dynarec berbeda DITOLAK sebagai penjelasan berbukti: run 392622 workflow and AA1 use the same exact AppImage SHA and these two flags. Ancillary flags/runner differ; this does not rule out content/format or state-specific issue.
          AC4: anonymously listed releases HTTP 200; ids 647346873 (game BIN), 652373928 (SCPH-7502 ZIP), 686794219 (checkpoint) each HTTP 302 on exact zero-body Range query, redirecting to release-assets.githubusercontent.com. ROM/BIOS/checkpoint are reachable without token. No asset, visibility, or hash was changed. Suggested mitigation only: owner may decide whether copyrighted/private assets should be moved to private storage or repository/release visibility changed.
          AB2 tetap CLOSED. AB2/AB3 tidak dijalankan. ISO, BIOS, savestate, RAM dump, screenshot tidak dikomit. Story Mode completion NOT VERIFIED.
          EOF
          git add "$REPORT"
          git commit -m "Publish concise AC1-AC4 restore report"
          git push origin HEAD:main
          FINAL_COMMIT="$(git rev-parse HEAD)"
          echo "FINAL_REPORT_COMMIT=$FINAL_COMMIT"
          echo "FINAL_REPORT_RAW=https://raw.githubusercontent.com/$RESEARCH_REPO/$FINAL_COMMIT/$REPORT"
          cat "$REPORT"

      - name: Remove savestates, BIOS, ISO and private traces
        if: always()
        shell: bash
        run: |
          kill "$(cat "$AA_WORK/xvfb.pid" 2>/dev/null)" 2>/dev/null || true
          rm -rf "$AA_WORK" "$RUNNER_TEMP/naruto-aa1-gdb"
