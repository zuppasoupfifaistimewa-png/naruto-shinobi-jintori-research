name: Inspect existing control-probe artifact on runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.inspect-control-probe-artifact-12308661246"

permissions:
  contents: read
  actions: read

concurrency:
  group: inspect-control-probe-artifact-12308661246
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[INSPECT-CONTROL-PROBE-ARTIFACT-12308661246]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository text
        uses: actions/checkout@v4
      - name: Validate one-shot selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat experiments/.inspect-control-probe-artifact-12308661246)" = "ARTIFACT_ID=12308661246 RUN_ID=39513285641"
          echo "INSPECTION_SCOPE=artifact 12308661246; run 39513285641; no emulator/input/restore"
      - name: Download existing artifact to runner temp
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/control-probe-artifact
      - name: Install screenshot analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y python3-pil tesseract-ocr tesseract-ocr-jpn
      - name: Inspect manifest, text, JSON and selected screenshots on runner
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/control-probe-artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from PIL import Image, ImageChops, ImageStat

          root = Path(os.environ["ARTIFACT_DIR"])
          files = sorted(p for p in root.rglob("*") if p.is_file())
          infos = [SimpleNamespace(filename=p.relative_to(root).as_posix(), file_size=p.stat().st_size, path=p) for p in files]
          total = sum(i.file_size for i in infos)
          print(f"RUNNER_FILES={len(infos)} UNCOMPRESSED_BYTES={total}")
          if total > 150 * 1024 * 1024:
              raise SystemExit("uncompressed-size safety limit exceeded")
          branches = ("NONE","START","CIRCLE","CROSS","TRIANGLE","SQUARE","UP","DOWN","LEFT","RIGHT")
          image_re = re.compile(r"(NONE|START|CIRCLE|CROSS|TRIANGLE|SQUARE|UP|DOWN|LEFT|RIGHT)-(pre|post)\\.png$", re.I)
          for i in infos:
              print(f"ENTRY name={i.filename} bytes={i.file_size}")
          for i in infos:
              name=i.filename
              low=name.lower()
              if i.file_size > 24 * 1024 * 1024 or low.endswith(".sstate"):
                  if low.endswith(".sstate"):
                      print(f"SAVESTATE_SKIPPED name={name} bytes={i.file_size}")
                  continue
              if low.endswith((".txt",".log",".json",".csv",".md")):
                  data=i.path.read_bytes()
                  if low.endswith(".json"):
                      try:
                          obj=json.loads(data.decode("utf-8","replace"))
                          if isinstance(obj,dict):
                              pick={k:obj.get(k) for k in ("state","state_name","action","confidence","reason","frame","branch","input","decision","observation") if k in obj}
                              print(f"JSON_SUMMARY name={name} keys={','.join(obj.keys())[:500]} selected={json.dumps(pick,ensure_ascii=False)[:1800]}")
                              for k in ("state","state_name","observation","decision"):
                                  v=obj.get(k)
                                  if isinstance(v,dict):
                                      sub={q:v.get(q) for q in ("state","action","confidence","reason") if q in v}
                                      if sub: print(f"JSON_NESTED name={name} field={k} value={json.dumps(sub,ensure_ascii=False)}")
                      except Exception as e:
                          print(f"JSON_PARSE_ERROR name={name} error={type(e).__name__}")
                  else:
                      lines=data.decode("utf-8","replace").splitlines()
                      if any(x in low for x in ("control-probe-report","manifest")):
                          print(f"TEXT_FILE_BEGIN name={name}")
                          for line in lines[:120]: print(line[:1000])
                          print("TEXT_FILE_END")
                      else:
                          selected=[line for line in lines if re.search(r"CONTROL_PROBE_(INPUT|SCREENSHOT|BRANCH_DONE|RESTORE_GATE)|state=|STATE=|decision|checkpoint|action=",line,re.I)]
                          for line in selected[:160]: print(f"TEXT_MATCH name={name} line={line[:1000]}")
          pngs=[i for i in infos if image_re.search(Path(i.filename).name)]
          by_key={}
          for i in pngs:
              m=image_re.search(Path(i.filename).name)
              key=(m.group(1).upper(),m.group(2).lower())
              if key in by_key: continue
              digest=hashlib.sha256(i.path.read_bytes()).hexdigest()
              try:
                  im=Image.open(i.path).convert("RGB")
                  if im.size!=(1280,800):
                      print(f"IMAGE name={i.filename} size={im.size} sha256={digest} unexpected_size=1")
                      continue
                  by_key[key]=(im,i.filename)
                  print(f"IMAGE name={i.filename} size=1280x800 sha256={digest}")
                  ocr=subprocess.run(["tesseract",str(i.path),"stdout","-l","jpn+eng","--psm","11"],capture_output=True,text=True,timeout=20)
                  txt=" ".join(ocr.stdout.split())
                  print(f"OCR name={i.filename} rc={ocr.returncode} text={txt[:600]}")
              except Exception as e:
                  print(f"IMAGE_PARSE_ERROR name={i.filename} error={type(e).__name__}")
          none_pre=by_key.get(("NONE","pre"))
          none_post=by_key.get(("NONE","post"))
          for branch in branches:
              if branch=="NONE": continue
              for phase,control in (("pre",none_pre),("post",none_post)):
                  candidate=by_key.get((branch,phase))
                  if not control or not candidate: continue
                  a,b=control[0],candidate[0]
                  if a.size!=b.size: continue
                  diff=ImageChops.difference(a,b)
                  stat=ImageStat.Stat(diff)
                  hist=diff.convert("L").histogram()
                  differing=sum(hist[1:])
                  print(f"PAIR_DIFF branch={branch} phase={phase} control={control[1]} action={candidate[1]} differing_pixels={differing} total_pixels={a.width*a.height} mean_abs_rgb={sum(stat.mean)/3:.6f} identical={int(differing==0)}")
          print("ARTIFACT_CONTENT_PROCESSING=RUNNER_ONLY")
          print("SAVESTATE_CONTENTS=NOT_OPENED")
          PY
