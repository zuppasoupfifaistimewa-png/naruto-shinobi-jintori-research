name: IA0-IA5 isolated static audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ia0-ia5-static-audit.yml"
      - "tools/ia-static/RunIA0IA5Static.py"
      - "tools/ia-ghidra/ExportIAManagerFieldAccesses.java"

permissions:
  contents: write
  actions: read

concurrency:
  group: naruto-ia0-ia5-static-audit
  cancel-in-progress: false

jobs:
  ia0-ia5-static:
    name: ia0-ia5-static
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GHIDRA_ASSET: ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
      WORK: /tmp/ia0-ia5-private
      OUT: /tmp/ia0-ia5-output
      IA_BASELINE: b9bd69a5c59ca5103a2144deef3604a6b5f5c4a9

    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install static and disc-extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bchunk xorriso unzip python3-pip jq
          python3 -m pip install --break-system-packages "capstone==5.0.3"
          mkdir -p "$WORK/source" "$WORK/extracted" "$WORK/input" "$WORK/pycache" "$OUT"

      - name: py_compile every tracked Python script
        id: pycompile
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT/IA0_PYCOMPILE.tsv" "$WORK/pycache" <<'PY'
          import csv, hashlib, py_compile, subprocess, sys
          from pathlib import Path
          out, cache = Path(sys.argv[1]), Path(sys.argv[2])
          files = subprocess.check_output(["git", "ls-files", "-z", "*.py"]).decode().split("\0")
          rows=[]
          for name in [x for x in files if x]:
              target=cache/(hashlib.sha256(name.encode()).hexdigest()+".pyc")
              try:
                  py_compile.compile(name,cfile=str(target),doraise=True)
                  rows.append((name,"PASS",""))
              except Exception as exc:
                  rows.append((name,"FAIL",type(exc).__name__+":"+str(exc)))
          with out.open("w",encoding="utf-8",newline="") as f:
              w=csv.writer(f,delimiter="\t",lineterminator="\n")
              w.writerow(["path","status","reason"]); w.writerows(rows)
          for row in rows:
              if row[1] != "PASS":
                  print("PY_COMPILE_ERROR\\t"+row[0]+"\\t"+row[2])
          print("PY_COMPILE_TOTAL="+str(len(rows)))
          print("PY_COMPILE_FAIL="+str(sum(x[1]!="PASS" for x in rows)))
          PY
          PYRC="$(python3 -c 'from pathlib import Path; import sys; print(int(any(len(x.split())>1 and x.split()[1]=="FAIL" for x in Path(sys.argv[1]).read_text().splitlines()[1:])))' "$OUT/IA0_PYCOMPILE.tsv")"
          echo "exit_code=$PYRC" >> "$GITHUB_OUTPUT"

      - name: Restore Ghidra cache
        id: ghidra_cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Download Ghidra if cache is missing
        id: ghidra_install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            ARCHIVE="$RUNNER_TEMP/$GHIDRA_ASSET"
            URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 3 "$URL" -o "$ARCHIVE"
            echo "$GHIDRA_SHA256  $ARCHIVE" | sha256sum --check --status
            unzip -q "$ARCHIVE" -d "$GHIDRA_CACHE_DIR"
            rm -f "$ARCHIVE"
          fi
          HEADLESS="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -x "$HEADLESS"
          echo "HEADLESS=$HEADLESS" >> "$GITHUB_ENV"

      - name: Download and extract verified disc privately
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          BIN="$WORK/source/naruto-disc.bin"
          CUE_RAW="$WORK/source/original.cue"
          CUE="$WORK/source/naruto-disc.cue"
          curl --fail --location --silent --show-error --retry 2 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/647346873" -o "$BIN"
          test "$(stat -c %s "$BIN")" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $BIN" | sha256sum --check --status
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$API/releases/assets/647354760" -o "$CUE_RAW"
          test "$(stat -c %s "$CUE_RAW")" = 116
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $CUE_RAW" | sha256sum --check --status
          python3 - "$CUE_RAW" "$CUE" <<'PY'
          from pathlib import Path
          import re,sys
          src,dst=map(Path,sys.argv[1:3]); lines=[]; count=0
          for line in src.read_text(encoding="utf-8").splitlines():
              if line.lstrip().upper().startswith("FILE "):
                  m=re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$',line,re.I)
                  if not m: raise SystemExit("INVALID_CUE_FILE_DIRECTIVE")
                  line=m.group(1)+'"naruto-disc.bin"'+m.group(2); count+=1
              lines.append(line)
          if count!=1: raise SystemExit("CUE_FILE_DIRECTIVE_COUNT="+str(count))
          dst.write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
          bchunk "$BIN" "$CUE" "$WORK/source/track"
          ISO="$(find "$WORK/source" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          test -n "$ISO"
          xorriso -osirrox on -indev "$ISO" -extract / "$WORK/extracted" > "$WORK/source/extract.log" 2>&1
          EXE="$(find "$WORK/extracted" -type f -iname 'SLPS_035.53' -print -quit)"
          DATA="$(find "$WORK/extracted" -type f -iname 'DATA.BIN' -print -quit)"
          test -n "$EXE" && test -n "$DATA"
          test "$(stat -c %s "$EXE")" = 385024
          echo "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569  $EXE" | sha256sum --check --status
          test "$(stat -c %s "$DATA")" = 66015232
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $DATA" | sha256sum --check --status
          cp "$EXE" "$WORK/input/SLPS_035.53"
          python3 - "$DATA" "$WORK/input/ENTRY1.bin" <<'PY'
          from pathlib import Path
          import hashlib,struct,sys
          data=Path(sys.argv[1]).read_bytes()
          lbn,size=struct.unpack_from("<II",data,0x4c)
          off=(lbn-212)*2048
          entry=data[off:off+size]
          if (lbn,size,off,len(entry))!=(8778,596412,0x10BB000,596412):
              raise SystemExit("ENTRY1_DIRECTORY_MAPPING_MISMATCH")
          digest=hashlib.sha256(entry).hexdigest()
          if digest!="9c531036e66c88849bc8fd16ee1717f10b1a7e42132f2a616635c122c809c60a":
              raise SystemExit("ENTRY1_SHA256_MISMATCH="+digest)
          Path(sys.argv[2]).write_bytes(entry)
          print("EXE_AND_ENTRY1_INPUTS_VERIFIED")
          PY
          echo "extracted=true" >> "$GITHUB_OUTPUT"

      - name: Run Ghidra static exports
        id: ghidra_run
        if: steps.extract.outputs.extracted == 'true' && steps.ghidra_install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/ghidra-exe" "$WORK/ghidra-entry1"
          SCRIPT_PATH="$GITHUB_WORKSPACE/tools/ia-ghidra"
          set +e
          "$HEADLESS" "$WORK/ghidra-exe" Naruto_SLPS_035_53_EXE_IA \
            -import "$WORK/input/SLPS_035.53" \
            -loader BinaryLoader -loader-baseAddr 0x80010000 -loader-fileOffset 0x800 -loader-length 0x5D800 \
            -processor "MIPS:LE:32:default" -scriptPath "$SCRIPT_PATH" \
            -preScript PreparePsxExe.java \
            -postScript EnsureTargetFunctions.java 0x80014F10 \
            -postScript ExportFunctionDetail.java "$OUT/ghidra-exe-14f10.txt" 0x80014F10 \
            -postScript ExportIAManagerFieldAccesses.java "$OUT/EXE_PLUS4.tsv" 0x4 \
            -postScript ExportIAManagerFieldAccesses.java "$OUT/EXE_PLUS530.tsv" 0x530 \
            -analysisTimeoutPerFile 900 -max-cpu 2 -deleteProject > "$OUT/ghidra-exe.log" 2>&1
          EXE_RC=$?
          "$HEADLESS" "$WORK/ghidra-entry1" Naruto_SLPS_035_53_ENTRY1_IA \
            -import "$WORK/input/ENTRY1.bin" \
            -loader BinaryLoader -loader-baseAddr 0x800AD450 -loader-length 0x919BC -loader-blockName ENTRY1_AT_800AD450 \
            -processor "MIPS:LE:32:default" -scriptPath "$SCRIPT_PATH" \
            -postScript EnsureTargetFunctions.java 0x800B24C8 0x800BEDA4 0x800DC2E0 0x800F2A9C \
            -postScript ExportFunctionDetail.java "$OUT/ghidra-entry-targets.txt" 0x800B24C8 0x800BEDA4 0x800DC2E0 0x800F2A9C \
            -postScript ExportIAManagerFieldAccesses.java "$OUT/ENTRY1_PLUS4.tsv" 0x4 \
            -postScript ExportIAManagerFieldAccesses.java "$OUT/ENTRY1_PLUS530.tsv" 0x530 \
            -analysisTimeoutPerFile 900 -max-cpu 2 -deleteProject > "$OUT/ghidra-entry1.log" 2>&1
          ENTRY_RC=$?
          set -e
          echo "$EXE_RC" > "$OUT/ghidra-exe.exit"
          echo "$ENTRY_RC" > "$OUT/ghidra-entry1.exit"
          {
            echo "=== Ghidra EXE log tail (exit=$EXE_RC) ==="
            tail -n 120 "$OUT/ghidra-exe.log" 2>/dev/null || echo "EXE_GHIDRA_LOG_MISSING"
            echo
            echo "=== Ghidra Entry 1 log tail (exit=$ENTRY_RC) ==="
            tail -n 120 "$OUT/ghidra-entry1.log" 2>/dev/null || echo "ENTRY1_GHIDRA_LOG_MISSING"
          } > "$OUT/GHIDRA_DIAGNOSTICS.txt"

      - name: Run IA0-IA5 static analysis
        id: analysis
        if: steps.extract.outputs.extracted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 tools/ia-static/RunIA0IA5Static.py "$WORK/input/SLPS_035.53" "$WORK/input/ENTRY1.bin" "$OUT"
          RC=$?
          set -e
          echo "$RC" > "$OUT/analysis.exit"
          echo "analysis_exit=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove all private binary inputs and Ghidra work
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          if [ -e "$WORK" ]; then echo "PRIVATE_BINARY_CLEANUP=FAIL" > "$OUT/cleanup.txt"; exit 1; fi
          echo "PRIVATE_BINARY_CLEANUP=PASS" > "$OUT/cleanup.txt"

      - name: Commit text-only IA results and mandatory run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          DEST="reports/stage1_economy/ia0-ia5-static-run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          find "$OUT" -maxdepth 1 -type f \( -name '*.txt' -o -name '*.tsv' -o -name '*.md' \) -exec cp {} "$DEST/" \;
          ANALYSIS_RC="$(cat "$OUT/analysis.exit" 2>/dev/null || echo TIDAK_TAHU)"
          EXE_RC="$(cat "$OUT/ghidra-exe.exit" 2>/dev/null || echo TIDAK_TAHU)"
          ENTRY_RC="$(cat "$OUT/ghidra-entry1.exit" 2>/dev/null || echo TIDAK_TAHU)"
          PYRC="${{ steps.pycompile.outputs.exit_code }}"
          [ -n "$PYRC" ] || PYRC=TIDAK_TAHU
          CLEANUP="$(cat "$OUT/cleanup.txt" 2>/dev/null || echo PRIVATE_BINARY_CLEANUP=UNKNOWN)"
          JOB_ID="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -r '.jobs[] | select(.name=="ia0-ia5-static") | .id' | head -n 1)" || JOB_ID=TIDAK_TAHU
          [ -n "$JOB_ID" ] || JOB_ID=TIDAK_TAHU
          if [ "$ANALYSIS_RC" = 0 ] && [ "$EXE_RC" = 0 ] && [ "$ENTRY_RC" = 0 ] && [ "$PYRC" = 0 ] && [ "$CLEANUP" = "PRIVATE_BINARY_CLEANUP=PASS" ]; then STATUS=PASS; else STATUS=PARTIAL; fi
          {
            echo "STATUS=$STATUS"
            echo "JOB=ia0-ia5-static"
            echo "JOB_ID=$JOB_ID"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXIT_CODE=$ANALYSIS_RC"
            echo "PY_COMPILE_EXIT_CODE=$PYRC"
            echo "GHIDRA_EXE_EXIT_CODE=$EXE_RC"
            echo "GHIDRA_ENTRY1_EXIT_CODE=$ENTRY_RC"
            echo "$CLEANUP"
            echo "GAME_OR_EMULATOR_EXECUTED=no"
            echo "BIOS_OR_SAVESTATE_USED=no"
            echo "BINARY_COMMITTED=no"
          } > "$DEST/ACTIONS_RUN_SUMMARY.txt"
          BAD="$(find "$DEST" -type f ! \( -name '*.txt' -o -name '*.tsv' -o -name '*.md' \) -print)"
          test -z "$BAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Publish IA0-IA5 static audit run $GITHUB_RUN_ID"
            PUSHED=0
            for n in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
              if git push origin HEAD:main; then PUSHED=1; break; fi
              sleep "$n"
            done
            test "$PUSHED" -eq 1
          fi
