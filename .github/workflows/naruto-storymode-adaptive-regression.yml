name: Naruto adaptive classifier regression

on:
  push:
    branches: [main]
    paths:
      - "tools/storymode_adaptive_agent.py"
      - "tests/test_storymode_adaptive_agent.py"
      - ".github/workflows/naruto-storymode-adaptive-regression.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v4

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pil

      - name: Download private, authentic emulator evidence from adaptive failure
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39758737690
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/private-evidence

      - name: Run synthetic regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify policy against authentic external X11 screenshots
        env:
          EVIDENCE: ${{ runner.temp }}/private-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["EVIDENCE"])
          agent = Path("tools/storymode_adaptive_agent.py")
          expected = {
              "C01-F20.png": ("map", "DOWN"),
              "C01-F60.png": ("map", "DOWN"),
              "C01-F100.png": ("dialogue", "START"),
              "C01-F110.png": ("dialogue", "START"),
              "C01-F180.png": ("map_after_move", "WAIT"),
              "C02-F20.png": ("map_after_move", "WAIT"),
              "C02-F60.png": ("map_after_move", "WAIT"),
              "C02-F100.png": ("map_after_move", "WAIT"),
              "C02-F110.png": ("map_after_move", "WAIT"),
              "C02-F180.png": ("map_after_move", "WAIT"),
          }
          for filename, want in expected.items():
              path = root / filename
              if not path.is_file():
                  raise SystemExit("missing authentic private evidence: " + filename)
              p = subprocess.run(
                  [sys.executable, str(agent), str(path)],
                  check=True, capture_output=True, text=True, timeout=10
              )
              got = json.loads(p.stdout.strip().splitlines()[-1])
              observed = (got.get("state"), got.get("action"))
              print(json.dumps({
                  "file": filename, "state": observed[0], "action": observed[1],
                  "confidence": got.get("confidence"), "reason": got.get("reason")
              }, sort_keys=True))
              if observed != want:
                  raise SystemExit(f"classification mismatch for {filename}: got={observed}, expected={want}")
          print("AUTHENTIC_X11_REGRESSION=PASS checked=10")
          PY

      - name: Download authentic revision51 card-overlay evidence
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39875714125
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/card-overlay-evidence

      - name: Verify card overlay dominates dialogue on authentic X11 frames
        env:
          EVIDENCE: ${{ runner.temp }}/card-overlay-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from PIL import Image
          root = Path(os.environ["EVIDENCE"])
          expected = {name: ("card_selection", "WAIT") for name in (
              "C01-F20.png", "C01-F60.png", "C01-F100.png", "C01-F110.png", "C01-F180.png"
          )}
          for filename, want in expected.items():
              path = root / filename
              if not path.is_file():
                  raise SystemExit("missing authentic card-overlay frame: " + filename)
              with Image.open(path) as im:
                  if im.size != (1280, 800):
                      raise SystemExit(f"bad screenshot dimensions for {filename}: {im.size}")
              proc = subprocess.run(
                  [sys.executable, "tools/storymode_adaptive_agent.py", str(path)],
                  check=True, capture_output=True, text=True, timeout=10,
              )
              got = json.loads(proc.stdout.strip().splitlines()[-1])
              observed = (got.get("state"), got.get("action"))
              print(json.dumps({"file": filename, "observed": observed, "reason": got.get("reason")}, sort_keys=True))
              if observed != want:
                  raise SystemExit(f"card overlay/dialogue priority mismatch for {filename}: {observed} != {want}")
          print("AUTHENTIC_CARD_OVERLAY_DIALOGUE_PRIORITY=PASS checked=5")
          PY
      - name: Download authentic revision53 card action-versus-control evidence
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39877412316
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/revealed-card-evidence

      - name: Verify opened card detail state on authentic revision53 X11 frames
        env:
          EVIDENCE: ${{ runner.temp }}/revealed-card-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from PIL import Image
          root = Path(os.environ["EVIDENCE"])
          expected = {
              "C01-F20.png": ("card_selection", "WAIT"),
              "C01-F60.png": ("card_selection_detail", "WAIT"),
              "C01-F100.png": ("card_selection_detail", "WAIT"),
              "C01-F110.png": ("card_selection_detail", "WAIT"),
              "C01-F180.png": ("card_selection_detail", "WAIT"),
              "C02-F20.png": ("card_selection", "WAIT"),
              "C02-F60.png": ("card_selection", "WAIT"),
              "C02-F100.png": ("card_selection", "WAIT"),
              "C02-F110.png": ("card_selection", "WAIT"),
              "C02-F180.png": ("card_selection", "WAIT"),
          }
          for filename, want in expected.items():
              path = root / filename
              if not path.is_file():
                  raise SystemExit("missing authentic revision53 screenshot: " + filename)
              with Image.open(path) as im:
                  if im.size != (1280, 800):
                      raise SystemExit(f"bad screenshot dimensions for {filename}: {im.size}")
              proc = subprocess.run(
                  [sys.executable, "tools/storymode_adaptive_agent.py", str(path)],
                  check=True, capture_output=True, text=True, timeout=10,
              )
              got = json.loads(proc.stdout.strip().splitlines()[-1])
              observed = (got.get("state"), got.get("action"))
              print(json.dumps({"file": filename, "observed": observed, "reason": got.get("reason")}, sort_keys=True))
              if observed != want:
                  raise SystemExit(f"revealed-card classification mismatch for {filename}: {observed} != {want}")
          print("AUTHENTIC_REVEALED_CARD_DETAIL=PASS checked=10")
          PY
