          print(f"PINK_BADGE_PULSE_REGRESSION=PASS frames={len(pulse_frames)} max_rgb_distance={max(pulse_distances.values()):.2f} same_phase_across_UP_WAIT=true pulse_alone_is_not_a_unique_selection_cue=true")

          cue_metrics = {
              "map_UP": (map_focus_ring_pixels, map_up_panel_gold, map_up_text_delta),
              "map_WAIT": (map_wait_pink_ring_pixels, map_wait_panel_gold, map_wait_text_delta),
              "submenu_UP": (rev65_pink_ring_pixels, rev65_up_panel_gold, rev65_up_text_delta),
              "submenu_WAIT": (rev65_wait_ring_counts[60], rev65_wait_panel_gold, rev65_wait_text_delta),
          }
          cue_matches = {name: matches_map_selection_reference(*metrics) for name, metrics in cue_metrics.items()}
          print("LEVELUP_TARGET_CUE_METRICS " + " ".join(
