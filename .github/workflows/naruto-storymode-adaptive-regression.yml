          # Pink badge chroma changes with animation phase in the authentic frames.
          # Sample a badge-interior ROI away from the foreground kunai and arrow ring;
          # compare the same frame phases in the map-UP and map-WAIT contexts.
          # A shared pulse is not a discriminating selection signal.
          def pink_badge_core_rgb_mean(arr, box):
              x1, y1, x2, y2 = box
              crop = arr[y1:y2, x1:x2].astype(np.int16)
              r, g, b = crop[:,:,0], crop[:,:,1], crop[:,:,2]
              mask = (r > 150) & (r > g*1.25) & (b > 80) & ((r-g) > 50)
              values = crop[mask]
              if len(values) < 300:
                  raise SystemExit(f"pink badge core mask too sparse in {box}: {len(values)}")
              return tuple(float(value) for value in values.mean(axis=0)), int(len(values))

          pulse_frames = (60, 100, 110, 180)
          map_up_pulse_rgb, map_wait_pulse_rgb = {}, {}
          pulse_distances = {}
          for frame in pulse_frames:
