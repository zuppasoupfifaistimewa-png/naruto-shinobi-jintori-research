          print("CAMERA_SHIFT_REGRESSION=PASS UP_scene_shift_approx_100px WAIT_scene_shift_approx_0px target_selection_not_inferred=true")
          if max(proxy_motion.values()) > 20 or not (rev65_up_shift >= 92 and map_up_shift >= 92 and abs(rev65_wait_shift) <= 4 and abs(map_wait_shift) <= 4):
