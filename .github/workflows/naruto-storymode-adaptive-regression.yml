name: Naruto adaptive classifier regression

on:
  push:
    branches: [main]
    paths:
      - "tools/storymode_adaptive_agent.py"
      - "tests/test_storymode_adaptive_agent.py"
      - ".github/workflows/naruto-storymode-adaptive-regression.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v4

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pil

      - name: Download private, authentic emulator evidence from adaptive failure
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39758737690
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/private-evidence

      - name: Run synthetic regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify policy against authentic external X11 screenshots
        env:
          EVIDENCE: ${{ runner.temp }}/private-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["EVIDENCE"])
          agent = Path("tools/storymode_adaptive_agent.py")
          expected = {
              "C01-F20.png": ("map", "DOWN"),
              "C01-F60.png": ("map", "DOWN"),
              "C01-F100.png": ("dialogue", "START"),
              "C01-F110.png": ("dialogue", "START"),
              "C01-F180.png": ("map_after_move", "WAIT"),
              "C02-F20.png": ("map_after_move", "WAIT"),
              "C02-F60.png": ("map_after_move", "WAIT"),
              "C02-F100.png": ("map_after_move", "WAIT"),
              "C02-F110.png": ("map_after_move", "WAIT"),
              "C02-F180.png": ("map_after_move", "WAIT"),
          }
          for filename, want in expected.items():
              path = root / filename
              if not path.is_file():
                  raise SystemExit("missing authentic private evidence: " + filename)
              p = subprocess.run(
                  [sys.executable, str(agent), str(path)],
                  check=True, capture_output=True, text=True, timeout=10
              )
              got = json.loads(p.stdout.strip().splitlines()[-1])
              observed = (got.get("state"), got.get("action"))
              print(json.dumps({
                  "file": filename, "state": observed[0], "action": observed[1],
                  "confidence": got.get("confidence"), "reason": got.get("reason")
              }, sort_keys=True))
              if observed != want:
                  raise SystemExit(f"classification mismatch for {filename}: got={observed}, expected={want}")
          print("AUTHENTIC_X11_REGRESSION=PASS checked=10")
          PY

      - name: Download authentic revision51 card-overlay evidence
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39875714125
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/card-overlay-evidence

      - name: Verify card overlay dominates dialogue on authentic X11 frames
        env:
          EVIDENCE: ${{ runner.temp }}/card-overlay-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from PIL import Image
          root = Path(os.environ["EVIDENCE"])
          expected = {name: ("card_selection", "WAIT") for name in (
              "C01-F20.png", "C01-F60.png", "C01-F100.png", "C01-F110.png", "C01-F180.png"
          )}
          for filename, want in expected.items():
              path = root / filename
              if not path.is_file():
                  raise SystemExit("missing authentic card-overlay frame: " + filename)
              with Image.open(path) as im:
                  if im.size != (1280, 800):
                      raise SystemExit(f"bad screenshot dimensions for {filename}: {im.size}")
              proc = subprocess.run(
                  [sys.executable, "tools/storymode_adaptive_agent.py", str(path)],
                  check=True, capture_output=True, text=True, timeout=10,
              )
              got = json.loads(proc.stdout.strip().splitlines()[-1])
              observed = (got.get("state"), got.get("action"))
              print(json.dumps({"file": filename, "observed": observed, "reason": got.get("reason")}, sort_keys=True))
              if observed != want:
                  raise SystemExit(f"card overlay/dialogue priority mismatch for {filename}: {observed} != {want}")
          print("AUTHENTIC_CARD_OVERLAY_DIALOGUE_PRIORITY=PASS checked=5")
          PY
      - name: Download authentic revision53 card action-versus-control evidence
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39877412316
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/revealed-card-evidence

      - name: Verify opened card detail state on authentic revision53 X11 frames
        env:
          EVIDENCE: ${{ runner.temp }}/revealed-card-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from PIL import Image
          root = Path(os.environ["EVIDENCE"])
          expected = {
              "C01-F20.png": ("card_selection", "WAIT"),
              "C01-F60.png": ("card_selection_detail", "WAIT"),
              "C01-F100.png": ("card_selection_detail", "WAIT"),
              "C01-F110.png": ("card_selection_detail", "WAIT"),
              "C01-F180.png": ("card_selection_detail", "WAIT"),
              "C02-F20.png": ("card_selection", "WAIT"),
              "C02-F60.png": ("card_selection", "WAIT"),
              "C02-F100.png": ("card_selection", "WAIT"),
              "C02-F110.png": ("card_selection", "WAIT"),
              "C02-F180.png": ("card_selection", "WAIT"),
          }
          for filename, want in expected.items():
              path = root / filename
              if not path.is_file():
                  raise SystemExit("missing authentic revision53 screenshot: " + filename)
              with Image.open(path) as im:
                  if im.size != (1280, 800):
                      raise SystemExit(f"bad screenshot dimensions for {filename}: {im.size}")
              proc = subprocess.run(
                  [sys.executable, "tools/storymode_adaptive_agent.py", str(path)],
                  check=True, capture_output=True, text=True, timeout=10,
              )
              got = json.loads(proc.stdout.strip().splitlines()[-1])
              observed = (got.get("state"), got.get("action"))
              print(json.dumps({"file": filename, "observed": observed, "reason": got.get("reason")}, sort_keys=True))
              if observed != want:
                  raise SystemExit(f"revealed-card classification mismatch for {filename}: {observed} != {want}")
          print("AUTHENTIC_REVEALED_CARD_DETAIL=PASS checked=10")
          PY
      - name: Download authentic Revision65 barrier-selection A/B evidence
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39947481094
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/revision65-barrier-evidence

      - name: Download authentic map-selection UP-vs-WAIT comparison evidence
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          run-id: 39786019434
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: ${{ runner.temp }}/map-up-wait-evidence

      - name: Regression-gate pink 60 marker without treating it as a selected target
        env:
          EVIDENCE: ${{ runner.temp }}/revision65-barrier-evidence
          MAP_EVIDENCE: ${{ runner.temp }}/map-up-wait-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          import numpy as np
          from PIL import Image

          root = Path(os.environ["EVIDENCE"])
          agent = "tools/storymode_adaptive_agent.py"
          expected = {f"C{branch:02d}-F{frame}.png": ("barrier_level_selection", "WAIT")
                      for branch in (1, 2) for frame in (20, 60, 100, 110, 180)}
          images = {}
          for filename, want in expected.items():
              path = root / filename
              if not path.is_file():
                  raise SystemExit("missing authentic Revision65 frame: " + filename)
              with Image.open(path) as im:
                  if im.size != (1280, 800):
                      raise SystemExit(f"bad screenshot dimensions for {filename}: {im.size}")
                  images[filename] = np.asarray(im.convert("RGB"))
              proc = subprocess.run(
                  [sys.executable, agent, str(path)], check=True,
                  capture_output=True, text=True, timeout=10
              )
              got = json.loads(proc.stdout.strip().splitlines()[-1])
              observed = (got.get("state"), got.get("action"))
              print(json.dumps({"file": filename, "state": observed[0], "action": observed[1],
                                "reason": got.get("reason")}, sort_keys=True))
              if observed != want:
                  raise SystemExit(f"Revision65 state/action mismatch: {filename}: {observed} != {want}")
          def pink_mask(arr):
              arr = arr.astype(np.int16)
              r, g, b = arr[:,:,0], arr[:,:,1], arr[:,:,2]
              return (r > 180) & (g < 110) & (b > 100) & ((r-g) > 75)

          def pink_pixel_count(arr, box):
              x1, y1, x2, y2 = box
              return int(pink_mask(arr)[y1:y2, x1:x2].sum())

          # The same pink-60 tile is partly visible beneath the fixed HUD before UP,
          # then exposed in a different ROI after the scene/camera composition shifts.
          # This is a confound: badge visibility alone cannot establish selection.
          baseline_partly_occluded = pink_pixel_count(images["C01-F20.png"], (480,145,560,220))
          action_exposed = pink_pixel_count(images["C01-F60.png"], (430,210,570,340))
          control_same_roi = pink_pixel_count(images["C02-F60.png"], (430,210,570,340))
          print(f"REV65_BADGE_EXPOSURE baseline_partial={baseline_partly_occluded} action_post_UP={action_exposed} control={control_same_roi}")
          if baseline_partly_occluded < 80 or action_exposed < 1000 or control_same_roi > 50:
              raise SystemExit("Revision65 pink-60 baseline/exposure signature changed; re-audit camera-pan confound")

          # Reference action/control on the authenticated map-selection experiment:
          # the panel follows the selected tile only in the UP branch. The changed
          # panel is paired visually with red directional focus arrows surrounding
          # the pink-60 tile; WAIT retains the empty-land / value-140 information.
          map_root = Path(os.environ["MAP_EVIDENCE"])
          map_images = {}
          for filename in ("C01-F20.png", "C01-F60.png", "C02-F20.png", "C02-F60.png"):
              path = map_root / filename
              if not path.is_file():
                  raise SystemExit("missing authentic map UP-vs-WAIT frame: " + filename)
              with Image.open(path) as im:
                  if im.size != (1280,800):
                      raise SystemExit(f"bad map screenshot dimensions for {filename}: {im.size}")
                  map_images[filename] = np.asarray(im.convert("RGB"))

          def changed_pixels(a, b, box):
              x1, y1, x2, y2 = box
              aa, bb = a[y1:y2,x1:x2], b[y1:y2,x1:x2]
              return int(np.any(aa != bb, axis=2).sum())

          panel_box = (150,340,545,540)
          action_panel_delta = changed_pixels(map_images["C01-F20.png"], map_images["C01-F60.png"], panel_box)
          control_panel_delta = changed_pixels(map_images["C02-F20.png"], map_images["C02-F60.png"], panel_box)
          map_selected_tile_pixels = pink_pixel_count(map_images["C01-F60.png"], (585,360,685,460))
          map_control_tile_pixels = pink_pixel_count(map_images["C02-F60.png"], (585,360,685,460))
          print(f"MAP_SELECTED_TILE_PANEL action_delta={action_panel_delta} control_delta={control_panel_delta} action_pink60_pixels={map_selected_tile_pixels} control_same_ROI={map_control_tile_pixels}")
          if action_panel_delta < 8000 or control_panel_delta > 500:
              raise SystemExit("map target-information panel did not discriminate UP from WAIT as calibrated")
          if map_selected_tile_pixels < 1200 or map_control_tile_pixels > 250:
              raise SystemExit("map pink-60 tile ROI no longer distinguishes the UP target from WAIT")

          def pink_marker_ratio(arr):
              # Fixed ROI around the pink hexagon and its 60 label in the authentic F60 frame.
              crop = arr[175:260, 420:540].astype(np.int16)
              r, g, b = crop[:,:,0], crop[:,:,1], crop[:,:,2]
              mask = (r > 180) & (g < 110) & (b > 100) & ((r-g) > 75)
              return float(mask.mean())
          baseline = {}
          for branch in (1, 2):
              baseline[f"C{branch:02d}-F20.png"] = pink_marker_ratio(images[f"C{branch:02d}-F20.png"])
          if any(v > 0.01 for v in baseline.values()):
              raise SystemExit("pink marker ROI did not match pre-input baseline: " + repr(baseline))
          action_ratios = {f"C01-F{f}.png": pink_marker_ratio(images[f"C01-F{f}.png"])
                           for f in (60, 100, 110, 180)}
          control_ratios = {f"C02-F{f}.png": pink_marker_ratio(images[f"C02-F{f}.png"])
                            for f in (60, 100, 110, 180)}
          print(json.dumps({"pink_marker_ratio": action_ratios, "control_roi_ratio": control_ratios,
                            "meaning": "60_matches_known_barrier_value_symbol_from_map_context; submenu_target_selection_role_UNKNOWN"}, sort_keys=True))
          if any(v < 0.02 for v in action_ratios.values()):
              raise SystemExit("expected pink 60 badge signature missing from an action-branch frame")
          if any(v > 0.01 for v in control_ratios.values()):
              raise SystemExit("control branch unexpectedly has the calibrated pink-badge signature")
          for branch in (1, 2):
              first = images[f"C{branch:02d}-F60.png"]
              after_circle = images[f"C{branch:02d}-F100.png"]
              for label, box in (("instruction_panel", (140,565,685,715)),
                                 ("confirm_back_footer", (660,685,1130,770))):
                  x1,y1,x2,y2 = box
                  before_roi = first[y1:y2,x1:x2]
                  after_roi = after_circle[y1:y2,x1:x2]
                  changed = int(np.any(before_roi != after_roi, axis=2).sum())
                  print(f"{branch=} {label=} changed_pixels_F60_to_F100={changed}")
                  if changed != 0:
                      raise SystemExit(f"{label} changed after Circle in branch {branch}; investigate semantics")
          def estimate_scene_vertical_shift(before, after, kind):
              # Pixel-only vertical registration of the map background; no extra dependency.
              # Ignore the fixed HUD/foreground/description panels, then find the shift with
              # minimum mean absolute grayscale error over a 4-pixel sampling grid.
              def gray(arr):
                  return arr.astype(np.float32).mean(axis=2)[200:560:4, 16:1264:4]
              a, b = gray(before), gray(after)
              h, w = a.shape
              yy, xx = np.mgrid[200:560:4, 16:1264:4]
              valid = np.ones((h,w), dtype=bool)
              valid &= ~((xx >= 500) & (xx < 800) & (yy >= 230) & (yy < 560))
              if kind == "map":
                  valid &= ~((xx >= 140) & (xx < 550) & (yy >= 320) & (yy < 550))
              candidates = []
              for dy in range(-35, 36):
                  if dy >= 0:
                      aa, bb = a[:h-dy], b[dy:]
                      mm = valid[:h-dy]
                  else:
                      aa, bb = a[-dy:], b[:h+dy]
                      mm = valid[-dy:]
                  if int(mm.sum()) < 500:
                      continue
                  error = float(np.abs(aa-bb)[mm].mean())
                  candidates.append((error, dy*4, int(mm.sum())))
              candidates.sort()
              if not candidates:
                  raise SystemExit("camera shift estimation had no valid overlap")
              return candidates[0][1], candidates[0][0]

          rev65_up_shift, rev65_up_error = estimate_scene_vertical_shift(
              images["C01-F20.png"], images["C01-F60.png"], "rev65")
          rev65_wait_shift, rev65_wait_error = estimate_scene_vertical_shift(
              images["C02-F20.png"], images["C02-F60.png"], "rev65")
          map_up_shift, map_up_error = estimate_scene_vertical_shift(
              map_images["C01-F20.png"], map_images["C01-F60.png"], "map")
          map_wait_shift, map_wait_error = estimate_scene_vertical_shift(
              map_images["C02-F20.png"], map_images["C02-F60.png"], "map")
          print(f"CAMERA_SHIFT_ESTIMATE revision65_UP={rev65_up_shift}px revision65_WAIT={rev65_wait_shift}px map_UP={map_up_shift}px map_WAIT={map_wait_shift}px")
          if not (92 <= rev65_up_shift <= 108 and 92 <= map_up_shift <= 108):
              raise SystemExit("expected ~100px scene shift did not reproduce in both UP branches")
          if abs(rev65_wait_shift) > 4 or abs(map_wait_shift) > 4:
              raise SystemExit("WAIT control unexpectedly showed a comparable scene shift")
          print("CAMERA_SHIFT_REGRESSION=PASS UP_scene_shift_approx_100px WAIT_scene_shift_approx_0px target_selection_not_inferred=true")
          print("MAP_CONTEXT_PANEL_REGRESSION=PASS up_panel_changes_to_level1_value60_durability2of2 wait_panel_stays_empty_land_value140 known_map_cue=red_focus_arrows_plus_matching_tile_panel")
          print("REV65_CAMERA_PAN_CONFOUND_REGRESSION=PASS baseline_pink60_partly_visible=true post_UP_badge_exposed=true exposure_is_not_selection_proof=true target_role=UNKNOWN")
          print("REV65_PINK60_MARKER_REGRESSION=PASS action_badge_visible=true control_badge_absent=true prompt_unchanged_after_circle=true target_semantics=UNKNOWN input_policy=WAIT")
          PY
