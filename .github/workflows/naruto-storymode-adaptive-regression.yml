              map_up_pulse_rgb[key], map_wait_pulse_rgb[key] = up_rgb, wait_rgb
              distance = float(np.linalg.norm(np.asarray(up_rgb) - np.asarray(wait_rgb)))
              pulse_distances[key] = distance
              print(f"PINK_BADGE_PULSE_PHASE {key} map_UP_rgb={tuple(round(x,1) for x in up_rgb)} map_WAIT_rgb={tuple(round(x,1) for x in wait_rgb)} rgb_distance={distance:.2f} UP_pixels={up_pixels} WAIT_pixels={wait_pixels}")
          if not same_badge_pulse_across_contexts(map_up_pulse_rgb, map_wait_pulse_rgb):
