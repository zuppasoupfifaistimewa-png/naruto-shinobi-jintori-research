          print("LEVELUP_TARGET_CUE_REGRESSION=PASS cue_requires_ring_and_stats_panel_footprint_and_text_transition=true map_UP_reference_match=true map_WAIT_reference_match=false submenu_UP_match=false submenu_WAIT_match=false submenu_target=UNKNOWN input_policy=WAIT")
