name: Step 4 — static helper return and seed-setter audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step4-helper-return-static-audit.yml"
      - "tools/ghidra/ExportFunctionDetail.java"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step4-helper-return-static-audit
  cancel-in-progress: false

jobs:
  helper-return-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GHIDRA_ASSET: "ghidra_12.2_PUBLIC_20261016.zip"
      GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      GHIDRA_CACHE_DIR: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4

      - name: Install disc extraction utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Fetch and verify BIN/CUE; extract the main executable on runner
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/step4-helper-audit"
          src="$root/source"
          tree="$root/extracted-root"
          out="$RUNNER_TEMP/step4-helper-audit-output"
          mkdir -p "$src" "$tree" "$out"
          bin="$src/naruto-disc.bin"
          cue_raw="$src/original.cue"
          cue="$src/naruto-disc.cue"
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream"             -H "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https'             --retry 2 --retry-delay 2 --max-time 600             "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/647346873" -o "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream"             -H "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https'             --retry 2 --retry-delay 2 --max-time 60             "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/647354760" -o "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check
          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re, sys
          source, destination=map(Path,sys.argv[1:3])
          lines, rewritten, count=source.read_text(encoding="utf-8").splitlines(), [], 0
          for line in lines:
              if line.lstrip().upper().startswith("FILE "):
                  m=re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$',line,re.I)
                  if not m: raise SystemExit("Unrecognized CUE FILE directive")
                  line=m.group(1)+'"naruto-disc.bin"'+m.group(2); count+=1
              rewritten.append(line)
          if count!=1: raise SystemExit(f"Expected one FILE directive, got {count}")
          destination.write_text("\n".join(rewritten)+"\n",encoding="utf-8")
          PY
          bchunk "$bin" "$cue" "$src/track"
          iso="$(find "$src" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$tree" > "$out/disc-extraction.log" 2>&1
          candidate="$(find "$tree" -type f -iname 'SLPS_035.53*' -print -quit)"
          [[ -n "$candidate" ]]
          exe="$root/SLPS_035.53"
          cp "$candidate" "$exe"
          [[ "$(stat -c '%s' "$exe")" == "385024" ]]
          echo "a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569  $exe" | sha256sum --check
          [[ "$(head -c 8 "$exe")" == "PS-X EXE" ]]
          rm -rf "$src" "$tree"
          test ! -e "$src" && test ! -e "$tree"
          echo "source_disc_removed_before_ghidra=PASS"
          echo "executable_bytes=385024" > "$out/input-identity.txt"
          echo "executable_sha256=a97b3ebea329b267c186ae52fd21edb1891d66377d475cef32db5f133c296569" >> "$out/input-identity.txt"
          echo "input_executable_uploaded=no" >> "$out/input-identity.txt"

      - name: Restore cached Ghidra
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ghidra/ghidra_12.2_PUBLIC_20261016
          key: ghidra-12.2-linux-x64-2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67

      - name: Install Ghidra when cache is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GHIDRA_CACHE_DIR"
          if ! find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit | grep -q .; then
            archive="$RUNNER_TEMP/$GHIDRA_ASSET"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https'               --retry 3 --retry-delay 2               "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ASSET" -o "$archive"
            echo "$GHIDRA_SHA256  $archive" | sha256sum --check
            unzip -q "$archive" -d "$GHIDRA_CACHE_DIR"
            rm -f "$archive"
          fi

      - name: Decompile helper and setter; export raw instructions and xrefs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/step4-helper-audit-output"
          exe="$RUNNER_TEMP/step4-helper-audit/SLPS_035.53"
          project="$RUNNER_TEMP/step4-helper-ghidra-project"
          mkdir -p "$project" "$out"
          headless="$(find "$GHIDRA_CACHE_DIR" -type f -path '*/support/analyzeHeadless' -print -quit)"
          [[ -n "$headless" && -x "$headless" ]]
          "$headless" "$project" Naruto_seed_helper_audit             -import "$exe"             -loader BinaryLoader -loader-baseAddr 0x80010000 -loader-fileOffset 0x800             -loader-length 0x5D800 -loader-blockName MAIN_TEXT             -processor "MIPS:LE:32:default"             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra"             -preScript PreparePsxExe.java             -postScript ExportFunctionDetail.java "$out/seed-helper-detail.txt" 0x80037138 0x80035DA8 0x80037B58 0x80037BB0 0x8003755C 0x800373F8 0x800373C8 0x80037C48 0x80043F18 0x80043AB8             -analysisTimeoutPerFile 600 -max-cpu 2 -deleteProject             > "$out/ghidra-headless.log" 2>&1
          grep -Eiq "^=== TARGET (0x)?80037138 ===$" "$out/seed-helper-detail.txt"
          grep -Eiq "^=== TARGET (0x)?80035DA8 ===$" "$out/seed-helper-detail.txt"
          grep -Eiq "^=== TARGET (0x)?80043F18 ===$" "$out/seed-helper-detail.txt"
          echo "helper_function_and_setter_detail=PASS"
          echo "runtime_call_contract=NOT_PROVEN"
          echo "hypothetical_DATA_BIN_entry0_base=0x800AD000"
          echo "hypothetical_DATA_BIN_entry1_base=0x800D0000"

      - name: Remove private inputs and Ghidra project
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/step4-helper-audit" "$RUNNER_TEMP/step4-helper-ghidra-project"
          if [[ ! -e "$RUNNER_TEMP/step4-helper-audit" && ! -e "$RUNNER_TEMP/step4-helper-ghidra-project" ]]; then
            echo "STEP4_HELPER_PRIVATE_CLEANUP=PASS"
          else
            echo "STEP4_HELPER_PRIVATE_CLEANUP=FAIL"
            exit 1
          fi
          printf 'game_or_emulator_executed=no\ngameplay_input_sent=no\nsavestate_restored=no\nprivate_binary_uploaded=no\n' >> "$RUNNER_TEMP/step4-helper-audit-output/input-identity.txt"

      - name: Validate text-only output and upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/step4-helper-audit-output"
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          bad=[p.name for p in root.iterdir() if p.is_file() and p.suffix.lower() not in {".txt",".log"}]
          if bad: raise SystemExit("NON_TEXT_OUTPUT: "+", ".join(bad))
          print("text_only_output_validation=PASS")
          print("uploaded_input_executable=no")
          PY
      - name: Upload text-only helper report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-helper-return-static-audit
          path: ${{ runner.temp }}/step4-helper-audit-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish text-only helper detail and Actions summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/step4-helper-audit-output"
          mkdir -p "$out"
          dest="reports/stage1_economy/at1-helper-a1-audit-run-$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dest"
          for name in seed-helper-detail.txt input-identity.txt ghidra-headless.log; do
            if [ -f "$out/$name" ]; then cp "$out/$name" "$dest/"; fi
          done
          if python3 - "$out/seed-helper-detail.txt" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          def has_body(addr):
              m = re.search(r"^=== TARGET (?:0x)?" + addr + r" ===\r?\n(.*?)(?=^=== TARGET |\\Z)", text, re.M | re.S | re.I)
              return bool(m and "RAW_FUNCTION_BODY_BEGIN" in m.group(1))
          if not has_body("80043f18") or not has_body("80043ab8"):
              raise SystemExit("INCOMPLETE: expected both target bodies")
          print("PASS: both 0x80043F18 and 0x80043AB8 bodies exported")
          PY
          then
            status="PASS"; rc="0"
          else
            status="INCOMPLETE"; rc="1"
          fi
          JOB_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$RESEARCH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | jq -r '.jobs[] | select(.name=="helper-return-audit") | .id' | head -n 1)"
          test -n "$JOB_ID" && test "$JOB_ID" != null || JOB_ID="TIDAK TAHU"
          {
            echo "STATUS=$status"
            echo "JOB=helper-return-audit"
            echo "JOB_ID=$JOB_ID"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXIT_CODE=$rc"
            echo "TARGETS=0x80043F18,0x80043AB8"
            echo "METHOD=Ghidra static disassembly only; no emulator/gameplay input."
          } > "$dest/ACTIONS_RUN_SUMMARY.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "Publish static a1 helper provenance for 0x80043F18 run $GITHUB_RUN_ID"
          pushed=0
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep "$n"; continue; }
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep "$n"
          done
          test "$pushed" -eq 1
          echo "AT1_HELPER_REPORT_PATH=$dest"
