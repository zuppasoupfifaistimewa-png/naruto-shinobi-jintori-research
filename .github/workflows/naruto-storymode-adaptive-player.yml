            echo "ADAPTIVE_RESTORE_ONLY_NO_INPUT_ASSERT=PASS press_events=0 suppressed_input_calls=$suppressed_count" >> "$WORK/captures/pcsx-adaptive.stdout"
            echo "ADAPTIVE_RESTORE_TEST=PASS source_sha256=$SOURCE_SHA256 event=ExecutionFlow::SaveStateLoaded post_restore_frame=C01-F20 captures=5 no_input=true" >> "$WORK/captures/pcsx-adaptive.stdout"
          elif [ "$CONTINUATION_TEST" = "1" ]; then
            test "$CYCLES" -eq 2
            grep -q 'ADAPTIVE_POLICY_GUARD=PASS cycle=2' "$WORK/captures/policy-guard-report.txt"
            for cycle in 1 2; do
              first="$WORK/captures/C$(printf '%02d' "$cycle")-F20.png"
              last="$WORK/captures/C$(printf '%02d' "$cycle")-F180.png"
              first_sha="$(sha256sum "$first" | cut -d ' ' -f1)"
              last_sha="$(sha256sum "$last" | cut -d ' ' -f1)"
              if [ "$first_sha" = "$last_sha" ]; then
                echo "ADAPTIVE_CONTINUATION_VISUAL_DELTA=FAIL cycle=$cycle identical_frame_sha256=$first_sha"
                exit 1
              fi
              echo "ADAPTIVE_CONTINUATION_VISUAL_DELTA=PASS cycle=$cycle f20_sha256=$first_sha f180_sha256=$last_sha"
            done
            grep -q 'ADAPTIVE_LOAD_EVENT=PASS event=ExecutionFlow::SaveStateLoaded' "$WORK/captures/pcsx-adaptive.stdout"
            test "$(grep -c 'ADAPTIVE_LOAD_EVENT=PASS event=ExecutionFlow::SaveStateLoaded' "$WORK/captures/pcsx-adaptive.stdout")" -eq 2
            echo "ADAPTIVE_CONTINUATION_TEST=PASS parent_sha256=$SOURCE_SHA256 cycles=2 fresh_processes=2 captures=10 checkpoint_chain=validated policy_guard=PASS"
          else
            grep -q 'ADAPTIVE_GAMEPLAY_PROGRESS=PASS from=map to=' "$WORK/captures/progress-report.txt"
          fi
          if [ "$CYCLES" -ge 2 ] && [ "$RESTORE_TEST" != "1" ] && [ "$CONTINUATION_TEST" != "1" ] && [ "$AB_TEST" != "1" ]; then grep -q 'ADAPTIVE_DIALOGUE_SKIP=PASS cycle=1' "$WORK/captures/pcsx-adaptive.stdout"; fi
          echo "ADAPTIVE_LOOP_TEST=PASS cycles=$CYCLES captures=$((CYCLES * 5)) checkpoints=$CYCLES fresh_process_checkpoint_resume=checked restore_test=$RESTORE_TEST continuation_test=$CONTINUATION_TEST ab_test=$AB_TEST dialogue_start_policy=checked"

      - name: Upload private adaptive screenshots, decisions, logs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          path: |
            /tmp/naruto-storymode-adaptive-player/captures/*
          # Preserve private emulator checkpoints long enough for multi-run continuation.
          retention-days: 90
          if-no-files-found: warn

      - name: Remove private game assets and checkpoint copies
        if: always()
        shell: bash
        run: rm -rf "$WORK"
