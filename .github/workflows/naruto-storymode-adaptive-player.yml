name: Naruto Story Mode adaptive checkpoint player

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-adaptive-player"

permissions:
  contents: read
  actions: read

concurrency:
  group: naruto-storymode-adaptive-player
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-ADAPTIVE-PLAYER]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-adaptive-player
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install X11 tools and prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3-pil python3-numpy xvfb x11-utils x11-apps imagemagick curl unzip
          mkdir -p "$WORK"/{build-artifact,state-artifact,card-artifact,cards,resume,captures,home,.config,.data,runtime}
          chmod 700 "$WORK/runtime"

      - name: Download previously built patched PCSX-Redux
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-adaptive-player/build-artifact

      - name: Download verified board checkpoint from run 39685868421
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-next-roulette-circle-diff-private
          run-id: 39685868421
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-adaptive-player/state-artifact

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-adaptive-player/card-artifact

      - name: Validate immutable board checkpoint and stage read-only copy
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          SOURCE="$WORK/state-artifact/next-roulette-result-none-f180.sstate"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          test -f "$APP" && chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$SOURCE")" = 21162945
          test "$(sha256sum "$SOURCE" | cut -d ' ' -f1)" = 19388b5a9b59c77e443f47abdc7c6f98251ef4a1be1b512378faab217a658ae9
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$SOURCE" "$WORK/resume/storymode-adaptive-source-f180.sstate"
          chmod 400 "$WORK/resume/storymode-adaptive-source-f180.sstate"
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          {
            echo "SOURCE_RUN=39685868421"
            echo "SOURCE_BYTES=21162945"
            echo "SOURCE_SHA256=19388b5a9b59c77e443f47abdc7c6f98251ef4a1be1b512378faab217a658ae9"
            echo "SOURCE_COPY_READ_ONLY=YES"
            echo "LOOP_CYCLES=2"
            echo "CYCLE=observe external X11 at F20 -> decide -> input F30-F38 -> verify F60/F100 -> checkpoint F180"
            echo "POLICY=START on calibrated dialogue; wait roulette then Circle only if it persists; Circle only when calibrated YES is visibly highlighted; route directions rotate after repeated map state; unknown states WAIT"
            echo "INTERNAL_EMULATOR_SCREENSHOT_API=DISABLED"
          } | tee "$WORK/captures/source-validation.txt"
          echo "ADAPTIVE_SOURCE_VALIDATION=PASS"

      - name: Download game and SCPH-7502 BIOS from private runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0]); h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("WHEEL_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Run adaptive observe-decide-act-verify-checkpoint loop
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("ADAPTIVE_PAD_SETUP=PASS")
          LUA
          )
          cat > "$WORK/storymode-adaptive.lua" <<'LUA'
          local maxCycles=2 -- multi-cycle regression after one-cycle smoke passed
          local frame=0; local loadStarted=false; local loadReturned=false; local loaded=false
          local activeButton=nil
          local pad=PCSX.SIO0.slots[1].pads[1]
          local buttons=PCSX.CONSTS.PAD.BUTTON
          local function log(s) print(s); io.stdout:flush() end
          local function checkpoint(cycle)
              local ok,state=pcall(function() return PCSX.createSaveState() end)
              if not ok or not state then log("ADAPTIVE_CHECKPOINT_ERROR cycle="..cycle.." err="..tostring(state)); PCSX.quit(71); return end
              local path=string.format("captures/adaptive-cycle-%02d-f180.sstate",cycle)
              local opened,file=pcall(function() return assert(Support.File.open(path,"TRUNCATE")) end)
              if not opened or not file then log("ADAPTIVE_CHECKPOINT_OPEN_ERROR cycle="..cycle.." err="..tostring(file)); PCSX.quit(72); return end
              local wrote,err=pcall(function() file:writeMoveSlice(state); file:close() end)
              if not wrote then log("ADAPTIVE_CHECKPOINT_WRITE_ERROR cycle="..cycle.." err="..tostring(err)); PCSX.quit(73); return end
              log("ADAPTIVE_CHECKPOINT_CREATED=PASS cycle="..cycle.." path="..path)
          end
          local function captureExternal(label,cycle)
              local xwd="captures/"..label..".xwd"
              local tmp="captures/."..label..".png.tmp"
              local png="captures/"..label..".png"
              os.remove(xwd); os.remove(tmp); os.remove(png)
              -- External X11 capture runs synchronously inside this VSync callback.
              local command="xwd -root -silent -out "..xwd.." && convert "..xwd.." "..tmp.." && mv "..tmp.." "..png.." && rm -f "..xwd
              local a,b,c=os.execute(command)
              local commandOk=(a==true or a==0 or c==0)
              local file=io.open(png,"rb")
              if not commandOk or not file then
                  if file then file:close() end
                  log("ADAPTIVE_X11_CAPTURE_FAIL label="..label.." status="..tostring(a)..":"..tostring(b)..":"..tostring(c))
                  PCSX.quit(86); return nil,nil,nil
              end
              local bytes=file:seek("end"); file:close()
              if not bytes or bytes<1000 then log("ADAPTIVE_X11_CAPTURE_INVALID label="..label); PCSX.quit(87); return nil,nil,nil end
              local script="python3 tools/storymode_adaptive_agent.py "..png.." --output captures/verification-"..label..".json"
              local hf=io.open("captures/history.json","r")
              if hf then hf:close(); script=script.." --history captures/history.json" end
              local pipe=io.popen(script.." 2>&1","r")
              if not pipe then log("ADAPTIVE_CLASSIFIER_START_FAIL label="..label); PCSX.quit(88); return nil,nil,nil end
              local result=pipe:read("*a") or ""; pipe:close()
              local state=result:match('"state"%s*:%s*"([%w_]+)')
              local action=result:match('"action"%s*:%s*"([%w_]+)')
              if not state or not action then log("ADAPTIVE_CLASSIFIER_FAIL label="..label.." output="..result:gsub("[\r\n]"," ")); PCSX.quit(89); return nil,nil,nil end
              log("ADAPTIVE_X11_CAPTURE label="..label.." size=1280x800 bytes="..bytes.." valid=true source=external_xwd")
              log("ADAPTIVE_OBSERVED label="..label.." state="..state.." action="..action.." confidence="..(result:match('"confidence"%s*:%s*([%d%.]+)') or "0"))
              return state,action,result
          end
          local function sendAction(action,cycle)
              if action=="WAIT" or action=="NONE" or action=="" then
                  log("ADAPTIVE_INPUT cycle="..cycle.." action=WAIT status=PASS reason=no_input_policy")
                  return
              end
              local b=buttons[action]
              if not b then log("ADAPTIVE_INPUT_ERROR cycle="..cycle.." invalid_action="..tostring(action)); PCSX.quit(83); return end
              local ok,v=pcall(function() pad.setOverride(b); return pad.getButton(b) end)
              local pass=ok and v==true
              log("ADAPTIVE_INPUT cycle="..cycle.." action="..action.." phase=press readback="..tostring(v).." status="..(pass and "PASS" or "FAIL"))
              if not pass then PCSX.quit(84); return end
              activeButton=b
          end
          local function releaseAction(cycle)
              if not activeButton then return end
              local b=activeButton
              local ok,v=pcall(function() pad.clearOverride(b); return pad.getButton(b) end)
              local pass=ok and v==false
              log("ADAPTIVE_INPUT cycle="..cycle.." phase=release readback="..tostring(v).." status="..(pass and "PASS" or "FAIL"))
              activeButton=nil
              if not pass then PCSX.quit(85) end
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("ADAPTIVE_LOAD_EVENT=PASS")
          end)
          local plannedAction={}
          local plannedState={}
          local plannedDecision={}
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not loadStarted then
                  loadStarted=true; log("ADAPTIVE_LOAD_BEGIN=1"); PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/storymode-adaptive-source-f180.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("ADAPTIVE_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      loadReturned=true; log("ADAPTIVE_LOAD_CALL_RETURNED=1"); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not loadReturned then return end
              frame=frame+1
              local cycle=math.floor((frame-1)/180)+1
              local phase=((frame-1)%180)+1
              if cycle>maxCycles then PCSX.quit(0); return end
              if phase==20 then
                  local state,action,result=captureExternal(string.format("C%02d-F20",cycle),cycle)
                  if not state then return end
                  plannedState[cycle]=state; plannedAction[cycle]=action; plannedDecision[cycle]=result
                  local df=assert(io.open(string.format("captures/decision-cycle-%02d.json",cycle),"wb")); df:write(result); df:close()
                  local af=assert(io.open(string.format("captures/action-cycle-%02d.txt",cycle),"wb")); af:write(action.."\n"); af:close()
                  log("ADAPTIVE_DECISION cycle="..cycle.." state="..state.." action="..action.." reason=synchronous_external_X11_classification")
                  if cycle==2 then
                      local safe=(state=="battle_untrained" and action=="WAIT")
                      local marker="ADAPTIVE_BATTLE_FAIL_CLOSED="..(safe and "PASS" or "FAIL").." cycle=2 state="..state.." action="..action
                      local bf=assert(io.open("captures/battle-regression-report.txt","wb")); bf:write(marker.."\n"); bf:close()
                      log(marker)
                  end
              elseif phase==30 then
                  sendAction(plannedAction[cycle] or "WAIT",cycle)
              elseif phase==38 then
                  releaseAction(cycle)
              elseif phase==60 then
                  captureExternal(string.format("C%02d-F60",cycle),cycle)
              elseif phase==100 then
                  local label=string.format("C%02d-F100",cycle)
                  local state,action=captureExternal(label,cycle)
                  if not state then return end
                  local before=plannedState[cycle] or "unknown"; local act=plannedAction[cycle] or "WAIT"
                  log("ADAPTIVE_ACTION_VERIFICATION cycle="..cycle.." before="..before.." action="..act.." observed_after="..state.." state_changed="..tostring(before~=state))
                  if before=="map" and state=="battle_untrained" then
                      local marker="ADAPTIVE_GAMEPLAY_PROGRESS=PASS from=map to=battle_untrained label="..label
                      local pf=assert(io.open("captures/progress-report.txt","wb")); pf:write(marker.."\n"); pf:close()
                      log(marker)
                  end
              elseif phase==180 then
                  local state,action=captureExternal(string.format("C%02d-F180",cycle),cycle)
                  if not state then return end
                  local count=0
                  local reported=tonumber((plannedDecision[cycle] or ""):match('"roulette_wait_count"%s*:%s*(%d+)')) or 0
                  if state=="roulette" and (plannedAction[cycle] or "WAIT")=="WAIT" then count=reported end
                  local ht=string.format('{"last_state":"%s","last_action":"%s","roulette_wait_count":%d}\n',state,plannedAction[cycle] or "WAIT",count)
                  local hf=assert(io.open("captures/history.json","wb")); hf:write(ht); hf:close()
                  checkpoint(cycle)
                  if cycle==maxCycles then log("ADAPTIVE_LOOP_FINISHED cycles="..maxCycles); PCSX.quit(0); return end
              end
          end)
          log("ADAPTIVE_SCRIPT_READY cycles="..maxCycles.." source=verified-board-f180 captures=EXTERNAL_X11_ONLY")
          LUA
          mkdir -p "$WORK/tools"
          cp "$GITHUB_WORKSPACE/tools/storymode_adaptive_agent.py" "$WORK/tools/storymode_adaptive_agent.py"
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          cp "$WORK/storymode-adaptive.lua" "$WORK/captures/storymode-adaptive.lua"
          PROBE_MODE=ADAPTIVE timeout --signal=TERM --kill-after=5s 240s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
            -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$WORK/cards/naruto-storymode-template.mcd" \
            -exec "$PAD_SETUP" -dofile "$WORK/storymode-adaptive.lua" -softgpu -dynarec -stdout -lua_stdout \
            -logfile "$WORK/captures/pcsx-adaptive.log" -run > "$WORK/captures/pcsx-adaptive.stdout" 2>&1 &
          pid=$!
          python3 - "$pid" "$WORK/captures/pcsx-adaptive.stdout" "$WORK/captures" "$WORK" <<'PY'
          import sys,time,subprocess,hashlib,json
          from pathlib import Path
          from PIL import Image
          pid=int(sys.argv[1]); stdout=Path(sys.argv[2]); out=Path(sys.argv[3])
          cycles=2; phases=(20,60,100,180)
          labels=["C%02d-F%d"%(c,p) for c in range(1,cycles+1) for p in phases]
          done=set(); deadline=time.monotonic()+60
          def alive():
              q=subprocess.run(["ps","-o","stat=","-p",str(pid)],capture_output=True,text=True)
              st=q.stdout.strip(); return bool(st) and not st.startswith("Z")
          def tail():
              try: return stdout.read_text(errors="replace").splitlines()[-12:]
              except FileNotFoundError: return []
          while len(done)<len(labels) and time.monotonic()<deadline:
              for label in labels:
                  if label in done: continue
                  png=out/(label+".png")
                  vpath=out/("verification-"+label+".json")
                  if not png.is_file() or not vpath.is_file(): continue
                  with Image.open(png) as im:
                      size=im.size; im.verify()
                  with Image.open(png) as im:
                      valid=size==(1280,800) and png.stat().st_size>1000 and im.getbbox() is not None
                  if not valid: raise SystemExit("invalid external X11 image: "+label)
                  v=json.loads(vpath.read_text(encoding="utf-8"))
                  digest=hashlib.sha256(png.read_bytes()).hexdigest()
                  print("ADAPTIVE_X11_VALIDATED label={} size={} bytes={} sha256={} state={} confidence={:.2f}".format(label,size,png.stat().st_size,digest,v.get("state","unknown"),v.get("confidence",0)),flush=True)
                  if label.endswith("F100"):
                      cycle=int(label[1:3]); dec=json.loads((out/("decision-cycle-%02d.json"%cycle)).read_text())
                      print("ADAPTIVE_ACTION_VERIFICATION cycle={} before={} action={} observed_after={} state_changed={}".format(cycle,dec.get("state"),dec.get("action"),v.get("state"),str(dec.get("state")!=v.get("state")).lower()),flush=True)
                  done.add(label)
              if len(done)<len(labels): time.sleep(.01)
          missing=sorted(set(labels)-done)
          if missing:
              print("ADAPTIVE_CAPTURE_WATCHDOG_FAIL missing={} process_alive={} stdout_tail={}".format(missing,alive(),json.dumps(tail())),flush=True)
              raise SystemExit(91)
          cps=sorted(out.glob("adaptive-cycle-*-f180.sstate"))
          summary=[{"file":p.name,"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in cps]
          print("ADAPTIVE_WATCHDOG_END captures={}/{} checkpoints={} hashes={}".format(len(done),len(labels),len(cps),json.dumps(summary)),flush=True)
          if len(cps)!=cycles: raise SystemExit("ADAPTIVE_CHECKPOINT_COUNT_FAIL")
          if not (out/"progress-report.txt").is_file(): raise SystemExit("ADAPTIVE_GAMEPLAY_PROGRESS_FAIL")
          rpt=out/"battle-regression-report.txt"
          if not rpt.is_file() or "ADAPTIVE_BATTLE_FAIL_CLOSED=PASS cycle=2 state=battle_untrained action=WAIT" not in rpt.read_text():
              raise SystemExit("ADAPTIVE_BATTLE_FAIL_CLOSED_FAIL")
          PY

          set +e
          wait "$pid"
          rc=$?
          set -e
          echo "ADAPTIVE_EMULATOR_EXIT=$rc"
          test "$rc" -eq 0
          test "$(find "$WORK/captures" -maxdepth 1 -name 'C*-F*.png' | wc -l)" -eq 8
          test "$(find "$WORK/captures" -maxdepth 1 -name 'adaptive-cycle-*-f180.sstate' | wc -l)" -eq 2
          grep -q 'ADAPTIVE_BATTLE_FAIL_CLOSED=PASS cycle=2 state=battle_untrained action=WAIT' "$WORK/captures/battle-regression-report.txt"
          grep -q 'ADAPTIVE_INPUT cycle=2 action=WAIT status=PASS' "$WORK/captures/pcsx-adaptive.stdout"
          for state in "$WORK"/captures/adaptive-cycle-*-f180.sstate; do
            bytes="$(stat -c %s "$state")"
            sha="$(sha256sum "$state" | cut -d ' ' -f1)"
            echo "ADAPTIVE_CHECKPOINT_FILE=$(basename "$state") BYTES=$bytes SHA256=$sha"
            test "$bytes" -gt 21000000
            python3 - "$state" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          with p.open("rb") as f: header=f.read(96)
          if b"PCSX-Redux SaveState v4" not in header:
              raise SystemExit("invalid PCSX savestate v4 header: "+p.name)
          if p.stat().st_size <= 21000000:
              raise SystemExit("checkpoint size below expected raw range: "+p.name)
          print("ADAPTIVE_CHECKPOINT_HEADER=PASS file="+p.name)
          PY
            echo "ADAPTIVE_CHECKPOINT_STRUCTURAL_VALIDATION=PASS file=$(basename "$state") bytes=$bytes sha256=$sha"
          done
          grep -q 'ADAPTIVE_GAMEPLAY_PROGRESS=PASS from=map to=battle_untrained' "$WORK/captures/progress-report.txt"
          echo "ADAPTIVE_LOOP_TEST=PASS cycles=2 captures=8 checkpoints=2 gameplay_state_transition=verified battle_fail_closed=verified"

      - name: Upload private adaptive screenshots, decisions, logs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-storymode-adaptive-player-private
          path: |
            /tmp/naruto-storymode-adaptive-player/captures/*
          retention-days: 14
          if-no-files-found: warn

      - name: Remove private game assets and checkpoint copies
        if: always()
        shell: bash
        run: rm -rf "$WORK"
