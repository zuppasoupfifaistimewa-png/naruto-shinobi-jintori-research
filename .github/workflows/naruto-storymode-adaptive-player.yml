name: Naruto Story Mode adaptive checkpoint player

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/.run-storymode-adaptive-player"

permissions:
  contents: read
  actions: read

concurrency:
  group: naruto-storymode-adaptive-player
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-NARUTO-STORYMODE-ADAPTIVE-PLAYER]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:latest
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      WORK: /tmp/naruto-storymode-adaptive-player
      RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research

    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install X11 tools and prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          # Bound package-network waits so a stalled mirror cannot consume the whole player timeout.
          timeout 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
          timeout 240s env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y jq python3-pil python3-numpy xvfb x11-utils x11-apps imagemagick curl unzip
          mkdir -p "$WORK"/{build-artifact,state-artifact,card-artifact,cards,resume,captures,home,.config,.data,runtime}
          chmod 700 "$WORK/runtime"

      - name: Read and validate source checkpoint selector
        id: source
        shell: bash
        run: |
          set -euo pipefail
          marker="experiments/.run-storymode-adaptive-player"
          get_value() { awk -F= -v key="$1" '$1==key {print $2; exit}' "$marker"; }
          source_run="$(get_value SOURCE_RUN)"
          source_artifact="$(get_value SOURCE_ARTIFACT)"
          source_checkpoint="$(get_value SOURCE_CHECKPOINT)"
          source_sha256="$(get_value SOURCE_SHA256)"
          loop_cycles="$(get_value LOOP_CYCLES)"
          restore_test="$(get_value RESTORE_TEST)"
          continuation_test="$(get_value CONTINUATION_TEST)"
          ab_test="$(get_value AB_TEST)"
          ab_action="$(get_value AB_ACTION)"
          ab_expected_state="$(get_value AB_EXPECTED_STATE)"
          ab_test="${ab_test:-0}"
          ab_action="${ab_action:-DOWN}"
          ab_expected_state="${ab_expected_state:-menu_or_unknown_choice}"
          [[ "$source_run" =~ ^[0-9]+$ ]]
          [[ "$source_artifact" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$source_checkpoint" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$source_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$loop_cycles" == "1" || "$loop_cycles" == "2" ]]
          [[ "$restore_test" == "0" || "$restore_test" == "1" ]]
          [[ "$continuation_test" == "0" || "$continuation_test" == "1" ]]
          [[ "$ab_test" == "0" || "$ab_test" == "1" ]]
          [[ "$ab_action" == "UP" || "$ab_action" == "DOWN" || "$ab_action" == "LEFT" || "$ab_action" == "RIGHT" || "$ab_action" == "TRIANGLE" || "$ab_action" == "CROSS" || "$ab_action" == "CIRCLE" ]]
          [[ "$ab_expected_state" == "menu_or_unknown_choice" || "$ab_expected_state" == "map_after_move" || "$ab_expected_state" == "roulette" || "$ab_expected_state" == "card_selection" || "$ab_expected_state" == "card_selection_detail" || "$ab_expected_state" == "barrier_level_selection" ]]
          if [ "$ab_test" = "1" ]; then
            if [ "$ab_expected_state" = "map_after_move" ]; then
              [[ "$ab_action" == "UP" || "$ab_action" == "DOWN" || "$ab_action" == "LEFT" || "$ab_action" == "RIGHT" || "$ab_action" == "CROSS" ]]
            elif [ "$ab_expected_state" = "roulette" ]; then
              [[ "$ab_action" == "CIRCLE" ]]
            elif [ "$ab_expected_state" = "card_selection" ]; then
              [[ "$ab_action" == "CIRCLE" ]]
            elif [ "$ab_expected_state" = "card_selection_detail" ]; then
              [[ "$ab_action" == "CIRCLE" ]]
            elif [ "$ab_expected_state" = "barrier_level_selection" ]; then
              [[ "$ab_action" == "UP" || "$ab_action" == "DOWN" || "$ab_action" == "LEFT" || "$ab_action" == "RIGHT" ]]
            else
              [[ "$ab_action" == "DOWN" || "$ab_action" == "TRIANGLE" || "$ab_action" == "CIRCLE" ]]
            fi
            [[ "$loop_cycles" == "2" && "$restore_test" == "0" && "$continuation_test" == "0" ]]
          fi
          {
            echo "run_id=$source_run"
            echo "artifact_name=$source_artifact"
            echo "checkpoint=$source_checkpoint"
            echo "sha256=$source_sha256"
            echo "loop_cycles=$loop_cycles"
            echo "restore_test=$restore_test"
            echo "continuation_test=$continuation_test"
            echo "ab_test=$ab_test"
            echo "ab_action=$ab_action"
            echo "ab_expected_state=$ab_expected_state"
          } >> "$GITHUB_OUTPUT"

      - name: Download previously built patched PCSX-Redux
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-control-probe-private
          run-id: 39513285641
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-adaptive-player/build-artifact

      - name: Download selected private source checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-adaptive-player/state-artifact

      - name: Download original private Memory Card
        uses: actions/download-artifact@v4
        with:
          name: naruto-storymode-memory-card-private
          run-id: 39262213468
          github-token: ${{ github.token }}
          repository: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          path: /tmp/naruto-storymode-adaptive-player/card-artifact

      - name: Validate immutable source checkpoint and stage read-only copy
        shell: bash
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          SOURCE_ARTIFACT: ${{ steps.source.outputs.artifact_name }}
          SOURCE_CHECKPOINT: ${{ steps.source.outputs.checkpoint }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
          LOOP_CYCLES: ${{ steps.source.outputs.loop_cycles }}
          RESTORE_TEST: ${{ steps.source.outputs.restore_test }}
          CONTINUATION_TEST: ${{ steps.source.outputs.continuation_test }}
          AB_TEST: ${{ steps.source.outputs.ab_test }}
          AB_ACTION: ${{ steps.source.outputs.ab_action }}
          AB_EXPECTED_STATE: ${{ steps.source.outputs.ab_expected_state }}
        run: |
          set -euo pipefail
          APP="$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage"
          SOURCE="$WORK/state-artifact/$SOURCE_CHECKPOINT"
          CARD="$WORK/card-artifact/naruto-storymode.mcd"
          test -f "$APP" && chmod +x "$APP"
          test "$(sha256sum "$APP" | cut -d ' ' -f1)" = 2fb33f631bfd197654d6f4c2dc89b95c4388e68dd1e77ca25a55a80a7035ba99
          test "$(stat -c %s "$SOURCE")" -gt 21000000
          echo "$SOURCE_SHA256  $SOURCE" | sha256sum --check -
          head -c 96 "$SOURCE" | grep -Fq 'PCSX-Redux SaveState v4'
          test "$(stat -c %s "$CARD")" = 131072
          test "$(sha256sum "$CARD" | cut -d ' ' -f1)" = ac0dbcb89e54bcddf7c698fb6fe52cb0ca71977dba2d28e521d6ed556c7a11b5
          cp "$SOURCE" "$WORK/resume/storymode-adaptive-source-f180.sstate"
          chmod 400 "$WORK/resume/storymode-adaptive-source-f180.sstate"
          cp "$CARD" "$WORK/cards/naruto-storymode-template.mcd"
          if [ "$AB_TEST" = "1" ]; then
            cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/naruto-storymode-ab-action.mcd"
            cp "$WORK/cards/naruto-storymode-template.mcd" "$WORK/cards/naruto-storymode-ab-none.mcd"
            cmp -s "$WORK/cards/naruto-storymode-ab-action.mcd" "$WORK/cards/naruto-storymode-ab-none.mcd"
            baseline_card_sha="$(sha256sum "$WORK/cards/naruto-storymode-template.mcd" | cut -d ' ' -f1)"
            action_card_sha="$(sha256sum "$WORK/cards/naruto-storymode-ab-action.mcd" | cut -d ' ' -f1)"
            none_card_sha="$(sha256sum "$WORK/cards/naruto-storymode-ab-none.mcd" | cut -d ' ' -f1)"
            test "$baseline_card_sha" = "$action_card_sha" && test "$action_card_sha" = "$none_card_sha"
            echo "ADAPTIVE_AB_CARD_CLONES=PASS baseline_sha256=$baseline_card_sha action_sha256=$action_card_sha none_sha256=$none_card_sha" | tee "$WORK/captures/ab-card-clones.txt"
          fi
          {
            echo "SOURCE_RUN=$SOURCE_RUN"
            echo "SOURCE_ARTIFACT=$SOURCE_ARTIFACT"
            echo "SOURCE_CHECKPOINT=$SOURCE_CHECKPOINT"
            echo "SOURCE_BYTES=$(stat -c %s "$SOURCE")"
            echo "SOURCE_SHA256=$SOURCE_SHA256"
            echo "SOURCE_COPY_READ_ONLY=YES"
            echo "LOOP_CYCLES=$LOOP_CYCLES"
            echo "RESTORE_TEST=$RESTORE_TEST"
            echo "CONTINUATION_TEST=$CONTINUATION_TEST"
            echo "AB_TEST=$AB_TEST"
            echo "AB_ACTION=$AB_ACTION"
            echo "AB_EXPECTED_STATE=$AB_EXPECTED_STATE"
            echo "CYCLE=observe external X11 at F20 -> decide -> input F30-F38 -> verify F60/F100 -> checkpoint F180"
            echo "POLICY=START on calibrated dialogue; wait roulette then Circle only if it persists; Circle only when calibrated YES is visibly highlighted; route directions rotate after repeated map state; unknown states WAIT"
            echo "INTERNAL_EMULATOR_SCREENSHOT_API=DISABLED"
          } | tee "$WORK/captures/source-validation.txt"
          echo "ADAPTIVE_SOURCE_VALIDATION=PASS"

      - name: Download game and SCPH-7502 BIOS from private runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; out="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            test -n "$id" && test "$id" != null
            curl --fail --silent --show-error --location --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "$out"
          }
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          test "$(stat -c %s game.bin)" = 325989552
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c %s scph7502.zip)" = 283463
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          with zipfile.ZipFile("scph7502.zip") as z:
              members=[]; total=0
              for i in z.infolist():
                  p=PurePosixPath(i.filename); mode=(i.external_attr>>16)&0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)): raise SystemExit("unsafe BIOS archive")
                  total += i.file_size
                  if i.file_size > 2*1024*1024 or total > 4*1024*1024: raise SystemExit("BIOS expansion limit")
                  if not i.is_dir() and i.file_size == 524288: members.append(i)
              if len(members)!=1: raise SystemExit("expected one 512 KiB BIOS")
              bios=z.read(members[0]); h=hashlib.sha256(bios).hexdigest()
              if h!="5e84a94818cf5282f4217591fefd88be36b9b174b3cc7cb0bcd75199beb450f1": raise SystemExit("BIOS hash mismatch")
              Path("scph7502.bin").write_bytes(bios)
              print("WHEEL_BIOS_SHA256="+h)
          lines=Path("game.cue").read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          ix=[i for i,x in enumerate(lines) if x.lstrip().upper().startswith("FILE ")]
          if len(ix)!=1 or not any(x.lstrip().upper().startswith("TRACK ") for x in lines): raise SystemExit("invalid CUE")
          lines[ix[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY

      - name: Run adaptive observe-decide-act-verify-checkpoint loop
        shell: bash
        env:
          RESTORE_TEST: ${{ steps.source.outputs.restore_test }}
          CONTINUATION_TEST: ${{ steps.source.outputs.continuation_test }}
          AB_TEST: ${{ steps.source.outputs.ab_test }}
          AB_ACTION: ${{ steps.source.outputs.ab_action }}
          AB_EXPECTED_STATE: ${{ steps.source.outputs.ab_expected_state }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd "$WORK"
          "$WORK/build-artifact/PCSX-Redux-spu-adpcm-patched.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          Xvfb :99 -ac -screen 0 1280x800x24 +extension GLX +render -nolisten tcp > "$WORK/captures/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/.config" XDG_DATA_HOME="$WORK/.data" XDG_RUNTIME_DIR="$WORK/runtime" LIBGL_ALWAYS_SOFTWARE=1
          for i in $(seq 1 60); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep .25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType='Analog'
          PCSX.settings.pads[1].Connected=true
          PCSX.SIO0.slots[1].pads[1].map()
          print("ADAPTIVE_PAD_SETUP=PASS")
          LUA
          )
          cat > "$WORK/storymode-adaptive.lua" <<'LUA'
          local cycle=tonumber(os.getenv("ADAPTIVE_CYCLE") or "1")
          if cycle<1 or cycle>2 then error("ADAPTIVE_CYCLE must be 1 or 2") end
          local abTest=os.getenv("AB_TEST")=="1"
          local restoreTest=os.getenv("RESTORE_TEST")=="1"
          local abAction=os.getenv("AB_ACTION") or "DOWN"
          local abExpectedState=os.getenv("AB_EXPECTED_STATE") or "menu_or_unknown_choice"
          local frame=0; local loadStarted=false; local loadReturned=false; local loaded=false
          local shutdownFrame=nil
          local activeButton=nil
          local pad=PCSX.SIO0.slots[1].pads[1]
          local buttons=PCSX.CONSTS.PAD.BUTTON
          local function log(s) print(s); io.stdout:flush() end
          local function checkpoint(cycle)
              local ok,state=pcall(function() return PCSX.createSaveState() end)
              if not ok or not state then log("ADAPTIVE_CHECKPOINT_ERROR cycle="..cycle.." err="..tostring(state)); return false end
              local path=string.format("captures/adaptive-cycle-%02d-f180.sstate",cycle)
              local opened,file=pcall(function() return assert(Support.File.open(path,"TRUNCATE")) end)
              if not opened or not file then log("ADAPTIVE_CHECKPOINT_OPEN_ERROR cycle="..cycle.." err="..tostring(file)); return false end
              local wrote,err=pcall(function() file:writeMoveSlice(state) end)
              local closed,closeErr=pcall(function() file:close() end)
              if not wrote then log("ADAPTIVE_CHECKPOINT_WRITE_ERROR cycle="..cycle.." err="..tostring(err)); return false end
              if not closed then log("ADAPTIVE_CHECKPOINT_CLOSE_ERROR cycle="..cycle.." err="..tostring(closeErr)); return false end
              -- Do not read file length/header in the GPU::Vsync callback:
              -- Support.File may finalize visibility after this callback returns.
              -- Shell validates size, v4 header and SHA-256 after emulator exit.
              log("ADAPTIVE_CHECKPOINT_WRITE_RETURNED=PASS cycle="..cycle.." path="..path.." validation=deferred_to_shell_after_emulator_exit")
              return true
          end
          local function captureExternal(label,cycle)
              local xwd="captures/"..label..".xwd"
              local tmp="captures/."..label..".tmp.png"
              local png="captures/"..label..".png"
              os.remove(xwd); os.remove(tmp); os.remove(png)
              -- External X11 capture runs synchronously inside this VSync callback.
              local command="xwd -root -silent -out "..xwd.." && convert "..xwd.." "..tmp.." && mv "..tmp.." "..png.." && rm -f "..xwd
              local a,b,c=os.execute(command)
              local commandOk=(a==true or a==0 or c==0)
              local file=io.open(png,"rb")
              if not commandOk or not file then
                  if file then file:close() end
                  log("ADAPTIVE_X11_CAPTURE_FAIL label="..label.." status="..tostring(a)..":"..tostring(b)..":"..tostring(c))
                  PCSX.quit(86); return nil,nil,nil
              end
              local bytes=file:seek("end"); file:close()
              if not bytes or bytes<1000 then log("ADAPTIVE_X11_CAPTURE_INVALID label="..label); PCSX.quit(87); return nil,nil,nil end
              local script="python3 tools/storymode_adaptive_agent.py "..png.." --output captures/verification-"..label..".json"
              local hf=io.open("captures/history.json","r")
              if hf then hf:close(); script=script.." --history captures/history.json" end
              local pipe=io.popen(script.." 2>&1","r")
              if not pipe then log("ADAPTIVE_CLASSIFIER_START_FAIL label="..label); PCSX.quit(88); return nil,nil,nil end
              local result=pipe:read("*a") or ""; pipe:close()
              local state=result:match('"state"%s*:%s*"([%w_]+)')
              local action=result:match('"action"%s*:%s*"([%w_]+)')
              if not state or not action then log("ADAPTIVE_CLASSIFIER_FAIL label="..label.." output="..result:gsub("[\r\n]"," ")); PCSX.quit(89); return nil,nil,nil end
              log("ADAPTIVE_X11_CAPTURE label="..label.." size=1280x800 bytes="..bytes.." valid=true source=external_xwd")
              log("ADAPTIVE_OBSERVED label="..label.." state="..state.." action="..action.." confidence="..(result:match('"confidence"%s*:%s*([%d%.]+)') or "0"))
              return state,action,result
          end
          local function sendAction(action,cycle)
              -- Central hard gate: restore-only must never mutate pad state, regardless
              -- of which action the classifier or dialogue policy requests.
              if restoreTest then
                  log("ADAPTIVE_RESTORE_ONLY_INPUT_SUPPRESSED cycle="..cycle.." requested_action="..tostring(action))
                  return
              end
              if action=="WAIT" or action=="NONE" or action=="" then
                  log("ADAPTIVE_INPUT cycle="..cycle.." action=WAIT status=PASS reason=no_input_policy")
                  return
              end
              local b=buttons[action]
              if not b then log("ADAPTIVE_INPUT_ERROR cycle="..cycle.." invalid_action="..tostring(action)); PCSX.quit(83); return end
              local ok,v=pcall(function() pad.setOverride(b); return pad.getButton(b) end)
              local pass=ok and v==true
              log("ADAPTIVE_INPUT cycle="..cycle.." action="..action.." phase=press readback="..tostring(v).." status="..(pass and "PASS" or "FAIL"))
              if not pass then PCSX.quit(84); return end
              activeButton=b
          end
          local function releaseAction(cycle)
              if not activeButton then return end
              local b=activeButton
              local ok,v=pcall(function() pad.clearOverride(b); return pad.getButton(b) end)
              local pass=ok and v==false
              log("ADAPTIVE_INPUT cycle="..cycle.." phase=release readback="..tostring(v).." status="..(pass and "PASS" or "FAIL"))
              activeButton=nil
              if not pass then PCSX.quit(85) end
          end
          PCSX.Events.createEventListener("ExecutionFlow::SaveStateLoaded",function()
              loaded=true; frame=0; log("ADAPTIVE_LOAD_EVENT=PASS event=ExecutionFlow::SaveStateLoaded")
          end)
          local plannedAction={}
          local plannedState={}
          local plannedDecision={}
          PCSX.Events.createEventListener("GPU::Vsync",function()
              if not loadStarted then
                  loadStarted=true; log("ADAPTIVE_LOAD_BEGIN=1"); PCSX.pauseEmulator()
                  PCSX.nextTick(function()
                      local f=assert(Support.File.open("resume/storymode-adaptive-source-f180.sstate"))
                      local ok,err=pcall(function() PCSX.loadSaveState(f) end); f:close()
                      if not ok then log("ADAPTIVE_LOAD_ERROR="..tostring(err)); PCSX.quit(32); return end
                      loadReturned=true; log("ADAPTIVE_LOAD_CALL_RETURNED=1"); PCSX.resumeEmulator()
                  end)
                  return
              end
              if not loaded or not loadReturned then return end
              frame=frame+1
              -- Let the F180 save-state writer settle before shutdown.
              -- The checkpoint remains the frozen F180 state; no additional inputs are sent.
              if shutdownFrame and frame>=shutdownFrame then
                  log("ADAPTIVE_SHUTDOWN_SETTLE_COMPLETE cycle="..cycle.." frame="..frame)
                  PCSX.pauseEmulator()
                  PCSX.nextTick(function() PCSX.quit(0) end)
                  return
              end
              local phase=((frame-1)%180)+1
              if phase==20 then
                  local state,action,result=captureExternal(string.format("C%02d-F20",cycle),cycle)
                  if not state then return end
                  plannedState[cycle]=state; plannedAction[cycle]=action; plannedDecision[cycle]=result
                  if abTest then
                      local mapAction=(abAction=="UP" or abAction=="DOWN" or abAction=="LEFT" or abAction=="RIGHT" or abAction=="CROSS")
                      local menuAction=(abAction=="DOWN" or abAction=="TRIANGLE" or abAction=="CIRCLE")
                      local rouletteAction=(abAction=="CIRCLE")
                      local cardAction=(abAction=="CIRCLE")
                      local barrierSelectionAction=(abAction=="UP" or abAction=="DOWN" or abAction=="LEFT" or abAction=="RIGHT")
                      local safeAction=(abExpectedState=="menu_or_unknown_choice" and menuAction) or (abExpectedState=="map_after_move" and mapAction) or (abExpectedState=="roulette" and rouletteAction) or (abExpectedState=="card_selection" and cardAction) or (abExpectedState=="card_selection_detail" and cardAction) or (abExpectedState=="barrier_level_selection" and barrierSelectionAction)
                      local precondition=(state==abExpectedState and action=="WAIT" and safeAction)
                      local branch=(cycle==1) and "ACTION" or "NONE"
                      local selected=(cycle==1) and abAction or "WAIT"
                      if not precondition then selected="WAIT" end
                      plannedAction[cycle]=selected
                      local marker="ADAPTIVE_AB_PRECONDITION="..(precondition and "PASS" or "FAIL")..
                          " cycle="..cycle.." branch="..branch.." state="..state..
                          " classifier_action="..action.." selected_action="..selected
                      local pf=assert(io.open(string.format("captures/ab-precondition-cycle-%02d.txt",cycle),"wb")); pf:write(marker.."\n"); pf:close()
                      log(marker)
                  end
                  local df=assert(io.open(string.format("captures/decision-cycle-%02d.json",cycle),"wb")); df:write(result); df:close()
                  local af=assert(io.open(string.format("captures/action-cycle-%02d.txt",cycle),"wb")); af:write(plannedAction[cycle].."\n"); af:close()
                  log("ADAPTIVE_DECISION cycle="..cycle.." state="..state.." action="..plannedAction[cycle].." classifier_action="..action.." reason=synchronous_external_X11_classification")
                  if cycle==2 then
                      local safe=((state=="battle_untrained" or state=="map_after_move" or state=="unknown" or state=="menu_or_unknown_choice") and action=="WAIT")
                          or (state=="dialogue" and action=="START")
                          or (state=="barrier_choice" and action=="CIRCLE")
                          or (state=="barrier_level_selection" and action=="WAIT")
                          or (state=="roulette" and action=="WAIT")
                          or (state=="card_selection" and action=="WAIT")
                          or (state=="card_selection_detail" and action=="WAIT")
                          or (state=="map" and action=="DOWN")
                      local marker="ADAPTIVE_POLICY_GUARD="..(safe and "PASS" or "FAIL").." cycle=2 state="..state.." action="..action
                      local bf=assert(io.open("captures/policy-guard-report.txt","wb")); bf:write(marker.."\n"); bf:close()
                      log(marker)
                  end
              elseif phase==30 then
                  sendAction(plannedAction[cycle] or "WAIT",cycle)
              elseif phase==38 then
                  releaseAction(cycle)
              elseif phase==60 then
                  captureExternal(string.format("C%02d-F60",cycle),cycle)
              elseif phase==100 then
                  local label=string.format("C%02d-F100",cycle)
                  local state,action=captureExternal(label,cycle)
                  if not state then return end
                  local before=plannedState[cycle] or "unknown"; local act=plannedAction[cycle] or "WAIT"
                  log("ADAPTIVE_ACTION_VERIFICATION cycle="..cycle.." before="..before.." action="..act.." observed_after="..state.." state_changed="..tostring(before~=state))
                  if before=="map" and (state=="battle_untrained" or state=="dialogue") then
                      local marker="ADAPTIVE_GAMEPLAY_PROGRESS=PASS from=map to="..state.." label="..label
                      local pf=assert(io.open("captures/progress-report.txt","wb")); pf:write(marker.."\n"); pf:close()
                      log(marker)
                  end
              elseif phase==110 then
                  local label=string.format("C%02d-F110",cycle)
                  local state,action=captureExternal(label,cycle)
                  if not state then return end
                  if state=="dialogue" and action=="START" then
                      if restoreTest then
                          sendAction("START",cycle)
                          log("ADAPTIVE_DIALOGUE_SKIP=SUPPRESSED cycle="..cycle.." reason=restore_only_no_input")
                      elseif abTest then
                          -- A/B isolation: compare exactly one configured action with NONE.
                          -- Never add an automatic dialogue START to either branch.
                          log("ADAPTIVE_DIALOGUE_SKIP=SUPPRESSED cycle="..cycle.." reason=ab_test_single_input_isolation")
                      else
                          sendAction("START",cycle)
                          log("ADAPTIVE_DIALOGUE_SKIP=PASS cycle="..cycle.." reason=visible_gold_dialogue_box")
                      end
                  else
                      log("ADAPTIVE_DIALOGUE_SKIP=NOT_DIALOGUE cycle="..cycle.." state="..state.." action=WAIT")
                  end
              elseif phase==118 then
                  releaseAction(cycle)
              elseif phase==180 then
                  local state,action=captureExternal(string.format("C%02d-F180",cycle),cycle)
                  if not state then return end
                  local count=0
                  local reported=tonumber((plannedDecision[cycle] or ""):match('"roulette_wait_count"%s*:%s*(%d+)')) or 0
                  if state=="roulette" and (plannedAction[cycle] or "WAIT")=="WAIT" then count=reported end
                  local ht=string.format('{"last_state":"%s","last_action":"%s","roulette_wait_count":%d}\n',state,plannedAction[cycle] or "WAIT",count)
                  local hf=assert(io.open("captures/history.json","wb")); hf:write(ht); hf:close()
                  -- Each bounded session ends at its verified checkpoint.
                  -- The orchestrator launches a fresh emulator process for
                  -- the next cycle and restores this saved state.
                  if not checkpoint(cycle) then
                      PCSX.pauseEmulator()
                      PCSX.nextTick(function() PCSX.quit(74) end)
                      return
                  end
                  log("ADAPTIVE_SESSION_FINISHED cycle="..cycle)
                  -- Let post-checkpoint I/O settle across 12 further VSync callbacks.
                  -- The file remains a snapshot of F180; no additional input is sent.
                  shutdownFrame=frame+12
                  log("ADAPTIVE_SHUTDOWN_SETTLE_BEGIN cycle="..cycle.." checkpoint_frame="..frame.." quit_frame="..shutdownFrame)
                  return
              end
          end)
          log("ADAPTIVE_SCRIPT_READY cycle="..cycle.." source=verified-checkpoint captures=EXTERNAL_X11_ONLY")
          LUA
          mkdir -p "$WORK/tools"
          cp "$GITHUB_WORKSPACE/tools/storymode_adaptive_agent.py" "$WORK/tools/storymode_adaptive_agent.py"
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          cp "$WORK/storymode-adaptive.lua" "$WORK/captures/storymode-adaptive.lua"
          CYCLES="$(awk -F= '$1=="LOOP_CYCLES" {print $2}' "$GITHUB_WORKSPACE/experiments/.run-storymode-adaptive-player")"
          [[ "$CYCLES" == "1" || "$CYCLES" == "2" ]]
          [[ "$RESTORE_TEST" == "0" || "$RESTORE_TEST" == "1" ]]
          [[ "$CONTINUATION_TEST" == "0" || "$CONTINUATION_TEST" == "1" ]]
          [[ "$AB_TEST" == "0" || "$AB_TEST" == "1" ]]
          [[ "$AB_ACTION" == "UP" || "$AB_ACTION" == "DOWN" || "$AB_ACTION" == "LEFT" || "$AB_ACTION" == "RIGHT" || "$AB_ACTION" == "TRIANGLE" || "$AB_ACTION" == "CROSS" || "$AB_ACTION" == "CIRCLE" ]]
          if [ "$AB_TEST" = "1" ]; then [[ "$CYCLES" == "2" && "$RESTORE_TEST" == "0" && "$CONTINUATION_TEST" == "0" ]]; fi
          export PAD_SETUP
          export LOOP_CYCLES="$CYCLES"
          export RESTORE_TEST CONTINUATION_TEST AB_TEST AB_ACTION AB_EXPECTED_STATE SOURCE_SHA256
          cat > "$WORK/run-bounded-cycles.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cycles="${LOOP_CYCLES:-2}"
          validate_checkpoint() {
            local state="$1"
            if [ ! -f "$state" ]; then
              echo "ADAPTIVE_CHECKPOINT_EXTERNAL_VALIDATION=FAIL file=$(basename "$state") reason=missing"
              return 1
            fi
            local bytes
            bytes="$(stat -c %s "$state")"
            if [ "$bytes" -le 21000000 ]; then
              echo "ADAPTIVE_CHECKPOINT_EXTERNAL_VALIDATION=FAIL file=$(basename "$state") bytes=$bytes reason=size"
              return 1
            fi
            if ! head -c 96 "$state" | grep -Fq 'PCSX-Redux SaveState v4'; then
              echo "ADAPTIVE_CHECKPOINT_EXTERNAL_VALIDATION=FAIL file=$(basename "$state") bytes=$bytes reason=header"
              return 1
            fi
            local sha
            sha="$(sha256sum "$state" | cut -d ' ' -f1)"
            echo "ADAPTIVE_CHECKPOINT_EXTERNAL_VALIDATION=PASS file=$(basename "$state") bytes=$bytes header='PCSX-Redux SaveState v4' sha256=$sha"
          }
          run_cycle() {
            local cycle="$1"
            local logfile="$WORK/captures/pcsx-adaptive-cycle-${cycle}.log"
            local stdout="$WORK/captures/pcsx-adaptive-cycle-${cycle}.stdout"
            local card="$WORK/cards/naruto-storymode-template.mcd"
            if [ "$AB_TEST" = "1" ]; then
              if [ "$cycle" -eq 1 ]; then card="$WORK/cards/naruto-storymode-ab-action.mcd"; else card="$WORK/cards/naruto-storymode-ab-none.mcd"; fi
            fi
            local resume_sha
            resume_sha="$(sha256sum "$WORK/resume/storymode-adaptive-source-f180.sstate" | cut -d ' ' -f1)"
            local card_sha
            card_sha="$(sha256sum "$card" | cut -d ' ' -f1)"
            echo "ADAPTIVE_SESSION_START cycle=${cycle} source=$resume_sha card=$(basename "$card") card_sha256=$card_sha" >> "$WORK/captures/pcsx-adaptive.stdout"
            set +e
            ADAPTIVE_CYCLE="$cycle" AB_TEST="$AB_TEST" AB_ACTION="$AB_ACTION" PROBE_MODE=ADAPTIVE timeout --signal=TERM --kill-after=5s 60s stdbuf -oL -eL "$WORK/squashfs-root/AppRun" \
              -noupdate -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" -memcard1 "$card" \
              -exec "$PAD_SETUP" -dofile "$WORK/storymode-adaptive.lua" -softgpu -dynarec -stdout -lua_stdout \
              -logfile "$logfile" -run > "$stdout" 2>&1
            local rc=$?
            set -e
            local cp="$WORK/captures/adaptive-cycle-$(printf '%02d' "$cycle")-f180.sstate"
            # Some sessions report a native shutdown fault after the Lua session-finished marker.
            # Accept only post-session native fault/timeout exits (139, 134, or 124) if the
            # session-finished marker exists and the newly written checkpoint passes external
            # size/header/SHA validation. Never mask failures before the marker or an invalid state.
            if { [ "$rc" -eq 139 ] || [ "$rc" -eq 134 ] || [ "$rc" -eq 124 ]; } && grep -q "ADAPTIVE_SESSION_FINISHED cycle=${cycle}" "$stdout"; then
              if validate_checkpoint "$cp" >> "$WORK/captures/pcsx-adaptive.stdout" 2>&1; then
                echo "ADAPTIVE_SESSION_SHUTDOWN_RECOVERED=PASS cycle=$cycle native_exit=$rc" >> "$WORK/captures/pcsx-adaptive.stdout"
                rc=0
              fi
            fi
            cat "$stdout" >> "$WORK/captures/pcsx-adaptive.stdout"
            echo "ADAPTIVE_SESSION_EXIT cycle=${cycle} code=$rc" >> "$WORK/captures/pcsx-adaptive.stdout"
            test "$rc" -eq 0
            grep -q "ADAPTIVE_SESSION_FINISHED cycle=${cycle}" "$stdout"
            # This check is deliberately after the emulator process has exited.
            validate_checkpoint "$cp" >> "$WORK/captures/pcsx-adaptive.stdout"
            if [ "$cycle" -eq 1 ] && [ "$AB_TEST" != "1" ]; then
              local sha
              sha="$(sha256sum "$cp" | cut -d ' ' -f1)"
              echo "ADAPTIVE_CYCLE2_RESUME_SOURCE=$sha" >> "$WORK/captures/pcsx-adaptive.stdout"
              rm -f "$WORK/resume/storymode-adaptive-source-f180.sstate"
              cp "$cp" "$WORK/resume/storymode-adaptive-source-f180.sstate"
              chmod 400 "$WORK/resume/storymode-adaptive-source-f180.sstate"
            elif [ "$cycle" -eq 1 ] && [ "$AB_TEST" = "1" ]; then
              echo "ADAPTIVE_AB_PARENT_PRESERVED=PASS sha256=$resume_sha" >> "$WORK/captures/pcsx-adaptive.stdout"
            fi
          }
          : > "$WORK/captures/pcsx-adaptive.stdout"
          run_cycle 1
          if [ "$cycles" -ge 2 ]; then run_cycle 2; fi
          if [ "$AB_TEST" = "1" ]; then
            echo "ADAPTIVE_AB_BRANCHES_COMPLETE=PASS cycles=$cycles parent_sha256=$SOURCE_SHA256" >> "$WORK/captures/pcsx-adaptive.stdout"
          else
            echo "ADAPTIVE_SEQUENTIAL_FRESH_PROCESS_RESUME=PASS cycles=$cycles" >> "$WORK/captures/pcsx-adaptive.stdout"
          fi
          SH
          chmod +x "$WORK/run-bounded-cycles.sh"
          PAD_SETUP="$PAD_SETUP" LOOP_CYCLES="$CYCLES" bash "$WORK/run-bounded-cycles.sh" > "$WORK/captures/pcsx-adaptive-orchestrator.stdout" 2>&1 &
          pid=$!
          python3 - "$pid" "$WORK/captures/pcsx-adaptive.stdout" "$WORK/captures" "$WORK" "$CYCLES" "$RESTORE_TEST" "$CONTINUATION_TEST" "$AB_TEST" <<'PY'
          import sys,time,subprocess,hashlib,json
          from pathlib import Path
          from PIL import Image
          pid=int(sys.argv[1]); stdout=Path(sys.argv[2]); out=Path(sys.argv[3])
          cycles=int(sys.argv[5]); restore_test=(sys.argv[6]=="1"); continuation_test=(sys.argv[7]=="1"); ab_test=(sys.argv[8]=="1"); phases=(20,60,100,110,180)
          labels=["C%02d-F%d"%(c,p) for c in range(1,cycles+1) for p in phases]
          done=set(); deadline=time.monotonic()+240
          def alive():
              q=subprocess.run(["ps","-o","stat=","-p",str(pid)],capture_output=True,text=True)
              st=q.stdout.strip(); return bool(st) and not st.startswith("Z")
          def tail():
              try: return stdout.read_text(errors="replace").splitlines()[-12:]
              except FileNotFoundError: return []
          def sequential_complete():
              try: content=stdout.read_text(errors="replace")
              except FileNotFoundError: content=""
              if ab_test:
                  return "ADAPTIVE_AB_BRANCHES_COMPLETE=PASS cycles=2 parent_sha256=" in content
              return "ADAPTIVE_SEQUENTIAL_FRESH_PROCESS_RESUME=PASS cycles={}".format(cycles) in content
          while time.monotonic()<deadline:
              for label in labels:
                  if label in done: continue
                  png=out/(label+".png")
                  vpath=out/("verification-"+label+".json")
                  if not png.is_file() or not vpath.is_file(): continue
                  with Image.open(png) as im:
                      size=im.size; im.verify()
                  with Image.open(png) as im:
                      valid=size==(1280,800) and png.stat().st_size>1000 and im.getbbox() is not None
                  if not valid: raise SystemExit("invalid external X11 image: "+label)
                  v=json.loads(vpath.read_text(encoding="utf-8"))
                  digest=hashlib.sha256(png.read_bytes()).hexdigest()
                  print("ADAPTIVE_X11_VALIDATED label={} size={} bytes={} sha256={} state={} confidence={:.2f}".format(label,size,png.stat().st_size,digest,v.get("state","unknown"),v.get("confidence",0)),flush=True)
                  if label.endswith("F100"):
                      cycle=int(label[1:3]); dec=json.loads((out/("decision-cycle-%02d.json"%cycle)).read_text())
                      print("ADAPTIVE_ACTION_VERIFICATION cycle={} before={} action={} observed_after={} state_changed={}".format(cycle,dec.get("state"),dec.get("action"),v.get("state"),str(dec.get("state")!=v.get("state")).lower()),flush=True)
                  done.add(label)
              cps=sorted(out.glob("adaptive-cycle-*-f180.sstate"))
              # Images are emitted just before checkpointing; do not finish
              # until all checkpoints and the fresh-process resume marker exist.
              if len(done)==len(labels) and len(cps)==cycles and sequential_complete():
                  break
              # If the orchestrator died, no later session can emit missing files.
              # Fail fast and upload partial private evidence instead of burning
              # the entire watchdog window.
              if not alive() and not sequential_complete():
                  print("ADAPTIVE_ORCHESTRATOR_EARLY_EXIT missing={} checkpoints={}/{} stdout_tail={}".format(sorted(set(labels)-done),len(cps),cycles,json.dumps(tail())),flush=True)
                  raise SystemExit(92)
              time.sleep(.02)
          missing=sorted(set(labels)-done)
          cps=sorted(out.glob("adaptive-cycle-*-f180.sstate"))
          sequential=sequential_complete()
          if missing or len(cps)!=cycles or not sequential:
              print("ADAPTIVE_CAPTURE_WATCHDOG_FAIL missing={} checkpoints={}/{} sequential_complete={} process_alive={} stdout_tail={}".format(missing,len(cps),cycles,sequential,alive(),json.dumps(tail())),flush=True)
              raise SystemExit(91)
          summary=[{"file":p.name,"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in cps]
          print("ADAPTIVE_WATCHDOG_END captures={}/{} checkpoints={} hashes={}".format(len(done),len(labels),len(cps),json.dumps(summary)),flush=True)
          if len(cps)!=cycles: raise SystemExit("ADAPTIVE_CHECKPOINT_COUNT_FAIL")
          if not restore_test and not continuation_test and not ab_test and not (out/"progress-report.txt").is_file(): raise SystemExit("ADAPTIVE_GAMEPLAY_PROGRESS_FAIL")
          if cycles>=2:
              rpt=out/"policy-guard-report.txt"
              if not rpt.is_file() or "ADAPTIVE_POLICY_GUARD=PASS cycle=2" not in rpt.read_text():
                  raise SystemExit("ADAPTIVE_POLICY_GUARD_FAIL")
          PY

          set +e
          wait "$pid"
          rc=$?
          set -e
          echo "ADAPTIVE_EMULATOR_EXIT=$rc"
          test "$rc" -eq 0
          test "$(find "$WORK/captures" -maxdepth 1 -name 'C*-F*.png' | wc -l)" -eq "$((CYCLES * 5))"
          test "$(find "$WORK/captures" -maxdepth 1 -name 'adaptive-cycle-*-f180.sstate' | wc -l)" -eq "$CYCLES"
          test "$(grep -c 'ADAPTIVE_LOAD_EVENT=PASS' "$WORK/captures/pcsx-adaptive.stdout")" -eq "$CYCLES"
          if [ "$AB_TEST" = "1" ]; then
            grep -q "ADAPTIVE_AB_BRANCHES_COMPLETE=PASS cycles=$CYCLES parent_sha256=$SOURCE_SHA256" "$WORK/captures/pcsx-adaptive.stdout"
          else
            grep -q "ADAPTIVE_SEQUENTIAL_FRESH_PROCESS_RESUME=PASS cycles=$CYCLES" "$WORK/captures/pcsx-adaptive.stdout"
          fi
          if [ "$CYCLES" -ge 2 ]; then grep -q 'ADAPTIVE_POLICY_GUARD=PASS cycle=2' "$WORK/captures/policy-guard-report.txt"; fi
          for state in "$WORK"/captures/adaptive-cycle-*-f180.sstate; do
            bytes="$(stat -c %s "$state")"
            sha="$(sha256sum "$state" | cut -d ' ' -f1)"
            echo "ADAPTIVE_CHECKPOINT_FILE=$(basename "$state") BYTES=$bytes SHA256=$sha"
            test "$bytes" -gt 21000000
            python3 - "$state" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          with p.open("rb") as f: header=f.read(96)
          if b"PCSX-Redux SaveState v4" not in header:
              raise SystemExit("invalid PCSX savestate v4 header: "+p.name)
          if p.stat().st_size <= 21000000:
              raise SystemExit("checkpoint size below expected raw range: "+p.name)
          print("ADAPTIVE_CHECKPOINT_HEADER=PASS file="+p.name)
          PY
            echo "ADAPTIVE_CHECKPOINT_STRUCTURAL_VALIDATION=PASS file=$(basename "$state") bytes=$bytes sha256=$sha"
          done
          if [ "$AB_TEST" = "1" ]; then
            test "$CYCLES" -eq 2
            grep -q 'ADAPTIVE_AB_CARD_CLONES=PASS' "$WORK/captures/ab-card-clones.txt"
            for cycle in 1 2; do grep -q "ADAPTIVE_AB_PRECONDITION=PASS cycle=$cycle" "$WORK/captures/ab-precondition-cycle-$(printf '%02d' "$cycle").txt"; done
            grep -q "ADAPTIVE_DECISION cycle=1 state=$AB_EXPECTED_STATE action=$AB_ACTION classifier_action=WAIT" "$WORK/captures/pcsx-adaptive-cycle-1.stdout"
            grep -q "ADAPTIVE_DECISION cycle=2 state=$AB_EXPECTED_STATE action=WAIT classifier_action=WAIT" "$WORK/captures/pcsx-adaptive-cycle-2.stdout"
            if [ "$AB_EXPECTED_STATE" = "card_selection" ] || [ "$AB_EXPECTED_STATE" = "card_selection_detail" ]; then
              grep -q "ADAPTIVE_POLICY_GUARD=PASS cycle=2 state=$AB_EXPECTED_STATE action=WAIT" "$WORK/captures/policy-guard-report.txt"
              grep -q "ADAPTIVE_DECISION cycle=1 state=$AB_EXPECTED_STATE action=CIRCLE classifier_action=WAIT" "$WORK/captures/pcsx-adaptive-cycle-1.stdout"
              grep -q 'ADAPTIVE_INPUT cycle=1 action=CIRCLE phase=press readback=true status=PASS' "$WORK/captures/pcsx-adaptive-cycle-1.stdout"
            fi
            grep -q "ADAPTIVE_INPUT cycle=1 action=$AB_ACTION phase=press readback=true status=PASS" "$WORK/captures/pcsx-adaptive-cycle-1.stdout"
            grep -q 'ADAPTIVE_INPUT cycle=1 phase=release readback=false status=PASS' "$WORK/captures/pcsx-adaptive-cycle-1.stdout"
            grep -q 'ADAPTIVE_INPUT cycle=2 action=WAIT status=PASS reason=no_input_policy' "$WORK/captures/pcsx-adaptive-cycle-2.stdout"
            test "$(grep -Ec 'ADAPTIVE_INPUT cycle=1 .*phase=press' "$WORK/captures/pcsx-adaptive-cycle-1.stdout")" -eq 1
            if [ "$AB_EXPECTED_STATE" != "barrier_level_selection" ] && grep -Eq 'ADAPTIVE_INPUT cycle=1 action=START phase=press|ADAPTIVE_INPUT cycle=1 action=DOWN phase=press|ADAPTIVE_INPUT cycle=1 action=UP phase=press|ADAPTIVE_INPUT cycle=1 action=LEFT phase=press|ADAPTIVE_INPUT cycle=1 action=RIGHT phase=press|ADAPTIVE_INPUT cycle=1 action=TRIANGLE phase=press|ADAPTIVE_INPUT cycle=1 action=CROSS phase=press' "$WORK/captures/pcsx-adaptive-cycle-1.stdout"; then
              echo "ADAPTIVE_AB_SINGLE_INPUT_ISOLATION=FAIL extra_action_in_action_branch" >> "$WORK/captures/pcsx-adaptive.stdout"
