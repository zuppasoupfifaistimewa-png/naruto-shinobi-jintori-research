name: Preserve Naruto checkpoint and compare RAM / strict A2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preserve-checkpoint-and-compare.yml"
      - "tools/checkpoint_compare_and_a2.py"
      - "tools/parse_pcsx_savestate_ram.py"

permissions:
  actions: read
  contents: write

concurrency:
  group: naruto-checkpoint-preservation-analysis
  cancel-in-progress: false

jobs:
  preserve-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_RUN_ID: "39262213468"
      SOURCE_ARTIFACT_ID: "12196796917"
      SOURCE_ARTIFACT_ZIP_SHA256: "692fc3a7b3899a08cabd56f90bb09d61265b1f909ed32ba7e89e6f162b91348b"
      SOURCE_ARTIFACT_ZIP_BYTES: "12409582"
      RAW_STATE_SHA256: "00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d"
      RAW_STATE_BYTES: "21163286"
      SOURCE_ARTIFACT_EXPIRES: "2026-11-02T15:03:35Z"
      PRESERVE_TAG: "naruto-checkpoint-39262213468"
      PRESERVE_ASSET: "storymode-checkpoint-run-39262213468.raw.sstate"
      GHIDRA_XREF_PATH: "reports/step4_10_static_evidence_audit/run_40789339014/a2_ghidra_rebased_xrefs.csv"
      GHIDRA_FUNCTION_PATH: "reports/step4_10_static_evidence_audit/run_40789339014/a2_ghidra_rebased_functions.csv"
      STRICT_BASELINE_PATH: "reports/step4_10_static_evidence_audit/run_40789339014/a2_xref_hits.csv"

    steps:
      - name: Checkout permitted research repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install disc extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bchunk xorriso jq

      - name: Download checkpoint artifact and verify source hashes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checkpoint-39262213468"
          mkdir -p "$root/source" "$root/output"
          zip="$root/source/checkpoint-artifact.zip"
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --retry 2 --retry-delay 2 --max-time 180 "$url" --output "$zip"
          [[ "$(stat -c '%s' "$zip")" == "$SOURCE_ARTIFACT_ZIP_BYTES" ]]
          echo "$SOURCE_ARTIFACT_ZIP_SHA256  $zip" | sha256sum --check -
          python3 - "$zip" "$root/source/storymode-checkpoint.raw.sstate" <<'PY'
          from pathlib import Path
          import hashlib,sys,zipfile
          zpath,dst=map(Path,sys.argv[1:3])
          with zipfile.ZipFile(zpath) as z:
              name="storymode-checkpoint.raw.sstate"
              if name not in z.namelist(): raise SystemExit("RAW_SAVESTATE_MEMBER_NOT_FOUND")
              info=z.getinfo(name)
              if info.file_size!=21163286: raise SystemExit(f"RAW_SAVESTATE_SIZE_MISMATCH:{info.file_size}")
              data=z.read(name)
          digest=hashlib.sha256(data).hexdigest()
          if digest!="00fab82601f4acee6e250c9009234dfb469d6f4d457cfb8413a1e874204f6c3d":
              raise SystemExit(f"RAW_SAVESTATE_SHA256_MISMATCH:{digest}")
          dst.write_bytes(data)
          print(f"source_artifact_zip_bytes={zpath.stat().st_size}")
          print(f"source_artifact_zip_sha256={hashlib.sha256(zpath.read_bytes()).hexdigest()}")
          print(f"raw_savestate_bytes={len(data)}")
          print(f"raw_savestate_sha256_before_release_upload={digest}")
          PY

      - name: Preserve raw savestate as a non-expiring GitHub Release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checkpoint-39262213468"
          raw="$root/source/storymode-checkpoint.raw.sstate"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          release_json="$root/release.json"
          status="$(curl --silent --show-error --output "$release_json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" "$api/releases/tags/$PRESERVE_TAG")"
          if [[ "$status" == "404" ]]; then
            python3 - "$root/release-request.json" "$PRESERVE_TAG" <<'PY'
          import json,sys
          from pathlib import Path
          out,tag=sys.argv[1:3]
          Path(out).write_text(json.dumps({
            "tag_name":tag,
            "name":"Naruto Story Mode checkpoint — run 39262213468",
            "body":"Preserved raw PCSX-Redux savestate from Actions run 39262213468 before its workflow artifact expires. Only the raw state is attached; no ROM, BIOS, DATA.BIN, RAM dump or screenshot bundle is included.",
            "draft":False,"prerelease":False
          }),encoding="utf-8")
          PY
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/json" \
              --data-binary "@$root/release-request.json" "$api/releases" --output "$release_json"
          elif [[ "$status" != "200" ]]; then
            echo "Unable to inspect checkpoint release; HTTP=$status" >&2; cat "$release_json" >&2; exit 1
          fi
          rid="$(jq -r '.id // empty' "$release_json")"
          upload_base="$(jq -r '.upload_url // empty' "$release_json" | sed 's/{.*$//')"
          [[ -n "$rid" && -n "$upload_base" ]]
          assets="$root/assets-before.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" "$api/releases/$rid/assets?per_page=100" --output "$assets"
          aid="$(jq -r --arg name "$PRESERVE_ASSET" '.[] | select(.name==$name) | .id' "$assets" | head -n 1 || true)"
          before="$(sha256sum "$raw" | awk '{print $1}')"
          if [[ -n "$aid" ]]; then
            existing="$root/existing-asset.sstate"
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" "$api/releases/assets/$aid" --output "$existing"
            [[ "$(sha256sum "$existing" | awk '{print $1}')" == "$before" ]] || { echo "Existing release asset differs; refusing overwrite." >&2; exit 1; }
          else
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" \
              --data-binary "@$raw" "$upload_base?name=$PRESERVE_ASSET" --output "$root/upload-result.json"
            aid="$(jq -r '.id // empty' "$root/upload-result.json")"
            [[ -n "$aid" ]]
          fi
          after="$root/release-download.sstate"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" "$api/releases/assets/$aid" --output "$after"
          after_sha="$(sha256sum "$after" | awk '{print $1}')"
          after_bytes="$(stat -c '%s' "$after")"
          [[ "$after_sha" == "$RAW_STATE_SHA256" && "$after_sha" == "$before" && "$after_bytes" == "$RAW_STATE_BYTES" ]]
          asset_json="$root/asset-after.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" "$api/releases/assets/$aid" --output "$asset_json"
          browser_url="$(jq -r '.browser_download_url' "$asset_json")"
          release_url="$(jq -r '.html_url' "$release_json")"
          {
            echo "checkpoint_run_id=$SOURCE_RUN_ID"
            echo "source_artifact_id=$SOURCE_ARTIFACT_ID"
            echo "source_artifact_zip_bytes=$SOURCE_ARTIFACT_ZIP_BYTES"
            echo "source_artifact_zip_sha256=$SOURCE_ARTIFACT_ZIP_SHA256"
            echo "source_artifact_expires_at=$SOURCE_ARTIFACT_EXPIRES"
            echo "raw_savestate_bytes_before=$RAW_STATE_BYTES"
            echo "raw_savestate_sha256_before=$before"
            echo "release_tag=$PRESERVE_TAG"
            echo "release_id=$rid"
            echo "release_asset_id=$aid"
            echo "release_asset_name=$PRESERVE_ASSET"
            echo "raw_savestate_bytes_after_download=$after_bytes"
            echo "raw_savestate_sha256_after_download=$after_sha"
            echo "before_after_hash_match=PASS"
            echo "release_url=$release_url"
            echo "release_asset_url=$browser_url"
            echo "raw_savestate_committed_to_git=no"
            echo "ram_dump_committed_to_git=no"
            echo "rom_bios_DATA_BIN_uploaded=no"
          } > "$root/output/t1_checkpoint-preservation-manifest.txt"
          cat "$root/output/t1_checkpoint-preservation-manifest.txt"

      - name: Download and extract verified DATA.BIN transiently
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checkpoint-39262213468"
          src="$root/disc-source"; extracted="$root/disc-extracted"
          mkdir -p "$src" "$extracted" "$root/output"
          bin="$src/naruto-disc.bin"; cue_raw="$src/original.cue"; cue="$src/naruto-disc.cue"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 600 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/647346873" --output "$bin"
          [[ "$(stat -c '%s' "$bin")" == "325989552" ]]
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  $bin" | sha256sum --check -
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 2 --max-time 60 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/647354760" --output "$cue_raw"
          [[ "$(stat -c '%s' "$cue_raw")" == "116" ]]
          echo "be70d64f856e17aadc02cdcba7510234f5a11523216baddb3b247c95cec820b8  $cue_raw" | sha256sum --check -
          python3 - "$cue_raw" "$cue" <<'PY'
          from pathlib import Path
          import re,sys
          src,dst=map(Path,sys.argv[1:3]); out=[]; n=0
          for line in src.read_text(encoding="utf-8").splitlines():
              if line.lstrip().upper().startswith("FILE "):
                  m=re.match(r'^(\s*FILE\s+)(?:"[^"]*"|\S+)(\s+\S+\s*)$',line,re.I)
                  if not m: raise SystemExit("unrecognized CUE FILE directive")
                  line=m.group(1)+'"naruto-disc.bin"'+m.group(2);n+=1
              out.append(line)
          if n!=1: raise SystemExit(f"expected one CUE FILE directive; got {n}")
          dst.write_text("\n".join(out)+"\n",encoding="utf-8")
          PY
          bchunk "$bin" "$cue" "$src/track"
          iso="$(find "$src" -maxdepth 1 -type f -iname 'track*.iso' -print -quit)"
          [[ -n "$iso" ]]
          xorriso -osirrox on -indev "$iso" -extract / "$extracted" > "$root/output/disc-extraction.log" 2>&1
          data="$(find "$extracted" -type f -iname 'DATA.BIN' -print -quit)"
          [[ -n "$data" && "$(stat -c '%s' "$data")" == "66015232" ]]
          echo "69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822  $data" | sha256sum --check -
          cp "$data" "$root/DATA.BIN"
          rm -rf "$src" "$extracted"
          {
            echo "DATA_BIN_VERIFIED=PASS"
            echo "DATA_BIN_BYTES=66015232"
            echo "DATA_BIN_SHA256=69df081aaeb5dd0cff13a177693f6ef6d62aa2b36417c63f031ec7ee4de51822"
            echo "DATA_BIN_CONTENT_COMMITTED=no"
          } > "$root/output/data-bin-identity.txt"

      - name: Parse RAM from savestate without emulator; compare T2 and T3
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checkpoint-39262213468"
          python3 tools/parse_pcsx_savestate_ram.py \
            "$root/source/storymode-checkpoint.raw.sstate" \
            "$root/ram-first-2MiB-from-savestate.bin" \
            --csv "$root/ram-values-private.csv" --run-id "$SOURCE_RUN_ID" > "$root/output/ram-parser-log.txt"
          grep -q "RAM_DUMP=.*BYTES=2097152 SHA256=3ad7b85c857a868d91df4b3f1049c23889a0dc482ad7ee390ac8b6c05c3190f4" "$root/output/ram-parser-log.txt"
          python3 tools/checkpoint_compare_and_a2.py \
            --data-bin "$root/DATA.BIN" \
            --ram-dump "$root/ram-first-2MiB-from-savestate.bin" \
            --functions-csv "$GITHUB_WORKSPACE/$GHIDRA_FUNCTION_PATH" \
            --strict-baseline-csv "$GITHUB_WORKSPACE/$STRICT_BASELINE_PATH" \
            --ghidra-xrefs-csv "$GITHUB_WORKSPACE/$GHIDRA_XREF_PATH" \
            --out "$root/output"
          echo "ram_source=parsed inside GitHub Actions from PCSX-Redux SaveState v4; not restored into emulator" >> "$root/output/t2_t3_checkpoint-audit.txt"

      - name: Remove private working files before publishing reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checkpoint-39262213468"
          rm -f "$root/DATA.BIN" "$root/ram-first-2MiB-from-savestate.bin" "$root/ram-values-private.csv"
          rm -rf "$root/disc-source" "$root/disc-extracted"
          if [[ -f "$root/output/t2_t3_checkpoint-audit.txt" ]]; then
            echo "private_ram_dump_committed=no" >> "$root/output/t2_t3_checkpoint-audit.txt"
            echo "DATA_BIN_committed=no" >> "$root/output/t2_t3_checkpoint-audit.txt"
            echo "savestate_committed_to_git=no" >> "$root/output/t2_t3_checkpoint-audit.txt"
          fi

      - name: Commit only sanitized text, JSON and CSV reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checkpoint-39262213468"
          dest="reports/checkpoint_preservation/run_$GITHUB_RUN_ID"
          mkdir -p "$dest"
          if [[ -d "$root/output" ]]; then
            find "$root/output" -maxdepth 1 -type f \( -name '*.txt' -o -name '*.csv' -o -name '*.json' \) -exec cp {} "$dest/" \;
          fi
          if find "$dest" -maxdepth 1 -type f | grep -q .; then
            git add "$dest"
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Record checkpoint preservation and RAM comparison $GITHUB_RUN_ID"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi

      - name: Upload sanitized reports (short retention; Release asset is durable copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-preservation-and-comparison
          path: |
            ${{ runner.temp }}/checkpoint-39262213468/output/*.txt
            ${{ runner.temp }}/checkpoint-39262213468/output/*.csv
            ${{ runner.temp }}/checkpoint-39262213468/output/*.json
          if-no-files-found: warn
          retention-days: 14
