name: Naruto retail SCPH-7502 PCSX-Redux GUI boot probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-retail-scph7502-gui-probe.yml"

permissions:
  contents: read

concurrency:
  group: naruto-retail-scph7502-gui-probe
  cancel-in-progress: true

jobs:
  retail-bios-probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Install private GUI capture tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq xvfb x11-utils xdotool imagemagick tesseract-ocr tesseract-ocr-jpn libgl1-mesa-dri mesa-utils

      - name: Download private release assets and verify BIOS, ROM and emulator
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_REPO: ${{ github.repository }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-retail-scph7502-probe"
          mkdir -p "$WORK/captures"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/research-emulator-pcsx-redux-2026-10-15" -o release.json
          fetch_asset() {
            name="$1"; output="$2"
            ids="$(jq -r --arg name "$name" '[.assets[]? | select(.name == $name) | .id] | .[]' release.json)"
            if [ "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "::error::Expected exactly one private release asset: $name"
              exit 1
            fi
            id="$ids"
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage pcsx-redux.AppImage
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin game.bin
          fetch_asset Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue game.cue
          fetch_asset scph7502.zip scph7502.zip
          echo "c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c  pcsx-redux.AppImage" | sha256sum --check -
          test "$(stat -c '%s' game.bin)" = "325989552"
          echo "58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88  game.bin" | sha256sum --check -
          test "$(stat -c '%s' scph7502.zip)" = "283463"
          echo "b436489c574457560489bfaad11b2a2171c684edba34d69de107b7b26dfc0e3a  scph7502.zip" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile, zlib
          with zipfile.ZipFile("scph7502.zip") as zf:
              candidates=[]
              expanded=0
              for info in zf.infolist():
                  p=PurePosixPath(info.filename)
                  mode=(info.external_attr >> 16) & 0xffff
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      raise SystemExit("Unsafe archive entry")
                  if info.file_size > 2*1024*1024:
                      raise SystemExit("Archive member exceeds safety limit")
                  expanded += info.file_size
                  if expanded > 4*1024*1024:
                      raise SystemExit("Archive expansion exceeds safety limit")
                  if not info.is_dir() and info.file_size == 524288:
                      candidates.append(info)
              if len(candidates) != 1:
                  raise SystemExit(f"Expected exactly one BIOS-sized entry; got {len(candidates)}")
              hmd5=hashlib.md5(); hsha1=hashlib.sha1(); hsha256=hashlib.sha256(); crc=0; size=0
              with zf.open(candidates[0]) as src, Path("scph7502.bin").open("wb") as dst:
                  while True:
                      b=src.read(65536)
                      if not b: break
                      dst.write(b); size += len(b); hmd5.update(b); hsha1.update(b); hsha256.update(b); crc=zlib.crc32(b,crc)
              actual=(size,hmd5.hexdigest(),hsha1.hexdigest(),f"{crc & 0xffffffff:08X}")
              expected=(524288,"b9d9a0286c33dc6b7237bb13cd46fdee","8d5de56a79954f29e9006929ba3fed9b6a418c1d","318178BF")
              print("BIOS_MEMBER="+candidates[0].filename)
              print("BIOS_SIZE="+str(size))
              print("BIOS_MD5="+actual[1])
              print("BIOS_SHA1="+actual[2])
              print("BIOS_SHA256="+hsha256.hexdigest())
              print("BIOS_CRC32="+actual[3])
              if actual != expected:
                  raise SystemExit("BIOS reference identity mismatch")
              print("BIOS_REFERENCE_IDENTITY=MATCH")
          PY
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          from pathlib import Path
          p=Path("game.cue")
          lines=p.read_bytes().decode("utf-8-sig").replace("\r\n","\n").replace("\r","\n").splitlines()
          files=[i for i,line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          if len(files)!=1 or not any(line.lstrip().upper().startswith("TRACK ") for line in lines):
              raise SystemExit("Invalid CUE")
          lines[files[0]]='FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines)+"\n",encoding="ascii")
          PY
          echo "Pinned PCSX-Redux, private Naruto ROM/CUE, and verified SCPH-7502 BIOS are ready on the ephemeral runner."

      - name: Boot game and capture emulator window with retail BIOS
        run: |
          set -eu
          cd "$WORK"
          Xvfb :99 -ac -screen 0 1280x800x24 -nolisten tcp > "$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p "$WORK/home/.config" "$WORK/home/.local/share"
          export HOME="$WORK/home" XDG_CONFIG_HOME="$WORK/home/.config" XDG_DATA_HOME="$WORK/home/.local/share"
          for i in $(seq 1 40); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.25; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          echo "OPENGL_CAPABILITIES_BEGIN"
          glxinfo -B 2>&1 | head -35 || true
          echo "OPENGL_CAPABILITIES_END"
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=Port 1 Analog connected/remapped")
          print("SAFE_MONITORING=no CPU register reads inside VSync callbacks")
          LUA
          )
          timeout --signal=TERM --kill-after=5s 95s \
            "$WORK/squashfs-root/AppRun" -bios "$WORK/scph7502.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -run -interpreter -stdout -lua_stdout \
            -logfile "$WORK/pcsx.log" > "$WORK/pcsx.stdout" 2>&1 &
          emu_pid=$!
          capture_window() {
            label="$1"
            tree="$(xwininfo -root -tree 2>&1 || true)"
            printf '%s\n' "$tree" > "$WORK/window-tree-$label.txt"
            root_hex="$(xwininfo -root 2>/dev/null | awk '/Window id:/{print $4; exit}')"
            [ -n "$root_hex" ] || root_hex=0x0
            root_id=$((root_hex))
            window_id=""
            best_area=0
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              id_num=$((id))
              if [ "$id_num" -eq "$root_id" ]; then continue; fi
              stats="$(xwininfo -id "$id" 2>/dev/null || true)"
              width="$(printf '%s\n' "$stats" | awk '/Width:/{print $2; exit}')"
              height="$(printf '%s\n' "$stats" | awk '/Height:/{print $2; exit}')"
              name="$(printf '%s\n' "$stats" | sed -n 's/.*Window id: [^"]*"\(.*\)".*/\1/p' | head -n 1)"
              case "$width:$height" in *[!0-9:]*|:*) continue;; esac
              area=$((width*height))
              if [ "$width" -ge 400 ] && [ "$height" -ge 250 ] && [ "$area" -gt "$best_area" ]; then
                window_id="$id_num"; best_area="$area"; best_name="$name"; best_width="$width"; best_height="$height"
              fi
            done < <(printf '%s\n' "$tree" | awk '$1 ~ /^0x[[:xdigit:]]+$/ {print $1}')
            if [ -z "$window_id" ]; then
              echo "CAPTURE_RESULT=$label no eligible non-root X11 window"
              sed -n '1,80p' "$WORK/window-tree-$label.txt" || true
              return 1
            fi
            echo "CAPTURE_WINDOW=$label id=$window_id name=$best_name width=$best_width height=$best_height"
            import -window "$window_id" "$WORK/captures/$label.png"
            identify -format 'FRAME_METRICS label=%f width=%w height=%h mean=%[mean] stddev=%[standard-deviation] colors=%k\n' "$WORK/captures/$label.png"
            echo "OCR_BEGIN=$label"
            tesseract "$WORK/captures/$label.png" stdout -l jpn+eng 2>/dev/null | head -20 || true
            echo "OCR_END=$label"
            echo "$window_id" > "$WORK/last-window-id"
            return 0
          }
          sleep 18
          capture_window before-input || true
          if [ -s "$WORK/last-window-id" ]; then
            wid="$(cat "$WORK/last-window-id")"
            timeout 2s xdotool windowfocus "$wid" 2>/dev/null || true
            echo "INPUT_TEST=Return then Z sent to detected app window; visible state change must be checked separately"
            xdotool key --clearmodifiers Return
            sleep 2
            capture_window after-return || true
            xdotool key --clearmodifiers z
            sleep 2
            capture_window after-cross || true
            echo "INPUT_TEST_END"
          else
            echo "INPUT_TEST_SKIPPED=no eligible app window detected"
          fi
          sleep 12
          capture_window frame-40s || true
          sleep 20
          capture_window frame-60s || true
          sleep 20
          capture_window frame-80s || true
          set +e
          wait "$emu_pid"
          rc=$?
          set -e
          echo "GUI_PROCESS_EXIT=$rc (124 means capped observation)"
          echo "BOOT_MARKERS_BEGIN"
          grep -E 'Loaded BIOS:|BIOS|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM\.CNF|BOOT =|EXEC:PC0|Execute !|PAD_SETUP=|FATAL|Exception|ERROR|Error|Failed|failed' "$WORK/pcsx.stdout" "$WORK/pcsx.log" 2>/dev/null | tail -120 || true
          echo "BOOT_MARKERS_END"
          echo "Interpretation rule: BIOS recognized, EXE launch, title/menu capture and responsive input are separate evidence gates."

      - name: Upload private GUI evidence for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-retail-scph7502-private-probe
          path: |
            ${{ runner.temp }}/naruto-retail-scph7502-probe/captures/*.png
            ${{ runner.temp }}/naruto-retail-scph7502-probe/pcsx.stdout
            ${{ runner.temp }}/naruto-retail-scph7502-probe/pcsx.log
            ${{ runner.temp }}/naruto-retail-scph7502-probe/window-tree-*.txt
            ${{ runner.temp }}/naruto-retail-scph7502-probe/xvfb.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove private media and extracted tools
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi
          echo "Cleanup complete; BIOS, ROM, emulator extracts and temporary runtime files removed from runner."
